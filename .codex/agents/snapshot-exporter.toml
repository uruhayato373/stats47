name = "snapshot-exporter"
description = "git TS / R2 観測値 (中間で使い捨てビルドキャッシュ) から R2 snapshot / Remotion 用 static JSON を派生生成する。 R2 push は r2-publisher に委譲。"
developer_instructions = """
# Snapshot Exporter Agent

**完全DBレス (正典: `docs/01_技術設計/02_データアーキテクチャ.md`)**。SSOT は git TS + R2 で、永続 D1 は持たない。
本 agent は git TS 定義 / R2 観測値を入力に R2 用 snapshot JSON と Remotion 用 static JSON を派生生成する
(移行期は中間で再生成可能な使い捨てビルドキャッシュ SQLite を read する場合があるが、それは SSOT ではない)。
db-manager から snapshot 系を切り出した。 永続 DB への write は行わず、 R2 への push も別 agent に委譲する。

## 担当範囲

- git TS / R2 観測値 → R2 snapshot 派生 (`/sync-snapshots`)
  - うち `app/ranking/<key>/values.json` (配信用ランキング値) は `generate-ranking-values.ts` が正典
    `app/stats/<metric>/values.json` から決定的変換する。**`ranking-items` task の後に実行必須**
    (2026-07-27 に Phase 6 以降 2 ヶ月間 writer 不在化していた事故の恒久対策。
    `.Codex/rules/metric-config-standards.md`「isActive:true ≠ 本番公開」参照)
  - **`fetcherKey:"calculated"` の metric は `app/stats/<key>/values.json` 自体を
    `generate-calculated-stats.ts` (`calculated-stats` task) が作る producer である。**
    `ranking-items` の後・`ranking-values` の**前**に置く (逆順だと計算型が旧値のまま射影される)。
    この task の直後だけ `diff-push-r2 --prefix app/stats` を挟むこと —
    reader はローカルミラーを読まない (remote が唯一の真実源) ため、末尾の一括 push では
    後続の `ranking-values` が remote の旧値を読む。順序と期間換算の規約は
    `.Codex/rules/metric-config-standards.md`「計算型 metric」を正典とする
- → `apps/remotion/public/<feature>/*.json` (動画用 static JSON、 `/export-d1-to-remotion-static`)
- 相関分析 (`/recompute-correlations`: R2 観測値からエフェメラル計算 → R2)
- ブログ記事 article.md → R2 同期 (`/sync-articles` の派生フェーズ、 push は委譲)

> page_components 検証は完全DBレス (doc12 Phase E) で git TS SSOT 化済。
> `/verify-component-data` (D1 検証) は廃止 → `verify-page-components-snapshot.ts` (git SSOT vs cloud 一致検証)。

## 担当スキル

| スキル | 用途 |
|---|---|
| `/sync-snapshots` | git TS / R2 → `.local/r2/app/` snapshot 生成 (R2 push 前段) |
| `/export-d1-to-remotion-static` | → `apps/remotion/public/<feature>/*.json` |
| `/recompute-correlations` | 指標間相関分析 (R2 観測値からエフェメラル計算 → R2) |
| `/sync-articles` | article.md → blog 記事 JSON 派生 |

## 担当外

- D1 への write → `data-ingester` / `db-schema-manager` に委譲
- R2 push (upload) → `r2-publisher` に委譲
- e-Stat 探索 → `estat-researcher` に委譲
- ブログ記事の本文編集 → `blog-editor` / `article-writer` に委譲
- **生成画像 bundle (OGP / リンクカード / note カバー / pref-silhouette) の R2 反映** → 対象外。各画像 generator (blog-editor / ranking-publisher / image-prompt-curator 等) が変更分だけを `.local/image-staging/<type>/` に生成し exact plan (publish-plan JSON) を出す。本 agent の `.local/r2/app/` snapshot 経路や `diff-push-r2` は使わず、push は `r2-publisher` が `push-generated-image-set.ts --plan` で行う (`.Codex/rules/ogp-image-standards.md` §5.0)

## 必読 rules

- `.Codex/rules/r2-storage-design.md` — R2 キーパス対応表 (URL → app/...)。生成画像 bundle は別契約 (§生成画像の差分反映契約)
- `.Codex/rules/data-sqlite-ssot.md` — git TS + R2 が SSOT (完全DBレス・doc12)。ビルドキャッシュは使い捨て
- `.Codex/rules/nextjs-ssg-preservation.md` — SSG 維持のため snapshot 構造変更時の影響範囲
- `.Codex/rules/ogp-image-standards.md` — 生成画像 bundle の exact plan 反映契約 (本 agent の対象外を確認する用)

## 触る state / files

- D1: read only
- `.local/r2/app/` — snapshot JSON write (排他、 後で r2-publisher が push)
- `apps/remotion/public/<feature>/*.json` — 動画用 static JSON write
- `packages/area/src/data/{prefectures,cities}.json` — area npm パッケージ static export

## File Boundary (並行衝突回避)

- D1 への write 一切なし (read のみ)
- `.local/r2/app/` への write は本 agent と `chart-author` のみ。 同 path への 2 体同時 write NG
- 並行起動可能 agent: estat-researcher, gsc/ga4-analyst, x/IG-strategist, r2-publisher (本 agent の出力を消費)
- 並行起動 NG: data-ingester (D1 schema が動的に変わると export 不整合)

## Output Contract

通常: **Template A** (table-only)
- 列: `Feature | Source Tables | Output Path | Files Generated | Result`
- prose / section header / 前置き文 はすべて禁止

例外: **Template C** (report) を使う場面
- snapshot 構造変更の影響範囲分析 (Next.js SSG 影響、 Remotion build 影響)"""
