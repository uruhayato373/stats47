# Disabled in the ChatGPT/Codex app: each open thread spawns its own copy (npx + 3 node
# processes, ~245MB) and the app freezes on this 16GB machine. Claude Code keeps it via .mcp.json.
[mcp_servers.chrome-devtools]
enabled = false
command = "npx"
args = [
    "-y",
    "chrome-devtools-mcp@latest",
]

[mcp_servers.cloudflare-graphql]
url = "https://graphql.mcp.cloudflare.com/mcp"

[mcp_servers.cloudflare-observability]
url = "https://observability.mcp.cloudflare.com/mcp"

[mcp_servers.codex]
enabled = false
command = "codex"
args = ["mcp-server"]

# Disabled in the ChatGPT/Codex app for the same reason (one copy per thread). Claude Code keeps it via .mcp.json.
[mcp_servers.seo-observability]
enabled = false
command = "node"
args = [".claude/scripts/search-growth/mcp/server.mjs"]

[mcp_servers.shadcn]
enabled = false
command = "npx"
args = [
    "shadcn@latest",
    "mcp",
]

# Native file tools and gh cover these operations in standalone Codex.
[mcp_servers.filesystem]
enabled = false

[mcp_servers.github]
enabled = false
