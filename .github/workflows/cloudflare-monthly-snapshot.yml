name: ☁️ Cloudflare Monthly Snapshot

# Cloudflare の請求サイクルは「前月 15 日 → 当月 14 日」。
# 当月 15 日 JST 09:00 (UTC 当月 15 日 00:00) に走らせて直前で締まったサイクルを集計。

on:
  schedule:
    - cron: "0 0 15 * *" # UTC 15 日 00:00 = JST 15 日 09:00
  workflow_dispatch:
    inputs:
      cycle:
        description: "Cycle to aggregate (YYYY-MM). Empty = latest closed cycle"
        required: false
        default: ""
      no_issue:
        description: "Skip issue creation (dry-run mode)"
        required: false
        default: "false"

permissions:
  contents: write
  issues: write

concurrency:
  group: cloudflare-monthly-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 🧰 Checkout develop (latest daily snapshots)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: ☁️ Run monthly snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # FLAGS は配列で組む ("$FLAGS" 単一引数渡しは 1 トークン化する — ARG_VECTOR_QUOTED)
          FLAGS=()
          if [ -n "${{ inputs.cycle }}" ]; then
            FLAGS+=(--cycle "${{ inputs.cycle }}")
          fi
          if [ "${{ inputs.no_issue }}" = "true" ]; then
            FLAGS+=(--no-issue)
          fi
          node .claude/scripts/cloudflare/monthly-snapshot.mjs "${FLAGS[@]}"

      - name: 💾 Commit snapshot to develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude/skills/analytics/cloudflare-cost-improvement/reference/monthly-snapshots
          if git diff --cached --quiet; then
            echo "No snapshot changes."
          else
            git commit -m "chore(cloudflare): monthly snapshot $(date -u +%Y-%m) [skip ci]"
            # pull せずに push すると develop が進んだ瞬間に (fetch first) で落ちる (2026-08-16 是正)
            git pull --rebase origin develop
            git push origin develop
          fi

      # 月次レビューが他の月次処理と同じ形で読めるよう、実行結果を state に残す (2026-10-01)。失敗した回も failed で残す
      - name: 🗂️ Record monthly job result
        if: always()
        run: |
          STATUS="${{ job.status == 'success' && 'ok' || 'failed' }}"
          node .claude/scripts/metrics/record-monthly-job.mjs --job cloudflare-snapshot --status "$STATUS"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude/state/metrics/monthly-jobs/cloudflare-snapshot.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(metrics): monthly job cloudflare-snapshot $STATUS [skip ci]"
          git pull --rebase origin develop
          git push origin develop
