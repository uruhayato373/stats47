name: 🖼 Generate OGP Images (ranking / areas)

# ランキング・地域ページの静的 OGP 画像を Satori (Node) で事前生成して R2 へ push。
# ランタイム next/og は Cloudflare Worker で 500 (error 1101) になるため、OGP は
# ビルド外の Node で生成し R2 静的配信する (正典: .claude/rules/ogp-image-standards.md)。
# blog は publish-blog.yml / generate-blog-thumbnails-cloud.ts が別途担当。
#
# 手動 dispatch のみ (デプロイ規律: 本番 R2 反映はまとめて・確認の上)。

on:
  workflow_dispatch:
    inputs:
      type:
        description: "対象種別 (ranking / areas)"
        required: true
        default: "ranking"
        type: choice
        options:
          - ranking
          - areas
      limit:
        description: "件数上限 (空=全件)"
        required: false
        default: ""
      force:
        description: "既存も強制再生成"
        required: false
        default: false
        type: boolean
      apply:
        description: "R2 へ push する (false=生成のみ dry-run)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: generate-ogp-images-${{ github.event.inputs.type }}
  cancel-in-progress: false

env:
  R2_PUBLIC_FETCH_URL: https://storage.stats47.jp
  CLOUDFLARE_R2_BUCKET_NAME: stats47
  SITE_ORIGIN: https://stats47.jp
  # wrangler r2 object put --remote 用
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 🧰 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🖼 Generate OGP images
        run: |
          FLAGS="--type ${{ github.event.inputs.type }}"
          if [ -n "${{ github.event.inputs.limit }}" ]; then FLAGS="$FLAGS --limit ${{ github.event.inputs.limit }}"; fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FLAGS="$FLAGS --force"; fi
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then FLAGS="$FLAGS --apply"; fi
          echo "Running: generate-ogp-images.ts $FLAGS"
          npx tsx apps/web/scripts/generate-ogp-images.ts $FLAGS
