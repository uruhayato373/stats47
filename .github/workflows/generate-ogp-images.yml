name: 🖼 Generate OGP Images (blog / ranking / areas / cards / note)

# ブログ・ランキング・地域の OGP、ランキングのリンクカード、note カバーを Satori (Node) で事前生成し
# R2 へ push する。ランタイム next/og は Cloudflare Worker で 500 (1101) になるため、OGP は
# ビルド外の Node で生成し R2 静的配信する (正典: .claude/rules/ogp-image-standards.md)。
# blog OGP も同じ manifest/publisher 契約だが、記事入力の都合で専用 generator が担当。
#
# 主経路は R2 creds を持つセッション/ローカルからの直接実行 (クラウド連携トークンは
# actions:write 無しで dispatch 不可)。本 CI はその fallback。手動 dispatch のみ。

on:
  workflow_dispatch:
    inputs:
      type:
        description: '対象種別'
        required: true
        default: 'ranking'
        type: choice
        options:
          - ranking
          - areas
          - ranking-cards
          - note-covers
          - pref-silhouette
          - blog
      limit:
        description: '1回の件数上限 (安全上限500、残りは再実行)'
        required: false
        default: '500'
      slugs:
        description: 'blogのみ: 対象slugのカンマ区切り (空なら全公開記事)'
        required: false
        default: ''
      ranking_keys:
        description: 'ranking / ranking-cards のみ: 対象キーのカンマ区切り (最大50件)'
        required: false
        default: ''
      apply:
        description: 'R2 へ push する (false=生成のみ)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # 全 R2 writer と共通ロック。snapshot / blog / 画像の同時上書きを防ぐ。
  group: r2-write
  cancel-in-progress: false

env:
  R2_PUBLIC_FETCH_URL: https://storage.stats47.jp
  SITE_ORIGIN: https://stats47.jp
  CLOUDFLARE_R2_BUCKET_NAME: stats47
  # S3 API 経由 R2 書き込み (exact image publisher)
  R2_S3_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
  R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 🧰 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🖼 Generate images
        env:
          IMAGE_TYPE: ${{ inputs.type }}
          IMAGE_LIMIT: ${{ inputs.limit }}
          BLOG_SLUGS: ${{ inputs.slugs }}
          RANKING_KEYS: ${{ inputs.ranking_keys }}
        run: |
          # FLAGS は配列で組む ("$FLAGS" 単一引数渡しは 1 トークン化する — ARG_VECTOR_QUOTED)
          TYPE="$IMAGE_TYPE"
          FLAGS=(--max-generate 500)
          if [ -n "$IMAGE_LIMIT" ]; then FLAGS+=(--limit "$IMAGE_LIMIT"); fi
          if [ -n "$RANKING_KEYS" ]; then
            [[ "$TYPE" = "ranking" || "$TYPE" = "ranking-cards" ]] || { echo 'ranking_keys requires ranking or ranking-cards'; exit 1; }
            test -z "$BLOG_SLUGS" || { echo 'ranking_keys and slugs cannot be combined'; exit 1; }
            npx tsx -e '
              import { getMetricConfig } from "@stats47/data-configs";
              const keys = process.env.RANKING_KEYS.split(",");
              if (keys.length > 50 || new Set(keys).size !== keys.length) throw new Error("Expected 1-50 unique ranking keys");
              for (const key of keys) {
                if (!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(key)) throw new Error(`Invalid ranking key: ${key}`);
                const config = getMetricConfig(key);
                if (!config?.isActive || !config.entities.includes("prefecture")) throw new Error(`Unknown/inactive prefecture ranking: ${key}`);
              }
              console.log(`Validated explicit ranking scope: ${keys.length}`);
            '
            FLAGS+=(--key "$RANKING_KEYS")
          fi
          if [ "$TYPE" = "blog" ]; then
            if [ -n "$BLOG_SLUGS" ]; then
              FLAGS+=(--slug "$BLOG_SLUGS")
            fi
            echo "Running: generate-blog-thumbnails-cloud.ts ${FLAGS[*]}"
            npx tsx apps/web/scripts/generate-blog-thumbnails-cloud.ts "${FLAGS[@]}"
          else
            FLAGS=(--type "$TYPE" "${FLAGS[@]}")
            echo "Running: generate-ogp-images.ts ${FLAGS[*]}"
            npx tsx --tsconfig apps/web/scripts/tsconfig.ogp.json apps/web/scripts/generate-ogp-images.ts "${FLAGS[@]}"
          fi

      - name: 📋 Summarize exact publish plan
        run: |
          PLAN=".local/image-generation-publish-plan-${{ github.event.inputs.type }}.json"
          test -f "$PLAN" || { echo "exact publish plan が生成されませんでした"; exit 1; }
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const plan = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const scopedSlugs = process.argv[2].split(",").filter(Boolean);
            const lines = [
              "### Image publish plan",
              `- generator: ${plan.generator}`,
              `- changed bundles: ${plan.items.length}`,
              `- scope: ${scopedSlugs.length ? `${scopedSlugs.length} explicit slugs` : "all published entities"}`,
              `- plan: ${process.argv[1]}`,
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\\n") + "\\n");
          ' "$PLAN" "${{ github.event.inputs.slugs }}"

      - name: ☁️ Publish exact image set to R2
        if: github.event.inputs.apply == 'true'
        run: |
          PLAN=".local/image-generation-publish-plan-${{ github.event.inputs.type }}.json"
          test -f "$PLAN" || { echo "exact publish plan が生成されませんでした"; exit 1; }
          npx tsx packages/r2-storage/src/scripts/push-generated-image-set.ts --plan "$PLAN"
