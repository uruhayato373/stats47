name: 🖼 Generate OGP Images (ranking / areas / cards / note)

# ランキング・地域の OGP、ランキングのリンクカード、note カバーを Satori (Node) で事前生成し
# R2 へ push する。ランタイム next/og は Cloudflare Worker で 500 (1101) になるため、OGP は
# ビルド外の Node で生成し R2 静的配信する (正典: .claude/rules/ogp-image-standards.md)。
# blog OGP は publish-blog.yml / generate-blog-thumbnails-cloud.ts が別途担当。
#
# 主経路は R2 creds を持つセッション/ローカルからの直接実行 (クラウド連携トークンは
# actions:write 無しで dispatch 不可)。本 CI はその fallback。手動 dispatch のみ。

on:
  workflow_dispatch:
    inputs:
      type:
        description: "対象種別"
        required: true
        default: "ranking"
        type: choice
        options:
          - ranking
          - areas
          - ranking-cards
          - note-covers
      limit:
        description: "件数上限 (空=全件)"
        required: false
        default: ""
      apply:
        description: "R2 へ push する (false=生成のみ)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: generate-ogp-images-${{ github.event.inputs.type }}
  cancel-in-progress: false

env:
  R2_PUBLIC_FETCH_URL: https://storage.stats47.jp
  SITE_ORIGIN: https://stats47.jp
  CLOUDFLARE_R2_BUCKET_NAME: stats47
  # S3 API 経由 R2 書き込み (diff-push-r2.ts)
  R2_S3_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
  R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 🧰 Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🖼 Generate images
        run: |
          FLAGS="--type ${{ github.event.inputs.type }} --force"
          if [ -n "${{ github.event.inputs.limit }}" ]; then FLAGS="$FLAGS --limit ${{ github.event.inputs.limit }}"; fi
          echo "Running: generate-ogp-images.ts $FLAGS"
          npx tsx --tsconfig apps/web/scripts/tsconfig.ogp.json apps/web/scripts/generate-ogp-images.ts "$FLAGS"

      - name: ☁️ Push to R2 (S3 diff)
        if: github.event.inputs.apply == 'true'
        run: |
          case "${{ github.event.inputs.type }}" in
            ranking|ranking-cards) PREFIX="app/ranking" ;;
            areas)                 PREFIX="app/areas" ;;
            note-covers)           PREFIX="note" ;;
          esac
          echo "Pushing prefix: $PREFIX"
          npx tsx packages/r2-storage/src/scripts/diff-push-r2.ts --prefix "$PREFIX"
