name: 📊 Refresh Affiliate Inventory & Compliance

# アフィリエイト在庫の棚卸し JSON と直接配置 compliance snapshot を再生成し、
# artifact と job summary に残す (週次運用ループの前半。後半 = GA4 + 集約 state は
# affiliate-ga4-weekly.yml が 1 時間後に実行)。
#
# - SSOT (affiliate-ads-data.ts / affiliate-direct-placements-data.ts) が変わったら自動で state を同期
# - 週次 cron で棚卸し snapshot を artifact として残す
# - dashboard HTML は /tmp 生成の派生物 (artifact のみ・commit しない。2026-07-15 に commit-back 廃止)
# - 本番 R2 / アプリ / git には触れない。R2 反映は publish-affiliate-ads.yml が別途担当。
# - 広告在庫の変更・effect 判定・push・deploy は自動化しない (観測と候補生成まで)。

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "apps/web/scripts/affiliate-ads-data.ts"
      - "apps/web/scripts/affiliate-offer-profiles-data.ts"
      - "apps/web/scripts/affiliate-direct-placements-data.ts"
      - ".claude/scripts/ads/build-affiliate-dashboard.ts"
      - ".claude/scripts/ads/audit-affiliate-inventory.ts"
      - ".claude/scripts/ads/build-placement-map.mjs"
      - ".claude/scripts/ads/lib/placement-map-core.mjs"
      - ".claude/scripts/ads/audit-affiliate-compliance.ts"
      - ".github/workflows/affiliate-dashboard-refresh.yml"
  schedule:
    - cron: "0 12 * * 0" # JST 21:00 Sunday (UTC 12:00) — 週次棚卸し snapshot

permissions:
  contents: read

concurrency:
  group: affiliate-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 🧰 Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📊 Regenerate inventory audit
        run: npx -y tsx .claude/scripts/ads/audit-affiliate-inventory.ts --json > /dev/null

      - name: 🔍 Compliance audit (direct placements, live)
        # 孤立・PR 表記漏れ・台帳未登録タグを state に記録する。異常があっても workflow は
        # 落とさない (findings は state → operations state の recommendedActions が案内)。
        run: npx -y tsx .claude/scripts/ads/audit-affiliate-compliance.ts --live --scan-all-blog | tee /tmp/affiliate-compliance.md

      - name: 🗺️ Build placement map (需要 GSC × 供給 在庫/EPC)
        # 「どのページ種別×vertical に imp があり、そこに在庫があるか / 広告が出ていないか」を
        # 決定的に突合して state に残す。propose (次に何を仕入れ・どこへ当てるか) の入力。
        # GSC snapshot が未取得の週は exit 2 で落ちるので、その場合も workflow は止めない。
        continue-on-error: true
        run: node .claude/scripts/ads/build-placement-map.mjs

      - name: 🧮 Build read-only portfolio state
        run: |
          npx -y tsx .claude/scripts/ads/build-affiliate-portfolio-state.ts
          npx -y tsx .claude/scripts/ads/build-affiliate-portfolio-state.ts --check

      - name: 🖥️ Build dashboard (/tmp, artifact only)
        run: npx -y tsx .claude/scripts/ads/build-affiliate-dashboard.ts /tmp/stats47-affiliate-dashboard.html > /dev/null

      - name: 📤 Upload dashboard artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: affiliate-dashboard
          path: /tmp/stats47-affiliate-dashboard.html
          retention-days: 14

      - name: 📤 Upload read-only audit state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: affiliate-audit-state
          path: |
            .claude/state/ads/inventory-latest.json
            .claude/state/ads/compliance-latest.json
            .claude/state/ads/placement-map-latest.json
            .claude/state/ads/affiliate-portfolio-latest.json
          retention-days: 30

      - name: 📝 Job summary (compliance findings のみ)
        run: |
          if grep -qE "^- ❌" /tmp/affiliate-compliance.md; then
            cat /tmp/affiliate-compliance.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ compliance findings なし" >> "$GITHUB_STEP_SUMMARY"
          fi
