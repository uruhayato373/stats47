name: 🎨 Gemini Image Run (request-file)

# cloud Claude Code から Gemini API を使うための CI 実行経路 (2026-07-14 新設)。
#
# ★2026-10-07: task "blog-ogp" (ブログ背景の Gemini 生成) は廃止し、受け付けずに失敗させる。
#   ブログの記事固有背景は Codex imagegen で作り assets/blog/article-backgrounds/ に置く
#   (/generate-blog-images の Mode A。正典 .claude/rules/ogp-image-standards.md)。
#   公開時のサムネイル検査のエラーがこの経路を案内していたため、書き直した記事の背景を
#   Gemini で作ろうとする誤りが起きた。受け付ける task は今は無い (area-specialty は未配線)。
# GEMINI_API_KEY は GitHub Secrets 専任 (ローカル .env.local 管理を不要にする)。
#
# 発火経路は 2 つ:
#   1. push (主経路・cloud 用): develop に data/gemini-image-requests.json を commit/push
#      → 本 workflow が生成 → 消費した request を git rm で commit-back [skip ci]。
#      cloud セッションは actions:write が無く workflow_dispatch 不可 (403) のため、
#      youtube-upload-request / estat-catalog-run と同じ push トリガー方式を採る。
#   2. workflow_dispatch (ローカル fallback): slugs/budget を入力して手動実行。
#
# request file 形式 (data/gemini-image-requests.json):
#   { "task": "blog-ogp", "slugs": ["slug-a", "slug-b"], "budgetUsd": 0.5, "apply": false }
#   - task: 現状 "blog-ogp" のみ (blog OGP の AI 背景生成 → ogp-image-standards.md §5)
#   - apply: true = R2 へ push (本番反映) / false = artifact 出力のみ (目視検証用)
#   - budgetUsd: 上限 2 USD (それ以上は拒否。~$0.039/枚)

on:
  push:
    branches: [develop]
    paths: ['data/gemini-image-requests.json']
  workflow_dispatch:
    inputs:
      slugs:
        description: '対象 slug (カンマ区切り)'
        required: true
      budget_usd:
        description: '費用上限 USD (<=2)'
        required: false
        default: '0.5'
      apply:
        description: 'true: R2 へ push / false: artifact のみ'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  # Gemini 課金の二重実行と、全 R2 image writer の競合を同時に防ぐ。
  group: r2-write
  cancel-in-progress: false

env:
  CLOUDFLARE_R2_BUCKET_NAME: stats47
  R2_S3_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
  R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
  # 画像は generator が isolated staging + exact plan を作り、後続publisherがS3 APIで反映する。
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 🧰 Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📋 Resolve request (dispatch 入力 or request file)
        id: req
        # 受け付ける task は今は無い (blog-ogp は 2026-10-07 に廃止)。後続の生成 step は、新しい task を
        # 配線するまで動かない。依頼ファイルは下の consume step が結果によらず消す。
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "✗ ブログ背景の Gemini 生成 (blog-ogp) は廃止。/generate-blog-images の Mode A (Codex) を使う"
            exit 1
          fi
          node -e '
            const r = JSON.parse(require("fs").readFileSync("data/gemini-image-requests.json", "utf8"));
            if (r.task === "blog-ogp") console.error("✗ ブログ背景の Gemini 生成 (blog-ogp) は廃止。/generate-blog-images の Mode A (Codex) を使う");
            else console.error("✗ 受け付ける task がありません:", r.task);
            process.exit(1);
          '

      - name: 🎨 Generate blog OGP AI backgrounds (Gemini)
        env:
          SLUGS: ${{ steps.req.outputs.slugs }}
          BUDGET: ${{ steps.req.outputs.budget }}
          APPLY: ${{ steps.req.outputs.apply }}
        run: |
          # ARGS は配列で組む (ARG_VECTOR_QUOTED)。--slug の値は CSV 1 引数が正 (フラグ値)
          ARGS=(--ai-background --slug "$SLUGS" --budget-usd "$BUDGET")
          if [ "$APPLY" != "true" ]; then
            ARGS+=(--out-dir .local/gemini-verify)
          fi
          echo "generate-blog-thumbnails-cloud.ts ${ARGS[*]}"
          set -o pipefail
          npx tsx apps/web/scripts/generate-blog-thumbnails-cloud.ts "${ARGS[@]}" 2>&1 | tee /tmp/gemini-run.log

      - name: ☁️ Publish exact blog image set (apply=true のみ)
        if: steps.req.outputs.apply == 'true'
        run: |
          PLAN=".local/image-generation-publish-plan-blog.json"
          test -f "$PLAN" || { echo "exact publish plan が生成されませんでした"; exit 1; }
          npx tsx packages/r2-storage/src/scripts/push-generated-image-set.ts --plan "$PLAN"

      - name: 📤 Upload verify artifact (apply=false のみ)
        if: steps.req.outputs.apply != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gemini-verify
          path: .local/gemini-verify
          retention-days: 7
          if-no-files-found: warn

      # ★request は結果によらず必ず消費する (2026-08-03)。成功時しか消費しないと、失敗 run の
      #   request が develop に残って **同内容の再 push が paths フィルタで発火しなくなる**
      #   (data-refresh で実際に起きた: 2026-07-31 の失敗 run が request を 3 日間残した)。
      - name: 🧹 Consume request file (push イベント時のみ・commit-back)
        if: ${{ always() && github.event_name == 'push' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch data/gemini-image-requests.json
          if git diff --cached --quiet; then
            echo "commit する変更なし"
            exit 0
          fi
          git commit -q -m "chore(gemini): consume image request [skip ci]"
          git stash push --include-untracked --quiet || true
          for _ in 1 2 3; do
            if git pull --rebase --quiet origin develop && git push origin HEAD:develop; then
              echo "✅ request を消費した"
              exit 0
            fi
            sleep 5
          done
          echo "::error::request の消費に失敗した (同内容の再 push が発火しなくなる)"
          exit 1
