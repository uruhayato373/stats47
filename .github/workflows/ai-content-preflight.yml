name: 🔎 AI Content Preflight (Gemini model)

# Gemini テキストモデルが実在するかを ListModels で実測する (生成は行わない = 課金ゼロ)。
#
# ★なぜ要るか (2026-07-30 の障害)
#   日次 cron ai-content-generate-daily.yml の初回実行が 40 件すべて HTTP 404 で失敗した。
#   原因はキーでも配線でもなく「設定モデルが API に存在しない」こと。モデルは提供終了するため、
#   コードに焼いたモデル名はいつか必ず 404 になる。
#
#   - モデル設定に触る PR で実 API に当てて壊れを事前に検出する
#   - 日次 cron 側は生成前に同じ preflight を通す (このファイルではなく generate-daily 内の step)
#
# 出力するのはモデル名だけ (機密ではない)。API キー・レスポンス本文は client 側が出さない。

on:
  pull_request:
    paths:
      - "packages/ai-content/src/services/gemini-text-client.ts"
      - "packages/ai-content/src/services/model-preflight.ts"
      - "packages/ai-content/src/scripts/preflight-gemini.ts"
      - ".github/workflows/ai-content-preflight.yml"
      - ".github/workflows/ai-content-generate-daily.yml"
  push:
    branches: [develop]
    paths:
      - "packages/ai-content/src/services/gemini-text-client.ts"
      - "packages/ai-content/src/services/model-preflight.ts"
      - "packages/ai-content/src/scripts/preflight-gemini.ts"
      - ".github/workflows/ai-content-preflight.yml"
      - ".github/workflows/ai-content-generate-daily.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-content-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # 空なら gemini-text-client.ts の既定値を使う。提供終了時はここに実在モデルを設定して復旧する
      GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
    steps:
      - name: 🧰 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Unit tests (model-preflight / generation-outcome)
        run: npm run test:ai-content --workspace apps/web

      - name: 🔑 Assert API key
        run: |
          if [ -z "${GEMINI_API_KEY}" ]; then
            echo "::error::GEMINI_API_KEY (Secrets) が未設定です"
            exit 1
          fi
          echo "GEMINI_API_KEY: 設定あり (値は出力しない)"

      - name: 🔎 Preflight (ListModels で実在確認)
        run: |
          set -o pipefail
          NODE_OPTIONS='--conditions react-server' \
            npx tsx packages/ai-content/src/scripts/preflight-gemini.ts 2>&1 | tee /tmp/preflight.log

      - name: 📝 Summary
        if: always()
        run: |
          {
            echo "### Gemini モデル preflight"
            echo '```'
            cat /tmp/preflight.log 2>/dev/null || echo "(ログなし)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
