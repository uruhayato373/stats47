name: 📊 Weekly Metrics Summary

on:
  schedule:
    - cron: "0 0 * * 1" # Monday JST 09:00 (UTC Mon 00:00)
  workflow_dispatch:
    inputs:
      week:
        description: "Target ISO week (YYYY-Www). Empty = last week (recommended)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: weekly-metrics-summary
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 🧰 Checkout develop (latest metrics data)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: develop
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: 📅 Resolve target week
        id: week
        run: |
          INPUT_WEEK="${{ inputs.week }}"
          if [ -n "$INPUT_WEEK" ]; then
            echo "week=$INPUT_WEEK" >> "$GITHUB_OUTPUT"
          else
            # 月曜朝に回すと「昨日 = 前週の日曜」でその ISO 週を取る
            WEEK=$(date -u -d "1 day ago" +%G-W%V)
            echo "week=$WEEK" >> "$GITHUB_OUTPUT"
          fi

      - name: 📝 Generate weekly metrics summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WEEK="${{ steps.week.outputs.week }}"
          OUT_FILE="/tmp/weekly-metrics-${WEEK}.md"
          node .claude/scripts/metrics/generate-weekly-metrics-issue.mjs --week "${WEEK}" > "$OUT_FILE"
          echo "--- preview ---"
          head -30 "$OUT_FILE"
          cat "$OUT_FILE" >> "$GITHUB_STEP_SUMMARY"
