name: 📊 Weekly Metrics Summary

on:
  schedule:
    - cron: "0 9 * * 5" # 金曜 JST 18:00 (UTC 09:00)。金曜の計測 05:00・無人 triage 12:00 の後、土曜のレビューの前
  workflow_dispatch:
    inputs:
      week:
        description: "Target ISO week (YYYY-Www). Empty = last week (recommended)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: weekly-metrics-summary
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 🧰 Checkout develop (latest metrics data)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: 📅 Resolve target week
        id: week
        run: |
          INPUT_WEEK="${{ inputs.week }}"
          if [ -n "$INPUT_WEEK" ]; then
            echo "week=$INPUT_WEEK" >> "$GITHUB_OUTPUT"
          else
            # 直近に終わった ISO 週 (月〜日・JST)。金曜に回すと前週 = 金曜の計測が取った週
            DOW=$(TZ=Asia/Tokyo date +%w)
            WEEK=$(TZ=Asia/Tokyo date -d "$(( DOW == 0 ? 7 : DOW )) days ago" +%G-W%V)
            echo "week=$WEEK" >> "$GITHUB_OUTPUT"
          fi

      - name: 📝 Generate weekly metrics summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WEEK="${{ steps.week.outputs.week }}"
          OUT_FILE="/tmp/weekly-metrics-${WEEK}.md"
          node .claude/scripts/metrics/generate-weekly-metrics-issue.mjs --week "${WEEK}" > "$OUT_FILE"
          echo "--- preview ---"
          head -30 "$OUT_FILE"
          cat "$OUT_FILE" >> "$GITHUB_STEP_SUMMARY"
