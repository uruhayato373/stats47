name: 🔁 GSC Auto-resubmit (RETIRED — Indexing API compliance)

# ⚠️ RETIRED 2026-07-23 — Google Indexing API 準拠是正
# (.claude/skills/analytics/search-growth/reference/platform-contract.md)。
#
# Google Indexing API の公式対象は JobPosting または BroadcastEvent を含む VideoObject
# ページのみ (https://developers.google.com/search/apis/indexing-api/v3/quickstart,
# アクセス日 2026-07-23)。stats47 の ranking / area / theme / blog / 410 URL は対象外。
# 通常ページへの URL_UPDATED 自動送信は公式仕様に反するため、この scheduled workflow を
# 無効化した:
#   - schedule トリガーを削除 (自動送信を停止)
#   - 送信スクリプト (auto-resubmit.mjs) は publish path を撤去した retired stub に変更済
#   - 過去の送信履歴 (.claude/state/metrics/gsc/resubmit-history.json) は証拠として保持
#
# 通常ページの再クロールは、Indexing API 送信ではなく次の compliant な手段で行う:
#   sitemap 掲載整合 / 内部リンク強化 / HTTP status(200/301/410) 修正 / canonical 是正 /
#   content 補強 → その後 URL Inspection API で coverageState 遷移を「観測」する
#   (= observe-after-fix)。観測は gsc-url-inspection-daily.yml + url-inspection-daily.cjs が担う。
#
# この file は git 履歴保持のために残す。GitHub 上での直接 disable は行わない (repository
# file 変更のみ)。手動 dispatch しても送信は起きない (下記 stub が退役通知を出して終わる)。
#
# 関連: .claude/todo/04_改善バックログ.md [INDEXING-AUTO-01]
#       .claude/skills/analytics/gsc-coverage-remediation/SKILL.md
#       docs/01_技術設計/06_自動化インベントリ.md

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: gsc-auto-resubmit-daily
  cancel-in-progress: false

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ⚠️ Retirement notice (no Indexing API send)
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## GSC Auto-resubmit — RETIRED

          この workflow は 2026-07-23 に **Google Indexing API 準拠是正** のため退役しました。
          通常ページ (ranking/area/theme/blog/410) への Indexing API 送信は公式仕様に反するため停止しています。

          再クロールは sitemap / 内部リンク / HTTP / canonical / content 修正 + URL Inspection 観測 (observe-after-fix) で行ってください。
          正典: `.claude/skills/analytics/search-growth/reference/platform-contract.md`。
          EOF
          echo "[retired] gsc-auto-resubmit-daily は退役済み。Indexing API 送信は行いません。"
          echo "[retired] observe-after-fix: url-inspection-daily.cjs で coverageState を観測してください。"
