name: 🔁 GSC Auto-resubmit (daily)

# 未 INDEXED URL を Indexing API に自動再送信する。
# - URL Inspection daily (JST 06:00) の後に走らせる (JST 06:30)
# - 1 日 100 URL を上限 (公式 quota 200/日の半分、安全マージン)
# - 7 日以内重複送信は scripts 内 history で自動 dedup
# - 履歴は .claude/state/metrics/gsc/resubmit-history.json に commit
#
# 関連:
# - docs/05_改善ログ/indexing.md [INDEXING-AUTO-01]
# - .claude/scripts/gsc/auto-resubmit.mjs
# - .github/workflows/gsc-url-inspection-daily.yml

on:
  schedule:
    - cron: "30 21 * * *" # JST 06:30 = UTC 21:30 (前日)
  workflow_dispatch:
    inputs:
      max:
        description: "Max URLs to send (default 100, max 200)"
        required: false
        default: "100"
      dry_run:
        description: "Dry-run mode (true / false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: gsc-auto-resubmit-daily
  cancel-in-progress: false

jobs:
  resubmit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 🧰 Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔁 Run auto-resubmit
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          MAX_OPT="${{ inputs.max || '100' }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node .claude/scripts/gsc/auto-resubmit.mjs --max "$MAX_OPT"
          else
            node .claude/scripts/gsc/auto-resubmit.mjs --execute --max "$MAX_OPT"
          fi

      - name: 📅 Resolve date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: 💾 Commit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude/state/metrics/gsc/resubmit-history.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(gsc): auto-resubmit history ${{ steps.date.outputs.date }} [skip ci]"
            git push origin main
          fi

      - name: 📄 Step summary
        if: always()
        run: |
          if [ -f .claude/state/metrics/gsc/resubmit-history.json ]; then
            cat <<EOF >> $GITHUB_STEP_SUMMARY
          ## GSC Auto-resubmit ${{ steps.date.outputs.date }}

          $(node -e "
            const h = require('./.claude/state/metrics/gsc/resubmit-history.json');
            const today = new Date(Date.now() + 9*3600*1000).toISOString().slice(0,10);
            const todayCount = h.entries.filter(e => e.date === today).length;
            const total = h.entries.length;
            console.log(\`- Today sent: \${todayCount}\`);
            console.log(\`- Total history: \${total}\`);
          ")
          EOF
          fi
