name: 📝 Publish Blog Article (contents/blog draft → R2)

# 完全DBレス / cloud-first のブログ公開パイプライン。
# contents/blog/<slug> のドラフトを R2 cloud (app/blog/<slug>) に publish し、
# blog snapshot (all.json) を再生成 + push する。ローカル R2 creds 不要 (GitHub Secrets 使用)。
#
# 使い方:
#   gh workflow run publish-blog.yml -f slug=<slug>                      # dry-run (既定: push しない)
#   gh workflow run publish-blog.yml -f slug=<slug> -f dry_run=false     # 本番公開
#   gh workflow run publish-blog.yml -f slug=<slug> -f published_at=2026-05-30 -f dry_run=false
#
# 安全性:
#   - factual gate (ci-factual-gate.mjs) を通過しないと publish しない (AI記事の数値捏造防止)
#   - export-blog-snapshot は union 方式 (配信中 all.json ∪ ローカル) で既存記事を消さない
#   - 記事は prefix push、画像は isolated staging + exact plan publisher で分離

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'contents/blog/<slug> の slug'
        required: true
      published_at:
        description: 'publishedAt (YYYY-MM-DD、空なら本日 UTC)'
        required: false
        default: ''
      dry_run:
        description: 'true: push せず検証のみ / false: 本番公開'
        required: false
        default: 'true'

permissions:
  contents: write # 本番公開後に contents/blog ドラフトを自動削除 (ephemeral outbox) して commit-back するため

concurrency:
  group: r2-write
  cancel-in-progress: false

env:
  # R2 cloud read+write (CLOUDFLARE_* secrets から導出)
  R2_S3_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
  R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
  CLOUDFLARE_R2_BUCKET_NAME: stats47
  R2_PUBLIC_FETCH_URL: https://storage.stats47.jp
  WORKER_CACHE_PURGE_SECRET: ${{ secrets.WORKER_CACHE_PURGE_SECRET }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 🧰 Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: ✅ Validate draft exists
        run: |
          SLUG="${{ github.event.inputs.slug }}"
          test -f "contents/blog/$SLUG/article.md" \
            || { echo "❌ ドラフトが無い: contents/blog/$SLUG/article.md"; exit 1; }
          # 既に公開済みなら二重公開しない (R2 に既存)
          echo "draft OK: $SLUG"

      - name: 🔎 Factual gate (数値捏造・rank 不整合の検出)
        run: node .claude/scripts/blog/ci-factual-gate.mjs "${{ github.event.inputs.slug }}"

      - name: 🗓 Stage draft → app/blog + set publishedAt
        run: |
          SLUG="${{ github.event.inputs.slug }}"
          PD="${{ github.event.inputs.published_at }}"
          [ -z "$PD" ] && PD="$(date -u +%Y-%m-%d)"
          mkdir -p ".local/r2/app/blog/$SLUG"
          cp -R "contents/blog/$SLUG/." ".local/r2/app/blog/$SLUG/"
          # 公開しない作業ファイル (調査材料・審査結果・prompt) を公開 R2 へ上げない (blog-auto-publish.yml と同じ)
          rm -f ".local/r2/app/blog/$SLUG/research.md" ".local/r2/app/blog/$SLUG/review.md" ".local/r2/app/blog/$SLUG/"*.prompt.txt
          # 公開フォルダ側の publishedAt + published を設定 (git のドラフトは触らない)
          A=".local/r2/app/blog/$SLUG/article.md"
          perl -i -pe "s/^publishedAt:.*/publishedAt: $PD/" "$A"
          # 下書きの published: false を true に上書き。published 行が無ければ publishedAt 直後に追加。
          if grep -q '^published:' "$A"; then
            perl -i -pe "s/^published:.*/published: true/" "$A"
          else
            perl -i -pe "s/^(publishedAt:.*)/\$1\npublished: true/" "$A"
          fi
          echo "publishedAt=$PD / published=true set for $SLUG"
          grep -m1 '^publishedAt:' "$A"; grep -m1 '^published:' "$A"

      # 構造品質ゲート (2026-06-02 追加): factual gate は数値捏造のみ検出するため、
      # 薄い記事 (charCount<3000 / internalLinks<3 / H2<4 / 手書きの出典節 / NG word) が
      # 素通りしていた (GSC高インプレ10記事の再発防止)。push 前に R2 公開をブロックする。
      - name: 🧱 Quality gate (構造・薄さ — 公開ブロック)
        run: node .claude/scripts/blog/quality-gate.mjs "${{ github.event.inputs.slug }}"

      - name: 🖼️ Generate changed blog thumbnails (isolated staging)
        run: |
          # article.md から semantic fingerprint を作り、変更時だけ
          # .local/image-staging/blog に bundle + exact plan を生成する。
          npx tsx --tsconfig apps/web/scripts/tsconfig.ogp.json apps/web/scripts/generate-blog-thumbnails.ts --slug "${{ github.event.inputs.slug }}"

      - name: 🖼️ Publish exact blog image set
        run: |
          PLAN=".local/image-generation-publish-plan-blog.json"
          test -f "$PLAN" || { echo "exact publish plan が生成されませんでした"; exit 1; }
          if [ "${{ github.event.inputs.dry_run }}" = "false" ]; then
            npx tsx packages/r2-storage/src/scripts/push-generated-image-set.ts --plan "$PLAN"
          else
            npx tsx packages/r2-storage/src/scripts/push-generated-image-set.ts --plan "$PLAN" --dry-run
          fi

      # CI の export-blog-snapshot は cloud(S3) を list するため、新記事を index(all.json) に
      # 含めるには記事本体を cloud へ push してから all.json を再生成する。画像 manifest は
      # prefix 内にもあるため、exact plan の楽観ロックを壊さないよう画像セット確定後に同期する。
      - name: 📤 Push article files to R2 (画像セット確定後)
        run: |
          SLUG="${{ github.event.inputs.slug }}"
          if [ "${{ github.event.inputs.dry_run }}" = "false" ]; then
            echo "本番: 記事ファイルを cloud へ push (app/blog/$SLUG)"
            # 上書きの前後で本文の版を private R2 に退避する (blog-auto-publish.yml と同じ)
            node .claude/scripts/blog/archive-blog-articles.mjs --slugs "$SLUG"
            npx tsx packages/r2-storage/src/scripts/diff-push-r2.ts --prefix "app/blog/$SLUG"
            node .claude/scripts/blog/archive-blog-articles.mjs --file ".local/r2/app/blog/$SLUG/article.md" --slug "$SLUG"
          else
            echo "dry-run: 記事 push スキップ (差分のみ)"
            npx tsx packages/r2-storage/src/scripts/diff-push-r2.ts --prefix "app/blog/$SLUG" --dry-run
          fi

      - name: 🧮 Regenerate blog snapshot (cloud 記事集合 + 新記事 → all.json, union 方式)
        run: NODE_OPTIONS='--conditions react-server' npx tsx apps/web/scripts/export-blog-snapshot.ts

      - name: 📤 Push all.json index to R2 (再生成した index を cloud へ)
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "false" ]; then
            echo "本番: index (all.json) を push"
            npx tsx packages/r2-storage/src/scripts/diff-push-r2.ts --prefix app/blog
          else
            echo "dry-run: index push スキップ (差分のみ)"
            npx tsx packages/r2-storage/src/scripts/diff-push-r2.ts --prefix app/blog --dry-run
          fi

      - name: 🧹 Purge Workers Cache (本番公開時のみ)
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          SLUG="${{ github.event.inputs.slug }}"
          npx tsx packages/r2-storage/src/scripts/purge-worker-cache.ts --urls \
            "https://stats47.jp/blog/$SLUG" \
            "https://stats47.jp/blog" \
            "https://stats47.jp/" \
            "https://stats47.jp/sitemap.xml"

      - name: 🌐 Audit public data contracts after blog publish
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: npm run audit:public-data-contract

      - name: ✅ Verify live (本番公開時のみ)
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          SLUG="${{ github.event.inputs.slug }}"
          sleep 5
          code=$(curl -s -o /dev/null -w "%{http_code}" -A "Mozilla/5.0 (compatible; Googlebot/2.1)" "https://stats47.jp/blog/$SLUG")
          echo "live: https://stats47.jp/blog/$SLUG → HTTP $code"
          [ "$code" = "200" ] || echo "⚠️ まだ 200 でない (ISR/cache 反映待ちの可能性)。数分後に再確認を"

      # contents/blog は ephemeral outbox: 本番公開時のみ、公開した slug のドラフトを R2 反映後に
      # 自動削除して commit-back する ([skip ci] で再発火防止 / pull --rebase で race 吸収)。
      # R2 の一覧から作る git の生成物 (sitemap・タグのキー・未公開の slug・記事台帳・ページの索引・指標の逆引き) も
      # 同じコミットで進める。書き戻す中身は blog-auto-publish.yml の同じ step と揃える
      # (workflow-commit-back.test.cjs が 2 本を同じ fixture で実行して確かめる。片方だけ変えると落ちる)。
      - name: 🧹 Remove published draft from contents/blog (ephemeral outbox)
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          SLUG="${{ github.event.inputs.slug }}"
          if [ -d "contents/blog/$SLUG" ]; then
            git rm -r -q "contents/blog/$SLUG"
          fi
          # sitemap のコミット済み snapshot を公開実態に追随させる。追随しないと PR の Known Tag Keys Gate が落ちる。
          if (cd apps/web && NODE_OPTIONS='--conditions react-server' npx tsx scripts/generate-sitemap-blog-entries.ts); then
            git add apps/web/src/config/sitemap-blog-entries.ts || true
          else
            echo "::warning::sitemap-blog-entries の再生成に失敗 (公開自体は成功。次の sync-snapshots で追随する)"
          fi
          # 新しいタグを持つ記事を公開すると known-tag-keys も古くなる。未登録のタグのページは 410 になる。
          if (cd apps/web && NODE_OPTIONS='--conditions react-server' npx tsx scripts/generate-known-tag-keys.ts); then
            git add apps/web/src/config/known-tag-keys.ts || true
          else
            echo "::warning::known-tag-keys の再生成に失敗 (公開自体は成功。次の sync-snapshots で追随する)"
          fi
          # 未公開だった記事を再公開した回は、未公開の slug の一覧 (middleware が 410 を返す) からその slug を外す。
          # 下の content:sync はこの一覧を読んで台帳の状態を決めるので、その前に作り直す。
          if (cd apps/web && NODE_OPTIONS='--conditions react-server' npx tsx scripts/generate-unpublished-blog-slugs.ts); then
            git add apps/web/src/config/unpublished-blog-slugs.ts || true
          else
            echo "::warning::unpublished-blog-slugs の再生成に失敗 (公開自体は成功。次の sync-snapshots で追随する)"
          fi
          # 記事台帳・ページの索引・指標の逆引き。タグの索引は known-tag-keys から、逆引きはページの索引から作るので、
          # 上を進めたらここも進めないと develop の content:check と metrics:check が落ちる。
          # git add は作り直しが最後まで通ったときだけ。途中で落ちた書きかけは載せない。
          if NODE_OPTIONS='--conditions react-server' npm run content:sync -- --from-r2; then
            git add data/blog/ledger data/content/entities.json data/content/pages
            if npm run metrics:build-index; then
              git add data/metrics/index
            else
              echo "::warning::指標の逆引き (data/metrics/index) の作り直しに失敗 (公開自体は成功。develop の metrics:check が落ちるので、上のログの原因を直して npm run metrics:build-index を流す)"
            fi
          else
            echo "::warning::記事台帳とページの索引の作り直しに失敗 (公開自体は成功。タグのキーが進んだ回は develop の content:check が落ちるので、上のログの原因を直して npm run content:sync -- --from-r2 を流す)"
          fi
          if git diff --cached --quiet; then
            echo "書き戻す差分なし (ドラフトの取り残しも、生成物の変化も無い)"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore(blog): outbox 掃除 + sitemap snapshot 追随 [skip ci] - $SLUG"
          # content:sync は書き戻しに含めない外部公開物の索引 (data/content/external.json) も書くので、
          # 作業ツリーに残った差分で pull が止まらないよう --autostash を付ける。
          PUSHED=false
          for i in 1 2 3; do
            if git pull --rebase --autostash --quiet origin develop && git push origin HEAD:develop; then
              echo "✅ outbox cleanup pushed: $SLUG"; PUSHED=true; break
            fi
            echo "push retry $i (concurrent push?)"; sleep 3
          done
          # 3 回とも通らなければ step を落とす。成功で終わると、R2 には公開済みなのに develop の outbox と台帳が古いまま気づけない
          [ "$PUSHED" = true ] || { echo "::error::書き戻しの push が 3 回とも失敗した (R2 への公開は済んでいる。develop の outbox・sitemap・タグのキー・記事台帳・索引は古いまま。上のログで pull と push が落ちた理由を確かめる)"; exit 1; }

      - name: 📝 Summary
        run: |
          {
            echo "### Publish Blog: ${{ github.event.inputs.slug }}"
            echo "- dry_run: ${{ github.event.inputs.dry_run }}"
            echo "- factual gate: passed"
            echo "- 🧹 contents/blog outbox: 公開後にドラフトを自動削除 (ephemeral)"
          } >> "$GITHUB_STEP_SUMMARY"
