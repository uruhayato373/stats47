name: 🗾 Migration-flow Monthly Highlight

# 毎月 1日に「先月の TOP 5 / BOTTOM 5 変動県」をハイライト投稿。
# - データ鮮度を維持しながら投稿頻度は控えめ (1-3 件/月)
# - IG carousel + X reel の組み合わせ
#
# 関連:
# - docs/01_技術設計/06_自動化インベントリ.md / .claude/rules/sns-content-standards.md

# ★schedule は Phase 3 (生成ステップ) を実装するまで停止する (2026-08-01)。
# 生成ステップが `echo "TODO"` のまま R2 push が無条件で走る構造だったため、
# 毎月 1日に必ず「.local/r2/sns/migration-flow が見つかりません」で落ちていた
# (2026-06-01 / 07-01 / 08-01 の 3 回とも failure)。何も生成しない cron が
# 毎月赤を出し続けても検知価値が無いので、実装が入るまで手動 dispatch のみにする。
# 再開条件: 下の「Pick monthly highlight」「Render highlight assets」を実装すること。
on:
  workflow_dispatch:
    inputs:
      highlight_type:
        description: "ハイライト種類 (top5 / bottom5 / theme)"
        required: false
        default: "top5"
      dry_run:
        description: "投稿せず生成のみ"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: migration-flow-monthly
  cancel-in-progress: false

jobs:
  highlight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 🧰 Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      # TODO Phase 3
      - name: 📊 Pick monthly highlight
        run: |
          echo "TODO: Phase 3 で実装"
          # node .claude/scripts/sns/migration-flow/pick-monthly-highlight.mjs \
          #   --type ${{ inputs.highlight_type || 'top5' }}
          # outputs: .local/r2/sns/migration-flow/highlight-{YYYY-MM}/

      - name: 🎬 Render highlight assets
        run: |
          echo "TODO: Phase 3 で実装"
          # cd apps/remotion && npx remotion render MigrationHighlight \
          #   out/mf-highlight-{YYYY-MM}.mp4 \
          #   --props='{...}'

      # 生成ステップが未実装の間は staging が作られない。無条件に push すると
      # diff-push-r2 が「見つかりません」で exit 1 する (この workflow の失敗原因)。
      - name: 🔎 Check generated assets
        id: assets
        run: |
          if [ -d .local/r2/sns/migration-flow ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::生成ステップが未実装のため R2 push と投稿をスキップします (Phase 3)"
          fi

      - name: ☁️ Push to R2
        if: steps.assets.outputs.exists == 'true' && inputs.dry_run != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: |
          npx tsx packages/r2-storage/src/scripts/diff-push-r2.ts --prefix sns/migration-flow

      - name: 📱 Post to Instagram
        if: steps.assets.outputs.exists == 'true' && inputs.dry_run != 'true'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ vars.INSTAGRAM_BUSINESS_ACCOUNT_ID || secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
        run: |
          echo "TODO: Phase 3 で実装"
          # npx tsx .claude/skills/sns/post-instagram/post-instagram.ts \
          #   highlight-${MONTH} --domain migration-flow --type carousel

      - name: 💾 Commit logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude/state/metrics/sns/instagram-publish-log.csv
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore(sns): migration-flow monthly highlight $(date -u +%Y-%m) [skip ci]"
            # 投稿台帳は develop へ commit-back する (main 直推しは branch-workflow 違反・
            # 投稿のたびに main/develop が分岐する。main へは次の PR で乗る。2026-08-16 是正)
            git pull --rebase --autostash origin develop
            git push origin develop
          fi
