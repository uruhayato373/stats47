name: Post-Deploy Smoke Test

on:
  # deploy-workers 完了後に自動実行
  workflow_run:
    workflows: ["Deploy to Cloudflare Workers"]
    types:
      - completed
    branches:
      - main

  # 手動実行（URL 指定可能）
  workflow_dispatch:
    inputs:
      base_url:
        description: "テスト対象の URL"
        required: false
        default: "https://stats47.jp"

concurrency:
  group: smoke-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    # deploy が成功した場合のみ実行（手動実行時は常に実行）
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    # 実測 (2026-07-29 run 30417240556): checkout〜Playwright 完了で 3分20秒、
    # warm-cache が 29 URL × 約5.1秒 (DELAY=2 + リクエスト) = 約2分30秒 → 合計 約5分50秒。
    # 旧 5 分では恒常的に約 1 分超過し、**テストは全て通っているのに job が
    # timeout で cancelled** になっていた (2026-07-28 / 07-29 と 2 回連続)。
    # 変動 (npm ci のキャッシュミス・Playwright ブラウザ取得) を見込んで倍の余裕を取る。
    # ハング検知の役目は残すため、無制限にはしない。
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Wait for deployment propagation
        run: sleep 30

      - name: Run health check
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://stats47.jp' }}
        run: npx tsx apps/web/scripts/smoke-test.ts --base-url "$BASE_URL"

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        working-directory: apps/web
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ github.event.inputs.base_url || 'https://stats47.jp' }}
        run: npx playwright test --config playwright.smoke.config.ts

      - name: Upload smoke test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-test-report
          path: apps/web/playwright-smoke-report/
          retention-days: 7

      - name: Warm cache (R2 ISR + Edge)
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://stats47.jp' }}
        run: bash .github/scripts/warm-cache.sh "$BASE_URL"
