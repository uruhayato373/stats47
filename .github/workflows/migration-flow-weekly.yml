name: 🗾 Migration-flow Weekly Deep Dive

# 毎週月曜に 1 県の深掘り投稿。47 県を年内に全カバー (週ローテーション)。
#
# ローテーション:
#   今週カバー = WEEK_OF_YEAR % 47 (0=hokkaido, 1=aomori, ..., 46=okinawa)
#   投稿ログで既投稿週は skip、未カバー優先 (年初リセット)
#
# 関連:
# - docs/01_技術設計/06_自動化インベントリ.md / .claude/rules/sns-content-standards.md
#
# ★★ 2026-08-16: schedule を停止した (オーナー判断) ★★
#   2026-05-25 から 12 回連続で失敗していた。原因は「📱 Post to Instagram + X」step が読む
#   .claude/skills/sns/post-instagram/post-instagram.ts:86-88 が `.local/r2/sns/...` という
#   **gitignored なローカル成果物**を existsSync で要求すること (.gitignore:140)。
#   この workflow は checkout しかせず R2 から media を取る step が無いので、clean checkout の
#   CI では構造的に必ず失敗する。県名だけが週ローテーションで変わり同一エラーを繰り返していた。
#
#   投稿を再開する場合は、成功している post-instagram-scheduled.yml と同じ経路
#   (公開 R2 URL https://storage.stats47.jp を IG Graph API に URL のまま渡す) へ寄せるか、
#   post step の前に R2 から pull する step を足すこと。**未修正のままなので dispatch でも
#   Post step は失敗する** (schedule を止めたのは無言の連続失敗を止めるため)。

on:
  # schedule は 2026-08-16 に削除 (上記)。再開は設計欠陥の修正とセットで。
  workflow_dispatch:
    inputs:
      pref_code:
        description: "明示的に投稿する県コード (空白で週ローテーション)"
        required: false
        default: ""
      dry_run:
        description: "投稿せず選定のみ"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: migration-flow-weekly
  cancel-in-progress: false

jobs:
  deep-dive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 🧰 Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Pick this week's prefecture
        id: pick
        run: |
          # Week-of-year % 47 で県を決定 (UTC + 9h = JST)
          WEEK_OF_YEAR=$(date -u -d '+9 hours' +%V)
          PREF_INDEX=$(( ( ${WEEK_OF_YEAR#0} - 1 ) % 47 + 1 ))
          PREF_CODE=$(printf "%02d" $PREF_INDEX)
          # 入力指定があれば優先
          if [ -n "${{ inputs.pref_code }}" ]; then
            PREF_CODE="${{ inputs.pref_code }}"
          fi
          # slug 取得 (簡易マッピング、Phase 4 で外部化)
          declare -A SLUG_MAP=(
            [01]=hokkaido [02]=aomori [03]=iwate [04]=miyagi [05]=akita [06]=yamagata
            [07]=fukushima [08]=ibaraki [09]=tochigi [10]=gunma [11]=saitama [12]=chiba
            [13]=tokyo [14]=kanagawa [15]=niigata [16]=toyama [17]=ishikawa [18]=fukui
            [19]=yamanashi [20]=nagano [21]=gifu [22]=shizuoka [23]=aichi [24]=mie
            [25]=shiga [26]=kyoto [27]=osaka [28]=hyogo [29]=nara [30]=wakayama
            [31]=tottori [32]=shimane [33]=okayama [34]=hiroshima [35]=yamaguchi [36]=tokushima
            [37]=kagawa [38]=ehime [39]=kochi [40]=fukuoka [41]=saga [42]=nagasaki
            [43]=kumamoto [44]=oita [45]=miyazaki [46]=kagoshima [47]=okinawa
          )
          SLUG="${SLUG_MAP[$PREF_CODE]}"
          {
            echo "pref_code=$PREF_CODE"
            echo "slug=$SLUG"
          } >> "$GITHUB_OUTPUT"
          echo "Picked: $SLUG ($PREF_CODE) for week $WEEK_OF_YEAR"

      # TODO Phase 4: 既投稿チェック (週単位 idempotency)
      - name: 🔁 Skip if already posted this week
        id: check
        run: |
          WEEK_OF_YEAR=$(date -u -d '+9 hours' +%V)
          YEAR=$(date -u -d '+9 hours' +%Y)
          LOG=".claude/state/metrics/sns/instagram-publish-log.csv"
          TAG="weekly-${YEAR}-W${WEEK_OF_YEAR}-${{ steps.pick.outputs.slug }}"
          if [ -f "$LOG" ] && grep -q ",${TAG}," "$LOG"; then
            echo "[skip] ${TAG} already posted"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 📱 Post to Instagram + X
        if: steps.check.outputs.skip != 'true' && inputs.dry_run != 'true'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ vars.INSTAGRAM_BUSINESS_ACCOUNT_ID || secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
        run: |
          # 既存 caption.txt + reel.mp4 を流用 (年次 refresh で更新済)
          npx tsx .claude/skills/sns/post-instagram/post-instagram.ts \
            ${{ steps.pick.outputs.slug }} \
            --domain migration-flow --type reels
          # X は Playwright が CI 対応してから (Phase 4)
          echo "TODO: X 投稿は Phase 4"

      - name: 💾 Commit logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude/state/metrics/sns/instagram-publish-log.csv
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore(sns): migration-flow weekly ${{ steps.pick.outputs.slug }} [skip ci]"
            # 投稿台帳は develop へ commit-back する (main 直推しは branch-workflow 違反・
            # 投稿のたびに main/develop が分岐する。main へは次の PR で乗る。2026-08-16 是正)
            git pull --rebase --autostash origin develop
            git push origin develop
          fi
