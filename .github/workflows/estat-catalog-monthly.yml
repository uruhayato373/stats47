name: 📚 e-Stat Catalog (monthly)

# e-Stat メタデータ完全カタログを R2 estat-catalog/ へ月次更新する。
# 完全DBレス・read-only な発見基盤 (観測値は対象外・既存 app/stats/ 経路のまま)。
#
# パイプライン:
#   1. catalog.mjs run: getStatsList (全表。集計地域区分「該当なし」を含む) → S3 から既存索引取得 →
#      差分 plan → getMetaInfo を時間予算まで → .local/r2/estat-catalog/ に staging
#   2. diff-push-r2 --prefix estat-catalog: R2 へ push
#
# カタログ本体の git commit-back はしない (状態は R2 の manifest.json)。実行結果だけを
# data/ci/monthly-jobs/estat-catalog.json に残す (月次レビューが読む)。
# concurrency は estat-catalog 専用 group とし、r2-write (data-refresh / sync-snapshots) と
# 直列化しない — このプレフィックスは本 workflow が専有し app 配信に触れないため、
# 30〜150 分の crawl 中に他の R2 反映を塞ぐ必要がない。
#
# 1 回で終わらないとき (初回は約 12,000 表) は workflow_dispatch を繰り返して manifest の
# metaPending が 0 になるまで回す。起動用の専用ブランチは 2026-11-04 に廃止した。
#
# 設計: docs/02_実装計画/48_e-Statカタログ実装仕様.md

on:
  workflow_dispatch:
    inputs:
      meta_scope:
        description: "getMetaInfo を取る collectArea (カンマ区切り。0=該当なし 1=全国 2=都道府県 3=市区町村)"
        required: false
        default: "2,3"
      meta_stat_codes:
        description: "collectArea に関係なく getMetaInfo を取る調査コード (カンマ区切り。例 00200561=家計調査)"
        required: false
        default: "00200561"
      time_budget_min:
        # job の timeout (180 分) から、全表の一覧取得 (約 10 分)・索引の書き出し・R2 への反映の時間を残す。
        # 2026-11-02 に一覧を全 23 万表へ広げたので 150 → 120 に下げた (150 のままだと反映の途中で打ち切られうる)
        description: "getMetaInfo に使う時間予算 (分)"
        required: false
        default: "120"
      max_meta:
        description: "getMetaInfo の上限件数 (空なら時間予算のみで制御)"
        required: false
        default: ""
      dry_run:
        description: "true: L1 (getStatsList) のみ実行し getMetaInfo も R2 push もしない"
        required: false
        default: "false"
  schedule:
    # 3日 03:00 JST = 2日 18:00 UTC。data-refresh (5日03:00 UTC) と非重複。
    - cron: "0 18 2 * *"

permissions:
  contents: write

concurrency:
  group: estat-catalog
  cancel-in-progress: false

env:
  NEXT_PUBLIC_ESTAT_APP_ID: ${{ vars.NEXT_PUBLIC_ESTAT_APP_ID }}
  R2_S3_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
  R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
  CLOUDFLARE_R2_BUCKET_NAME: stats47

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 🧰 Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Install deps
        run: npm ci

      - name: 📚 Run catalog crawl
        env:
          META_STAT_CODES: ${{ github.event.inputs.meta_stat_codes || '00200561' }}
        run: |
          ARGS=(run --meta-scope "${{ github.event.inputs.meta_scope || '2,3' }}" \
                     --meta-stat-codes "$META_STAT_CODES" \
                     --time-budget-min "${{ github.event.inputs.time_budget_min || '120' }}")
          MAX_META="${{ github.event.inputs.max_meta }}"
          if [ -n "$MAX_META" ]; then ARGS+=(--max-meta "$MAX_META"); fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run); fi
          node --import tsx .claude/scripts/estat/catalog.mjs "${ARGS[@]}"

      - name: 📤 Push to R2
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: npx tsx packages/r2-storage/src/scripts/diff-push-r2.ts --prefix estat-catalog

      # 月次レビューがファイルから「走ったか・何が出たか」を判定できるよう、結果を state に残す (2026-10-01)。
      # 失敗した回も failed として残す。読み手: .claude/scripts/management/lib/review-cadence.mjs
      - name: 🗂️ Record monthly job result
        if: always()
        run: |
          STATUS="${{ job.status == 'success' && (github.event.inputs.dry_run == 'true' && 'skipped' || 'ok') || 'failed' }}"
          node .claude/scripts/metrics/record-monthly-job.mjs --job estat-catalog --status "$STATUS" \
            --field trigger="${{ github.event_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ci/monthly-jobs/estat-catalog.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(metrics): monthly job estat-catalog $STATUS [skip ci]"
          git pull --rebase origin develop
          git push origin develop
