name: 🚇 Commute-flow Ingest (e-Stat → R2)

# 国勢調査「従業地・通学地集計」(statsDataId 0003454526) から通勤 O-D を取得し、
# 47 県分の per-prefecture JSON を R2 (app/commute-flow/{NN}.json) に反映する。
#
# e-Stat APP_ID は CI 専任 (vars.NEXT_PUBLIC_ESTAT_APP_ID)。次元コードは名称から自動検出。
# 国勢調査は5年に1回 → 低頻度。まず dry_run=true で検出ログを確認してから本実行する。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true: 次元検出ログのみ (R2 反映しない)"
        required: false
        default: "true"

permissions:
  contents: read

env:
  NEXT_PUBLIC_ESTAT_APP_ID: ${{ vars.NEXT_PUBLIC_ESTAT_APP_ID }}
  R2_PUBLIC_FETCH_URL: https://storage.stats47.jp
  NODE_OPTIONS: "--conditions react-server"
  R2_S3_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
  R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
  CLOUDFLARE_R2_BUCKET_NAME: stats47
  WORKER_CACHE_PURGE_SECRET: ${{ secrets.WORKER_CACHE_PURGE_SECRET }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 🧰 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📥 Ingest commute O-D
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npx tsx packages/data-configs/scripts/ingest-commute-flow.ts --dry-run
          else
            npx tsx packages/data-configs/scripts/ingest-commute-flow.ts
            echo "--- 生成数 ---"
            find .local/r2/app/commute-flow -maxdepth 1 -name '*.json' | wc -l
          fi

      - name: ☁️ Push to R2 (app/commute-flow)
        if: inputs.dry_run != 'true'
        run: |
          npx tsx packages/r2-storage/src/scripts/diff-push-r2.ts --prefix app/commute-flow

      - name: 🧹 Purge Workers Cache
        if: inputs.dry_run != 'true'
        run: npx tsx packages/r2-storage/src/scripts/purge-worker-cache.ts --all
