name: 🛒 Sync Rakuten Catalog → R2

# 楽天市場の商品・返礼品カタログを R2 snapshot に焼く日次 cron。
#
# なぜ事前取得か (2026-08-04):
#   楽天に申告した Expected QPS は 1。一方 deploy-workers.yml の warm-cache は sitemap の
#   全 URL を順に叩くため、デプロイのたびに ISR が総入れ替えになり 646 ページ分の楽天
#   呼び出しがバーストしていた。429 で弾かれてもカードは [] に degrade して静かに消える
#   だけで気づけない。ここで 1 QPS 以下でまとめて取得し、ページは R2 だけを読む。
#
# これが CI で回せるのは、楽天アプリの Allowed IP を 0.0.0.0/0 にしたため
# (GitHub Actions ランナーの送信元 IP は動的で個別登録できない)。
# 正典: .claude/rules/affiliate-ads-standards.md §12

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "先頭 N 件だけ取得 (動作確認用。空なら全件)"
        required: false
        type: string
      dry_run:
        description: "R2 に書かず件数だけ出す"
        required: false
        type: boolean
        default: false
  schedule:
    # 毎日 JST 04:00 (UTC 19:00)。deploy や他の cron と重ならない時間帯。
    - cron: "0 19 * * *"

permissions:
  contents: read
  # 失敗を Issue で通知するため (cloudflare-usage-daily 等と同じ規約)
  issues: write

concurrency:
  # R2 push は publish-affiliate-ads / sync-snapshots と同じ group で直列化する
  # (書き先 prefix は app/rakuten/ 専有だが、R2 書込 workflow を跨いだ二重実行を避ける慣例に合わせる)
  group: r2-write
  cancel-in-progress: false

env:
  RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
  RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
  R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
  # diff-push-r2 (S3 API) に必須。他の R2 書込 workflow と同じ組み立て方。
  R2_S3_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_R2_BUCKET_NAME: stats47

jobs:
  sync:
    runs-on: ubuntu-latest
    # 全件 (品目 459 + 都道府県 47) を 1.2 秒間隔で回すと約 12 分。余裕を持たせる。
    timeout-minutes: 40
    steps:
      # action は SHA ピン留めが必須 (audit-workflow-policy.cjs --strict)。既存 workflow と同じ pin に揃える。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm

      - name: 📦 Install
        run: npm ci

      - name: 🛒 Fetch → R2
        env:
          # 展開を env 経由にして、入力値がシェルに直接埋め込まれるのを避ける
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # 配列で組み立てる (単純な文字列連結は shellcheck SC2086 になる)
          ARGS=()
          if [ -n "$INPUT_LIMIT" ]; then ARGS+=(--limit "$INPUT_LIMIT"); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          # ★ -r setup-cli.js は必須。R2 の server barrel と repositories が server-only を
          #   import しており、素の tsx 実行では throw する (sync-snapshots/run.sh と同じ規約)。
          npx tsx -r ./packages/ranking/src/scripts/setup-cli.js \
            apps/web/scripts/sync-rakuten-catalog.ts "${ARGS[@]}"

      # ★ saveToR2 は .local/r2/ に書くだけ。実 R2 への反映は diff-push-r2 (S3 API) が行う
      #   2 段構成 (sync-snapshots/run.sh と同じ)。この段が無いと「書込済」と表示されても
      #   本番には何も反映されない。
      - name: 🚀 Push → R2
        if: ${{ inputs.dry_run != true }}
        run: npx tsx packages/r2-storage/src/scripts/diff-push-r2.ts --prefix app/rakuten

      # ★失敗を検知できるようにする。この cron が黙って死ぬと R2 が古いまま配信され続け、
      #   楽天アプリの期限切れ (2027-03-07) / スコープ変更 / Allowed IP 変更に気づけない。
      #   カードは [] に degrade して静かに消えるだけなので、通知が無いと発覚しない。
      - name: 🚨 Open alert issue on failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="🛒 楽天カタログ同期が失敗しています"
          BODY=$(cat <<EOF
          日次 cron \`sync-rakuten-catalog.yml\` が失敗しました。

          実行ログ: $RUN_URL

          ## 放置した場合の影響
          R2 (\`app/rakuten/\`) が更新されず、**古い商品・価格が配信され続けます**。
          楽天カードは取得失敗時に静かに消える (fallback を持たない) ため、
          サイトを見ても気づけません。

          ## 確認順 (よくある原因)
          1. 楽天アプリの **有効期限** (2027-03-07)
          2. **API Access Scopes** の \`Rakuten Ichiba API\` チェック
          3. **Allowed IP** が \`0.0.0.0/0\` のままか
             (GitHub Actions の送信元 IP は動的なので特定 IP にすると全滅する)
          4. \`RAKUTEN_APP_ID\` / \`RAKUTEN_ACCESS_KEY\` の GitHub Secrets

          正典: \`.claude/rules/affiliate-ads-standards.md\` §12
          EOF
          )
          # ラベルが無いと gh issue create が "could not add label" で落ち、**アラート自体が飛ばない**
          # (2026-08-12 に rakuten-alert 未登録で実際に発生し、9 日間の同期停止を誰も知らなかった)。
          gh label create rakuten-alert --description "楽天カタログ同期の失敗" --color "b60205" --force 2>/dev/null || true
          EXISTING=$(gh issue list --state open --label rakuten-alert --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "$TITLE" --body "$BODY"
          else
            gh issue create --title "$TITLE" --label "rakuten-alert,auto-generated" --body "$BODY"
          fi

      - name: ✅ Close recovered alert
        if: success() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --state open --label rakuten-alert --limit 100 --json number --jq '.[].number' |
            while read -r NUMBER; do
              gh issue close "$NUMBER" --reason completed \
                --comment "楽天カタログ同期が復旧したため自動 Close します。"
            done
