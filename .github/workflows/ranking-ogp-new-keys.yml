name: 🖼 Ranking OGP for new known keys (develop)

# develop の既知キー (known-ranking-keys.ts) のうちまだ main へ出ていないランキングの OGP とリンクカードを、
# main へのマージ (デプロイ) より前に R2 へ作る。
#
# なぜ要るか (DEPLOY-SMOKE-NEW-KEY-OGP-01): デプロイ後スモークは、この push で増えたキーの og:image を
# 実際に取得する。OGP は sync-snapshots の sync-ranking-keys job が keys PR を作るときにしか作られないので、
# 既知キーを develop で手で再生成して出したデプロイは、OGP が無いまま必ずスモークで落ちていた
# (2026-10-08 に PR #1100 の 13 キーと PR #1104 の 31 キーで 2 回。手で sync-snapshots を代理起動して直した)。
# スモークの検査は緩めず、画像を作る時点をデプロイ前へ動かす。
#
# 取り消されても拾い直す (R2-WRITE-PENDING-DISPLACE-01): r2-write の待ち枠は 1 本だけで、後から入った run が
# 待機中の run を黙って cancelled にする (2026-10-12・10-26・11-02・11-16 に、ジョブを始める前に取り消された)。
# 対象を「この push で足されたキー」ではなく「develop にあって main に無いキーのうち og:image が R2 に無いもの」
# にし (packages/ops/src/ogp/pending-ranking-ogp.mjs)、push に加えて定期実行でも確かめる。取り消された run の
# キーは次の実行で必ず拾われる。判定は r2-write の外の plan job で行い、作るものが無い実行は待ち枠に入らない
# (ほかの R2 writer の待機を奪わない)。
#
# 生成するのは欠落分だけ (generate-ogp-images.ts の exact publish plan)。1 回 50 件まで。超えた分は次の実行で作る。

on:
  push:
    branches: [develop]
    paths:
      - 'packages/ranking/src/config/known-ranking-keys.ts'
      - 'packages/ops/src/ogp/pending-ranking-ogp.mjs'
      - '.github/workflows/ranking-ogp-new-keys.yml'
  schedule:
    # 取り消された run の拾い直し。本番反映 (1 日 1 回) より前に 1 回は回るよう 6 時間おき
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # この workflow どうしの重なりだけを避ける。待機中の run が後続に取り消されても、後続が同じキーの集合
  # (main に無いキー) を見るので取りこぼさない。R2 への書き込みの排他は generate job の r2-write が持つ
  group: ranking-ogp-new-keys
  cancel-in-progress: false

env:
  R2_PUBLIC_FETCH_URL: https://storage.stats47.jp
  SITE_ORIGIN: https://stats47.jp
  CLOUDFLARE_R2_BUCKET_NAME: stats47
  R2_S3_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
  R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}

jobs:
  # r2-write の外で、作るべきキーがあるかだけを決める (依存を入れない。HEAD で公開 R2 を見るだけ)
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      keys: ${{ steps.keys.outputs.keys }}
    steps:
      - name: 🧰 Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0

      - name: 🔍 Pending keys without og:image
        id: keys
        run: |
          KNOWN_KEYS_FILE="packages/ranking/src/config/known-ranking-keys.ts"
          git show "origin/main:${KNOWN_KEYS_FILE}" > "$RUNNER_TEMP/main-known-keys.ts"
          node packages/ops/src/ogp/pending-ranking-ogp.mjs "$KNOWN_KEYS_FILE" "$RUNNER_TEMP/main-known-keys.ts" | tee "$RUNNER_TEMP/plan.txt"
          cat "$RUNNER_TEMP/plan.txt" >> "$GITHUB_OUTPUT"
          {
            echo "### デプロイ待ちの既知キーの OGP"
            sed 's/^/- /' "$RUNNER_TEMP/plan.txt"
          } >> "$GITHUB_STEP_SUMMARY"

  generate:
    needs: plan
    if: needs.plan.outputs.keys != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # 全 R2 writer と共通ロック。snapshot / blog / 画像の同時上書きを防ぐ。
      group: r2-write
      cancel-in-progress: false
    steps:
      - name: 🧰 Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      # sync-snapshots の sync-ranking-keys job と同じ生成・反映 (exact publish plan を必須にする)。
      # 生成・反映の失敗は run を止める (画像なしのランキングを黙って main へ出さない)。
      - name: 🖼 Generate OGP for the pending keys
        env:
          RANKING_KEYS: ${{ needs.plan.outputs.keys }}
        run: |
          TSC="apps/web/scripts/tsconfig.ogp.json"
          SC="apps/web/scripts/generate-ogp-images.ts"
          ARGS=(--source known --key "$RANKING_KEYS" --limit 50 --max-generate 50)
          for TYPE in ranking; do
            npx tsx --tsconfig "$TSC" "$SC" --type "$TYPE" "${ARGS[@]}"
            PLAN=".local/image-generation-publish-plan-${TYPE}.json"
            test -f "$PLAN" || { echo "exact publish plan が生成されませんでした: $TYPE"; exit 1; }
            npx tsx packages/r2-storage/src/scripts/push-generated-image-set.ts --plan "$PLAN"
          done
