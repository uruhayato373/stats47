name: 📤 YouTube Upload (experiment)

# YouTube 量産実験の CI 投稿経路。CI シークレット GOOGLE_OAUTH_* を使い、ローカル認証なしで投稿する。
# ローカルに R2 creds / OAuth が無い環境でも投稿できるよう、動画は GitHub Release アセット等の
# 公開/API URL から fetch する (ローカル R2 push 不要)。正典: docs/10_SNS戦略/07_YouTube量産実験.md
#
# トリガー:
#   - push (develop, paths=リクエストファイル): .claude/state/youtube-upload-request.json を更新すると 1 本投稿
#   - workflow_dispatch: 同じリクエストファイルを読んで手動再実行 (main 昇格時のみ dispatch 可)
# 本番デプロイ (develop→main) を避けるため push トリガーを主経路にする。
# 月次上限は .claude/state/youtube-experiment.json (monthlyLimit) で緩和。重複ガードは upload.js 内で走る。

on:
  workflow_dispatch: {}
  push:
    branches: [develop]
    paths:
      - ".claude/state/youtube-upload-request.json"

permissions:
  contents: write

concurrency:
  group: youtube-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 🧰 Checkout develop
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: develop
          fetch-depth: 1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔐 Write .env.local from secrets
        run: |
          {
            echo "GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}"
            echo "GOOGLE_OAUTH_CLIENT_SECRET=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}"
            echo "GOOGLE_OAUTH_REFRESH_TOKEN=${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}"
            echo "YOUTUBE_CHANNEL_ID=UCdRiwDSX1aUd0dSd7Cs08Kg"
          } > .env.local

      - name: 📥 Fetch video from request URL (Release asset / R2)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REQ=.claude/state/youtube-upload-request.json
          if [ ! -f "$REQ" ]; then
            echo "ERROR: リクエストファイルが無い: $REQ"
            exit 1
          fi
          VURL=$(jq -r '.video_url' "$REQ")
          if [ -z "$VURL" ] || [ "$VURL" = "null" ]; then
            echo "ERROR: video_url が空"
            exit 1
          fi
          echo "Fetching: $VURL"
          # GitHub API asset URL は token + octet-stream。公開 R2/URL でも害はない
          if ! curl -fL -H "Authorization: token $GH_TOKEN" -H "Accept: application/octet-stream" "$VURL" -o video.mp4; then
            echo "ERROR: 動画取得失敗: $VURL"
            exit 1
          fi
          echo "video.mp4 $(stat -c%s video.mp4) bytes"
          THUMB=$(jq -r '.thumbnail_url // ""' "$REQ")
          if [ -n "$THUMB" ] && [ "$THUMB" != "null" ]; then
            curl -fL -H "Authorization: token $GH_TOKEN" -H "Accept: application/octet-stream" "$THUMB" -o thumb.png && echo "thumb fetched" || echo "WARN: thumbnail fetch 失敗 (続行)"
          fi

      - name: 🎬 Upload to YouTube (stats47)
        run: |
          REQ=.claude/state/youtube-upload-request.json
          TITLE=$(jq -r '.title' "$REQ")
          DESC=$(jq -r '.description // ""' "$REQ")
          TAGS=$(jq -r '.tags // "都道府県,ランキング,統計"' "$REQ")
          PRIVACY=$(jq -r '.privacy // "private"' "$REQ")
          PUBAT=$(jq -r '.publish_at // ""' "$REQ")
          CKEY=$(jq -r '.content_key' "$REQ")
          MKEYS=$(jq -r '.metric_keys // ""' "$REQ")
          echo "title=$TITLE / privacy=$PRIVACY / content_key=$CKEY"
          ARGS=(video.mp4
            --title "$TITLE"
            --description "$DESC"
            --tags "$TAGS"
            --privacy "$PRIVACY"
            --content-key "$CKEY"
            --post-type long --domain ranking --template bcr)
          # upload.js の予約フラグは --schedule (--publish-at は未知フラグとして黙殺され即時公開になる)
          if [ -n "$PUBAT" ] && [ "$PUBAT" != "null" ]; then ARGS+=(--schedule "$PUBAT"); fi
          if [ -f thumb.png ]; then ARGS+=(--thumbnail thumb.png); fi
          if [ -n "$MKEYS" ] && [ "$MKEYS" != "null" ]; then ARGS+=(--metric-keys "$MKEYS"); fi
          node .claude/scripts/youtube/upload.js "${ARGS[@]}"

      - name: 🧹 Remove secrets file
        if: always()
        run: rm -f .env.local

      - name: 📤 Commit posts.json ledger back to develop
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # upload.js が書いた posts.json を先に commit してから rebase する
          # (未ステージのまま pull --rebase すると "unstaged changes" で exit 128 になる)
          git add .claude/state/sns/posts.json
          if git diff --cached --quiet; then
            echo "posts.json 変更なし、コミットをスキップ"
            exit 0
          fi
          git commit -m "chore(youtube): upload ledger update [skip ci]"
          git fetch origin develop
          git rebase origin/develop
          git push origin HEAD:develop
