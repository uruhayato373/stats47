name: 📈 Theme Quality Audit (weekly)

# 日曜05:00 JST。公開R2をread-only検査し、構成・履歴・coverage・recipeの退行を検知。
# 新規/変化した異常だけissueを更新し、同じ警告は再通知しない。
on:
  schedule:
    - cron: "0 20 * * 6"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: theme-chart-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 🧰 Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 1
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
      - name: Install audit dependencies
        run: npm ci --ignore-scripts
      - name: 🔎 Audit catalog and public data
        id: check
        run: |
          set +e
          timeout --kill-after=20s 300s node .claude/scripts/audit/theme-chart-live-audit.mjs --json .claude/state/theme-charts/live-audit.json 2>&1 | tee /tmp/theme-live.log
          live_code=${PIPESTATUS[0]}
          timeout --kill-after=20s 480s npm run theme:portfolio:audit 2>&1 | tee /tmp/theme-quality.log
          quality_code=${PIPESTATUS[0]}
          {
            echo "live_code=$live_code"
            echo "quality_code=$quality_code"
            node .claude/scripts/themes/build-theme-alert.mjs --output /tmp/theme-alert.md --live-code "$live_code" --quality-code "$quality_code"
            alert_code=$?
            echo "alert_code=$alert_code"
          } >> "$GITHUB_OUTPUT"
          cat /tmp/theme-alert.md >> "$GITHUB_STEP_SUMMARY"
      - name: 📤 Commit observations to develop
        if: steps.check.outputs.alert_code == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for observation in .claude/state/theme-charts/live-audit.json .claude/state/themes/quality.json .claude/state/themes/quality.definitions.json .claude/state/themes/quality.observations.json .claude/state/themes/quality.lastGoodObservations.json .claude/state/themes/portfolio.json .claude/state/themes/experiments.json; do
            if [ -f "$observation" ]; then git add -- "$observation"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(theme): weekly quality observations [skip ci]"
          git pull --rebase origin develop
          git push origin develop
      - name: Update actionable alert
        if: always() && steps.check.outputs.alert_code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_OPEN: ${{ steps.check.outputs.alert_open }}
        run: |
          gh label create theme-alert --description "テーマのデータ・構成監査" --color b60205 --force
          gh label create auto-generated --description "機械監査アラート" --color ededed --force
          existing=$(gh issue list --label theme-alert --state open --json number --jq '.[0].number')
          if [ "$ALERT_OPEN" = true ]; then
            if [ -n "$existing" ]; then
              gh issue view "$existing" --json body --jq '.body' > /tmp/theme-existing.md
              if ! diff -q /tmp/theme-existing.md /tmp/theme-alert.md > /dev/null; then
                gh issue edit "$existing" --title "[Theme Alert] テーマ品質の確認が必要です" --body-file /tmp/theme-alert.md
              fi
            else
              gh issue create --title "[Theme Alert] テーマ品質の確認が必要です" --label theme-alert --label auto-generated --body-file /tmp/theme-alert.md
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "テーマ品質監査の異常が解消しました。"
          fi
      - name: Propagate audit failures
        if: always()
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          LIVE_CODE: ${{ steps.check.outputs.live_code }}
          QUALITY_CODE: ${{ steps.check.outputs.quality_code }}
          ALERT_CODE: ${{ steps.check.outputs.alert_code }}
        run: |
          test "$CHECK_OUTCOME" = success && test "$LIVE_CODE" = 0 && test "$QUALITY_CODE" = 0 && test "$ALERT_CODE" = 0
