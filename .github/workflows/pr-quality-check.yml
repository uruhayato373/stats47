name: 🔍 Pull Request Quality Check

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

# 同じPRの複数実行を防ぐ（最新のみ実行）
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality-check:
    name: Code Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 🧰 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 全履歴取得（差分チェック用）

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📝 ESLint Check
        run: npm run lint
        continue-on-error: false # Lintエラーで失敗させる

      - name: 🎨 Design System Check
        # トークン/カード/レイアウトの決定的ガード (pre-commit と同一)。
        # --no-verify で pre-commit を回避してもここで弾く。
        # 正典: docs/01_技術設計/15_デザインシステムSSOT.md
        run: npm run design-system:check -w apps/web
        continue-on-error: false

      - name: 🃏 Card Census Guard
        # *Card の増殖を抑える (スパゲッティ化の止血)。ベースライン超過で失敗。
        run: node .claude/scripts/lib/check-card-census.cjs
        continue-on-error: false

      - name: 🚧 R2 Route SSG Guard
        # R2 依存 route への generateStaticParams 再混入を弾く (notFound 固着の再発防止)。
        # pre-commit と同一だが --no-verify 素通り対策で CI でも実行する。
        # 正典: .claude/rules/nextjs-ssg-preservation.md
        run: node .claude/scripts/lib/check-r2-route-ssg.cjs
        continue-on-error: false

      - name: 🚫 D1 Import Gate (Phase 7)
        run: |
          # apps/web から runtime D1 import (getDrizzle / @stats47/database/server) が
          # 0 件であることを担保。型のみ import (@stats47/database/schema) は許可。
          # Phase 0-6 で R2 snapshot 化が完了しており、ここに新規追加すると
          # Phase 8 (D1 binding 削除) と Phase 10 (D1 解約) を阻害する。
          set +e
          MATCHES=$(grep -rln 'getDrizzle\|@stats47/database/server' apps/web/src/ 2>/dev/null)
          if [ -n "$MATCHES" ]; then
            echo "::error::apps/web/src から D1 runtime import が検出されました。R2 snapshot 経由に切替えてください。"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ apps/web/src に D1 runtime import なし"

          # apps/web/src から @stats47/<pkg>/server 経由で D1 を叩く known-bad シンボルを
          # import していないか確認 (Phase 7 強化、2026-04-29 に Phase 8 ブロッカーを発見した教訓)。
          # 各シンボルは package 内で getDrizzle を呼ぶため、間接的に D1 read を発生させる。
          BAD_SYMBOLS='findFirstKeyByTag|findRankingItemsByTag|findLatestYear\b|listRankingItemsByAreaType\b|listRankingValuesByPrefecture\b|getTagsForItem'
          MATCHES2=$(grep -rEn "$BAD_SYMBOLS" apps/web/src/ --include='*.ts' --include='*.tsx' 2>/dev/null | grep -v '__tests__')
          if [ -n "$MATCHES2" ]; then
            echo "::error::apps/web/src から D1 を叩く間接的シンボル import が検出されました。R2 reader (read*FromR2) に切替えてください。"
            echo "$MATCHES2"
            exit 1
          fi
          echo "✅ apps/web/src に D1 間接的 import なし"
        continue-on-error: false

      - name: 📅 Metric Years Gate
        run: |
          # metric config の years がフルタイムコード (2009100000) でなく 4桁年であることを担保。
          # 「2009100000 問題」(年フィルタ 0件・年セレクタ崩れ) の再発防止。
          # 規約: .claude/rules/estat-api.md「年の正規化」
          npm run validate:years --workspace=@stats47/data-configs
        continue-on-error: false

      - name: 🧱 Metric Config Gate
        run: |
          # metric config の構造規約 (無効 category キー等) を担保。
          # port/uncategorized/labor/local-economy のような 17 軸外キーの再発防止。
          # warn (title年・※subtitle・冗長・重複) は表示のみで非ブロック (Phase 3 で是正)。
          # 規約: .claude/rules/metric-config-standards.md
          npm run validate:config --workspace=@stats47/data-configs
        continue-on-error: false

      - name: 📚 Theme Catalog Gate
        run: |
          # テーマ指標×チャート統合カタログ (SSOT) の整合と生成物の鮮度を担保。
          # 生成物 (IndicatorSet TS / page-components JSON) が手編集・生成忘れで
          # カタログから乖離するのを両方向で検知する。
          # 規約: .claude/rules/theme-catalog-standards.md
          npm run validate:catalog --workspace=@stats47/data-configs
          npm run generate:catalog --workspace=@stats47/data-configs -- --check
        continue-on-error: false

      - name: 🖼️ Blog Thumbnail Gate
        run: |
          # 公開R2 (storage.stats47.jp) で全ブログ記事の thumbnail-light.webp が
          # 200 画像配信されているか監査。欠落があれば fail し、デプロイ前に検出する。
          # 背景: ogp.json 未作成の記事は thumbnail が生成されず R2 404 になり、
          #   Post-Deploy Smoke Test (デプロイ後) が落ちる。それを前倒しで検出する。
          # 修正はコード変更不要 — 以下を実行して thumbnail を生成+cloud push してから再実行:
          #   npx tsx apps/web/scripts/generate-blog-thumbnails-cloud.ts --apply
          if ! npx tsx apps/web/scripts/generate-blog-thumbnails-cloud.ts --audit; then
            echo "::error::ブログ thumbnail が欠落しています。generate-blog-thumbnails-cloud.ts --apply で生成+push してから再実行してください。"
            exit 1
          fi
        continue-on-error: false

      - name: 📐 Type Check
        run: npm run type-check
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        continue-on-error: false # 型エラーで失敗させる

      - name: 🧪 Run Unit Tests with Coverage
        run: npm run test:coverage -w apps/web
        continue-on-error: false # テスト失敗で止める

      - name: 📊 Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/web/coverage/
          retention-days: 90

      - name: 💬 Comment PR with coverage summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            try {
              const coverageSummaryPath = path.join(process.cwd(), 'apps/web/coverage', 'coverage-summary.json');
              if (fs.existsSync(coverageSummaryPath)) {
                const summary = JSON.parse(fs.readFileSync(coverageSummaryPath, 'utf8'));
                const total = summary.total;
                
                // メトリクス計算
                const lines = total.lines.pct.toFixed(2);
                const statements = total.statements.pct.toFixed(2);
                const functions = total.functions.pct.toFixed(2);
                const branches = total.branches.pct.toFixed(2);
                
                // 回帰防止 floor (単一ソース coverage-thresholds.json を vitest と共有)。目標値ではない。
                const ct = JSON.parse(fs.readFileSync(path.join(process.cwd(), 'apps/web', 'coverage-thresholds.json'), 'utf8'));
                const floor = { lines: ct.lines, statements: ct.statements, functions: ct.functions, branches: ct.branches };
                // floor 以上=🟢 / floor-10pt 以内=🟡 / 未満=🔴
                const getBadge = (value, f) => value >= f ? '🟢' : value >= f - 10 ? '🟡' : '🔴';
                
                // ファイル別のカバレッジ（上位10件、低カバレッジ優先）
                const fileCoverage = Object.entries(summary)
                  .filter(([key]) => key !== 'total')
                  .map(([file, data]) => ({
                    file: file.replace(process.cwd() + '/', '').replace(/^src\//, ''),
                    lines: data.lines.pct,
                    statements: data.statements.pct,
                    functions: data.functions.pct,
                    branches: data.branches.pct
                  }))
                  .sort((a, b) => a.lines - b.lines) // 低い順にソート
                  .slice(0, 10);
                
                const lowCoverageFiles = fileCoverage.filter(f => f.lines < floor.lines);
                const highCoverageFiles = fileCoverage.filter(f => f.lines >= floor.lines);
                
                let fileList = '';
                if (lowCoverageFiles.length > 0) {
                  fileList += '\n\n**⚠️ 低カバレッジファイル（改善推奨）:**\n';
                  fileList += lowCoverageFiles.map(f => 
                    `- \`${f.file}\`: ${f.lines.toFixed(1)}% (Lines)`
                  ).join('\n');
                }
                if (highCoverageFiles.length > 0 && lowCoverageFiles.length < 10) {
                  fileList += '\n\n**✅ 高カバレッジファイル（参考）:**\n';
                  fileList += highCoverageFiles.slice(0, 5).map(f => 
                    `- \`${f.file}\`: ${f.lines.toFixed(1)}% (Lines)`
                  ).join('\n');
                }
                
                const workflowUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
                
                const comment = `## 📊 Test Coverage Report
                
                | Metric | Coverage | Status |
                |--------|----------|--------|
                | Lines | ${lines}% | ${getBadge(parseFloat(lines), floor.lines)} |
                | Statements | ${statements}% | ${getBadge(parseFloat(statements), floor.statements)} |
                | Functions | ${functions}% | ${getBadge(parseFloat(functions), floor.functions)} |
                | Branches | ${branches}% | ${getBadge(parseFloat(branches), floor.branches)} |

                **Floor (回帰防止線・目標ではありません):** Lines ${floor.lines}% / Statements ${floor.statements}% / Functions ${floor.functions}% / Branches ${floor.branches}% — vitest が enforce (未達で CI 失敗)。分母はロジック層のみ (src/app 等 E2E 担当は除外)。
                
                📥 [Download full coverage report](${workflowUrl})${fileList}
                
                <details>
                <summary>📋 Coverage Details</summary>
                
                Full HTML report is available in the workflow artifacts. Download the \`coverage-report\` artifact and open \`coverage/index.html\` in your browser.
                
                **How to view:**
                1. Go to the [workflow run](${workflowUrl})
                2. Download the \`coverage-report\` artifact
                3. Extract and open \`coverage/index.html\` in your browser
                </details>`;
                
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: comment
                });
              }
            } catch (error) {
              console.error('Failed to generate coverage comment:', error);
            }

      # 注: カバレッジ閾値の enforce は上の「Run Unit Tests with Coverage」step に一本化。
      # vitest.config.ts が coverage-thresholds.json (単一ソース) を読み floor 未達で exit 1 する。
      # 旧「Check coverage thresholds」step (閾値リテラル 10 を再ハードコード) は重複のため削除。

      - name: 🏗️ Build Check
        run: npm run build -w apps/web
        env:
          NODE_ENV: production
          NEXT_PUBLIC_ENV: production
          NEXT_PUBLIC_BASE_URL: https://stats47.jp
          NEXT_PUBLIC_ESTAT_APP_ID: ${{ secrets.NEXT_PUBLIC_ESTAT_APP_ID }}
          NODE_OPTIONS: "--max-old-space-size=4096"
        continue-on-error: false # ビルドエラーで失敗させる

      - name: ✅ All Checks Passed
        run: echo "✅ All quality checks passed!"
