name: 🔍 Pull Request Quality Check

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

# 同じPRの複数実行を防ぐ（最新のみ実行）
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

# ─────────────────────────────────────────────────────────────────────────────
# Phase 2 並列化 (2026-07-12): 旧「単一 quality-check job で全 step を直列」を
# 独立 job へ分割し、依存インストール後の gate/type-check/test/build/thumbnail を
# 並列実行してクリティカルパスを短縮する。
#   - 各 step の run / env / continue-on-error は不変 (検査内容を弱めない)。
#   - 集約 job `quality-check` (name: Code Quality Check) が全 job を needs + if:always() で
#     検証し、単一の required status check を維持する (branch protection の再設定を不要にする)。
#   - R2 secret / build env は build job だけに渡す (Thumbnail は公開 URL のみで secret 不要)。
#   - Blog Thumbnail Gate の「全件→変更分」仕様変更・CI cache 導入は本 PR に含めない (別 Phase)。
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  static-gates:
    name: Static Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🧰 Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # 全履歴取得（差分チェック用）

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: ⚙️ GitHub Actions Syntax Guard
        # actionlint v1.7.7 を固定版 + 公開SHA-256検証付きで実行。
        # YAML / expressions / reusable workflow / shellcheck連携可能部分の構文回帰をPRで止める。
        # shellcheck 指摘は例外 (SHELLCHECK_OPTS 除外) を使わず全て実修正済み
        # (SC2086 変数引用 / SC2129 redirect グループ化 / SC2162 read -r / SC2016 は node -e で inline disable)。
        run: |
          ACTIONLINT_VERSION="1.7.7"
          ACTIONLINT_ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          ACTIONLINT_SHA256="023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${ACTIONLINT_ARCHIVE}" \
            --output "/tmp/${ACTIONLINT_ARCHIVE}"
          echo "${ACTIONLINT_SHA256}  /tmp/${ACTIONLINT_ARCHIVE}" | sha256sum --check --strict
          mkdir -p /tmp/actionlint
          tar -xzf "/tmp/${ACTIONLINT_ARCHIVE}" -C /tmp/actionlint actionlint
          find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 \
            | xargs -0 /tmp/actionlint/actionlint
        continue-on-error: false

      - name: 🛡️ GitHub Actions Policy Audit
        # permissions / timeout / schedule concurrency / action SHA pin を必須化。
        # actionは `@40桁commit SHA # vN`で固定し、サプライチェーン回帰を止める。
        run: node .claude/scripts/lib/audit-workflow-policy.cjs --strict
        continue-on-error: false

      - name: 📝 ESLint Check
        run: npm run lint
        continue-on-error: false # Lintエラーで失敗させる

      - name: 🎨 Design System Check
        # トークン/カード/レイアウトの決定的ガード (pre-commit と同一)。
        # --no-verify で pre-commit を回避してもここで弾く。
        # 正典: docs/01_技術設計/15_デザインシステムSSOT.md
        run: npm run design-system:check -w apps/web
        continue-on-error: false

      - name: 🃏 Card Census Guard
        # *Card の増殖を抑える (スパゲッティ化の止血)。ベースライン超過で失敗。
        run: node .claude/scripts/lib/check-card-census.cjs
        continue-on-error: false

      - name: 🚧 R2 Route SSG Guard
        # R2 依存 route への generateStaticParams 再混入を弾く (notFound 固着の再発防止)。
        # pre-commit と同一だが --no-verify 素通り対策で CI でも実行する。
        # 正典: .claude/rules/nextjs-ssg-preservation.md
        run: node .claude/scripts/lib/check-r2-route-ssg.cjs
        continue-on-error: false

      - name: 🔗 Docs Link Regression Guard
        # 既存 broken は baseline で許容し、新規の ref/referrer だけをブロックする。
        # docs 再編時に skill / agent / rule からの参照を黙って壊さないための後方互換ゲート。
        run: node .claude/scripts/lib/check-docs-links.cjs --baseline
        continue-on-error: false

      - name: 📱 Static Asset Contract Guard
        # manifest / metadata の icon 参照、PNG実寸、SVG安全性、ICO/PWA必須setを検査。
        # TypeScriptでは検出できない「存在しない public asset 参照」をPRで止める。
        run: node .claude/scripts/lib/check-static-assets.cjs
        continue-on-error: false

      - name: 🖼️ Image and SVG Policy Regression Guard
        # public画像のデコード/容量/OGP寸法/SVG安全性と、記事内相対画像参照を検査。
        # 既存findingはbaselineで許容し、新規の欠落・肥大化だけをブロックする。
        run: node .claude/scripts/lib/check-asset-policy.cjs --baseline
        continue-on-error: false

      - name: 🗂️ Theme Portfolio State Guard
        # テーマポートフォリオ state の schema + 判定規律 (根拠なし merge/retire 禁止・
        # 重複実験防止・推測値/標本不足比率の混入防止・THEME_CATALOGS 整合) を検証。
        # 読み取り専用で破壊的変更なし。正典: .claude/state/themes/README.md
        run: |
          node .claude/scripts/themes/validate-theme-state.mjs
          node --test .claude/scripts/themes/__tests__/
        continue-on-error: false

      - name: 📊 Affiliate Compliance / Operations Guard
        # 直接配置台帳の構造検証 + compliance/operations 判定コアの fixture テスト。
        # ネットワーク・R2 には触れない (本文突合 --live は週次 workflow が担当)。
        # 正典: .claude/rules/affiliate-ads-standards.md / skill /audit-affiliate-compliance
        run: |
          npx tsx .claude/scripts/ads/audit-affiliate-compliance.ts --check
          node --test .claude/scripts/ads/__tests__/
        continue-on-error: false

      - name: 📋 Survey Portfolio State Guard
        # survey ポートフォリオ state の schema + 判定規律 (surveys.json 双方向一致・
        # survey-editorial.ts との drift・orphan/linkage 整合・根拠なし merge/retire 禁止・
        # 重複実験防止・推測値混入防止) を検証。読み取り専用で破壊的変更なし
        # (本文生成・R2 push・deploy は行わない)。正典: .claude/state/surveys/README.md
        run: npx tsx .claude/scripts/surveys/validate-survey-portfolio.ts
        continue-on-error: false

      - name: 🧹 Repository Hygiene Regression Guard
        # origin/develop 由来の既存findingはbaselineで許容し、一時出力・大容量・
        # case/Unicode衝突の新規悪化だけをブロックする。
        run: node .claude/scripts/lib/check-repo-hygiene.cjs --baseline
        continue-on-error: false

      - name: 🧩 Checker Wiring Regression Guard
        # check/audit/validate/verify/lint/guard 系scriptの新規未配線を検出。
        # 既存の未配線候補はbaselineで許容し、新規悪化だけを止める。
        run: node .claude/scripts/lib/check-checker-wiring.cjs --baseline
        continue-on-error: false

      - name: 📦 Workspace Contract Guard
        # package entrypoint/exports、internal dependency、runtime循環、package-lock登録を検査。
        run: node .claude/scripts/lib/check-workspace-contract.cjs
        continue-on-error: false

      - name: 🔐 Environment Registry Guard
        # 値は読まず、コード/workflowが参照するenv名と公開区分だけを検査。
        # 新規envは `.claude/config/env-registry.json` への登録を必須にする。
        run: node .claude/scripts/lib/check-env-registry.cjs
        continue-on-error: false

      - name: 🧭 Route and SEO Contract Guard
        # page metadata、literal canonical、静的route重複、noindex↔sitemap矛盾の新規悪化を検出。
        run: node .claude/scripts/lib/check-route-contract.cjs --baseline
        continue-on-error: false

      - name: ♿ Static Accessibility Regression Guard
        # TypeScript ASTでalt、blank link、click-only非interactive要素、form識別名を検査。
        run: node .claude/scripts/lib/check-accessibility-static.cjs --baseline
        continue-on-error: false

      - name: 🧭 Maintenance Debt Regression Guard
        # 無根拠TODO/FIXME/HACK、削除条件のないlegacy、永続D1 runtime復活の新規増加を止める。
        # ratchet-check: baseline は縮小専用 (origin/main 比で増加したら手編集/すり替えとして拒否)。
        run: |
          node .claude/scripts/lib/check-maintenance-debt.cjs --baseline
          node .claude/scripts/lib/check-maintenance-debt.cjs --ratchet-check
        continue-on-error: false

      - name: 🔗 github-script await Guard
        # actions/github-script の inline JS で GitHub API 呼び出し (github.rest.*/graphql) の
        # await 忘れを弾く。未await だと 503 等の reject が unhandled rejection になり、テスト
        # 全 pass でも job が落ちる (2026-07-20 実発生)。actionlint は inline JS を見ないため本 guard が補う。
        run: node .claude/scripts/lib/check-github-script-await.cjs
        continue-on-error: false

      - name: ⏱️ Static Checker Runtime Budget
        # 決定的checkerの実測時間をStep Summaryへ記録し、個別/合計予算の悪化を止める。
        run: node .claude/scripts/lib/check-runtime-budget.cjs
        continue-on-error: false

      - name: 🚫 D1 Import Gate (Phase 7)
        run: |
          # apps/web から runtime D1 import (getDrizzle / @stats47/database/server) が
          # 0 件であることを担保。型のみ import (@stats47/database/schema) は許可。
          # Phase 0-6 で R2 snapshot 化が完了しており、ここに新規追加すると
          # Phase 8 (D1 binding 削除) と Phase 10 (D1 解約) を阻害する。
          set +e
          MATCHES=$(grep -rln 'getDrizzle\|@stats47/database/server' apps/web/src/ 2>/dev/null)
          if [ -n "$MATCHES" ]; then
            echo "::error::apps/web/src から D1 runtime import が検出されました。R2 snapshot 経由に切替えてください。"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ apps/web/src に D1 runtime import なし"

          # apps/web/src から @stats47/<pkg>/server 経由で D1 を叩く known-bad シンボルを
          # import していないか確認 (Phase 7 強化、2026-04-29 に Phase 8 ブロッカーを発見した教訓)。
          # 各シンボルは package 内で getDrizzle を呼ぶため、間接的に D1 read を発生させる。
          BAD_SYMBOLS='findFirstKeyByTag|findRankingItemsByTag|findLatestYear\b|listRankingItemsByAreaType\b|listRankingValuesByPrefecture\b|getTagsForItem'
          MATCHES2=$(grep -rEn "$BAD_SYMBOLS" apps/web/src/ --include='*.ts' --include='*.tsx' 2>/dev/null | grep -v '__tests__')
          if [ -n "$MATCHES2" ]; then
            echo "::error::apps/web/src から D1 を叩く間接的シンボル import が検出されました。R2 reader (read*FromR2) に切替えてください。"
            echo "$MATCHES2"
            exit 1
          fi
          echo "✅ apps/web/src に D1 間接的 import なし"
        continue-on-error: false

      - name: 📅 Metric Years Gate
        run: |
          # metric config の years がフルタイムコード (2009100000) でなく 4桁年であることを担保。
          # 「2009100000 問題」(年フィルタ 0件・年セレクタ崩れ) の再発防止。
          # 規約: .claude/rules/estat-api.md「年の正規化」
          npm run validate:years --workspace=@stats47/data-configs
        continue-on-error: false

      - name: 🧱 Metric Config Gate
        run: |
          # metric config の構造規約 (無効 category キー等) を担保。
          # port/uncategorized/labor/local-economy のような 17 軸外キーの再発防止。
          # warn (title年・※subtitle・冗長・重複) は表示のみで非ブロック (Phase 3 で是正)。
          # 規約: .claude/rules/metric-config-standards.md
          npm run validate:config --workspace=@stats47/data-configs
          npm run build:registry --workspace=@stats47/data-configs -- --check
        continue-on-error: false

      - name: 📚 Theme Catalog Gate
        run: |
          # テーマ指標×チャート統合カタログ (SSOT) の整合と生成物の鮮度を担保。
          # 生成物 (IndicatorSet TS / page-components JSON) が手編集・生成忘れで
          # カタログから乖離するのを両方向で検知する。
          # 規約: .claude/rules/theme-catalog-standards.md
          npm run validate:catalog --workspace=@stats47/data-configs
          npm run generate:catalog --workspace=@stats47/data-configs -- --check
        continue-on-error: false

      - name: 🗾 Area Databook Gate
        run: |
          # area ページ「県データブック」カタログ (SSOT) の整合と生成物の鮮度を担保。
          # rankingKey 実在・editorial 品質 (出典/字数/件数) と、page-components/area の
          # 手編集・生成忘れを両方向で検知する。
          # 規約: .claude/rules/area-databook-standards.md
          npm run validate:area-databook --workspace=@stats47/data-configs
          npm run generate:area-databook --workspace=@stats47/data-configs -- --check
          npm run generate:editorial-index --workspace=@stats47/data-configs -- --check
        continue-on-error: false

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🧰 Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # 全履歴取得（差分チェック用）

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📐 Type Check
        run: npm run type-check
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        continue-on-error: false # 型エラーで失敗させる

  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🧰 Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # 全履歴取得（差分チェック用）

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run Unit Tests with Coverage
        run: npm run test:coverage -w apps/web
        continue-on-error: false # テスト失敗で止める

      - name: 📊 Upload coverage to artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: apps/web/coverage/
          retention-days: 90

      - name: 💬 Comment PR with coverage summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            try {
              const coverageSummaryPath = path.join(process.cwd(), 'apps/web/coverage', 'coverage-summary.json');
              if (fs.existsSync(coverageSummaryPath)) {
                const summary = JSON.parse(fs.readFileSync(coverageSummaryPath, 'utf8'));
                const total = summary.total;

                // メトリクス計算
                const lines = total.lines.pct.toFixed(2);
                const statements = total.statements.pct.toFixed(2);
                const functions = total.functions.pct.toFixed(2);
                const branches = total.branches.pct.toFixed(2);

                // 回帰防止 floor (単一ソース coverage-thresholds.json を vitest と共有)。目標値ではない。
                const ct = JSON.parse(fs.readFileSync(path.join(process.cwd(), 'apps/web', 'coverage-thresholds.json'), 'utf8'));
                const floor = { lines: ct.lines, statements: ct.statements, functions: ct.functions, branches: ct.branches };
                // floor 以上=🟢 / floor-10pt 以内=🟡 / 未満=🔴
                const getBadge = (value, f) => value >= f ? '🟢' : value >= f - 10 ? '🟡' : '🔴';

                // ファイル別のカバレッジ（上位10件、低カバレッジ優先）
                const fileCoverage = Object.entries(summary)
                  .filter(([key]) => key !== 'total')
                  .map(([file, data]) => ({
                    file: file.replace(process.cwd() + '/', '').replace(/^src\//, ''),
                    lines: data.lines.pct,
                    statements: data.statements.pct,
                    functions: data.functions.pct,
                    branches: data.branches.pct
                  }))
                  .sort((a, b) => a.lines - b.lines) // 低い順にソート
                  .slice(0, 10);

                const lowCoverageFiles = fileCoverage.filter(f => f.lines < floor.lines);
                const highCoverageFiles = fileCoverage.filter(f => f.lines >= floor.lines);

                let fileList = '';
                if (lowCoverageFiles.length > 0) {
                  fileList += '\n\n**⚠️ 低カバレッジファイル（改善推奨）:**\n';
                  fileList += lowCoverageFiles.map(f =>
                    `- \`${f.file}\`: ${f.lines.toFixed(1)}% (Lines)`
                  ).join('\n');
                }
                if (highCoverageFiles.length > 0 && lowCoverageFiles.length < 10) {
                  fileList += '\n\n**✅ 高カバレッジファイル（参考）:**\n';
                  fileList += highCoverageFiles.slice(0, 5).map(f =>
                    `- \`${f.file}\`: ${f.lines.toFixed(1)}% (Lines)`
                  ).join('\n');
                }

                const workflowUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

                const comment = `## 📊 Test Coverage Report

                | Metric | Coverage | Status |
                |--------|----------|--------|
                | Lines | ${lines}% | ${getBadge(parseFloat(lines), floor.lines)} |
                | Statements | ${statements}% | ${getBadge(parseFloat(statements), floor.statements)} |
                | Functions | ${functions}% | ${getBadge(parseFloat(functions), floor.functions)} |
                | Branches | ${branches}% | ${getBadge(parseFloat(branches), floor.branches)} |

                **Floor (回帰防止線・目標ではありません):** Lines ${floor.lines}% / Statements ${floor.statements}% / Functions ${floor.functions}% / Branches ${floor.branches}% — vitest が enforce (未達で CI 失敗)。分母はロジック層のみ (src/app 等 E2E 担当は除外)。

                📥 [Download full coverage report](${workflowUrl})${fileList}

                <details>
                <summary>📋 Coverage Details</summary>

                Full HTML report is available in the workflow artifacts. Download the \`coverage-report\` artifact and open \`coverage/index.html\` in your browser.

                **How to view:**
                1. Go to the [workflow run](${workflowUrl})
                2. Download the \`coverage-report\` artifact
                3. Extract and open \`coverage/index.html\` in your browser
                </details>`;

                // await 必須: 未await だと 503 等の reject が try/catch を素通りして
                // unhandled rejection になり、cosmetic なコメント投稿の失敗で job 全体が落ちる
                // (2026-07-20 GitHub API 503 障害で Unit Tests が誤って fail した事例)。
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: comment
                });
              }
            } catch (error) {
              console.error('Failed to generate coverage comment:', error);
            }

      # 注: カバレッジ閾値の enforce は上の「Run Unit Tests with Coverage」step に一本化。
      # vitest.config.ts が coverage-thresholds.json (単一ソース) を読み floor 未達で exit 1 する。
      # 旧「Check coverage thresholds」step (閾値リテラル 10 を再ハードコード) は重複のため削除。

  build:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🧰 Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # 全履歴取得（差分チェック用）

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build Check
        run: npm run build -w apps/web
        env:
          NODE_ENV: production
          NEXT_PUBLIC_ENV: production
          NEXT_PUBLIC_BASE_URL: https://stats47.jp
          NEXT_PUBLIC_ESTAT_APP_ID: ${{ secrets.NEXT_PUBLIC_ESTAT_APP_ID }}
          NODE_OPTIONS: "--max-old-space-size=4096"
          # Phase 4(a): この build job だけ next build 内の型検査をスキップ (Phase 4 / next.config.ts の
          # ignoreBuildErrors env ゲート)。並列で走る必須 type-check job (npm run type-check = 全 workspace)
          # がカバーし、集約 job quality-check が type-check を needs するため型検査の必須性は維持される。
          # localhost / deploy(workers:build) は env 未設定で従来どおり型検査する。
          NEXT_SKIP_BUILD_TYPECHECK: "true"
        continue-on-error: false # ビルドエラーで失敗させる

  remote-asset-audit:
    name: Blog Thumbnail Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🧰 Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # 全履歴取得（差分チェック用）

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🖼️ Blog Thumbnail Gate
        run: |
          # 公開R2 (storage.stats47.jp) で全ブログ記事の thumbnail-light.webp が
          # 200 画像配信されているか監査。欠落があれば fail し、デプロイ前に検出する。
          # 背景: ogp.json 未作成の記事は thumbnail が生成されず R2 404 になり、
          #   Post-Deploy Smoke Test (デプロイ後) が落ちる。それを前倒しで検出する。
          # 修正はコード変更不要 — 以下を実行して thumbnail を生成+cloud push してから再実行:
          #   npx tsx apps/web/scripts/generate-blog-thumbnails-cloud.ts --apply
          if ! npx tsx apps/web/scripts/generate-blog-thumbnails-cloud.ts --audit; then
            echo "::error::ブログ thumbnail が欠落しています。generate-blog-thumbnails-cloud.ts --apply で生成+push してから再実行してください。"
            exit 1
          fi
        continue-on-error: false

  accessibility-e2e:
    name: Accessibility E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🧰 Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🌐 Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: ♿ Run representative axe checks
        # webServer (next dev) が validate-env.ts の必須 env を要求するため build job と同じ値を渡す
        # (Phase 2 並列分割で env が build job のみになり dev server が起動不能だった是正)。
        env:
          NEXT_PUBLIC_BASE_URL: https://stats47.jp
          NEXT_PUBLIC_ESTAT_APP_ID: ${{ secrets.NEXT_PUBLIC_ESTAT_APP_ID }}
        run: npx playwright test tests/e2e/accessibility/representative-routes.spec.ts --project=e2e-chromium
        working-directory: apps/web

  # 集約 job: 上記 job を全て needs し、単一の required status check
  # (branch protection が要求する "Code Quality Check") を維持する。
  # if:always() で常に実行し、いずれかが failure/cancelled/skipped なら明示的に失敗させる
  # (needs のいずれかが失敗すると本 job は skip されうるため、結果を明示チェックする)。
  quality-check:
    name: Code Quality Check
    needs: [static-gates, type-check, test, build, remote-asset-audit, accessibility-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 🧮 Verify all required checks passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "::error::One or more required checks did not pass."
          echo "static-gates=${{ needs.static-gates.result }} type-check=${{ needs.type-check.result }} test=${{ needs.test.result }} build=${{ needs.build.result }} remote-asset-audit=${{ needs.remote-asset-audit.result }} accessibility-e2e=${{ needs.accessibility-e2e.result }}"
          exit 1

      - name: ✅ All Checks Passed
        run: echo "✅ All quality checks passed!"
