name: 📐 Fetch e-Stat MetaInfo

# 指定 statsDataId の次元構造 (getMetaInfo) を取得し、config 生成のキュレーション素材にする。
# R2/D1 非書込 read-only。e-Stat APP_ID は CI 専任 (secrets)。
# workflow_dispatch は default ブランチ限定のため、main デプロイ無しで回せるよう
# 専用ブランチ estat-meta-run への push でも発火させる。

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "statsDataId カンマ区切り (空なら proof-batch-statsids.json を使用)"
        required: false
        default: ""
  push:
    branches: [estat-meta-run]

permissions:
  contents: read

concurrency:
  group: estat-meta
  cancel-in-progress: true

env:
  NEXT_PUBLIC_ESTAT_APP_ID: ${{ secrets.NEXT_PUBLIC_ESTAT_APP_ID }}

jobs:
  fetch-meta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 🧰 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install deps
        run: npm ci

      - name: 📐 Fetch getMetaInfo
        run: |
          IDS="${{ github.event.inputs.ids }}"
          if [ -n "$IDS" ]; then
            node .claude/scripts/estat/fetch-estat-meta.mjs --ids "$IDS"
          else
            node .claude/scripts/estat/fetch-estat-meta.mjs --list .claude/scripts/estat/proof-batch-statsids.json
          fi

      - name: 📤 Upload meta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estat-meta
          path: .claude/state/estat/meta*/**
          retention-days: 30
          if-no-files-found: warn
