name: 📐 Fetch e-Stat MetaInfo

# 指定 statsDataId の次元構造 (getMetaInfo) を取得し、config 生成のキュレーション素材にする。
# R2/D1 非書込 read-only。e-Stat APP_ID は CI 専任 (secrets)。
# workflow_dispatch は default ブランチ限定のため、main デプロイ無しで回せるよう
# 専用ブランチ estat-meta-run への push でも発火させる。

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "statsDataId カンマ区切り (空なら proof-batch-statsids.json を使用)"
        required: false
        default: ""
      full:
        description: "全項目を出力 (cdCat コード確定用。既定は先頭12件サンプル)"
        required: false
        default: "false"
  push:
    branches: [estat-meta-run]

permissions:
  contents: read

concurrency:
  group: estat-meta
  cancel-in-progress: true

env:
  NEXT_PUBLIC_ESTAT_APP_ID: ${{ vars.NEXT_PUBLIC_ESTAT_APP_ID }}

jobs:
  fetch-meta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 🧰 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install deps
        run: npm ci

      - name: 📐 Fetch getMetaInfo
        run: |
          IDS="${{ github.event.inputs.ids }}"
          FULL=""
          [ "${{ github.event.inputs.full }}" = "true" ] && FULL="--full"
          if [ -n "$IDS" ]; then
            node .claude/scripts/estat/fetch-estat-meta.mjs --ids "$IDS" $FULL
          else
            node .claude/scripts/estat/fetch-estat-meta.mjs --list .claude/scripts/estat/proof-batch-statsids.json $FULL
          fi

      - name: 📤 Upload meta
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: estat-meta
          path: .claude/state/estat/meta*/**
          retention-days: 30
          if-no-files-found: warn
