name: 📝 Blog Generate Daily (Claude Code生成 + 公開)

# ブログ新規記事の日次生成ループ。
#
#   1. topic-queue を再構築 (GSC 需要 × 相関 × カテゴリから決定的に並ぶ)
#   2. pending 上位を準備:
#        R2 観測値を接地 → **データ健全性ゲート** → SVG 生成 → article.prompt.txt 書き出し
#   3. Claude Code Base Action (OAuth / Max) で author → 機械ゲート → 独立 critic を実行
#   4. 対象全件の article.md + critic PASS + published:true を決定的に照合
#   5. develop に push し、blog-auto-publish.yml を明示 dispatch
#   6. 失敗時は run を赤くし、運用 Issue を upsert
#
# ★なぜ push トリガー任せにしないか
#   blog-auto-publish.yml は develop への push トリガーを持つが、GitHub Actions は
#   **既定の GITHUB_TOKEN で push した場合、後続 workflow を発火させない** (無限ループ防止)。
#   ai-content で実際に outbox が滞留した (2026-07-31)。明示 dispatch し、run が生まれたことを
#   確認してから成功とする。
#
# ★安全装置
#   - 壊れた metric の記事は書かない (blog-topic-gate。分類軸の絞り忘れ等を生成前に弾く)
#   - quality-gate の blocker が 1 つでも残れば公開しない。**ゲートは緩めない**
#   - OAuth token 未登録、対象あり生成0件、critic未通過はすべて hard fail
#   - LIMIT 3 (入力上限) / timeout 120 分 / max-turns 300 (実測 1 本 ≈ 10 分・turn 100 に対し 3 本分)
#     ★既定は 1 本/日。上限 3 はトークン予算だけで決まるが、既定は**記事の月産上限**で決まる。
#     .claude/state/blog/seo-strategy.json の typeMix.perMonth は計 17-20 本/月、BLOG-SEO-PACE-01 も
#     「月 15〜20 本の上限内」。3 本/日 = 月 84 本はこれを 4-5 倍超える (2026-08-03 に一度 3 を既定に
#     してしまい、同日の週次計画で検知して 1 へ戻した)。既定を上げるときは型配分 SSOT を先に更新する。
#   - Claude が変更できるのは当日 target の原稿ディレクトリだけ
#   - Base Action は commit SHA 固定、MCP/Web、project hooks、full output を無効化
#   - dry_run: LLM を呼ばず接地・ゲート・prompt 長だけ出す (課金ゼロ)
#
# 正典: .claude/rules/blog-quality-standards.md / .claude/rules/blog-data-schema.md §0

on:
  schedule:
    # JST 23:00 (UTC 14:00)。ai-content は JST 03:00 / 08:00 / 13:00 / 18:00 (boost 期間中は 4 枠)
    # に走り、5 件バッチで 1 回あたり約 58 分かかる。旧 JST 04:30 のままだと 03:00 の回と
    # 実時間で重なり、同じ Max 枠を奪い合う。どの枠とも重ならない 23:00 へ寄せる。
    # 重なり判定は content-generation-routine.test.cjs が予算モデルから機械検査する。
    - cron: "0 14 * * *"
  # push トリガー (cloud 用): develop に data/blog-generate-requests.json を commit/push すると
  # 実行し、消費した request を git rm で commit-back する。cloud セッションは actions:write が
  # 無く workflow_dispatch できない (403) ため。data-refresh.yml / gemini-image-run.yml と同じ方式。
  #   { "limit": 1, "dryRun": false, "keepDraft": true }
  push:
    branches: [develop]
    paths: ['data/blog-generate-requests.json']
  workflow_dispatch:
    inputs:
      limit:
        description: "生成件数 (1..3、既定1)。1 本 ≈ 10 分・turn 100。既定は型配分の月産上限で決まる"
        required: false
        default: "1"
      dry_run:
        description: "true: LLM を呼ばず接地とゲートだけ実行する"
        required: false
        default: "false"
      keep_draft:
        description: "互換入力 (現在は失敗時にrunを赤くし、未完成原稿はcommitしない)"
        required: false
        default: "false"

permissions:
  contents: write
  issues: write # 失敗 Issue を upsert するため
  actions: write # blog-auto-publish.yml を dispatch するため

concurrency:
  group: blog-generate
  cancel-in-progress: false

env:
  R2_PUBLIC_FETCH_URL: https://storage.stats47.jp
  LIMIT: ${{ inputs.limit || '1' }}
  DRY_RUN: ${{ inputs.dry_run || 'false' }}
  KEEP_DRAFT: ${{ inputs.keep_draft || 'false' }}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 🧰 Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 2

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      # push トリガー時は request file を、それ以外は workflow_dispatch の inputs を使う。
      # GITHUB_ENV に書くので、後続 step の if: env.DRY_RUN も解決される。
      - name: 🧭 Resolve inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          REQ=data/blog-generate-requests.json
          if [ "$EVENT_NAME" = "push" ] && [ -f "$REQ" ]; then
            LIMIT=$(node -e "const r=require('./$REQ');process.stdout.write(String(r.limit??1))")
            DRY_RUN=$(node -e "const r=require('./$REQ');process.stdout.write(r.dryRun===true?'true':'false')")
            KEEP_DRAFT=$(node -e "const r=require('./$REQ');process.stdout.write(r.keepDraft===true?'true':'false')")
            {
              echo "LIMIT=$LIMIT"
              echo "DRY_RUN=$DRY_RUN"
              echo "KEEP_DRAFT=$KEEP_DRAFT"
            } >> "$GITHUB_ENV"
            echo "request 解決: limit=$LIMIT dry_run=$DRY_RUN keep_draft=$KEEP_DRAFT"
          else
            echo "inputs 使用: limit=${LIMIT} dry_run=${DRY_RUN} keep_draft=${KEEP_DRAFT}"
          fi
          if ! [[ "${LIMIT}" =~ ^[0-9]+$ ]] || [ "${LIMIT}" -lt 1 ] || [ "${LIMIT}" -gt 3 ]; then
            echo "::error::LIMIT は 1..3 の整数が必須: ${LIMIT}"
            exit 1
          fi
          if [ "${DRY_RUN}" != "true" ] && [ "${DRY_RUN}" != "false" ]; then
            echo "::error::DRY_RUN は true / false が必須: ${DRY_RUN}"
            exit 1
          fi

      # 何を書くか。GSC 需要・相関・カテゴリ網羅から決定的に並ぶ。
      # 外部 fetch を含むので失敗しても既存キューで続行する (生成を止める理由にはならない)。
      - name: 📊 Rebuild topic-queue
        run: node .claude/scripts/blog/build-topic-queue.mjs || echo "::warning::topic-queue 再構築に失敗。既存キューで続行する"

      - name: 🧱 Prepare articles (接地・ゲート・SVG・prompt まで)
        id: prepare
        run: |
          set -euo pipefail
          mkdir -p .local/ci
          # 引数は配列で組む (文字列を裸で展開すると glob と単語分割が起きる)
          EXTRA=()
          if [ "${DRY_RUN}" = "true" ]; then EXTRA+=(--dry-run); fi
          NODE_OPTIONS='--conditions react-server' \
            npx tsx packages/ai-content/src/scripts/generate-blog-article.ts \
              --limit "${LIMIT}" \
              "${EXTRA[@]}" 2>&1 | tee /tmp/gen.log
          if [ "${DRY_RUN}" = "true" ]; then
            : > .local/ci/blog-targets.txt
          else
            awk '$1 == "[ready]" { print $2 }' /tmp/gen.log > .local/ci/blog-targets.txt
          fi
          node -e '
            const fs = require("node:fs");
            const slugs = fs.readFileSync(".local/ci/blog-targets.txt", "utf8").trim().split(/\n/).filter(Boolean);
            for (const slug of slugs) {
              if (!/^[a-z0-9][a-z0-9-]*$/.test(slug)) throw new Error("不正な slug: " + slug);
              const prompt = "docs/21_ブログ記事原稿/" + slug + "/article.prompt.txt";
              if (!fs.statSync(prompt).size) throw new Error("空の prompt: " + prompt);
            }
          '
          COUNT=$(grep -c . .local/ci/blog-targets.txt || true)
          SLUGS=$(paste -sd, .local/ci/blog-targets.txt)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"
          {
            echo "### 接地結果"
            echo '```'
            grep -E '^(===|\[(ready|reject|fail|skip|dry-run)\])' /tmp/gen.log | tail -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🔐 Require Claude Code OAuth token
        if: ${{ env.DRY_RUN != 'true' && steps.prepare.outputs.count != '0' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN が未登録です。claude setup-token で発行し、Repository Secretへ登録してください"
            exit 1
          fi

      # High-level claude-code-action は schedule event を正式対応対象にしていないため、
      # event 非依存の公式 Base Action を使う。main SHA と内包 Claude Code version を固定する。
      - name: ✍️ Write and review articles with Claude Code
        id: claude
        if: ${{ env.DRY_RUN != 'true' && steps.prepare.outputs.count != '0' }}
        uses: anthropics/claude-code-base-action@e5758aabe98b80fec1bcbd4a51fe2e1f8935dfc3 # Claude Code v2.1.220 (base-action main 2026-08-02)
        env:
          NODE_VERSION: "20.x"
        with:
          prompt_file: .claude/prompts/ci/blog-routine.md
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: "false"
          settings: |
            {
              "disableAllHooks": true
            }
          claude_args: |
            --model sonnet
            --effort high
            --max-turns 300
            --no-session-persistence
            --setting-sources project
            --permission-mode dontAsk
            --tools "Read,Write,Edit,Glob,Grep,Agent,Skill,Bash"
            --allowedTools "Read,Write,Edit,Glob,Grep,Agent,Skill,Bash(node .claude/scripts/lib/article-factual-check.mjs *),Bash(node .claude/scripts/blog/quality-gate.mjs *),Bash(node --conditions=react-server --import tsx packages/ai-content/src/scripts/generate-blog-article.ts --ingest *)"
            --disallowedTools "WebFetch,WebSearch,Bash(env *),Bash(printenv *),Read(.env*),Read(**/.env*)"
            --strict-mcp-config
            --mcp-config '{"mcpServers":{}}'

      # ★失敗を診断可能にする (2026-08-02)。理由は ai-content-generate-daily.yml の同名 step と同じ。
      #   show_full_output は false のままにし、切り分けに要る最小限だけを出す。
      # ★verify 落ちでも出す (2026-08-03)。run 30774421511 は Claude が success した後に
      #   verify が「critic の Agent 記録なし」で落ちたが、diagnose が failure 限定だったため
      #   Issue に何の subagent が動いたかが残らなかった。Claude が実際に走った run では常に出す。
      - name: 🩺 Summarize Claude execution
        if: ${{ always() && steps.claude.outcome != 'skipped' }}
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          FILE="${CLAUDE_EXECUTION_FILE:-/home/runner/work/_temp/claude-execution-output.json}"
          mkdir -p .local/ci
          node .claude/scripts/lib/summarize-claude-execution.mjs "$FILE" > .local/ci/claude-diagnosis.txt 2>&1 || true
          {
            echo "### Claude 実行サマリ"
            echo '```'
            cat .local/ci/claude-diagnosis.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: ✅ Verify target completeness, gates, and critic PASS
        id: verify
        if: ${{ env.DRY_RUN != 'true' && steps.prepare.outputs.count != '0' }}
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          EXPECTED="${{ steps.prepare.outputs.count }}"
          if [ ! -s "$CLAUDE_EXECUTION_FILE" ]; then
            echo "::error::Claude execution log が無く、author / critic 実行を証明できません"
            exit 1
          fi
          # ★partial-publish (2026-08-07): 1 件でも落ちると全件を publish しない
          #   オールオアナッシングを廃止。通過分だけ publish し、失敗記事は outbox (docs/21)
          #   を drop して次回生成へ回す。公開対象 0 件のときだけ run を赤くする (silent-green
          #   防止)。fallible command は if で受け、per-item 失敗で step を殺さない。
          GENERATED=0
          FAILED=""
          while IFS= read -r SLUG; do
            [ -z "$SLUG" ] && continue
            DIR="docs/21_ブログ記事原稿/${SLUG}"
            ARTICLE="${DIR}/article.md"
            REVIEW="${DIR}/review.md"
            SLUG_OK=1
            SLUG_WHY=""
            for AGENT_TYPE in article-writer blog-critic; do
              if ! jq -e --arg agent "$AGENT_TYPE" --arg target "$SLUG" \
                'any(.[] | select(.type == "assistant") | .message.content[]?;
                  .type == "tool_use" and .name == "Agent"
                  and .input.subagent_type == $agent
                  and ((.input.prompt // "") | contains($target)))' \
                "$CLAUDE_EXECUTION_FILE" >/dev/null; then
                SLUG_OK=0; SLUG_WHY="agent-record-missing:${AGENT_TYPE}"
                # どの subagent まで動いたかを残す (呼ばれなかったのか prompt 照合を外したのかの切り分け)。
                echo "観測された subagent: $(jq -r '[.[] | select(.type == \"assistant\") | .message.content[]? | select(.type == \"tool_use\" and .name == \"Agent\") | .input.subagent_type] | unique | join(\", \")' "$CLAUDE_EXECUTION_FILE" 2>/dev/null || echo '(取得不可)')"
                break
              fi
            done
            if [ "$SLUG_OK" = 1 ] && [ ! -s "$ARTICLE" ]; then
              SLUG_OK=0; SLUG_WHY="no-article"
            fi
            if [ "$SLUG_OK" = 1 ]; then
              if [ ! -s "$REVIEW" ] || [ "$(wc -c < "$REVIEW" | tr -d ' ')" -lt 200 ] \
                || ! grep -Eq '^verdict:[[:space:]]*PASS[[:space:]]*$' "$REVIEW"; then
                SLUG_OK=0; SLUG_WHY="critic-not-pass"
              fi
            fi
            if [ "$SLUG_OK" = 1 ]; then
              if ! node .claude/scripts/lib/article-factual-check.mjs "$ARTICLE" "${DIR}/data"; then
                SLUG_OK=0; SLUG_WHY="factual"
              fi
            fi
            if [ "$SLUG_OK" = 1 ]; then
              if ! node .claude/scripts/blog/quality-gate.mjs "$ARTICLE"; then
                SLUG_OK=0; SLUG_WHY="quality-gate"
              fi
            fi
            if [ "$SLUG_OK" = 1 ]; then
              if ! NODE_OPTIONS='--conditions react-server' \
                npx tsx packages/ai-content/src/scripts/generate-blog-article.ts --ingest "$SLUG" \
                | tee "/tmp/blog-ingest-${SLUG}.log"; then
                SLUG_OK=0; SLUG_WHY="ingest"
              fi
            fi
            if [ "$SLUG_OK" = 1 ] && ! grep -q 'published: true' "$ARTICLE"; then
              SLUG_OK=0; SLUG_WHY="not-published"
            fi
            if [ "$SLUG_OK" = 1 ]; then
              GENERATED=$((GENERATED + 1))
            else
              echo "::warning::記事生成失敗のため drop (次回へ繰り越し): ${SLUG} (${SLUG_WHY})"
              FAILED="$FAILED $SLUG"
              rm -rf "$DIR"
            fi
          done < .local/ci/blog-targets.txt
          if [ "$GENERATED" -eq 0 ]; then
            echo "::error::対象 ${EXPECTED} 件すべて生成/critic に失敗 (公開対象 0 件)"
            exit 1
          fi
          if [ -n "${FAILED// /}" ]; then
            echo "::warning::部分成功: ${GENERATED}/${EXPECTED} 件を公開・失敗は次回へ繰り越し:${FAILED}"
          fi
          while IFS= read -r FILE; do
            case "$FILE" in
              docs/21_ブログ記事原稿/*|.claude/state/blog/topic-queue.json) ;;
              *)
                echo "::error::Claude routine の許可外変更: ${FILE}"
                exit 1
                ;;
            esac
          # core.quotepath=false が要る: 既定 (true) だと git は非 ASCII を含むパスを
          # ダブルクォートで包んで 8 進エスケープする ("docs/21_\343\203\226.../article.md")。
          # 出力先が docs/21_ブログ記事原稿/ なので、既定のままでは許可パターンに一度も
          # 一致せず、正しく生成・critic PASS した記事まで全件 reject される
          # (2026-08-03 run 30776544300 で実際に発生。この gate は一度も通れていなかった)。
          done < <(git -c core.quotepath=false status --porcelain=v1 --untracked-files=all | cut -c4-)
          echo "count=$GENERATED" >> "$GITHUB_OUTPUT"
          echo "✅ 公開対象 ${GENERATED}/${EXPECTED} 件 (factual + quality + critic PASS)"

      - name: 📤 Commit outbox and push
        id: commit
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          set -euo pipefail
          # push トリガーで来た request は同じ commit で消費する (再実行のループを防ぐ)
          if [ "${{ github.event_name }}" = "push" ]; then
            git rm -q --ignore-unmatch data/blog-generate-requests.json || true
          fi
          git add "docs/21_ブログ記事原稿" .claude/state/blog/topic-queue.json || true
          NEW="${{ steps.verify.outputs.count || '0' }}"
          echo "outbox=${NEW}" >> "$GITHUB_OUTPUT"
          if git diff --cached --quiet; then
            if [ "${{ steps.prepare.outputs.count }}" != "0" ]; then
              echo "::error::対象ありなのに commit 対象がありません"
              exit 1
            fi
            echo "対象0件・進捗変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore(blog): daily Claude Code generation (outbox ${NEW} 件)"
          for i in 1 2 3; do
            if git pull --rebase --quiet origin develop && git push origin HEAD:develop; then
              echo "✅ pushed (outbox ${NEW} 件)"
              exit 0
            fi
            echo "push retry $i"; sleep 5
          done
          # push できなければ記事が届かない。黙って成功にしない
          echo "::error::develop への push に 3 回失敗した (outbox ${NEW} 件が未配送)"
          exit 1

      # ★request は結果によらず必ず消費する (2026-07-31 の実測で必要と判明)。
      #
      #   preflight で落ちた run が request を消費せず develop に残り、同じ内容を再 push しても
      #   **diff が出ないので paths フィルタに掛からず再実行できなかった**。残った request は
      #   「未処理の要求がある」ようにも見えて紛らわしい。
      #   成功時は上の outbox commit が同じ commit で消しているので、ここは no-op になる。
      - name: 🧹 Consume request (未消費なら)
        if: ${{ always() && github.event_name == 'push' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch data/blog-generate-requests.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "chore(blog): consume blog-generate request [skip ci]"
          # ★キュー再構築の step が tracked な state を書き換えるため作業ツリーが汚れる。
          #   そのまま rebase すると "cannot pull with rebase: You have unstaged changes" で
          #   落ち、request が消費されないまま develop に残る (2026-08-02 run 30769885097 で実測)。
          #   残ると同内容の再 push が paths フィルタで発火しなくなる。消費に不要な差分なので退避する。
          git stash push --include-untracked --quiet || true
          for i in 1 2 3; do
            if git pull --rebase --quiet origin develop && git push origin HEAD:develop; then
              echo "✅ request を消費した"
              exit 0
            fi
            echo "consume retry $i"; sleep 5
          done
          echo "::error::request の消費に失敗した (同内容の再 push が発火しなくなる)"
          exit 1

      # 既定 token の push は blog-auto-publish の push トリガーを発火させないため明示 dispatch する。
      # run が生まれたことを確認してから成功とする (ai-content で滞留を実際に踏んだ)。
      - name: 🚀 Dispatch blog-auto-publish
        if: ${{ env.DRY_RUN != 'true' && steps.verify.outputs.count != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BEFORE=$(gh run list --workflow blog-auto-publish.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run blog-auto-publish.yml --ref develop
          for _ in $(seq 1 12); do
            sleep 10
            AFTER=$(gh run list --workflow blog-auto-publish.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')
            if [ "$AFTER" != "$BEFORE" ]; then
              echo "✅ blog-auto-publish の run が生成された: $AFTER"
              exit 0
            fi
          done
          echo "::error::blog-auto-publish の run を確認できなかった (outbox が滞留している可能性)"
          exit 1

      - name: 🧹 Close resolved routine issues
        if: ${{ success() && env.DRY_RUN != 'true' && steps.prepare.outputs.count != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for TITLE in "📝 ブログ: 今日の執筆対象" "🚨 Blog generation routine failed"; do
            NUMBER=$(gh issue list --search "$TITLE in:title" --state open --json number --jq '.[0].number // empty')
            if [ -n "$NUMBER" ]; then gh issue close "$NUMBER" --reason completed; fi
          done

      # ★1 件あたりのトークン実績を残す (2026-08-03)。
      #   件数を 1→5 / 1→3 に引き上げたのに「1 件で何トークンか」を一度も測っていなかった。
      #   execution log には usage が最初から書かれていて、診断 step も既にこのファイルを読んでいる。
      #   捨てていただけなので append-only の履歴にする。
      #   失敗 run こそ知りたい (利用枠に当たったか) ので always()。
      #   計測が本体の成否を左右してはいけないので continue-on-error にする (無視ではなく可視化)。
      - name: 📊 Record token usage
        if: ${{ always() && steps.claude.outcome != 'skipped' }}
        continue-on-error: true
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          FILE="${CLAUDE_EXECUTION_FILE:-/home/runner/work/_temp/claude-execution-output.json}"
          node .claude/scripts/lib/record-claude-usage.mjs "$FILE" \
            --workflow blog \
            --run-id "${{ github.run_id }}" \
            --limit "${LIMIT}" \
            --items "${{ steps.verify.outputs.count || '0' }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude/state/metrics/claude-usage || true
          if git diff --cached --quiet; then echo "記録する変更なし"; exit 0; fi
          git commit -q -m "chore(metrics): record Claude token usage [skip ci]"
          git stash push --include-untracked --quiet || true
          for _ in 1 2 3; do
            if git pull --rebase --quiet origin develop && git push origin HEAD:develop; then
              echo "✅ トークン実績を記録した"
              exit 0
            fi
            sleep 5
          done
          echo "::error::トークン実績の push に失敗した (計測のみ・本体には影響しない)"
          exit 1

      - name: 🚨 Upsert failure issue
        if: ${{ failure() && env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="🚨 Blog generation routine failed"
          DIAG="(診断なし: Claude step まで到達していないか、execution log を読めなかった)"
          if [ -s .local/ci/claude-diagnosis.txt ]; then DIAG=$(cat .local/ci/claude-diagnosis.txt); fi
          BODY="日次ブログ生成が失敗しました。対象あり生成0件、認証、factual/quality gate、critic、push/dispatchのいずれかです。

          Run: ${RUN_URL}
          Target count: ${{ steps.prepare.outputs.count || 'unknown' }}

          <details><summary>Claude 実行の失敗診断</summary>

          \`\`\`
          ${DIAG}
          \`\`\`

          </details>

          成功するまでgreen扱いにはなりません。"
          NUMBER=$(gh issue list --search "$TITLE in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label auto-generated
          fi
