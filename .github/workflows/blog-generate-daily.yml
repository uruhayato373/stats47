name: 📝 Blog Generate Daily (Gemini)

# ブログ新規記事の無人生成ループ (2026-07-31 新設)。
# ranking ai-content の日次ループ (ai-content-generate-daily.yml) と同じ形で、
# Claude のトークンを使わず Gemini API + 決定的ゲートだけで回す。
#
#   1. topic-queue を再構築 (何を書くか。GSC 需要 × 相関 × カテゴリから決定的に並ぶ)
#   2. pending 上位を生成:
#        R2 観測値を接地 → **データ健全性ゲート** → SVG 生成 → 本文生成 → quality-gate
#        → **別コンテキストの critic** → published:true → 最終ゲート
#   3. outbox (docs/21_ブログ記事原稿) を develop に push
#   4. blog-auto-publish.yml を dispatch → factual/quality ゲート再検証 → R2 公開
#
# ★なぜ push トリガー任せにしないか
#   blog-auto-publish.yml は develop への push トリガーを持つが、GitHub Actions は
#   **既定の GITHUB_TOKEN で push した場合、後続 workflow を発火させない** (無限ループ防止)。
#   ai-content で実際に outbox が滞留した (2026-07-31)。明示 dispatch し、run が生まれたことを
#   確認してから成功とする。
#
# ★安全装置
#   - 壊れた metric の記事は書かない (blog-topic-gate。分類軸の絞り忘れ等を生成前に弾く)
#   - quality-gate の blocker が 1 つでも残れば公開しない。**ゲートは緩めない**
#   - critic が REVISE なら下書きごと破棄する (自己採点での公開を作らない)
#   - LIMIT は小さく始める。品質が実測で確認できるまで増やさない
#   - dry_run: LLM を呼ばず接地・ゲート・prompt 長だけ出す (課金ゼロ)
#
# ⚠️ 費用: 1 記事あたり本文生成 + critic の 2 回。入力 ~3K / 出力 ~4K トークン相当 × 2。
#
# 正典: .claude/rules/blog-quality-standards.md / .claude/rules/blog-data-schema.md §0

on:
  schedule:
    - cron: "30 19 * * *" # JST 04:30 (UTC 19:30)。ai-content (JST 03:00) と重ならせない
  # push トリガー (cloud 用): develop に data/blog-generate-requests.json を commit/push すると
  # 実行し、消費した request を git rm で commit-back する。cloud セッションは actions:write が
  # 無く workflow_dispatch できない (403) ため。data-refresh.yml / gemini-image-run.yml と同じ方式。
  #   { "limit": 1, "dryRun": false, "keepDraft": true }
  push:
    branches: [develop]
    paths: ['data/blog-generate-requests.json']
  workflow_dispatch:
    inputs:
      limit:
        description: "生成件数 (既定 2。品質を実測してから増やす)"
        required: false
        default: "2"
      dry_run:
        description: "true: LLM を呼ばず接地とゲートだけ実行する"
        required: false
        default: "false"
      keep_draft:
        description: "true: ゲート落ち / critic REVISE の下書きを残して原因を見る"
        required: false
        default: "false"

permissions:
  contents: write
  actions: write # blog-auto-publish.yml を dispatch するため

concurrency:
  group: blog-generate
  cancel-in-progress: false

env:
  R2_PUBLIC_FETCH_URL: https://storage.stats47.jp
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  # 空なら gemini-text-client.ts の既定値。モデル提供終了時はリポジトリ変数で復旧できる
  GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
  LIMIT: ${{ inputs.limit || '2' }}
  DRY_RUN: ${{ inputs.dry_run || 'false' }}
  KEEP_DRAFT: ${{ inputs.keep_draft || 'false' }}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 🧰 Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 2

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      # push トリガー時は request file を、それ以外は workflow_dispatch の inputs を使う。
      # GITHUB_ENV に書くので、後続 step の if: env.DRY_RUN も解決される。
      - name: 🧭 Resolve inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          REQ=data/blog-generate-requests.json
          if [ "$EVENT_NAME" = "push" ] && [ -f "$REQ" ]; then
            LIMIT=$(node -e "const r=require('./$REQ');process.stdout.write(String(r.limit??2))")
            DRY_RUN=$(node -e "const r=require('./$REQ');process.stdout.write(r.dryRun===true?'true':'false')")
            KEEP_DRAFT=$(node -e "const r=require('./$REQ');process.stdout.write(r.keepDraft===true?'true':'false')")
            {
              echo "LIMIT=$LIMIT"
              echo "DRY_RUN=$DRY_RUN"
              echo "KEEP_DRAFT=$KEEP_DRAFT"
            } >> "$GITHUB_ENV"
            echo "request 解決: limit=$LIMIT dry_run=$DRY_RUN keep_draft=$KEEP_DRAFT"
          else
            echo "inputs 使用: limit=${LIMIT} dry_run=${DRY_RUN} keep_draft=${KEEP_DRAFT}"
          fi

      - name: 🔑 Assert API key (dry-run 以外)
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          if [ -z "${GEMINI_API_KEY}" ]; then
            echo "::error::GEMINI_API_KEY (Secrets) が未設定です"
            exit 1
          fi
          echo "GEMINI_API_KEY: 設定あり (値は出力しない)"

      # モデル提供終了で全件 404 になる事故の再発防止 (2026-07-30)。
      # ListModels の一覧照合では不十分 — 載っていても generateContent が 404 になる (2026-07-31 実測)。
      - name: 🔎 Preflight (極小の実生成で使用可否を確認)
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          set -o pipefail
          NODE_OPTIONS='--conditions react-server' \
            npx tsx packages/ai-content/src/scripts/preflight-gemini.ts 2>&1 | tee /tmp/preflight.log

      # 何を書くか。GSC 需要・相関・カテゴリ網羅から決定的に並ぶ。
      # 外部 fetch を含むので失敗しても既存キューで続行する (生成を止める理由にはならない)。
      - name: 📊 Rebuild topic-queue
        run: node .claude/scripts/blog/build-topic-queue.mjs || echo "::warning::topic-queue 再構築に失敗。既存キューで続行する"

      - name: ✍️ Generate articles (gate 通過分のみ outbox へ)
        run: |
          set -o pipefail
          EXTRA=""
          if [ "${DRY_RUN}" = "true" ]; then EXTRA="$EXTRA --dry-run"; fi
          if [ "${KEEP_DRAFT}" = "true" ]; then EXTRA="$EXTRA --keep-draft"; fi
          NODE_OPTIONS='--conditions react-server' \
            npx tsx packages/ai-content/src/scripts/generate-blog-article.ts \
              --limit "${LIMIT}" \
              --retries 1 \
              $EXTRA 2>&1 | tee /tmp/gen.log
          {
            echo "### 生成結果"
            echo '```'
            grep -E '^(===|\[(ok|reject|fail|skip|dry-run)\]|生成:)' /tmp/gen.log | tail -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Commit outbox and push
        id: commit
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          # push トリガーで来た request は同じ commit で消費する (再実行のループを防ぐ)
          if [ "${{ github.event_name }}" = "push" ]; then
            git rm -q --ignore-unmatch data/blog-generate-requests.json || true
          fi
          git add "docs/21_ブログ記事原稿" .claude/state/blog/topic-queue.json || true
          NEW=$(find "docs/21_ブログ記事原稿" -mindepth 2 -maxdepth 2 -name 'article.md' -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "outbox=${NEW}" >> "$GITHUB_OUTPUT"
          if git diff --cached --quiet; then
            echo "変更なし (生成 0 件)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore(blog): daily gemini article generation (outbox ${NEW} 件)"
          for i in 1 2 3; do
            if git pull --rebase --quiet origin develop && git push origin HEAD:develop; then
              echo "✅ pushed (outbox ${NEW} 件)"
              exit 0
            fi
            echo "push retry $i"; sleep 5
          done
          # push できなければ記事が届かない。黙って成功にしない
          echo "::error::develop への push に 3 回失敗した (outbox ${NEW} 件が未配送)"
          exit 1

      # ★request は結果によらず必ず消費する (2026-07-31 の実測で必要と判明)。
      #
      #   preflight で落ちた run が request を消費せず develop に残り、同じ内容を再 push しても
      #   **diff が出ないので paths フィルタに掛からず再実行できなかった**。残った request は
      #   「未処理の要求がある」ようにも見えて紛らわしい。
      #   成功時は上の outbox commit が同じ commit で消しているので、ここは no-op になる。
      - name: 🧹 Consume request (未消費なら)
        if: ${{ always() && github.event_name == 'push' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch data/blog-generate-requests.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "chore(blog): consume blog-generate request [skip ci]"
          git pull --rebase --quiet origin develop && git push origin HEAD:develop

      # 既定 token の push は blog-auto-publish の push トリガーを発火させないため明示 dispatch する。
      # run が生まれたことを確認してから成功とする (ai-content で滞留を実際に踏んだ)。
      - name: 🚀 Dispatch blog-auto-publish (outbox を R2 へ)
        if: ${{ env.DRY_RUN != 'true' && steps.commit.outputs.outbox != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BEFORE=$(gh run list --workflow blog-auto-publish.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run blog-auto-publish.yml --ref develop
          for i in $(seq 1 12); do
            sleep 10
            AFTER=$(gh run list --workflow blog-auto-publish.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')
            if [ "$AFTER" != "$BEFORE" ]; then
              echo "✅ blog-auto-publish の run が生成された: $AFTER"
              exit 0
            fi
          done
          echo "::error::blog-auto-publish の run を確認できなかった (outbox が滞留している可能性)"
          exit 1
