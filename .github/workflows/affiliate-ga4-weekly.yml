name: 📊 Fetch Affiliate GA4 Metrics & Operations State

# GA4 から アフィリエイト計測イベント (ad_impression / affiliate_click) を取得し、
# (vertical × position) 別 snapshot と 集約状態 (affiliate-operations-latest.json) を
# artifact と job summary に残す (週次運用ループの後半。前半 = 在庫/compliance は
# affiliate-dashboard-refresh.yml が 1 時間前に実行)。
#
# クラウド / web 実行環境には GA4 鍵が無いため、実測は CI で行う (既存 metrics workflow と同じ
# GOOGLE_SERVICE_ACCOUNT_KEY_JSON シークレットを stats47-*.json に復元して実行)。
#
# 失敗を隠さない: GA4 取得に失敗しても集約 state は生成し、measurementGate=blocked として記録したうえで、
# 最後の「🚦 計測ゲート」step で run 自体を失敗させる (緑のまま観測が止まる事故を 2026-09 に起こしたため)。
# 自動化は観測と候補生成 (recommendedActions) まで。広告変更・effect 判定・push・deploy はしない。
#
# 置き場 (2026-09-14・docs/01_技術設計/02_データアーキテクチャ.md):
#   - 生 snapshot ga4-affiliate-<date>.json は git に足さず R2 `state/ads/ga4-affiliate/` へ push する
#     (公開 URL。ローカルは `npm run state:pull -- ads/ga4-affiliate` で live/ に取得。lifecycle 400 日)。
#   - git には週次集約 `.claude/state/ads/ga4-affiliate-history.csv` だけを commit-back する
#     (vertical × position × 週。T14d / T28d の効果判定はこれで足りる)。
#   - artifact は従来どおり 30 日 (デバッグ用)。

on:
  workflow_dispatch:
    inputs:
      days:
        description: "完了済み日だけを対象にする集計日数 (固定期間未指定時)"
        required: false
        default: "28"
      start_date:
        description: "固定期間の開始日 YYYY-MM-DD (end_date と同時指定)"
        required: false
      end_date:
        description: "固定期間の終了日 YYYY-MM-DD (start_date と同時指定)"
        required: false
  schedule:
    - cron: "0 13 * * 0" # JST 22:00 Sunday (UTC 13:00) — inventory/compliance refresh の後

permissions:
  contents: write # 週次集約 CSV の commit-back

concurrency:
  group: affiliate-ga4-fetch
  cancel-in-progress: false

env:
  # diff-push-r2.ts が要求する R2 S3 認証 (sync-snapshots.yml と同じ導出)
  R2_S3_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
  R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
  CLOUDFLARE_R2_BUCKET_NAME: stats47
  R2_PUBLIC_FETCH_URL: https://storage.stats47.jp

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 🧰 Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📊 Fetch affiliate GA4 metrics
        id: ga4
        # 鍵欠落・API 失敗でも workflow は続行し、後段の集約 state が
        # measurementGate=blocked (ga4-snapshot-missing / stale) として失敗を可視化する。
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_JSON }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICE_ACCOUNT_KEY_JSON:-}" ]; then
            echo "::error::GOOGLE_SERVICE_ACCOUNT_KEY_JSON secret 未設定"; exit 1
          fi
          echo "$GOOGLE_SERVICE_ACCOUNT_KEY_JSON" > stats47-f6b5dae19196.json
          chmod 600 stats47-f6b5dae19196.json
          DAYS="${{ github.event.inputs.days || '28' }}"
          START_DATE="${{ github.event.inputs.start_date || '' }}"
          END_DATE="${{ github.event.inputs.end_date || '' }}"
          if [ -n "$START_DATE" ] || [ -n "$END_DATE" ]; then
            ARGS=(--start-date "$START_DATE" --end-date "$END_DATE")
            SNAPSHOT_DATE="$END_DATE"
          else
            ARGS=("$DAYS")
            SNAPSHOT_DATE=$(node -e '
              const { parseFetchWindow } = require("./.claude/scripts/ads/fetch-affiliate-ga4.cjs");
              process.stdout.write(parseFetchWindow([process.argv[1]]).endDate);
            ' "$DAYS")
          fi
          node .claude/scripts/ads/fetch-affiliate-ga4.cjs "${ARGS[@]}" | tee /tmp/affiliate-ga4.md
          SNAPSHOT_FILE=".claude/state/ads/ga4-affiliate-$SNAPSHOT_DATE.json"
          [ -f "$SNAPSHOT_FILE" ] || { echo "::error::snapshot が無い: $SNAPSHOT_FILE"; exit 1; }
          echo "snapshot_file=$SNAPSHOT_FILE" >> "$GITHUB_OUTPUT"
          echo "snapshot_date=$SNAPSHOT_DATE" >> "$GITHUB_OUTPUT"

      - name: 🔐 Cleanup GA4 key
        if: always()
        run: rm -f stats47-f6b5dae19196.json

      # 生 snapshot は R2 state/ が正典。index.json は公開 R2 が list できない代わりの object 一覧。
      - name: 📤 Publish raw snapshot to R2 state/ads/ga4-affiliate/
        id: publish
        if: steps.ga4.outcome == 'success'
        run: |
          set -euo pipefail
          FILE="${{ steps.ga4.outputs.snapshot_file }}"
          DATE="${{ steps.ga4.outputs.snapshot_date }}"
          [ -n "$FILE" ] || { echo "::error::snapshot が無い"; exit 1; }
          [ -f "$FILE" ] || { echo "::error::snapshot が無い: $FILE"; exit 1; }
          STAGE=.local/r2/state/ads/ga4-affiliate
          mkdir -p "$STAGE"
          cp "$FILE" "$STAGE/$DATE.json"
          # 過去期間の backfill が latest を巻き戻さないよう、既存 latest の期間終端と比較する。
          if curl -fsS "$R2_PUBLIC_FETCH_URL/state/ads/ga4-affiliate/latest.json" -o /tmp/affiliate-latest.json; then
            LATEST_DATE=$(node -e '
              const fs=require("fs");
              const value=JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              process.stdout.write(String(value.periodEnd || value.date || ""));
            ' /tmp/affiliate-latest.json)
          else
            LATEST_DATE=""
          fi
          if [ -n "$LATEST_DATE" ] && [[ "$LATEST_DATE" > "$DATE" ]]; then
            cp /tmp/affiliate-latest.json "$STAGE/latest.json"
            echo "historical backfill: latest.json は $LATEST_DATE のまま維持"
          else
            cp "$FILE" "$STAGE/latest.json"
          fi
          # 既存 index (無ければ空) に今回の key を足して重複を除く
          curl -fsS "$R2_PUBLIC_FETCH_URL/state/ads/ga4-affiliate/index.json" -o /tmp/index.json || echo '[]' > /tmp/index.json
          node -e '
            const fs=require("fs"); const idx=JSON.parse(fs.readFileSync("/tmp/index.json","utf8"));
            const keys=[...new Set([...idx, process.argv[1]+".json", "latest.json"])].sort();
            fs.writeFileSync(process.argv[2], JSON.stringify(keys, null, 2)+"\n");
          ' "$DATE" "$STAGE/index.json"
          npx tsx packages/r2-storage/src/scripts/diff-push-r2.ts --prefix "state/ads/ga4-affiliate/"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      # git に残すのは週次集約だけ。生 JSON は .claude/state/ads/.gitignore で追跡しない。
      - name: 📝 Append weekly aggregate and commit back
        if: steps.ga4.outcome == 'success'
        run: |
          set -euo pipefail
          node .claude/scripts/ads/append-ga4-affiliate-history.mjs "${{ steps.publish.outputs.file }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude/state/ads/ga4-affiliate-history.csv
          if git diff --cached --quiet; then echo "No aggregate changes"; exit 0; fi
          git commit -m "chore(ads): ga4 affiliate weekly aggregate ${{ steps.publish.outputs.date }} [skip ci]"
          # API 取得と R2 push を挟むので develop が進みうる。push 直前に取り直す (fetch-metrics-weekly と同じ)。
          git pull --rebase --autostash origin develop
          git push origin develop

      - name: 🔍 Rebuild local inventory/compliance inputs
        run: |
          npx -y tsx .claude/scripts/ads/audit-affiliate-inventory.ts --json --check-size > /dev/null
          npx -y tsx .claude/scripts/ads/audit-affiliate-compliance.ts --check > /tmp/affiliate-compliance.md

      - name: 🧮 Build portfolio + operations state (決定的判定 + validate)
        run: |
          npx -y tsx .claude/scripts/ads/build-affiliate-portfolio-state.ts | tee /tmp/affiliate-portfolio.md
          npx -y tsx .claude/scripts/ads/build-affiliate-portfolio-state.ts --check
          npx -y tsx .claude/scripts/ads/build-affiliate-operations-state.ts | tee /tmp/affiliate-operations.md
          npx -y tsx .claude/scripts/ads/build-affiliate-operations-state.ts --check
          npx -y tsx .claude/scripts/ads/build-affiliate-pilot-state.ts | tee /tmp/affiliate-pilot.md
          npx -y tsx .claude/scripts/ads/build-affiliate-pilot-state.ts --check

      - name: 📝 Job summary (異常があるときだけ action table)
        if: always()
        run: |
          if grep -q "## recommendedActions" /tmp/affiliate-operations.md 2>/dev/null; then
            cat /tmp/affiliate-operations.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ 推奨アクションなし" >> "$GITHUB_STEP_SUMMARY"
          fi
          cat /tmp/affiliate-ga4.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      # 緑のまま観測が止まらないようにする最後の関門。state は上で生成済みなので、
      # ここで落ちても measurementGate=blocked の記録と artifact は残る。
      - name: 🚦 計測ゲート (GA4 失敗 / measurementGate blocked なら run を落とす)
        if: always()
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const p = ".claude/state/ads/affiliate-operations-latest.json";
          if (!fs.existsSync(p)) {
            console.log("::error::affiliate-operations-latest.json が無い (集約 state を生成できていない)");
            process.exit(1);
          }
          const gate = JSON.parse(fs.readFileSync(p, "utf8")).measurementGate ?? {};
          console.log(`measurementGate: ${gate.status} ${(gate.reasons ?? []).join(", ")}`);
          if (gate.status !== "ready") {
            console.log(`::error::measurementGate=${gate.status} (${(gate.reasons ?? []).join(", ")})`);
            process.exit(1);
          }
          NODE
          if [ "${{ steps.ga4.outcome }}" != "success" ]; then
            echo "::error::GA4 取得 step が失敗した (outcome=${{ steps.ga4.outcome }})"
            exit 1
          fi

      - name: 📤 Upload read-only portfolio state
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: affiliate-portfolio-state
          path: |
            .claude/state/ads/ga4-affiliate-*.json
            .claude/state/ads/affiliate-portfolio-latest.json
            .claude/state/ads/affiliate-operations-latest.json
            .claude/state/ads/affiliate-pilot-readiness-latest.json
          retention-days: 30
