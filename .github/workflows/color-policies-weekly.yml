name: 🎨 Color policy ledger

# 指標 × 粒度の配色 (連続か 5 段階か・一方向か発散か) を R2 の値から作り直し、data/ranking/color-policies へ書き戻す。
# 読むだけで R2 には書かない。サイトと SNS へは generate-ranking-items と sync-snapshots の既存の経路で届く。
# 正典: .claude/rules/metric-config-standards.md「配色の台帳」

on:
  workflow_dispatch:
  push:
    # 新しい workflow は main に入るまで dispatch できないので、道具を変えた push でも作り直す
    branches: [develop]
    paths:
      - ".claude/scripts/metrics/build-color-policies.ts"
      - "packages/types/src/color-policy.ts"
      - ".github/workflows/color-policies-weekly.yml"
  schedule:
    # JST 土曜 05:00。計測 (02:00) と note の図の台帳 (04:00) の後、週次レビューの前
    - cron: "0 20 * * 5"

permissions:
  contents: write # 台帳の commit-back

concurrency:
  group: color-policies
  cancel-in-progress: false

env:
  R2_PUBLIC_FETCH_URL: https://storage.stats47.jp

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 🧰 Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci --ignore-scripts

      - name: 🎨 Build the ledger
        run: |
          npm run --silent color-policies:build
          npm run --silent color-policies:check

      - name: 📮 Commit the ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/ranking/color-policies/policies.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(metrics): refresh the color policy ledger [skip ci]"
          git pull --rebase origin develop
          git push origin develop
