name: 📝 Blog remediation daily (今日のリライト10記事)

# 是正ループの日次運用入口 (Claude Pro セッションで agent がリライトする運用)。
# CI で Claude は動かさない (決定的・APIコストゼロ)。
#   1. remediation-queue を最新化 (公開R2 audit + 最新GSC) → develop へ commit-back
#   2. docs/21 (ephemeral outbox) を自動掃除: 公開済み (R2 と内容一致) ドラフトを git rm。
#      広い git add で出戻りした残骸も翌日には自動で消える (2026-06-21 追加・残骸再発防止)
#      内容一致を要求=brushup 改稿中 (R2 旧版と差分) を誤削除しない安全装置
#   3. pending 上位 10 件を「今日のリライト」Issue に upsert 通知
#   4. SVG データ系譜 (json + source.json) を R2 で棚卸し → svg-lineage-queue を commit-back
#   5. 系譜ラチェット: 元データ消失が前回より増えたら workflow を失敗させる (縮小専用)
#   6. 公開散布図を JSON から再生成して byte 一致を要求。既知7件は一次ソースから再計算して値も照合
# 実リライトは人間が Claude セッションで `/brushup-blog --target queue --next 10` を回す。
#
# ★ラチェットを Issue 通知の「後」・commit の「前」に置く理由:
#   - Issue の後 → 系譜が退行しても日次リライトの通知は止めない (無関係な機能を殺さない)
#   - commit の前 → 退行時は baseline を進めない = 直すまで毎日鳴り続ける (一度きりで消えない)
# 正典: .claude/rules/blog-remediation-loop.md / .claude/rules/blog-data-schema.md §0

on:
  schedule:
    - cron: '0 23 * * *' # JST 08:00 (UTC 前日 23:00)
  workflow_dispatch:
    inputs:
      next:
        description: '今日のリライト件数 (default 10)'
        required: false
        default: '10'

permissions:
  contents: write

concurrency:
  group: blog-remediation-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 🧰 Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      # 公開R2 audit (品質blocker) + 最新GSC snapshot を入力にキューを最新化。
      # 「直さず done でごまかし」を防ぐため done の退行を audit で再 pending に戻す。
      - name: ♻️ Rebuild remediation queue
        continue-on-error: true # R2 取得失敗等で Issue 通知本体を止めない
        env:
          R2_PUBLIC_FETCH_URL: https://storage.stats47.jp
        run: node .claude/scripts/blog/build-remediation-queue.mjs

      # SVG データ系譜の棚卸し (2026-07-29 配線): 公開済み全 SVG について
      # <name>.json + <name>.source.json が R2 に揃っているかを走査し、復元キューを最新化する。
      #
      # なぜ cron に要るか: 公開時ゲート (quality-gate の svgLineageMissing) は
      # **ローカル outbox** を見るだけで、しかも公開時にしか発火しない。ゲート導入 (2026-06-20)
      # より前に公開された記事の系譜喪失は誰も検知せず、2026-07-29 にタイルマップを再生成しようとして
      # 初めて 12 枚が復元不能と判明した。定期棚卸しが無いと同じことが繰り返される。
      - name: 🧬 Rebuild SVG lineage queue
        continue-on-error: true # R2 取得失敗等で Issue 通知本体を止めない
        env:
          R2_PUBLIC_FETCH_URL: https://storage.stats47.jp
        run: node .claude/scripts/blog/build-lineage-queue.mjs

      # 出典 (source.json) の再取得可能性を検査 (2026-07-29 新設)。存在検査 (quality-gate の
      # 系譜 gate) では「存在するが復元できない」を捕まえられない。kind ごとに必要な参照が
      # あるか、参照先 rankingKey が R2 に実在するかまで見る。exit 3 = 欠陥あり (ラチェットで判定)。
      - name: 🔎 Audit chart provenance (再取得できる出典か)
        continue-on-error: true # 欠陥ありは exit 3。ここでは記録だけしてラチェットで判定する
        env:
          R2_PUBLIC_FETCH_URL: https://storage.stats47.jp
          NEXT_PUBLIC_ESTAT_APP_ID: ${{ vars.NEXT_PUBLIC_ESTAT_APP_ID }}
        run: node .claude/scripts/blog/audit-chart-provenance.mjs

      # docs/21 (ephemeral outbox) の自動掃除: 「published:true かつ R2 (正典) の article.md と
      # 内容が完全一致」するドラフトを git rm する。広い git add で出戻りした残骸も翌日には自動で消える。
      # published:false の作業中ドラフト / R2 と差分のある改稿中 (brushup) は保持。R2 が SSOT なので削除は可逆。
      #
      # ★2026-07-29: article.md の一致だけでなく「ローカルにあるファイルが全て R2 に載っているか」も
      # 確認する。data/*.json / *.source.json はローカルにしか無い場合があり (実例:
      # library-museum-cultural-capital)、article.md だけ見て消すと元データが永久に失われる。
      - name: 🧹 Prune published drafts from docs/21 outbox
        continue-on-error: true # 掃除失敗で Issue 通知本体を止めない
        env:
          R2_PUBLIC_FETCH_URL: https://storage.stats47.jp
        run: node .claude/scripts/blog/prune-published-outbox.mjs --apply

      - name: 📝 Compose today's rewrite issue body
        id: compose
        run: |
          NEXT="${{ inputs.next || '10' }}"
          mkdir -p /tmp/blog-remediation
          node .claude/scripts/blog/compose-daily-rewrite-issue.mjs --next "$NEXT" \
            > /tmp/blog-remediation/issue.md
          if head -1 /tmp/blog-remediation/issue.md | grep -q "^skip:"; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "--- skipped ---"; cat /tmp/blog-remediation/issue.md
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
            head -20 /tmp/blog-remediation/issue.md
          fi

      - name: 📄 Write GitHub Step Summary
        if: steps.compose.outputs.skipped == 'false'
        run: cat /tmp/blog-remediation/issue.md >> "$GITHUB_STEP_SUMMARY"

      # ラチェット (縮小専用): 元データ消失 (neither) の件数が前回より増えたら失敗させる。
      # 公開時ゲートと prune の安全装置で増えないはずなので、増えたら未知の経路がある。
      # R2 取得失敗時は queue が更新されず diff ゼロになるので誤検知しない。
      - name: 🔒 Lineage ratchet (元データ消失が増えていないか)
        run: |
          Q=".claude/state/blog/svg-lineage-queue.json"
          test -f "$Q" || { echo "queue が無い (rebuild 失敗) → スキップ"; exit 0; }
          # byStatus.neither が集計値 (build-lineage-queue.mjs が書く)。
          # entries[].status からも数えられるが、集計値を使う方がスキーマ変更に強い。
          COUNT='const q=require(process.argv[1]);const n=q.byStatus&&q.byStatus.neither;if(typeof n!=="number"){console.error("byStatus.neither が無い — スキーマ変更?");process.exit(2)}console.log(n)'
          NEW=$(node -e "$COUNT" "$PWD/$Q") || { echo "::error::queue のスキーマが想定と違います (ラチェットが空振りするので失敗させます)"; exit 1; }
          if ! git show "HEAD:$Q" > /tmp/lineage-prev.json 2>/dev/null; then
            echo "前回の queue が無い (初回) → baseline を記録するだけ: neither=$NEW"; exit 0
          fi
          OLD=$(node -e "$COUNT" /tmp/lineage-prev.json) || { echo "前回 queue のスキーマが古い → 比較をスキップ"; exit 0; }
          echo "元データ消失 (neither): 前回 $OLD → 今回 $NEW"
          if [ "$NEW" -gt "$OLD" ]; then
            echo "::error::SVG の元データ消失が $OLD → $NEW に増えました。公開時ゲート (quality-gate の svgLineageMissing) と docs/21 prune の安全装置を通らない経路があります。正典: .claude/rules/blog-data-schema.md §1.7"
            exit 1
          fi
          echo "✓ 増えていません (縮小専用ラチェット OK)"

      # 値ラチェット (縮小専用): 本文の数値が data と食い違う記事が増えたら失敗させる。
      #
      # 2026-08-12 に値照合の誤検出 (実数 ↔ 人口当たりの取り違え) を潰し、公開 426 記事で 0 件に
      # なった。以後の増加は本物の食い違いなので止める。0 件が「検証器が動いていない」ことと
      # 区別できるよう、実データへの誤値注入で 2 倍 / 1.5 倍 / 100 倍が発火することを実測済み。
      # 正典: .claude/rules/unit-semantics-standards.md
      - name: 🔒 Value ratchet (本文と data の数値食い違いが増えていないか)
        run: |
          Q=".claude/state/blog/remediation-queue.json"
          test -f "$Q" || { echo "queue が無い (rebuild 失敗) → スキップ"; exit 0; }
          COUNT='const q=require(process.argv[1]);const n=q.summary&&q.summary.valueMismatchArticles;if(typeof n!=="number"){console.error("summary.valueMismatchArticles が無い — スキーマ変更?");process.exit(2)}console.log(n)'
          NEW=$(node -e "$COUNT" "$PWD/$Q") || { echo "::error::queue のスキーマが想定と違います (ラチェットが空振りするので失敗させます)"; exit 1; }
          if ! git show "HEAD:$Q" > /tmp/value-prev.json 2>/dev/null; then
            echo "前回の queue が無い (初回) → baseline を記録するだけ: valueMismatch=$NEW"; exit 0
          fi
          OLD=$(node -e "$COUNT" /tmp/value-prev.json) || { echo "前回 queue に集計が無い (配線前) → 比較をスキップ"; exit 0; }
          echo "数値の食い違い (記事数): 前回 $OLD → 今回 $NEW"
          if [ "$NEW" -gt "$OLD" ]; then
            echo "::error::本文と data の数値が食い違う記事が $OLD → $NEW に増えました。どちらが正しいかを SSOT で確かめてから直すこと (壊れた data に本文を合わせない)。確認: node .claude/scripts/blog/quality-gate.mjs <slug> / 正典: .claude/rules/unit-semantics-standards.md"
            exit 1
          fi
          echo "✓ 増えていません (縮小専用ラチェット OK)"

      # 出典ラチェット (縮小専用): 「存在するが再取得できない source.json」が増えたら失敗させる。
      # 系譜ラチェットと同じ理由でここ (Issue の後・commit の前) に置く。
      - name: 🔒 Provenance ratchet (再取得できない出典が増えていないか)
        run: |
          Q=".claude/state/blog/chart-provenance-queue.json"
          test -f "$Q" || { echo "queue が無い (audit 失敗) → スキップ"; exit 0; }
          COUNT='const q=require(process.argv[1]);if(typeof q.defectCount!=="number"){console.error("defectCount が無い — スキーマ変更?");process.exit(2)}console.log(q.defectCount)'
          NEW=$(node -e "$COUNT" "$PWD/$Q") || { echo "::error::queue のスキーマが想定と違います (ラチェットが空振りするので失敗させます)"; exit 1; }
          if ! git show "HEAD:$Q" > /tmp/prov-prev.json 2>/dev/null; then
            echo "前回の queue が無い (初回) → baseline を記録するだけ: defects=$NEW"; exit 0
          fi
          OLD=$(node -e "$COUNT" /tmp/prov-prev.json) || { echo "前回 queue のスキーマが古い → 比較をスキップ"; exit 0; }
          echo "再取得できない出典: 前回 $OLD → 今回 $NEW"
          if [ "$NEW" -gt "$OLD" ]; then
            echo "::error::再取得できない source.json が $OLD → $NEW に増えました。詳細: .claude/state/blog/chart-provenance-LATEST.md / 正典: .claude/rules/blog-data-schema.md §1.5"
            exit 1
          fi
          echo "✓ 増えていません (縮小専用ラチェット OK)"

      - name: 📤 Commit refreshed queue + outbox prune to develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude/state/blog/remediation-queue.json
          # SVG データ系譜キュー (build-lineage-queue.mjs の出力)。commit しないと
          # 「元データ喪失が溜まっているか」が追跡できず、cron に配線した意味が無くなる。
          git add .claude/state/blog/svg-lineage-queue.json .claude/state/blog/svg-lineage-LATEST.md
          # 出典 (source.json) の再取得可能性。同じ理由で commit しないとラチェットの baseline が育たない。
          git add .claude/state/blog/chart-provenance-queue.json .claude/state/blog/chart-provenance-LATEST.md
          # prune-published-outbox の git rm 結果 (公開済みドラフト削除) もステージ
          git add -A "docs/21_ブログ記事原稿/"
          if git diff --cached --quiet; then
            echo "No queue / outbox change to commit"
            exit 0
          fi
          # rebuild で dirty な作業ツリーのまま pull すると失敗するため commit を先に。
          git commit -m "chore(blog): daily maintenance — queue refresh + outbox prune [skip ci]"
          git pull --rebase origin develop
          git push origin develop

      # 公開R2の全散布図を data JSON から再生成し、SVGと完全一致することを要求する。
      # さらに過去に破損した7件は ranking/e-Stat/観光庁原表から点集合を再計算して
      # 公開JSONとも照合する。読み取り専用で、差異・欠損・外部取得失敗は fail-closed。
      - name: 🔒 Scatter integrity gate (JSON / SVG / upstream)
        if: always()
        env:
          R2_PUBLIC_FETCH_URL: https://storage.stats47.jp
          NEXT_PUBLIC_ESTAT_APP_ID: ${{ vars.NEXT_PUBLIC_ESTAT_APP_ID }}
        run: |
          npx tsx .claude/scripts/blog/rerender-scatter-canonical.mts \
            --probe-only --require-canonical --verify-sources
