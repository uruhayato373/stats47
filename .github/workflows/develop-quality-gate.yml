name: 🚦 Develop Quality Gate

# ─────────────────────────────────────────────────────────────────────────────
# develop への push を検査する高速ゲート (2026-08-20 新設)。
#
# ★なぜ要るか (2026-08-20 の実測):
#   `pr-quality-check.yml` のトリガーは `pull_request: branches: [main]` だけなので、
#   **develop への push は一切検査されていなかった**。その結果、pre-commit を通って
#   いない変更がそのまま develop に着地し、壊れは「次に develop をマージする人」が
#   払う構造になっていた。実測では origin/develop の
#   `MetricFocusCharts.tsx:63` が react-hooks/set-state-in-effect 違反を含んだまま
#   入っており (commit 621131d6c)、マージ担当が 3 サイクル・十数分を検査待ちに使った。
#   しかも「自分が壊したのか継承したのか」の切り分けが毎回必要になる。
#
# ★設計方針: フル suite (pre-commit 相当・2 分超) を再実装しない。
#   develop の着地点で「決定的・高速」なゲートだけを
#   走らせ、壊れが次のマージ担当に回るのを止める。深い検査は従来どおり
#   develop→main の PR (`pr-quality-check.yml`) が担う。
#
# ★2026-09-17 (CI-DEVELOP-GATE-COVERAGE-01) で Card Census / Design System Check /
#   Ad Placement Guard を追加。PR #913 が入れた check-ad-placement のリテラル不一致と
#   native 枠の在庫フォールバック喪失が develop で一度も検知されず、main への PR で
#   初めて落ちた実例に基づく。apps/web Unit Tests (vitest) も候補に入れて実測したが、
#   run 35218837673 でジョブ全体 328 秒 (vitest 単体 162 秒) となり停止条件の 3 分を
#   大幅に超過したため fast-gates からは外した (推測ではなく実測で判断)。2026-09-18 に
#   node_modules キャッシュで fast-gates が 102 秒へ戻ったので、vitest は**別 job**
#   (unit-web / unit-packages、下記) として並列に走らせる。配線の過程で実際に develop 上で赤くなる欠陥
#   (RankingPageSidebarSection.tsx の RailAdSlot 追加に rakuten-ranking-placement.test.tsx
#   の mock が追従していなかった) を発見・是正済み。Build Check・Full E2E・Remotion も
#   同じ理由でここに足さない (重すぎて push が詰まり `--no-verify` を誘発する)。
#
#   ここに新しい検査を足すときは「決定的か」「1 分以内か」を満たすこと。満たさない
#   ものは `pr-quality-check.yml` 側に置く (このゲートが重くなると develop への
#   push が詰まり、結局 --no-verify を誘発して元の木阿弥になる)。
#
# ★cron の commit-back はほぼすべて `[skip ci]` を持つので発火しない。
#   2026-08-20 時点の例外は `gsc-url-inspection-daily.yml` の 1 本だけで、これは
#   `.claude/state/metrics/gsc/url-inspection/` の CSV/MD しか触らないため緑で通る。
#   **`paths-ignore` で state を除外しない**: 実測すると 3 ゲートはいずれも `.claude/state` を
#   読まない (maintenance-debt は `state` を EXCLUDED に持ち、env-registry の roots にも無く、
#   eslint は apps/web/src のみ) ので除外しても今は安全。それでも足さないのは、将来 state を
#   読むゲートを足したときに除外が黙って穴になるから。1 日 1 回の余分な run のほうが安い。
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - develop

# 同一ブランチの連続 push は最新のみ検査する (古い run は cancel)。
concurrency:
  group: develop-quality-gate
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-gates:
    name: Fast Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🧰 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # maintenance-debt の --ratchet-check が origin/main と比較する

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Restore node_modules cache
        # CI-SPEED-NODE-MODULES-CACHE-01: npm ci が実測 105〜122 秒でジョブの過半を占めていた。
        # lockfile hash キーで node_modules ごと復元し、hit 時は npm ci を skip する。
        # develop への push ごとに同じ key で save されるので 2 回目以降が hit する
        # (main 側は cache-node-modules.yml が同じ key で温める)。
        id: node-modules-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: 📦 Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: 📝 ESLint Check
        # ★`npm run lint` (= turbo → `next lint`) を使わない。
        #   `next lint` はパッケージマネージャを**外部プロセスとして起動**して registry を引く。
        #   GitHub runner には yarn 1.22.22 が素で入っているため検出を誤り、
        #   `Failed to get registry from "yarn"` で落ちる (2026-08-20 の初回 run で実測)。
        #   ローカルは corepack が「このプロジェクトは npm」と拒否するため再現しない。
        #   eslint を直接呼べば同じ設定・同じルールで、外部プロセスに依存しない
        #   (pre-commit の staged lint と同じ方式)。`next lint` 自体も Next 15 で非推奨。
        #   `--max-warnings` は付けない: 既存の warning 2 件 (no-img-element) で
        #   develop が常に赤になり、ゲートが運用で無視されるようになる。error のみで判定する。
        run: npx eslint src
        working-directory: apps/web
        continue-on-error: false

      - name: 🔐 Environment Registry Guard
        # 値は読まず、コード/workflow が参照する env 名と公開区分だけを検査する。
        # 2026-08-20 は Windows 版 dev サーバ由来の 4 変数 (PWSH_PATH / R2_DEV_GATEWAY*)
        # が未登録のまま develop に着地していた。
        run: node .claude/scripts/lib/check-env-registry.cjs
        continue-on-error: false

      - name: 🧭 Maintenance Debt Regression Guard
        # 無根拠 TODO/FIXME/HACK、削除条件のない legacy、永続 D1 runtime 復活の新規増加を止める。
        # ratchet-check: baseline は縮小専用 (origin/main 比で増えたら手編集/すり替えとして拒否)。
        run: |
          node .claude/scripts/lib/check-maintenance-debt.cjs --baseline
          node .claude/scripts/lib/check-maintenance-debt.cjs --ratchet-check
        continue-on-error: false

      - name: 🧯 Quality Warning Ratchet
        # validate:catalog / validate:polarity / validate:config の warn 件数が baseline
        # (.claude/config/quality-warning-baseline.json) を超えていないか。baseline は縮小専用。
        # 夜間の selection backfill (THEME-SELECTION-BACKFILL-01) が no-adoption-criteria を
        # 減らして baseline を縮めるので、develop 着地点で増加を止める (実測 4 秒・決定的)。
        run: node .claude/scripts/lib/check-quality-warning-ratchet.cjs --base origin/main
        continue-on-error: false

      - name: 📐 Card Census
        run: node .claude/scripts/lib/check-card-census.cjs
        continue-on-error: false

      - name: 🎨 Design System Check
        run: npm run design-system:check -w apps/web
        continue-on-error: false

      - name: 📢 Ad Placement Guard
        run: node .claude/scripts/lib/check-ad-placement.cjs
        continue-on-error: false

  # ★unit test を develop 着地点でも走らせる (CI-SPEED-UNIT-TESTS-EARLY-01、2026-09-18)。
  #   fast-gates とは別 job なので、上の「1 job 3 分」予算に乗らない (壁時計は並列)。
  #   それまで unit test は develop→main の PR で初めて走り、PR #974 で 2 回、2026-09-17 には
  #   RailAdSlot mock 欠落で web 4 test が crash したまま develop に潜んでいた。
  #   coverage は取らない (PR / 週次の担当)。node_modules は fast-gates と同じ key で復元する。
  unit-web:
    name: Unit Tests (web)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🧰 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: 📦 Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: 🧪 Web unit tests
        run: npm run test:run -w apps/web
        continue-on-error: false

  unit-packages:
    name: Unit Tests (packages)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🧰 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: 📦 Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: 🧪 Package unit tests
        # ローカルと同じ全件 (coverage 分割なし)。PR 側の test:packages:ci + coverage step が正典。
        run: npm run test:packages
        continue-on-error: false

  # ★生成物の鮮度・catalog 契約を develop 着地点で走らせる (CI-SPEED-PRECOMMIT-TRIM-01、2026-09-18)。
  #   `npm run preflight:pr` は PR CI の Catalog Gates / Static Gates と同じコマンド 18 種を並列に回す
  #   (ローカル実測 18〜21 秒。CI では main 先行チェックを skip)。これが develop で走るので、
  #   pre-commit から metric config 時の `npx tsx` 直列 6 本 (Windows で 12 分の記録) を外せる。
  #   ratchet 系が origin/main と比較するため fetch-depth 0。
  catalog-gates:
    name: Catalog Gates (preflight:pr)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🧰 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: 📦 Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: 🧭 Catalog / registry / generated-artifact gates
        run: npm run preflight:pr
        continue-on-error: false
