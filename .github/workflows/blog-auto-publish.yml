name: 📤 Blog Auto-Publish (develop → R2)

# Phase 2 半自律ブログ運用の「公開ブリッジ」。
# Claude Routine (AI リライト) が develop に入れた published:true 記事を R2 へ公開する。
# dispatch 403 (外部連携トークンの workflow 実行不可) を回避し、R2 secrets を持つ
# ネイティブ CI として publish-blog のロジックを実行する。
#
# === 段階導入 (.claude/rules/blog-data-schema.md §0 記事ライフサイクル) ===
#   現在 = Phase 1: workflow_dispatch のみ (手動起動)。実 CI でステップが通るか検証する段階。
#   次   = Phase 2: 検証 OK 後、後続コミットで `on: push: branches:[develop]` を追加する。
#          その「マージ」自体が自動公開の解禁の意思表示 (git 履歴に残る)。
#   緊急停止: GitHub Actions UI の "Disable workflow" (リポジトリ変数によるガードは廃止)。
#
# 安全装置:
#   - published:true の docs/21 記事だけが対象 (作業中ドラフト published:false は無視)
#   - publish 前に ci-factual-gate (数値捏造) + quality-gate (構造・薄さ) を再検証し、
#     落ちた slug はスキップ (R2 に到達させない)
#   - 1 回の実行で公開する上限を MAX_PUBLISH 件にクランプ (爆発半径の限定)
#
# 手動公開 (1 slug 指定) は従来どおり publish-blog.yml を使う。

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: '公開する slug (空白/カンマ区切り)。空なら develop 最新コミットの差分から検出'
        required: false
        type: string
  # Phase 2 (2026-06-02): develop に article.md が push されたら自動公開。
  # 外部連携トークンは workflow_dispatch を起動できない (actions:write なし → 403) ため、
  # push を公開トリガーにして「クラウド / web 実行環境でも publish が git push だけで完結」させる。
  # published:true の判定・factual/quality ゲート・MAX_PUBLISH クランプは下流ステップで担保。
  push:
    branches: [develop]
    paths:
      - 'docs/21_ブログ記事原稿/**/article.md'
      # この workflow 自身の変更でも発火させ、未公開記事の backfill (reconcile) を回せるようにする。
      - '.github/workflows/blog-auto-publish.yml'

permissions:
  contents: write # 公開後に docs/21 ドラフトを自動削除 (ephemeral outbox) して commit-back するため

concurrency:
  group: r2-write # 全 R2 image writer + publish-blog.yml と共通
  cancel-in-progress: false

env:
  R2_S3_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
  R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
  CLOUDFLARE_R2_BUCKET_NAME: stats47
  R2_PUBLIC_FETCH_URL: https://storage.stats47.jp
  MAX_PUBLISH: '10'
  # 公開後の CDN ピンポイントパージ用 (purge-cache.ts --urls)
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID || secrets.CLOUDFLARE_ZONE_ID }}
  WORKER_CACHE_PURGE_SECRET: ${{ secrets.WORKER_CACHE_PURGE_SECRET }}

jobs:
  auto-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 🧰 Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 2 # 差分検出フォールバック (HEAD~1..HEAD) のため

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Resolve target published drafts
        id: detect
        run: |
          INPUT_SLUGS="${{ inputs.slugs }}"
          if [ -n "$INPUT_SLUGS" ]; then
            # 明示指定: そのまま採用 (存在 + published:true は次ステップのゲートで担保)
            CANDIDATES=$(echo "$INPUT_SLUGS" | tr ', ' '\n' | sed '/^$/d')
          else
            # フォールバック: develop 最新コミットで変更された article.md を検出。
            # ★ core.quotepath=false で日本語パスをエスケープせず出力 (既定 true だと
            #    "docs/21_\343\203..." とエスケープされ grep に一致せず 0 件になる既知バグ)。
            CHANGED=$(git -c core.quotepath=false diff --name-only --diff-filter=ACM "HEAD~1" "HEAD" \
              | grep -E '^docs/21_ブログ記事原稿/[^/]+/article\.md$' || true)
            CANDIDATES=""
            for f in $CHANGED; do CANDIDATES="$CANDIDATES $(basename "$(dirname "$f")")"; done
            # reconcile: 変更検出が空なら、公開が要る記事を backfill する。
            # 対象は「未公開 (R2 に無い)」+「**改稿版 (R2 に旧版が live)**」の 2 つ。
            #
            # ★改稿版を含めるのが要 (2026-08-03 修正): 旧実装は all.json 未掲載だけを見ており、
            #   brushup 済みの記事は既に live なので永久に選ばれなかった。pruner は内容差分を見て
            #   正しく保持するため、outbox に溜まる一方で公開されない状態になっていた
            #   (実際に 2 本が滞留)。ブログ是正ループの出力は全てこの経路を通るので、
            #   塞がっていると是正キューの成果が本番に届かない。
            #
            #   判定は pruner と同じ .claude/scripts/blog/lib/outbox-r2.mjs を使う。
            #   prune (消す) と publish (出す) は裏表で、片方だけズレると同じ事故が再発する。
            if [ -z "$(echo "$CANDIDATES" | xargs)" ]; then
              echo "変更検出 0 → 公開待ち backfill (reconcile) モード"
              CANDIDATES=$(node .claude/scripts/blog/select-republish-slugs.mjs)
            fi
          fi
          # published:true のものだけ残す
          SLUGS=""
          COUNT=0
          for slug in $CANDIDATES; do
            f="docs/21_ブログ記事原稿/$slug/article.md"
            if [ -f "$f" ] && grep -qE '^published:[[:space:]]*true[[:space:]]*$' "$f"; then
              SLUGS="$SLUGS $slug"; COUNT=$((COUNT + 1))
            else
              echo "skip (not found / published!=true): $slug"
            fi
          done
          SLUGS=$(echo "$SLUGS" | xargs -n1 2>/dev/null | head -n "${MAX_PUBLISH}" | xargs || true)
          echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"
          echo "検出: ${COUNT} 件 (上限 ${MAX_PUBLISH} に丸め) → ${SLUGS:-なし}"
          {
            echo "### Auto-publish 対象"
            echo "- published 記事: ${COUNT} 件"
            echo "- 公開対象 (上限 ${MAX_PUBLISH}): ${SLUGS:-なし}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🚪 Gate + Stage + Publish each slug
        if: ${{ steps.detect.outputs.slugs != '' }}
        run: |
          set -e
          PUBLISHED=""
          SKIPPED=""
          for SLUG in ${{ steps.detect.outputs.slugs }}; do
            echo "::group::publish $SLUG"
            DRAFT="docs/21_ブログ記事原稿/$SLUG/article.md"
            # --- ゲート (公開前ブロック) ---
            if ! node .claude/scripts/blog/ci-factual-gate.mjs "$SLUG"; then
              echo "❌ $SLUG: factual gate fail → skip"; SKIPPED="$SKIPPED $SLUG"; echo "::endgroup::"; continue
            fi
            if ! node .claude/scripts/blog/quality-gate.mjs "$DRAFT"; then
              echo "❌ $SLUG: quality gate fail → skip"; SKIPPED="$SKIPPED $SLUG"; echo "::endgroup::"; continue
            fi
            # --- ステージ (publishedAt 補完) ---
            mkdir -p ".local/r2/app/blog/$SLUG"
            cp -R "docs/21_ブログ記事原稿/$SLUG/." ".local/r2/app/blog/$SLUG/"
            A=".local/r2/app/blog/$SLUG/article.md"
            if grep -qE '^publishedAt:\s*\(未定\)' "$A" || ! grep -qE '^publishedAt:\s*[0-9]' "$A"; then
              perl -i -pe "s/^publishedAt:.*/publishedAt: $(date -u +%Y-%m-%d)/" "$A"
            fi
            # --- thumbnail 差分生成 (isolated staging + exact plan) ---
            npx tsx apps/web/scripts/generate-blog-thumbnails.ts --slug "$SLUG"
            # --- 生成した画像だけを asset → manifest の順で反映 ---
            PLAN=".local/image-generation-publish-plan-blog.json"
            test -f "$PLAN" || { echo "exact publish plan が生成されませんでした: $SLUG"; exit 1; }
            npx tsx packages/r2-storage/src/scripts/push-generated-image-set.ts --plan "$PLAN"
            # --- 記事本体を R2 へ push ---
            # prefix には画像 manifest も含まれる。exact plan の前に同期すると
            # manifest の楽観ロックを自分自身で壊すため、画像セット確定後に同期する。
            npx tsx packages/r2-storage/src/scripts/diff-push-r2.ts --prefix "app/blog/$SLUG"
            PUBLISHED="$PUBLISHED $SLUG"
            echo "✅ $SLUG published"
            echo "::endgroup::"
          done
          {
            echo "PUBLISHED=$PUBLISHED"
            echo "SKIPPED=$SKIPPED"
          } >> "$GITHUB_ENV"

      - name: 🧮 Regenerate blog index (all.json) + push
        if: ${{ steps.detect.outputs.slugs != '' }}
        run: |
          NODE_OPTIONS='--conditions react-server' npx tsx apps/web/scripts/export-blog-snapshot.ts
          npx tsx packages/r2-storage/src/scripts/diff-push-r2.ts --prefix app/blog

      - name: 🧹 Purge CDN (公開記事URL + 一覧/ホーム/sitemap のみ)
        if: ${{ steps.detect.outputs.slugs != '' }}
        run: |
          # 公開された記事だけをピンポイントパージ (全ゾーンパージは避ける)。
          # URLS は配列で組む ("$URLS" 単一引数渡しは purge-cache の URL filter が 0 件になり fail — ARG_VECTOR_QUOTED)
          URLS=()
          for SLUG in $PUBLISHED; do URLS+=("https://stats47.jp/blog/$SLUG"); done
          if [ ${#URLS[@]} -eq 0 ]; then
            echo "公開0件のため purge skip"; exit 0
          fi
          # 記事追加で内容が変わる索引系もパージ
          URLS+=(https://stats47.jp/blog https://stats47.jp/ https://stats47.jp/sitemap.xml)
          echo "purge: ${URLS[*]}"
          npx tsx packages/r2-storage/src/scripts/purge-cache.ts --urls "${URLS[@]}"
          npx tsx packages/r2-storage/src/scripts/purge-worker-cache.ts --urls "${URLS[@]}"

      # 記事 frontmatter だけでなく本文中の SVG / image 参照も含め、cache purge 後の
      # 公開 R2 を実測する。PUBLISHED が空なら公開変更が無いので実行しない。
      - name: 🌐 Audit public data contracts after blog publish
        if: ${{ env.PUBLISHED != '' }}
        run: npm run audit:public-data-contract

      # docs/21 は ephemeral outbox: 公開に成功した slug のドラフトを R2 反映後に削除し、
      # commit-back する。これで docs/21 は常に空 (未公開ドラフトのみ) に保たれ、R2(正典)と
      # ドリフトしない。[skip ci] で自己再発火を防止、pull --rebase で他 push との race を吸収。
      - name: 🧹 Remove published drafts from docs/21 (ephemeral outbox)
        if: ${{ steps.detect.outputs.slugs != '' && success() }}
        env:
          R2_PUBLIC_FETCH_URL: https://storage.stats47.jp
        run: |
          REMOVED=""
          for SLUG in $PUBLISHED; do
            if [ -d "docs/21_ブログ記事原稿/$SLUG" ]; then
              git rm -r -q "docs/21_ブログ記事原稿/$SLUG" && REMOVED="$REMOVED $SLUG"
            fi
          done
          # ★sitemap のコミット済み snapshot を公開実態に追随させる (2026-08-20 配線)。
          #   これが無いと `pr-quality-check.yml` の Known Tag Keys Gate が
          #   「sitemap-blog-entries がコミット済みの内容と一致しません」で落ち、
          #   記事を公開するたびに人手で再生成する運用になっていた
          #   (実測: 08-15 / 08-16 / 08-17 ×2 / 08-21 と繰り返し発生)。
          #   R2 の app/blog/all.json を読むだけの決定的生成なので副作用はない。
          if (cd apps/web && NODE_OPTIONS='--conditions react-server' npx tsx scripts/generate-sitemap-blog-entries.ts); then
            git add apps/web/src/config/sitemap-blog-entries.ts || true
          else
            echo "::warning::sitemap-blog-entries の再生成に失敗 (公開自体は成功。次の sync-snapshots で追随する)"
          fi
          if git diff --cached --quiet; then
            echo "削除対象なし (docs/21 に公開済みドラフトの取り残しなし)"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore(blog): outbox 掃除 + sitemap snapshot 追随 [skip ci] -${REMOVED}"
          # 他 workflow の push と競合しても落ちないよう rebase してから push (最大3回)
          for i in 1 2 3; do
            if git pull --rebase --quiet origin develop && git push origin HEAD:develop; then
              echo "✅ outbox cleanup pushed:${REMOVED}"; break
            fi
            echo "push retry $i (concurrent push?)"; sleep 3
          done

      - name: 📝 Summary
        if: always()
        run: |
          {
            echo "- ✅ 公開: ${PUBLISHED:-なし}"
            echo "- ⏭️ ゲート未達でスキップ: ${SKIPPED:-なし}"
            echo "- 🧹 docs/21 outbox: 公開済みドラフトを削除済 (ephemeral)"
          } >> "$GITHUB_STEP_SUMMARY"
