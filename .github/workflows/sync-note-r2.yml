name: 📝 Sync Note Articles to R2

# 公開済み / 未公開ドラフト note 記事を R2 に同期し、docs/31 を空にする。
# docs/31 は ephemeral outbox (編集時のみ、push 後に削除)。
#
# 自動トリガー:
#   - develop への push で note-published-urls.json が更新 (新規公開後)
#   - develop への push で note-draft-index.json が更新 (ドラフト追加後)
#
# 手動実行:
#   gh workflow run sync-note-r2.yml -f dry_run=false
#
# 何をするか:
#   1. 公開済み (note-published-urls.json) + ドラフト (note-draft-index.json) を確認
#   2. r2_path 未記録 && docs/31 に存在するものを R2 にアップロード
#   3. 各 index に r2_path を追記
#   4. docs/31 から削除 (git rm) → commit-back
#
# 復元 (更新時):
#   bash .claude/scripts/note/restore-from-r2.sh <slug>

on:
  push:
    branches: [develop]
    paths:
      - '.claude/state/note-published-urls.json'
      - '.claude/state/note-draft-index.json'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true: R2 push / docs/31 削除なし (検証のみ) / false: 本番"
        required: false
        default: "true"

permissions:
  contents: write

concurrency:
  group: sync-note-r2
  cancel-in-progress: false

env:
  R2_S3_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
  R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
  CLOUDFLARE_R2_BUCKET_NAME: stats47
  R2_PUBLIC_FETCH_URL: https://storage.stats47.jp

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 🧰 Checkout develop
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: develop
          fetch-depth: 1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Check pending count (published + drafts)
        id: check
        run: |
          DRY_RUN=true node .claude/scripts/note/sync-note-r2.mjs
          DRY_RUN=true node .claude/scripts/note/sync-drafts-r2.mjs
          node -e "
            const fs=require('fs');
            const pub=JSON.parse(fs.readFileSync('.claude/state/note-published-urls.json','utf8'));
            const dft=JSON.parse(fs.readFileSync('.claude/state/note-draft-index.json','utf8'));
            const pubPending=Object.entries(pub.articles).filter(([k,v])=>!k.startsWith('_')&&!v.r2_path&&(
              fs.existsSync('docs/31_note記事原稿/'+v.vertical+'/'+k)||
              fs.existsSync('docs/31_note記事原稿/'+k)
            ));
            const dftPending=Object.entries(dft.drafts).filter(([k,v])=>!v.r2_path&&(
              v.vertical==='stats47-note'
                ? fs.existsSync('docs/31_note記事原稿/'+k)
                : fs.existsSync('docs/31_note記事原稿/'+v.vertical+'/'+k)
            ));
            const total=pubPending.length+dftPending.length;
            console.log('pending_count='+total);
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'pending_count='+total+'\n');
          "

      - name: ⏭️ Skip if nothing to sync
        if: steps.check.outputs.pending_count == '0'
        run: echo "同期対象なし — スキップ"

      - name: 📤 Sync published articles to R2
        if: |
          steps.check.outputs.pending_count != '0' &&
          (github.event_name == 'push' || github.event.inputs.dry_run == 'false')
        run: DRY_RUN=false node .claude/scripts/note/sync-note-r2.mjs

      - name: 📤 Sync draft articles to R2
        if: |
          steps.check.outputs.pending_count != '0' &&
          (github.event_name == 'push' || github.event.inputs.dry_run == 'false')
        run: DRY_RUN=false node .claude/scripts/note/sync-drafts-r2.mjs

      - name: 🧹 Remove synced articles from docs/31
        if: |
          steps.check.outputs.pending_count != '0' &&
          (github.event_name == 'push' || github.event.inputs.dry_run == 'false')
        run: |
          node -e "
            const fs=require('fs');
            const pub=JSON.parse(fs.readFileSync('.claude/state/note-published-urls.json','utf8'));
            const dft=JSON.parse(fs.readFileSync('.claude/state/note-draft-index.json','utf8'));
            const allArticles=[
              ...Object.entries(pub.articles).filter(([k])=>!k.startsWith('_')).map(([k,v])=>({slug:k,info:v})),
              ...Object.entries(dft.drafts).map(([k,v])=>({slug:k,info:v}))
            ];
            let count=0;
            for(const {slug,info} of allArticles){
              if(!info.r2_path) continue;
              const v=info.vertical;
              const nested='docs/31_note記事原稿/'+(v&&v!=='stats47-note'?v+'/':'')+slug;
              const top='docs/31_note記事原稿/'+slug;
              const target=fs.existsSync(nested)?nested:(fs.existsSync(top)?top:null);
              if(target){ console.log(target); count++; }
            }
            if(count===0) console.log('__none__');
          " | while IFS= read -r dir; do
            [ "$dir" = "__none__" ] && break
            echo "  git rm: $dir"
            git rm -r -q "$dir"
          done

      - name: 🗑️ Remove empty vertical containers from docs/31
        if: |
          steps.check.outputs.pending_count != '0' &&
          (github.event_name == 'push' || github.event.inputs.dry_run == 'false')
        run: |
          for d in docs/31_note記事原稿/*/; do
            [ -d "$d" ] || continue
            # コンテナが空ならgit rmで削除
            remaining=$(find "$d" -type f | wc -l)
            if [ "$remaining" -eq "0" ]; then
              echo "  empty container: $d"
              git rm -r -q "$d" 2>/dev/null || true
            fi
          done
          # docs/31 自体が空になったら削除
          remaining=$(find docs/31_note記事原稿 -type f 2>/dev/null | wc -l)
          if [ "$remaining" -eq "0" ]; then
            echo "  docs/31 が空になりました"
            git rm -r -q docs/31_note記事原稿 2>/dev/null || true
          fi

      - name: 💾 Commit-back (index 更新 + docs/31 削除)
        if: |
          steps.check.outputs.pending_count != '0' &&
          (github.event_name == 'push' || github.event.inputs.dry_run == 'false')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude/state/note-published-urls.json .claude/state/note-draft-index.json
          git diff --cached --quiet && { echo "変更なし (スキップ)"; exit 0; }
          COUNT=$(git diff --cached --name-only | wc -l | tr -d ' ')
          git commit -q -m "chore(note): sync all articles to R2, remove from docs/31 [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase --quiet origin develop && git push origin HEAD:develop; then
              echo "✅ commit-back 完了 ($COUNT ファイル)"; break
            fi
            echo "push retry $i"; sleep 3
          done

      - name: 📋 Summary
        run: |
          {
            echo "### Note R2 Sync"
            echo "- pending: ${{ steps.check.outputs.pending_count }} 件"
            echo "- dry_run: ${{ github.event.inputs.dry_run || 'false (push trigger)' }}"
            echo "- 復元: \`bash .claude/scripts/note/restore-from-r2.sh <slug>\`"
          } >> "$GITHUB_STEP_SUMMARY"
