name: 📸 Instagram scheduled post (daily)

# Phase 9 後続 (2026-04-26): IG Graph API は scheduled_publish_time 非対応のため、
# GitHub Actions cron で post-instagram (即時 API) を発火する形で予約投稿を代替。
# 投稿対象は .claude/state/instagram-w*-schedule.json (当日を含む週ファイルを自動選択) の
# today (JST) エントリ。1 日複数本対応 (2026-07-11〜): cron を 3 回発火し、各実行が
# 「time <= 現在時刻 かつ未投稿」の最早 1 件だけを投稿する (ig-posted-log で二重投稿防止)。
# 該当なしなら exit 0 で何もしない。投稿成功時は #127 に結果コメント投稿。

on:
  schedule:
    - cron: "3 23 * * *" # 08:03 JST (UTC 前日 23:03)
    - cron: "3 3 * * *" # 12:03 JST (UTC 03:03)
    - cron: "3 10 * * *" # 19:03 JST (UTC 10:03)
  workflow_dispatch:
    inputs:
      force_date:
        description: "JST 日付を強制指定 (YYYY-MM-DD)、空なら今日"
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: post-instagram-scheduled
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 🧰 Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: 📸 Post to Instagram (if today is scheduled)
        id: post
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          IG_FORCE_DATE: ${{ inputs.force_date }}
        run: |
          set -o pipefail
          node .claude/scripts/instagram/post-from-schedule.cjs 2>&1 | tee /tmp/post-output.log
          PERMALINK=$(grep -oE 'PERMALINK=https?://[^ ]+' /tmp/post-output.log | head -1 | cut -d= -f2- || echo "")
          KEY=$(grep -oE 'content_key":"[^"]+' /tmp/post-output.log | head -1 | cut -d'"' -f3 || echo "")
          DATE=$(grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' /tmp/post-output.log | head -1 || echo "")
          DOMAIN=$(grep -oE 'DOMAIN=[a-z0-9-]+' /tmp/post-output.log | head -1 | cut -d= -f2 || echo "")
          # SKIP: PERMALINK が取れていれば投稿あり(0)、なければスキップ(1)。
          # grep -c で日本語パターンを使うと Ubuntu runner (C locale) でマルチライン出力になり
          # GITHUB_OUTPUT に bare '0' が書き込まれて Invalid format エラーになる。
          if [ -n "${PERMALINK}" ]; then SKIP=0; else SKIP=1; fi
          echo "permalink=${PERMALINK}" >> "$GITHUB_OUTPUT"
          echo "content_key=${KEY}" >> "$GITHUB_OUTPUT"
          echo "post_date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "domain=${DOMAIN}" >> "$GITHUB_OUTPUT"
          echo "skipped=${SKIP}" >> "$GITHUB_OUTPUT"

      - name: 📝 Append to ig-posted-log
        if: success() && steps.post.outputs.permalink != ''
        run: |
          POSTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "{\"date\":\"${{ steps.post.outputs.post_date }}\",\"domain\":\"${{ steps.post.outputs.domain }}\",\"content_key\":\"${{ steps.post.outputs.content_key }}\",\"permalink\":\"${{ steps.post.outputs.permalink }}\",\"posted_at\":\"${POSTED_AT}\"}" \
            >> .claude/state/ig-posted-log.jsonl
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .claude/state/ig-posted-log.jsonl
          git commit -m "chore(ig): mark ${{ steps.post.outputs.content_key }} as posted [skip ci]"
          git push origin main

      - name: 💬 Comment posting result on issue #127
        if: success() && steps.post.outputs.permalink != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const date = "${{ steps.post.outputs.post_date }}";
            const key = "${{ steps.post.outputs.content_key }}";
            const permalink = "${{ steps.post.outputs.permalink }}";
            const body = `## 📸 IG 投稿成功 — ${date}\n\n- **content_key**: \`${key}\`\n- **permalink**: ${permalink}\n- **workflow run**: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n_自動 post by post-instagram-scheduled.yml_`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 127,
              body,
            });

      - name: 💬 Comment skipped on issue #127 (skip 時はサイレント)
        if: success() && steps.post.outputs.skipped != '0'
        run: echo "今日は投稿予定なし、issue コメントはスキップ"

      - name: 💬 Comment failure on issue #127
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const date = process.env.IG_FORCE_DATE || new Date(Date.now() + 9*3600*1000).toISOString().slice(0, 10);
            const body = `## ❌ IG 投稿失敗 — ${date}\n\n- **workflow run**: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n- ログを確認して手動 post-instagram で復旧してください\n\n_自動 post by post-instagram-scheduled.yml_`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 127,
              body,
            });
        env:
          IG_FORCE_DATE: ${{ inputs.force_date }}

      - name: 📄 Step Summary
        if: always()
        run: |
          echo "# Instagram Scheduled Post — $(TZ=Asia/Tokyo date +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- content_key: ${{ steps.post.outputs.content_key }}" >> $GITHUB_STEP_SUMMARY
          echo "- permalink: ${{ steps.post.outputs.permalink }}" >> $GITHUB_STEP_SUMMARY
          echo "- skipped: ${{ steps.post.outputs.skipped }}" >> $GITHUB_STEP_SUMMARY
