name: 🔄 Data Refresh (e-Stat → R2)

# クラウド/CI から e-Stat 観測値を更新する workflow。完全DBレス (doc 12)。
#
# パイプライン (R2 直結・永続/ビルド DB を SSOT にしない):
#   1. page-data-batch: e-Stat → .local/r2/app/stats/<metric>/{values,cities}.json (R2 直書き)
#   2. diff-push-r2 --prefix app/stats: 観測値を R2 に push
#   3. sync-snapshots run.sh: 派生 snapshot (master / ranking-values / area-profile 等) を
#      git TS + R2 観測値から再生成 → R2 push。exporter は .local/r2 (本 run で更新済) を
#      公開 URL より優先して読むため、同一 job 内で最新観測値を反映できる。
#
# ※ 旧 db:pull/db:push (ビルド DB round-trip) は廃止。観測値も exporter も DB を読まない
#   (page-data-batch / export-master-snapshots / generate-ranking-items / area-profile は
#   いずれも R2 + git TS 直結)。build DB pull は remotion-static 等 一部 task の保険として
#   best-effort で残す (失敗しても続行)。SSOT は git TS と R2 のみ。
#
# R2 書き込みはこの CI / クラウド専用 (_assert-ci-write ガードでローカル push は停止)。
#
# 動作確認: workflow_dispatch + dry_run=true で fetch のみ実行し、その後 dry_run=false で
#   1 metric (例 metric=japanese-population) を実 push 確認してから schedule を信頼すること。

on:
  workflow_dispatch:
    inputs:
      metric:
        description: "更新する metric key (空なら全 metric)"
        required: false
        default: ""
      since:
        description: "差分取得の起点 (YYYY-MM-DD、空なら全期間)"
        required: false
        default: ""
      dry_run:
        description: "true: fetch のみで R2 に書き込まない (手動実行の既定)"
        required: false
        default: "true"
  # 毎月 5日 03:00 UTC (= 12:00 JST) に全 metric を refresh。schedule 実行は
  # inputs が空 → 全 metric・実 push (dry_run 既定 'true' は workflow_dispatch のみ適用)。
  schedule:
    - cron: "0 3 5 * *"

permissions:
  contents: read

concurrency:
  # sync-snapshots.yml と同じ group で R2 push を直列化 (同時 push による破損防止)。
  group: r2-write
  cancel-in-progress: false

env:
  # diff-push-r2.ts が要求する R2 S3 認証 (CLOUDFLARE_* secrets から導出)
  R2_S3_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
  R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
  CLOUDFLARE_R2_BUCKET_NAME: stats47
  # exporter の R2 観測値読み取りは公開 URL 経由 (認証不要・ビルド DB 非依存)
  R2_PUBLIC_FETCH_URL: https://storage.stats47.jp
  NEXT_PUBLIC_ESTAT_APP_ID: ${{ secrets.NEXT_PUBLIC_ESTAT_APP_ID }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 🧰 Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      # 一部 task (remotion-static 等) が読むビルド DB を R2 から取得 (read-only / best-effort)。
      # DBレスで不要になった観測値・ranking 系 exporter には影響しないため、不在でも続行する。
      - name: ⬇️ Pull build DB (best-effort)
        continue-on-error: true
        run: npm run db:pull --workspace=packages/r2-storage

      # e-Stat → .local/r2/app/stats (観測値 R2 直書き)。dry_run=true なら fetch のみ。
      - name: 📊 page-data-batch (e-Stat fetch)
        run: |
          # ARGS は配列で組む ("$ARGS" 単一引数渡しは 1 トークン化する — ARG_VECTOR_QUOTED)
          ARGS=()
          [ -n "${{ inputs.metric }}" ] && ARGS+=(--metric "${{ inputs.metric }}")
          [ -n "${{ inputs.since }}" ] && ARGS+=(--since "${{ inputs.since }}")
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS+=(--dry-run)
          echo "page-data-batch.ts ${ARGS[*]}"
          npx tsx packages/data-configs/scripts/page-data-batch.ts "${ARGS[@]}"

      # 観測値を R2 に push (app/stats)。schedule 実行 (inputs.dry_run='') では push される。
      - name: ☁️ Push observations to R2 (app/stats)
        if: inputs.dry_run != 'true'
        run: npx tsx packages/r2-storage/src/scripts/diff-push-r2.ts --prefix app/stats

      # 派生 snapshot (master / ranking-values / area-profile 等) を git TS + 更新済観測値から
      # 再生成 → R2 push (run.sh は CI=true で push する)。
      # ※ correlation snapshot の生成 task は run.sh から廃止済 (producer 未実装)。観測値更新後も
      #   app/correlation/* は再生成されない (別途エフェメラル計算の実装が必要 / 機能バックログ)。
      - name: 🗂️ Regenerate derived snapshots + push to R2
        if: inputs.dry_run != 'true'
        run: bash .claude/skills/db/sync-snapshots/run.sh
