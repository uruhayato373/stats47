name: 🔄 Data Refresh (e-Stat → R2)

# クラウド/CI から e-Stat 観測値を更新する workflow。完全DBレス (doc 12)。
#
# パイプライン (R2 直結・永続/ビルド DB を SSOT にしない):
#   1. page-data-batch: e-Stat → .local/r2/app/stats/<metric>/{values,cities}.json (R2 直書き)
#   2. diff-push-r2 --prefix app/stats: 観測値を R2 に push
#   3. sync-snapshots run.sh: 派生 snapshot (master / ranking-values / area-profile 等) を
#      git TS + R2 観測値から再生成 → R2 push。CI reader はS3から更新済観測値を読む。
#   snapshot_scope=ranking は指定1〜50件の都道府県stats/item/values/正規化値と
#   全件ranking-items索引だけを更新。master/area-profile/correlation等は更新しない。
#
# ※ 旧 db:pull/db:push (ビルド DB round-trip) は廃止。観測値も exporter も DB を読まない
#   (page-data-batch / export-master-snapshots / generate-ranking-items / area-profile は
#   いずれも R2 + git TS 直結)。SSOT は git TS と R2 のみ。
#
# R2 書き込みはこの CI / クラウド専用 (_assert-ci-write ガードでローカル push は停止)。
#
# 動作確認: workflow_dispatch + dry_run=true で fetch のみ実行し、その後 dry_run=false で
#   1 metric (例 metric=japanese-population) を実 push 確認してから schedule を信頼すること。
#
# 発火経路は 3 つ:
#   1. push (cloud 用・2026-07-30 追加): develop に data/data-refresh-requests.json を
#      commit/push → 本 workflow が実行 → 消費した request を git rm で commit-back [skip ci]。
#      cloud セッションは actions:write が無く workflow_dispatch 不可 (403) のため。
#      gemini-image-run.yml と同じ方式。
#   2. workflow_dispatch (ローカル): metric/since/dry_run を入力して手動実行
#   3. schedule (毎月): 全 metric を実 push
#
# request file 形式 (data/data-refresh-requests.json):
#   { "metric": "vacant-housing-rate,wooden-housing-ratio", "since": "", "dryRun": false,
#     "migrateLegacyRecipes": false, "snapshotScope": "all" }
#   - metric: 空なら全 metric (2,295 件・60 分では終わらない可能性があるので通常は指定する)
#   - dryRun: true = fetch と形状検証のみ (R2 に書かない)
#   - allowEmpty: 0 件 fatal を警告に落とす key (カンマ区切り)。★下記の注意を読むこと
#
# ★allowEmpty の位置づけ (2026-07-31 追加)
#   0 件 metric があると batch は fatal で止まり、**成功した 2,000 件超の push まで巻き添えで
#   止まる**。実際に 58 件の 0 件で全体が止まり、R2 更新が 1 件も進まなかった。
#   allowEmpty はその 1 回だけ fatal を警告に落として残りを通すためのもので、
#   **データ破壊の防止とは別の仕組み**:
#     - 「既存データを 0 件で上書きしない」保護は metric ごとに常時働く (allowEmpty でも無効化されない)
#     - allowEmpty が落とすのは「未登録の 0 件があったら全体を止める」という一括ゲートだけ
#   request file は消費されるので効果はその run 限り。恒久的に 0 件が正しいなら
#   expected-empty.ts の EXPECTED_EMPTY に理由・追跡先・期限を添えて登録する。
#   **0 件の原因調査を省略する口実に使わない** (使うたびに未修正の defect が残っている)。

on:
  push:
    branches: [develop]
    paths: ['data/data-refresh-requests.json']
  workflow_dispatch:
    inputs:
      metric:
        description: "更新する metric key (空なら全 metric)"
        required: false
        default: ""
      snapshot_scope:
        description: "派生更新範囲。ranking: 指定1〜50件の都道府県rankingと全件索引のみ"
        required: false
        default: all
        type: choice
        options: [all, ranking]
      since:
        description: "差分取得の起点 (YYYY-MM-DD、空なら全期間)"
        required: false
        default: ""
      allow_empty:
        description: "0 件 fatal を警告に落とす key (カンマ区切り)。原因調査の代わりにしない"
        required: false
        default: ""
      dry_run:
        description: "true: fetch のみで R2 に書き込まない (手動実行の既定)"
        required: false
        default: "true"
      migrate_legacy_recipes:
        description: "true: hash固定済みの旧stats 31件へrecipeを移行する (一回限り)"
        required: false
        default: false
        type: boolean
  # 毎月 5日 03:00 UTC (= 12:00 JST) に全 metric を refresh。schedule 実行は
  # inputs が空 → 全 metric・実 push (dry_run 既定 'true' は workflow_dispatch のみ適用)。
  schedule:
    - cron: "0 3 5 * *"

permissions:
  # push トリガー時に consume commit-back するため write が要る
  contents: write
  # 失敗時に Issue を起票するため (2026-07-31 追加。下の「失敗を通知する」参照)
  issues: write

concurrency:
  # sync-snapshots.yml と同じ group で R2 push を直列化 (同時 push による破損防止)。
  group: r2-write
  cancel-in-progress: false

env:
  # diff-push-r2.ts が要求する R2 S3 認証 (CLOUDFLARE_* secrets から導出)
  R2_S3_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
  R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
  CLOUDFLARE_R2_BUCKET_NAME: stats47
  # exporter の R2 観測値読み取りは公開 URL 経由 (認証不要・ビルド DB 非依存)
  R2_PUBLIC_FETCH_URL: https://storage.stats47.jp
  NEXT_PUBLIC_ESTAT_APP_ID: ${{ vars.NEXT_PUBLIC_ESTAT_APP_ID }}
  WORKER_CACHE_PURGE_SECRET: ${{ secrets.WORKER_CACHE_PURGE_SECRET }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 全 metric (2,295 件) の実 push は e-Stat fetch + 派生 snapshot 再生成で 60 分に収まらない。
    # 2026-07-05 の月次は 42 分で correlation OOM 死しており、その先の所要は未計測。
    # GitHub hosted の上限 360 分の範囲で余裕を取る (metric 指定の部分更新は従来どおり数分で終わる)。
    timeout-minutes: 180
    steps:
      # push トリガーは develop (request file がそこにある)。
      # dispatch / schedule は従来どおり main (本番と同じ config で走らせる)。
      - name: 🧰 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || 'main' }}
          fetch-depth: 1

      # request file と workflow_dispatch inputs を 1 か所に統合する。
      # 以降のステップは REFRESH_* だけを見る (発火経路ごとの分岐を散らさない)。
      - name: 🧭 Resolve inputs
        id: resolve
        # ★inputs は env 経由で受ける。`${{ inputs.x }}` を run: の中に直接展開すると
        #   dispatch 時の入力がシェルとして評価される (Actions の式インジェクション。
        #   CodeQL が critical で検出)。env に置けば値は環境変数として渡るだけになる。
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_METRIC: ${{ inputs.metric }}
          INPUT_SNAPSHOT_SCOPE: ${{ inputs.snapshot_scope }}
          INPUT_SINCE: ${{ inputs.since }}
          INPUT_ALLOW_EMPTY: ${{ inputs.allow_empty }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_MIGRATE_LEGACY_RECIPES: ${{ inputs.migrate_legacy_recipes }}
        run: |
          REQ=data/data-refresh-requests.json
          if [ "$EVENT_NAME" = "push" ] && [ -f "$REQ" ]; then
            METRIC=$(node -e "const r=require('./$REQ');process.stdout.write(String(r.metric??''))")
            SNAPSHOT_SCOPE=$(node -e "const r=require('./$REQ');process.stdout.write(String(r.snapshotScope??'all'))")
            SINCE=$(node -e "const r=require('./$REQ');process.stdout.write(String(r.since??''))")
            ALLOW_EMPTY=$(node -e "const r=require('./$REQ');process.stdout.write(String(r.allowEmpty??''))")
            DRY=$(node -e "const r=require('./$REQ');process.stdout.write(r.dryRun===true?'true':'false')")
            MIGRATE_LEGACY_RECIPES=$(node -e "const r=require('./$REQ');process.stdout.write(r.migrateLegacyRecipes===true?'true':'false')")
          elif [ "$EVENT_NAME" = "push" ]; then
            # ★request file が無い push (= request の削除 commit) で本体を走らせない (2026-08-03)。
            #   ここは以前 workflow_dispatch 用の else に落ちていた。push イベントに inputs は
            #   無いので METRIC="" (全 2,295 metric)・DRY="" (≠true = 実 push) となり、
            #   **request を消すだけの commit が本番 R2 の全件更新を起動する**。
            #   consume step は [skip ci] を付けるので普段は発火しないが、人がファイルを消した
            #   瞬間に 180 分の全件 refresh が走る。要求が無いので何もしないのが正しい。
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "request file が無い push (削除 commit) のため何もしない"
            exit 0
          else
            METRIC="$INPUT_METRIC"
            SNAPSHOT_SCOPE="${INPUT_SNAPSHOT_SCOPE:-all}"
            SINCE="$INPUT_SINCE"
            ALLOW_EMPTY="$INPUT_ALLOW_EMPTY"
            DRY="$INPUT_DRY_RUN"
            MIGRATE_LEGACY_RECIPES="$INPUT_MIGRATE_LEGACY_RECIPES"
          fi
          case "$SNAPSHOT_SCOPE" in
            all|ranking) ;;
            *) echo 'snapshot_scope must be all or ranking' >&2; exit 1 ;;
          esac
          # ranking入力はGITHUB_OUTPUTへ渡す前にも形式を限定する。
          if [ "$SNAPSHOT_SCOPE" = "ranking" ] && ! [[ "$METRIC" =~ ^[a-z0-9]+(-[a-z0-9]+)*(,[a-z0-9]+(-[a-z0-9]+)*)*$ ]]; then
            echo 'ranking scope requires explicit comma-separated metric keys' >&2
            exit 1
          fi
          {
            echo "metric=$METRIC"
            echo "snapshot_scope=$SNAPSHOT_SCOPE"
            echo "since=$SINCE"
            echo "allow_empty=$ALLOW_EMPTY"
            echo "dry_run=$DRY"
            echo "migrate_legacy_recipes=$MIGRATE_LEGACY_RECIPES"
          } >> "$GITHUB_OUTPUT"
          echo "解決: metric='$METRIC' since='$SINCE' dry_run='$DRY'"
          # allowEmpty は「未修正の 0 件を通した」証跡なので件数を必ず残す
          if [ -n "$ALLOW_EMPTY" ]; then
            n=$(echo "$ALLOW_EMPTY" | tr ',' '\n' | grep -c . || true)
            echo "::warning::allowEmpty: ${n} 件の 0 件 metric を警告に降格した (原因は未修正のまま)"
          fi

      - name: 🟢 Setup Node.js
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        if: steps.resolve.outputs.skip != 'true'
        run: npm ci

      - name: 🔎 Validate ranking refresh scope
        if: steps.resolve.outputs.skip != 'true'
        env:
          SNAPSHOT_SCOPE: ${{ steps.resolve.outputs.snapshot_scope }}
          REFRESH_METRIC: ${{ steps.resolve.outputs.metric }}
          REFRESH_SINCE: ${{ steps.resolve.outputs.since }}
          REFRESH_ALLOW_EMPTY: ${{ steps.resolve.outputs.allow_empty }}
          MIGRATE_LEGACY_RECIPES: ${{ steps.resolve.outputs.migrate_legacy_recipes }}
        run: |
          [ "$SNAPSHOT_SCOPE" = "ranking" ] || exit 0
          if [ -n "$REFRESH_SINCE" ] || [ -n "$REFRESH_ALLOW_EMPTY" ] || [ "$MIGRATE_LEGACY_RECIPES" = "true" ]; then
            echo 'ranking scope requires full fetch without allow_empty; 互換recipeの移行と併用不可' >&2
            exit 1
          fi
          npx tsx -e '
            const { getMetricConfig } = require("@stats47/data-configs");
            const { GONE_RANKING_KEYS } = require("./packages/ranking/src/config/gone-ranking-keys.ts");
            const keys = process.env.REFRESH_METRIC.split(",");
            if (keys.length > 50 || new Set(keys).size !== keys.length) throw new Error("Expected 1-50 unique metric keys");
            for (const key of keys) {
              if (!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(key)) throw new Error("Invalid metric key: " + key);
              const config = getMetricConfig(key);
              if (!config?.isActive || !config.entities.includes("prefecture") || GONE_RANKING_KEYS.has(key)) throw new Error("Not an active prefecture ranking: " + key);
              if (config.source.kind !== "estat" && config.source.kind !== "kakei-chousa") throw new Error("No e-Stat fetch path: " + key);
            }
            console.log("Validated ranking refresh scope: " + keys.length);
          '

      # e-Stat → .local/r2/app/stats (観測値 R2 直書き)。dry_run=true なら fetch のみ。
      # ★ゲートで落ちても「取り込みに成功した分」は push させる (partial-publish)。
      #   以前は 1 件でもゲートに掛かると exit 1 → 後続の push が skip され、
      #   **正常に取り込んだ 2,000 件超が一度も R2 へ届かなかった** (2026-08-16 の実測では
      #   ok=2175 / shape=4 で全滅)。壊れた metric はそもそもローカルに書かれず
      #   (`writable = notEmpty && shapeOk`)、diff-push は upload-only で R2 を削除しないため、
      #   部分 push で壊れたデータが配信されることはない。
      #   run 自体は最後の「ゲート結果を job に反映」で赤にするので、欠陥は見逃さない。
      - name: 📊 page-data-batch (e-Stat fetch)
        id: batch
        continue-on-error: true
        if: steps.resolve.outputs.skip != 'true'
        env:
          SNAPSHOT_SCOPE: ${{ steps.resolve.outputs.snapshot_scope }}
          REFRESH_METRIC: ${{ steps.resolve.outputs.metric }}
          REFRESH_SINCE: ${{ steps.resolve.outputs.since }}
          REFRESH_ALLOW_EMPTY: ${{ steps.resolve.outputs.allow_empty }}
          REFRESH_DRY_RUN: ${{ steps.resolve.outputs.dry_run }}
        run: |
          # ARGS は配列で組む ("$ARGS" 単一引数渡しは 1 トークン化する — ARG_VECTOR_QUOTED)
          ARGS=()
          [ -n "$REFRESH_METRIC" ] && ARGS+=(--metric "$REFRESH_METRIC")
          [ -n "$REFRESH_SINCE" ] && ARGS+=(--since "$REFRESH_SINCE")
          [ -n "$REFRESH_ALLOW_EMPTY" ] && ARGS+=(--allow-empty "$REFRESH_ALLOW_EMPTY")
          [ "$REFRESH_DRY_RUN" = "true" ] && ARGS+=(--dry-run)
          [ "$SNAPSHOT_SCOPE" = "ranking" ] && ARGS+=(--kind prefecture)
          echo "page-data-batch.ts ${ARGS[*]}"
          npx tsx packages/data-configs/scripts/page-data-batch.ts "${ARGS[@]}"

      # recipe導入前に公開された31 payloadだけを、2026-08-27に固定した行SHA-256と
      # 完全一致した場合に限ってlocal stagingへ移す。値とgeneratedAtは変えない。
      # 通常runでは動かさず、request/inputで明示した一回限りの移行に限定する。
      - name: 🧬 Migrate reviewed compatibility recipe metadata
        if: steps.resolve.outputs.skip != 'true' && steps.resolve.outputs.dry_run != 'true' && steps.resolve.outputs.migrate_legacy_recipes == 'true'
        run: npm run migrate:reviewed-recipes:stage --workspace packages/stats-r2

      # 観測値を R2 に push (app/stats)。schedule 実行 (inputs.dry_run='') では push される。
      - name: ☁️ Push observations to R2 (app/stats)
        if: steps.resolve.outputs.skip != 'true' && (steps.resolve.outputs.dry_run != 'true')
        env:
          SNAPSHOT_SCOPE: ${{ steps.resolve.outputs.snapshot_scope }}
          REFRESH_METRIC: ${{ steps.resolve.outputs.metric }}
          BATCH_OUTCOME: ${{ steps.batch.outcome }}
        run: |
          if [ "$SNAPSHOT_SCOPE" = "ranking" ]; then
            test "$BATCH_OUTCOME" = "success" || { echo 'Scoped fetch failed; no observations published' >&2; exit 1; }
            # 全対象の取得成功とstagingの完全一致を、最初のPUTより前に検査する。
            node -e '
              const fs = require("node:fs");
              const keys = process.env.REFRESH_METRIC.split(",");
              const base = ".local/r2/app/stats";
              if (JSON.stringify(fs.readdirSync(base).sort()) !== JSON.stringify([...keys].sort())) throw new Error("Unexpected stats scope");
              for (const key of keys) {
                const dir = base + "/" + key;
                if (JSON.stringify(fs.readdirSync(dir)) !== JSON.stringify(["values.json"])) throw new Error("Unexpected stats files: " + key);
                const data = JSON.parse(fs.readFileSync(dir + "/values.json", "utf8"));
                if (data.metricKey !== key || data.entityKind !== "prefecture" || !data.rows?.length || data.meta?.rowCount !== data.rows.length || !data.meta?.recipe || !data.rows.some(row => Number.isFinite(row.value))) throw new Error("Empty/wrong stats: " + key);
              }
            '
            IFS=',' read -r -a KEYS <<< "$REFRESH_METRIC"
            for KEY in "${KEYS[@]}"; do
              npx tsx packages/r2-storage/src/scripts/diff-push-r2.ts --prefix "app/stats/$KEY/"
            done
          else
            npx tsx packages/r2-storage/src/scripts/diff-push-r2.ts --prefix app/stats
          fi

      # 派生 snapshot (master / ranking-values / area-profile 等) を git TS + 更新済観測値から
      # 再生成 → R2 push (run.sh は CI=true で push する)。
      # ※ correlation task は 2026-06-14 に復活済 (R2 観測値 → 使い捨て :memory: SQLite の
      #   エフェメラル producer)。上の「廃止済」記述は stale だったので 2026-07-31 に是正した。
      #
      # ★max-old-space-size 必須 (2026-07-05 障害の再発防止): 月次の全 metric refresh が
      #   correlation task で **JS ヒープ OOM** (4,051 MB で Mark-Compact 失敗) して落ちていた。
      #   全 metric の観測値を読んで総当たりで相関を出すため入力が大きい。runner (ubuntu-latest) は
      #   16 GB あるので既定の ~4 GB から引き上げる。**メモリ profile を直したわけではなく上限を
      #   上げただけ**なので、metric 数が増え続ければまた頭を打つ (その時は streaming 化が要る)。
      #
      # ★NODE_ENV=production 必須 (2026-07-27 障害の再発防止): run.sh の TSX ラッパ
      #   (packages/ranking/src/scripts/setup-cli.js) は NODE_ENV 未設定なら "development" を
      #   立てる。development だと packages/r2-storage の listFromR2 が S3 ではなく
      #   .local/r2 ローカル FS を列挙するため、item-metadata-refresh --apply が一部の
      #   item.json だけ (差分パッチ分) を staging に書いた直後に master export を走らせると
      #   「一部を全件」と誤認して home/featured.json 等が count:0 で R2 に上書きされる
      #   (この job は R2_ACCESS_KEY_ID 等 S3 認証を持つため、production にすれば S3 API 経由の
      #   一覧に切り替わる。既知の罠: memory project_kakei_expansion_pipeline_gotchas)。
      - name: 🗂️ Regenerate derived snapshots + push to R2
        if: steps.resolve.outputs.skip != 'true' && steps.resolve.outputs.dry_run != 'true' && steps.resolve.outputs.snapshot_scope != 'ranking'
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=8192
        run: bash .claude/skills/db/sync-snapshots/run.sh

      # statsのPUT完了後、production/S3 readで同じキーの配信用派生を生成する。
      # items --onlyでもall.jsonは全registryから生成される。索引を部分集合へ縮めない。
      - name: 🗂️ Regenerate scoped ranking snapshots + push to R2
        if: steps.resolve.outputs.skip != 'true' && steps.resolve.outputs.dry_run != 'true' && steps.resolve.outputs.snapshot_scope == 'ranking'
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=8192
          REFRESH_METRIC: ${{ steps.resolve.outputs.metric }}
        run: |
          npx tsx -r ./packages/ranking/src/scripts/setup-cli.js packages/ranking/src/scripts/generate-ranking-items.ts --only "$REFRESH_METRIC"
          npx tsx -r ./packages/ranking/src/scripts/setup-cli.js packages/ranking/src/scripts/generate-ranking-values.ts --only "$REFRESH_METRIC"
          npx tsx -r ./packages/ranking/src/scripts/setup-cli.js packages/ranking/src/scripts/generate-ranking-normalized-values.ts --only "$REFRESH_METRIC"
          npx tsx -r ./packages/ranking/src/scripts/setup-cli.js -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const { getMetricConfig, listAllMetrics } = require("@stats47/data-configs");
            const { GONE_RANKING_KEYS } = require("./packages/ranking/src/config/gone-ranking-keys.ts");
            const { activeNormalizationOptions } = require("./packages/ranking/src/scripts/generate-ranking-normalized-values.ts");
            const { rankingNormalizedValuesKeyPath } = require("./packages/ranking/src/types/snapshot.ts");
            const read = file => JSON.parse(fs.readFileSync(".local/r2/" + file, "utf8"));
            const sameKeys = (actual, expected) => JSON.stringify([...actual].sort()) === JSON.stringify([...expected].sort());
            const keys = process.env.REFRESH_METRIC.split(",");
            if (!sameKeys(fs.readdirSync(".local/r2/app/ranking"), keys)) throw new Error("Unexpected ranking scope");
            if (!sameKeys(fs.readdirSync(".local/r2/app/ranking-items"), ["all.json"])) throw new Error("Unexpected index staging");
            const all = read("app/ranking-items/all.json");
            const expected = listAllMetrics().filter(c => c.entities.includes("prefecture") && !GONE_RANKING_KEYS.has(c.key)).map(c => c.key);
            if (all.count !== expected.length || !Array.isArray(all.items) || !sameKeys(all.items.map(item => item.rankingKey), expected)) throw new Error("Incomplete all.json inventory");
            for (const key of keys) {
              const config = getMetricConfig(key);
              const options = activeNormalizationOptions(config);
              const files = ["item.json", "values.json", ...options.map(option => path.basename(rankingNormalizedValuesKeyPath(key, option.type))), ...(options.length ? ["national-trend.json"] : [])];
              if (!sameKeys(fs.readdirSync(".local/r2/app/ranking/" + key), files)) throw new Error("Incomplete/unexpected ranking files: " + key);
              const item = read("app/ranking/" + key + "/item.json").item;
              if (item?.rankingKey !== key || !item.latestYear || !sameKeys(item.availableYears.map(year => year.yearCode), [...new Set(read("app/stats/" + key + "/values.json").rows.map(row => row.yearCode))])) throw new Error("Wrong item years: " + key);
              if (JSON.stringify(all.items.find(entry => entry.rankingKey === key)) !== JSON.stringify(item)) throw new Error("Item/index mismatch: " + key);
              for (const file of files.filter(file => file !== "item.json")) {
                const data = read("app/ranking/" + key + "/" + file);
                if (data.rankingKey !== key || data.areaType !== "prefecture") throw new Error("Wrong snapshot identity: " + key + "/" + file);
                const rows = file === "national-trend.json" ? data.series?.flatMap(series => series.points) : data.partitions?.flatMap(partition => partition.values);
                if (!rows?.length) throw new Error("Empty snapshot: " + key + "/" + file);
                if (rows.some(row => row.yearName !== row.yearCode + (config.yearFormat === "fiscal" ? "年度" : "年"))) throw new Error("Stale year labels: " + key + "/" + file);
              }
            }
            console.log("Validated full inventory and scoped ranking files: " + keys.length);
          '
          IFS=',' read -r -a KEYS <<< "$REFRESH_METRIC"
          for KEY in "${KEYS[@]}"; do
            npx tsx packages/r2-storage/src/scripts/diff-push-r2.ts --prefix "app/ranking/$KEY/"
          done
          npx tsx packages/r2-storage/src/scripts/diff-push-r2.ts --prefix app/ranking-items/

      - name: 🧹 Purge Workers Cache after snapshot refresh
        if: steps.resolve.outputs.skip != 'true' && (steps.resolve.outputs.dry_run != 'true')
        run: npx tsx packages/r2-storage/src/scripts/purge-worker-cache.ts --all

      # producer が成功しても公開 R2 の item/values、theme 参照、blog asset の契約が
      # 壊れていないとは限らない。cache purge 後の live 配信を同じ横断監査で確認する。
      # Issue 起票と request 消費を通すため一旦 continue し、末尾で job を赤へ戻す。
      - name: 🌐 Audit public data contracts after refresh
        id: public_contract
        if: steps.resolve.outputs.skip != 'true' && (steps.resolve.outputs.dry_run != 'true')
        continue-on-error: true
        run: npm run audit:public-data-contract

      # 形状 allowlist の**縮小だけ**を自動反映する。
      #
      # 再取得で直った metric を allowlist に残すと、その key ではゲートが黙るので
      # 次の退行を見逃す。逆に「増やす」方向を自動化すると壊れたデータを自動で
      # 追認してしまうため、**現行リストの部分集合になったときだけ** commit-back する。
      - name: 🔻 Shrink shape allowlist (縮小時のみ commit-back)
        if: steps.resolve.outputs.skip != 'true' && steps.resolve.outputs.snapshot_scope != 'ranking' && (steps.resolve.outputs.dry_run != 'true' && github.event_name != 'pull_request')
        continue-on-error: true
        run: npx tsx packages/data-configs/scripts/shrink-shape-allowlist.ts --apply

      # ★request は結果によらず必ず消費する (2026-08-03)。
      #   旧実装は成功時しか走らなかったため、2026-07-31 の失敗 run 30623199884 が request を
      #   develop に残し、**同内容を再 push しても diff が出ず paths フィルタに掛からない**状態に
      #   なった (実際に 3 日間放置され、オーナーが workflow_dispatch で手動実行して回避した)。
      #   残った request は「未処理の要求がある」ようにも見えて紛らわしい。
      #   allowlist の commit-back は成功時だけ (失敗 run の中途半端な状態を追認しない)。
      - name: 🧹 Consume request file (push イベント時のみ・commit-back)
        if: ${{ always() && github.event_name == 'push' }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch data/data-refresh-requests.json
          if [ "$JOB_STATUS" = "success" ]; then
            git add -A packages/data-configs/src/expected-shape-anomaly.ts || true
          fi
          if git diff --cached --quiet; then
            echo "commit する変更なし"
            exit 0
          fi
          git commit -q -m "chore(data): consume data-refresh request [skip ci]"
          # batch が tracked な state を書き換えて作業ツリーが汚れていると rebase が
          # "cannot pull with rebase: You have unstaged changes" で落ちる。消費に不要なので退避する。
          git stash push --include-untracked --quiet || true
          for _ in 1 2 3; do
            if git pull --rebase --quiet origin "${{ github.ref_name }}" \
              && git push origin "HEAD:${{ github.ref_name }}"; then
              echo "✅ request を消費した"
              exit 0
            fi
            sleep 5
          done
          echo "::error::request の消費に失敗した (同内容の再 push が発火しなくなる)"
          exit 1

  # ★失敗を通知する (2026-07-31 追加)
  #
  # 2026-07-05 の月次 full refresh は correlation task の JS ヒープ OOM で落ちたが、
  # **どこにも通知が無く Actions タブに赤が残るだけ**だった。この workflow は月次でしか
  # 走らないので、気づかなければ次の実行まで 1 ヶ月 R2 が更新されない。
  #
  # 他の定期 workflow (ranking-integrity-audit-weekly / ogp-image-audit-weekly /
  # cloudflare-usage-daily) は失敗時に Issue を起票しており、ここだけ欠けていた。同じ方式に揃える。
  #
  # 手動 dispatch の失敗は起票しない (人がその場で見ているため)。
      # push と派生生成を通したあとで、取り込みゲートの結果を job に反映する。
      # ここより前に置くと partial-publish の意味が無くなる (後続が skip される)。
      - name: 🔴 Reflect refresh gate result
        if: steps.batch.outcome == 'failure' || steps.public_contract.outcome == 'failure'
        env:
          BATCH_OUTCOME: ${{ steps.batch.outcome }}
          PUBLIC_CONTRACT_OUTCOME: ${{ steps.public_contract.outcome }}
        run: |
          if [ "$BATCH_OUTCOME" = "failure" ]; then
            echo "page-data-batch がゲートで落ちた。full scopeは成功分のみ公開、ranking scopeは公開停止。" >&2
            echo "ログの [fatal] 行とPush observations工程を確認して是正する。" >&2
          fi
          if [ "$PUBLIC_CONTRACT_OUTCOME" = "failure" ]; then
            echo "更新後の公開データ契約監査が落ちた。ranking / theme / blog の欠落を是正する。" >&2
          fi
          exit 1

      - name: 🚨 Open issue on failure (schedule / push のみ)
        if: failure() && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          TITLE="[Data Refresh Alert] e-Stat → R2 の更新が失敗した"
          {
            echo "## Data Refresh 失敗 ($DATE)"
            echo ""
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- trigger: \`${{ github.event_name }}\`"
            echo "- metric: \`${{ steps.resolve.outputs.metric }}\` (空 = 全 metric)"
            echo ""
            echo "R2 の配信データが更新されていません。**次の月次まで放置すると 1 ヶ月古いまま**になります。"
            echo ""
            echo "### 見るところ"
            echo ""
            echo "- \`page-data-batch\` で落ちた → e-Stat 側の障害か config の不正。**取り込みに"
            echo "  成功した分は既に R2 へ push 済み** (partial-publish)。落ちた metric は"
            echo "  ローカルにも書かれていないので既存 R2 が温存されており、配信は壊れていない"
            echo "- \`sync-snapshots\` で落ちた → 観測値の push は完了済み。派生 snapshot だけが古い。"
            echo "  2026-07-05 は correlation task で JS ヒープ OOM (4,051 MB)。heap は 8 GB へ"
            echo "  引き上げ済だが、metric 数が増えれば再発しうる (その時は streaming 化が要る)"
            echo ""
            echo "### 再実行"
            echo ""
            echo "\`data/data-refresh-requests.json\` を develop へ push するか、workflow_dispatch。"
            echo ""
            echo "正典: .claude/rules/metric-config-standards.md"
          } > /tmp/data-refresh-issue.md

          gh label create data-refresh-alert --description "e-Stat → R2 更新の失敗" --color "b60205" --force 2>/dev/null || true

          EXISTING=$(gh issue list --state open --label data-refresh-alert --search "\"[Data Refresh Alert]\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "$TITLE" --body-file /tmp/data-refresh-issue.md
          else
            gh issue create --title "$TITLE" --label "data-refresh-alert,auto-generated" --body-file /tmp/data-refresh-issue.md
          fi

      - name: ✅ Close recovered data refresh alert
        if: success() && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --state open --label data-refresh-alert --limit 100 --json number --jq '.[].number' |
            while read -r NUMBER; do
              gh issue close "$NUMBER" --reason completed \
                --comment "e-StatからR2への更新が正常完了したため自動Closeします。"
            done
