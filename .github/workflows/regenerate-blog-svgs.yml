name: 🎨 Regenerate Blog SVGs (svg-builder 経由・dark mode 付与)

# 公開済みブログ記事 (R2 app/blog/<slug>/data/*.json) の SVG を svg-builder で再生成する。
# Step 4 (blog-svg-chart-standards.md §10): ダークモード未対応 SVG を一括是正する。
#
# 仕組み:
#   1. R2 app/blog を .local/r2/app/blog にダウンロード (S3 list/get)
#   2. all.json の slug ごとに generate-article-charts.ts --base .local/r2/app/blog を実行
#      → data/*.json を入力に svg-builder で *.svg を再生成 (svgThemeStyle() 自動付与)
#      → data/*.json を持たない無意味名 SVG (inline-chart-N) は対象外 (手動 brushup が必要)
#   3. ギャラリー HTML を artifact として保存 (視覚レビュー用)
#   4. 再生成したSVG keyを列挙し、dry_run=false のときだけbytes差分をexact publish
#
# ⚠️ 視覚変更を伴う: svg-builder の bar chart は layout:"columns" (カード型2列ランキング、
#    順位バッジ+県名+値+横バー、960×N) が既定。旧 CLI の手書き2列とは座標・配色が異なる。
#    まず dry_run=true で artifact ギャラリーを確認してから本番 push すること。
#
# 使い方:
#   gh workflow run regenerate-blog-svgs.yml                          # dry-run 全件 (push しない)
#   gh workflow run regenerate-blog-svgs.yml -f slugs="slug-a slug-b" # 指定 slug のみ dry-run
#   gh workflow run regenerate-blog-svgs.yml -f dry_run=false         # 本番 push (全件)
#   gh workflow run regenerate-blog-svgs.yml -f slugs="slug-a" -f dry_run=false  # 指定 slug を本番反映
#   gh workflow run regenerate-blog-svgs.yml -f mode=scatter-canonical # 散布図71件 dry-run
#   gh workflow run regenerate-blog-svgs.yml -f mode=scatter-canonical -f dry_run=false # 同じ対象をR2反映
#   gh workflow run regenerate-blog-svgs.yml -f mode=source-repair -f source_repair_payload='<base64>'
#
# scatter-canonical は SVG だけでなく source.json も検査する。破損2件は一次ソースから
# data/source/article を復元し、旧5件は公開JSONと一次ソースの点集合が一致した場合だけ
# source.json を復旧する。key file に列挙した差分だけを R2 へ反映する。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'all: 全チャート / scatter-canonical: 散布図を正規化 / source-repair: source/data JSONをCAS復旧'
        required: false
        type: choice
        options:
          - all
          - scatter-canonical
          - source-repair
        default: 'all'
      slugs:
        description: 'all モードの対象 slug (スペース区切り)。空なら all.json の全 slug'
        required: false
        default: ''
      source_repair_payload:
        description: 'base64 JSON: [{slug,base,manifest,expectedSourceSha256?,data?,expectedDataSha256?}]'
        required: false
        default: ''
      dry_run:
        description: 'true: 再生成 + ギャラリーのみ (push しない) / false: R2 へ反映'
        required: false
        default: 'true'

permissions:
  contents: read

concurrency:
  group: r2-write
  cancel-in-progress: false

env:
  R2_S3_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
  R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
  CLOUDFLARE_R2_BUCKET_NAME: stats47
  R2_PUBLIC_FETCH_URL: https://storage.stats47.jp
  NEXT_PUBLIC_ESTAT_APP_ID: ${{ vars.NEXT_PUBLIC_ESTAT_APP_ID }}
  WORKER_CACHE_PURGE_SECRET: ${{ secrets.WORKER_CACHE_PURGE_SECRET }}

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 🧰 Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📥 Download blog data from R2 (app/blog)
        if: ${{ github.event.inputs.mode == 'all' || github.event.inputs.mode == 'source-repair' }}
        run: npx tsx packages/r2-storage/src/scripts/sync-download.ts --prefix app/blog

      - name: 🔎 Resolve target slugs
        if: ${{ github.event.inputs.mode == 'all' }}
        id: targets
        run: |
          SLUGS="${{ github.event.inputs.slugs }}"
          if [ -z "$SLUGS" ]; then
            # all.json から slug を抽出 (配列 or {articles:[]})
            SLUGS=$(node -e '
              const fs=require("fs");
              const p=".local/r2/app/blog/all.json";
              if(!fs.existsSync(p)){console.error("all.json not found");process.exit(1)}
              const j=JSON.parse(fs.readFileSync(p,"utf8"));
              const arr=Array.isArray(j)?j:(j.articles||j.items||[]);
              console.log(arr.map(a=>a.slug||a.id).filter(Boolean).join(" "));
            ')
          fi
          echo "list=$SLUGS" >> "$GITHUB_OUTPUT"
          echo "対象 slug 数: $(echo "$SLUGS" | wc -w)"

      - name: 🎨 Regenerate SVGs via svg-builder
        if: ${{ github.event.inputs.mode == 'all' }}
        run: |
          : > .local/generated-blog-svg-keys.txt
          OK=0; SKIP=0; FAIL=0
          for SLUG in ${{ steps.targets.outputs.list }}; do
            DIR=".local/r2/app/blog/$SLUG/data"
            if [ ! -d "$DIR" ] || [ -z "$(ls -A "$DIR"/*.json 2>/dev/null)" ]; then
              SKIP=$((SKIP+1)); continue
            fi
            if npx tsx .claude/scripts/blog/generate-article-charts.ts \
                 --base .local/r2/app/blog --slug "$SLUG" > /dev/null 2>&1; then
              OK=$((OK+1))
              find ".local/r2/app/blog/$SLUG" -type f -name '*.svg' -print \
                | sed 's#^\.local/r2/##' >> .local/generated-blog-svg-keys.txt
            else
              FAIL=$((FAIL+1)); echo "  ⚠️ regen failed: $SLUG"
            fi
          done
          sort -u -o .local/generated-blog-svg-keys.txt .local/generated-blog-svg-keys.txt
          echo "再生成: ok=$OK skip=$SKIP(no json) fail=$FAIL"
          echo "exact publish候補: $(wc -l < .local/generated-blog-svg-keys.txt)"
          if [ "$FAIL" -gt 0 ]; then
            echo "::error::SVG再生成に${FAIL}件失敗しました"
            exit 1
          fi

      - name: ⬜ Regenerate canonical scatter catalog
        if: ${{ github.event.inputs.mode == 'scatter-canonical' }}
        run: |
          npx tsx .claude/scripts/blog/rerender-scatter-canonical.mts \
            --key-file .local/generated-blog-svg-keys.txt
          COUNT=$(wc -l < .local/generated-blog-svg-keys.txt)
          echo "exact publish候補: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "散布図はすでに正規化済みです（R2更新なし）"
          fi

      - name: 🩹 Prepare source/data repairs with CAS
        if: ${{ github.event.inputs.mode == 'source-repair' }}
        env:
          SOURCE_REPAIR_PAYLOAD_B64: ${{ github.event.inputs.source_repair_payload }}
        run: |
          node --import tsx --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { inspectChartSourceManifest } from './.claude/scripts/lib/chart-provenance.mjs';
          import {
            parseSourceRepairPayload,
            resolveCasJsonWrite,
          } from './.claude/scripts/blog/lib/source-repair-core.mjs';

          const { METRICS_REGISTRY } = await import('@stats47/data-configs');
          const { resolveBlogChartSurveyTaxonomy } = await import(
            './packages/ranking/src/survey/survey-taxonomy.ts'
          );

          const encoded = process.env.SOURCE_REPAIR_PAYLOAD_B64 ?? '';
          const repairs = parseSourceRepairPayload(encoded, 40);
          const safeName = /^[a-z0-9][a-z0-9-]*$/;
          const keys = [];
          const actions = { create: 0, update: 0, unchanged: 0 };
          for (const repair of repairs) {
            if (!repair || !safeName.test(repair.slug) || !safeName.test(repair.base)) {
              throw new Error('slug/base は kebab-case 必須');
            }
            const verdict = inspectChartSourceManifest(repair.manifest);
            if (verdict.verdict === 'invalid') {
              throw new Error(`${repair.slug}/${repair.base}: ${verdict.detail}`);
            }
            const taxonomy = resolveBlogChartSurveyTaxonomy(repair.manifest, METRICS_REGISTRY);
            if (taxonomy.status === 'unresolved' || taxonomy.status === 'missing-lineage') {
              throw new Error(`${repair.slug}/${repair.base}: survey taxonomy ${taxonomy.status}`);
            }
            const dir = path.join('.local/r2/app/blog', repair.slug, 'data');
            const svg = path.join(dir, `${repair.base}.svg`);
            const target = path.join(dir, `${repair.base}.source.json`);
            const key = `app/blog/${repair.slug}/data/${repair.base}.source.json`;
            if (!fs.existsSync(svg)) throw new Error(`公開 SVG が無い: ${repair.slug}/${repair.base}`);
            const content = `${JSON.stringify(repair.manifest, null, 2)}\n`;
            const sourceResolution = resolveCasJsonWrite({
              currentContent: fs.existsSync(target) ? fs.readFileSync(target, 'utf8') : null,
              nextContent: content,
              expectedSha256: repair.expectedSourceSha256 ?? null,
              label: `${repair.slug}/${repair.base}.source.json`,
            });
            actions[sourceResolution.action] += 1;
            if (sourceResolution.action !== 'unchanged') {
              fs.writeFileSync(target, content);
            }
            keys.push(key);

            if (repair.data !== undefined) {
              if (!repair.data || typeof repair.data !== 'object') {
                throw new Error(`${repair.slug}/${repair.base}: data はobject/array必須`);
              }
              const dataTarget = path.join(dir, `${repair.base}.json`);
              const dataKey = `app/blog/${repair.slug}/data/${repair.base}.json`;
              const dataContent = `${JSON.stringify(repair.data, null, 2)}\n`;
              const dataResolution = resolveCasJsonWrite({
                currentContent: fs.existsSync(dataTarget)
                  ? fs.readFileSync(dataTarget, 'utf8')
                  : null,
                nextContent: dataContent,
                expectedSha256: repair.expectedDataSha256 ?? null,
                label: `${repair.slug}/${repair.base}.json`,
              });
              actions[dataResolution.action] += 1;
              if (dataResolution.action !== 'unchanged') {
                fs.writeFileSync(dataTarget, dataContent);
              }
              keys.push(dataKey);
            }
          }
          if (keys.length === 0) throw new Error('新規 repair 対象が0件');
          const uniqueKeys = [...new Set(keys)].sort();
          fs.writeFileSync('.local/generated-blog-svg-keys.txt', `${uniqueKeys.join('\n')}\n`);
          console.log(`source/data repair: keys=${uniqueKeys.length} actions=${JSON.stringify(actions)}`);
          NODE

      - name: 🖼️ Build review gallery (local)
        run: |
          node .claude/scripts/blog/build-svg-gallery.mjs --source local \
            --out /tmp/blog-svg-gallery.html

      - name: 📤 Upload gallery artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blog-svg-gallery
          path: /tmp/blog-svg-gallery.html
          if-no-files-found: warn

      - name: 📤 Push regenerated/repaired assets to R2 (本番時のみ)
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          KEY_FILE=".local/generated-blog-svg-keys.txt"
          if [ ! -s "$KEY_FILE" ]; then
            if [ "${{ github.event.inputs.mode }}" = "scatter-canonical" ]; then
              echo "散布図はすでに正規化済みです（R2更新なし）"
              exit 0
            fi
            echo "::error::R2 exact publish keyが0件です"
            exit 1
          fi
          ARGS=()
          COUNT=0
          while IFS= read -r KEY; do
            ARGS+=(--key "$KEY")
            COUNT=$((COUNT + 1))
            if [ "$COUNT" -eq 100 ]; then
              npx tsx packages/r2-storage/src/scripts/push-exact-r2-assets.ts "${ARGS[@]}"
              ARGS=()
              COUNT=0
            fi
          done < "$KEY_FILE"
          if [ "${#ARGS[@]}" -gt 0 ]; then
            npx tsx packages/r2-storage/src/scripts/push-exact-r2-assets.ts "${ARGS[@]}"
          fi

      - name: 🧮 Regenerate and publish blog survey index after source repair
        if: ${{ github.event.inputs.mode == 'source-repair' && github.event.inputs.dry_run == 'false' }}
        run: |
          # source.json を先に R2 へ反映済み。公開URLの404 cacheを踏まないよう S3 readを使い、
          # surveyIds / surveyArticleIndex を同じ導出coreで再生成する。
          R2_PUBLIC_FETCH_URL='' NODE_OPTIONS='--conditions react-server' \
            npx tsx apps/web/scripts/export-blog-snapshot.ts
          npx tsx packages/r2-storage/src/scripts/push-exact-r2-assets.ts --key app/blog/all.json

      - name: 🧹 Purge Workers data cache (本番時のみ)
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: npx tsx packages/r2-storage/src/scripts/purge-worker-cache.ts --data

      - name: 📝 Summary
        run: |
          {
            echo "### 🎨 Regenerate Blog SVGs"
            echo "- mode: \`${{ github.event.inputs.mode }}\`"
            echo "- dry_run: \`${{ github.event.inputs.dry_run }}\`"
            echo "- 対象 slug: \`${{ github.event.inputs.slugs || 'all' }}\`"
            echo "- ギャラリー: artifact \`blog-svg-gallery\` をダウンロードして視覚確認"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event.inputs.dry_run }}" != "false" ]; then
            echo "- ⚠️ dry-run のため R2 へは push していません" >> "$GITHUB_STEP_SUMMARY"
          fi
