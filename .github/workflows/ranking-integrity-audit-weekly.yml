name: 📊 Ranking Data Integrity Audit (weekly)

# ランキング配信 (R2) の実データ整合性を live 実測で週次検知する。read-only (R2 write なし)。
#
# 背景 (2026-07-27 実測): active な 2,179 ランキングのうち 67 件で
# `app/ranking/<key>/values.json` が 404 (公開以来ずっとチャートが空ページ)。残り約 2,112 件の
# values.json は 2026-05-27 (Phase 6) 以降 writer 不在で凍結された stale データ。item.json は
# fresh 生成されるため item.latestYear と values の最新年がズレうる。また `app/home/featured.json`
# が count:0 に汚染され category/survey の一部も同時に汚染された障害も過去にあった。
# いずれも 2 ヶ月間検知されなかった。本 workflow はこれを機械的に週次検知する。
#
# 別途 Phase C で values.json writer を復活させる予定だが、本監査はそれと独立に
# 「今の R2 の実態」を検査するもの (writer が直っても有効であり続ける)。
#
# 検査項目: item.json 実在 / values.json 実在 / item↔values 年整合 /
# home featured 件数 / survey・category snapshot の件数下限 (絶対フロア + 前回実行比ドリフト)。
#
# 正典: packages/ranking/src/scripts/audit-ranking-data-integrity.ts (実装コメント参照)

on:
  schedule:
    - cron: "30 19 * * 6" # 土 19:30 UTC = 日 04:30 JST (internal-link-audit 04:00 の後、他 cron と非重複)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ranking-integrity-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    # (i) 正典 app/stats の検査追加で GET が約 +2,179 本増えたため 20→30 (2026-07-29)
    timeout-minutes: 30
    steps:
      - name: 🧰 Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔎 Audit ranking data integrity
        id: check
        run: |
          set +e
          mkdir -p .claude/state/ranking
          npx tsx packages/ranking/src/scripts/audit-ranking-data-integrity.ts \
            --json .claude/state/ranking/integrity-audit.json \
            2>&1 | tee /tmp/ranking-integrity-audit.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # 「config は直っているのに配信データが古いまま」を列挙する (2026-07-31 追加)。
      #
      # 形状ゲート 3 層はどれも「いま R2 にあるデータが壊れている」しか言わず、config を是正しても
      # 再取り込みが走らなければ配信は古いまま。allowlist の until が来るまで誰も催促しない。
      # 検査(k) (レシピ整合) が同じ乖離を狙うが、レシピ導入前の payload は unbaked (残数) に落ちて
      # 発火しないため、recipe に依存しないこの検査で空白を埋める。
      #
      # 縮小専用ラチェット: 増えたときだけ失敗する。0 件でなければ失敗にすると恒久的に赤くなり
      # 無視されるため。
      - name: 🔁 Audit re-ingest queue (config 是正 vs 配信の乖離)
        id: reingest
        run: |
          set +e
          npx tsx packages/data-configs/scripts/audit-reingest-queue.ts --ratchet \
            2>&1 | tee /tmp/reingest-queue.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          {
            echo "### 再取り込みキュー"
            echo '```'
            head -20 /tmp/reingest-queue.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ★計算型 ranking の配信値が config から再計算した値と一致するか (2026-08-03 配線)。
      #   read-only。R2 を全件読むので数分かかり PR CI には重すぎるが、週次なら妥当。
      #   スクリプト自体は 2026-07-24 からあったのに、どこからも呼ばれていなかった。
      #   ここが壊れると per_capita / ratio / subtraction の配信値が静かにずれる。
      - name: 🧮 Verify calculated rankings
        id: calculated
        continue-on-error: true
        env:
          R2_PUBLIC_FETCH_URL: https://storage.stats47.jp
          NODE_OPTIONS: --conditions react-server
        run: |
          npx tsx packages/ranking/scripts/verify-calculated-rankings.ts 2>&1 \
            | tee /tmp/calculated-rankings.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          {
            echo "### 計算型 ranking の再計算突合"
            echo '```'
            tail -30 /tmp/calculated-rankings.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ranking / theme / blog が参照する公開 R2 契約を同じ live 実測で検査する。
      # 個別 producer の成功だけでは、values.json の欠落・theme の部分 fallback・
      # 記事本文だけが参照する SVG 欠落を横断検知できないため、週次の最終防波堤にする。
      - name: 🌐 Audit public data contracts
        id: public_contract
        continue-on-error: true
        env:
          R2_PUBLIC_FETCH_URL: https://storage.stats47.jp
        run: |
          set +e
          npm run audit:public-data-contract -- --json /tmp/public-data-contract.json \
            2>&1 | tee /tmp/public-data-contract.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          {
            echo "### 公開データ契約 (ranking / theme / blog)"
            echo '```'
            tail -30 /tmp/public-data-contract.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Commit audit result to develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude/state/ranking/integrity-audit.json .claude/state/data
          if git diff --cached --quiet; then
            echo "No audit changes"
            exit 0
          fi
          git commit -m "chore(ranking): weekly data integrity audit $(date -u +%Y-%m-%d) [skip ci]"
          # pull せずに push すると develop が進んだ瞬間に (fetch first) で落ちる (2026-08-16 是正)
          git pull --rebase origin develop
          git push origin develop

      - name: 📎 Upload public data contract report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-data-contract-${{ github.run_id }}
          path: /tmp/public-data-contract.json
          if-no-files-found: warn
          retention-days: 30

      - name: 🚨 Open issue on integrity violations
        if: steps.check.outputs.exit_code != '0' || steps.reingest.outputs.exit_code != '0' || steps.calculated.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          TITLE="[Ranking Alert] ランキングデータ整合性の異常"
          {
            echo "## ランキングデータ整合性 週次監査 ($DATE)"
            echo ""
            echo "R2 配信データの実態に異常を検出しました (read-only 監査。curl 相当の HEAD/GET のみ)。"
            echo ""
            echo '```'
            sed -n '/^## /,$p' /tmp/ranking-integrity-audit.log | head -80
            echo '```'
            if [ "${{ steps.calculated.outputs.exit_code }}" != "0" ]; then
              echo ""
              echo "### 計算型 ranking の再計算突合"
              echo '```'
              tail -40 /tmp/calculated-rankings.log 2>/dev/null || echo "(ログなし)"
              echo '```'
            fi
            echo ""
            echo "是正手順:"
            echo "- values.json 欠落 → Phase C の values writer 復活を待つか、個別に \`generate-ranking-values.ts\` で再生成"
            echo "- item↔values 年整合ズレ → item.json (fresh 生成) と values.json (stale) のどちらが正か確認して再生成"
            echo "- home/survey/category 件数の急減 → \`export-master-snapshots.ts\` の再生成漏れ・部分集合汚染を疑う"
            echo ""
            echo "詳細 (全件 JSON): \`.claude/state/ranking/integrity-audit.json\` (このコミットで develop に反映済み)"
            echo ""
            echo "### 再取り込みキュー"
            echo ""
            echo "「config は直っているのに配信データが古いまま」の metric。"
            echo "増えたときだけ失敗する (縮小専用ラチェット)。"
            echo ""
            echo '```'
            head -20 /tmp/reingest-queue.log
            echo '```'
            echo ""
            echo "- stale-delivery → 再取り込みで直る (\`page-data-batch.ts --metric <key>\`)"
            echo "- config-insufficient → 再取り込みでは直らない (\`diagnose-unpinned-axes.ts --fetch\` で軸を診断)"
            echo ""
            echo "詳細: \`.claude/state/data/LATEST.md\`"
            echo ""
            echo "正典: packages/ranking/src/scripts/audit-ranking-data-integrity.ts"
          } > /tmp/ranking-integrity-issue.md

          gh label create ranking-alert --description "ランキングデータ整合性の異常" --color "b60205" --force 2>/dev/null || true

          EXISTING=$(gh issue list --state open --label ranking-alert --search "\"[Ranking Alert]\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Existing open issue #$EXISTING — replacing with latest audit"
            gh issue edit "$EXISTING" --title "$TITLE" --body-file /tmp/ranking-integrity-issue.md
          else
            gh issue create --title "$TITLE" --label "ranking-alert,auto-generated" --body-file /tmp/ranking-integrity-issue.md
          fi

      - name: ✅ Close recovered ranking alert
        if: steps.check.outputs.exit_code == '0' && steps.reingest.outputs.exit_code == '0' && steps.calculated.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --state open --label ranking-alert --limit 100 --json number --jq '.[].number' |
            while read -r NUMBER; do
              gh issue close "$NUMBER" --reason completed \
                --comment "ランキング整合性監査と再取り込みラチェットがともに復旧したため自動Closeします。"
            done

      - name: 🚨 Open issue on public data contract violations
        if: always() && steps.public_contract.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          TITLE="[Public Data Contract Alert] blog・ranking・theme 配信契約の異常"
          {
            echo "## 公開データ契約 週次監査 ($DATE)"
            echo ""
            echo "公開 R2 を横断実測し、参照先の欠落・空データ・地域型不一致・部分 fallback を検出しました。"
            echo ""
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo '```'
            tail -80 /tmp/public-data-contract.log 2>/dev/null || echo "(監査ログなし)"
            echo '```'
            echo ""
            echo "全件 JSON: workflow artifact \`public-data-contract-${{ github.run_id }}\`"
            echo "正典: apps/web/scripts/audit-public-data-contract.ts"
          } > /tmp/public-data-contract-issue.md

          gh label create public-data-contract-alert \
            --description "blog / ranking / theme の公開R2契約違反" \
            --color "b60205" --force 2>/dev/null || true

          EXISTING=$(gh issue list --state open --label public-data-contract-alert \
            --search "\"[Public Data Contract Alert]\" in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "$TITLE" --body-file /tmp/public-data-contract-issue.md
          else
            gh issue create --title "$TITLE" \
              --label "public-data-contract-alert,auto-generated" \
              --body-file /tmp/public-data-contract-issue.md
          fi

      - name: ✅ Close recovered public data contract alert
        if: always() && steps.public_contract.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --state open --label public-data-contract-alert --limit 100 \
            --json number --jq '.[].number' |
            while read -r NUMBER; do
              gh issue close "$NUMBER" --reason completed \
                --comment "公開データ契約の横断監査が復旧したため自動Closeします。"
            done

      # continue-on-error は Issue 起票を必ず通すため。最後に job を赤へ戻して見逃さない。
      - name: 🚦 Reflect public data contract result
        if: always()
        env:
          PUBLIC_CONTRACT_EXIT: ${{ steps.public_contract.outputs.exit_code }}
        run: |
          if [ "${PUBLIC_CONTRACT_EXIT:-1}" != "0" ]; then
            echo "公開データ契約に違反がある。専用 Issue と監査ログを確認する。" >&2
            exit 1
          fi
