name: 🗂️ Sync Snapshots → R2

# git TS (data/page-components, affiliate-ads 等) / article.md / R2 観測値を入力に
# 配信 snapshot を再生成し R2 (app/) に push する手動 workflow。完全DBレス (doc12)。
#
# R2 書き込みはこの CI / クラウド専用 (ローカルからの push は _assert-ci-write ガードで停止)。
# ローカルは公開 URL 経由の読み取り専用。
#
# 使い方: Actions タブ → この workflow → Run workflow。
#   only=<task>   で 1 task だけ再生成 (例: page-components / blog / master)。空なら全 task。
#   dry_run=true  で生成のみ (R2 push しない) — 初回や確認時に推奨。

on:
  workflow_dispatch:
    inputs:
      only:
        description: '対象 task (空=全 task)。正典は run.sh の TASKS 配列 (.claude/skills/db/sync-snapshots/run.sh)。例: ranking-items / calculated-stats / ranking-values / ranking-normalized-values / master / page-components / blog / area-profile'
        required: false
        default: ''
      dry_run:
        description: 'true: 生成のみ (R2 push しない)'
        required: false
        default: 'false'

permissions:
  contents: write
  pull-requests: write

concurrency:
  # data-refresh.yml の push と衝突しないよう直列化 (R2 push の二重実行防止)
  group: r2-write
  cancel-in-progress: false

env:
  # diff-push-r2.ts が要求する R2 S3 認証 (CLOUDFLARE_* secrets から導出)
  R2_S3_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
  R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
  CLOUDFLARE_R2_BUCKET_NAME: stats47
  # exporter の R2 観測値読み取りは公開 URL 経由 (認証不要・SSD 非依存)
  R2_PUBLIC_FETCH_URL: https://storage.stats47.jp
  NEXT_PUBLIC_ESTAT_APP_ID: ${{ vars.NEXT_PUBLIC_ESTAT_APP_ID }}
  WORKER_CACHE_PURGE_SECRET: ${{ secrets.WORKER_CACHE_PURGE_SECRET }}

jobs:
  sync:
    # ★45 分ではフル run が構造的に完走できない (2026-08-17 に run 32006827498 で実測)。
    #   内訳: 全 task の生成に 30 分 (うち master 7.6 分 / area-profile 15 分) + 末尾 push 21 分
    #   (14,033 件 / 実測 11.2 files/s) = 約 52 分。runner の manifest は毎回空なので
    #   「アップロード対象」は常に全件になる (差分 push という名前だが CI ではフル push)。
    #   45 分だと push が 9,416/14,033 で cancel され、書けた snapshot の 1/3 が届かないまま
    #   runner ごと破棄される (run.sh の「失敗しても push する」修正では救えない打ち切られ方)。
    #   120 分は data 成長ぶんの余裕込み。ハングの検知手段としては残す。
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 🧰 Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      # 一部 exporter が読むビルド DB (SQLite) を R2 から取得 (read-only)。
      # DBレス移行で不要になった exporter のみ対象なら失敗しても続行できるよう best-effort。
      - name: ⬇️ Pull build DB (best-effort)
        continue-on-error: true
        run: npm run db:pull --workspace=packages/r2-storage

      # 特産品イラスト (Codex 生成・CI では再生成できない実質ソース) を git tracked な
      # source dir から .local/r2 に配置する。run.sh 末尾の snapshot push が
      # app/areas/<code>/specialty/<slug>.webp として R2 に push する。
      # 正典: .claude/rules/area-databook-standards.md §5 / ogp-image-standards.md
      - name: 🖼 Stage area specialty webp
        run: |
          shopt -s nullglob
          count=0
          for d in apps/web/scripts/data/area-specialty/*/; do
            code=$(basename "$d")
            mkdir -p ".local/r2/app/areas/$code/specialty"
            for f in "$d"*.webp; do
              cp "$f" ".local/r2/app/areas/$code/specialty/"
              count=$((count + 1))
            done
          done
          echo "staged $count specialty webp → .local/r2/app/areas/**/specialty/"

      # snapshot 再生成 → R2 push。CI では CI=true が立つため run.sh の push が実行される。
      #
      # ★NODE_ENV=production 必須 (2026-07-27 障害の再発防止・data-refresh.yml と同じ理由):
      #   run.sh の TSX ラッパ (packages/ranking/src/scripts/setup-cli.js) は NODE_ENV 未設定なら
      #   "development" を立てる。development だと listFromR2 が S3 ではなく .local/r2 を列挙し、
      #   item-metadata-refresh --apply が一部キーだけ staging した状態で master が走ると
      #   「部分集合を全件と誤認」して featured/category/survey snapshot を空・欠損で上書きする。
      #   saveToR2 は常にローカル FS 書き込みなので、production にしても staging→push フローは不変。
      - name: 🗂️ Regenerate snapshots + push to R2
        env:
          NODE_ENV: production
        # ARGS は配列で組む: 文字列連結 + "$ARGS" だと全体が 1 引数になり run.sh が
        # "Unknown arg" で落ちる (2026-07-14 実発生。SC2086 対応 quote で word splitting が消えた regression)
        run: |
          ARGS=()
          [ -n "${{ inputs.only }}" ] && ARGS+=(--only "${{ inputs.only }}")
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS+=(--dry-run)
          echo "sync-snapshots/run.sh ${ARGS[*]}"
          bash .claude/skills/db/sync-snapshots/run.sh "${ARGS[@]}"

      - name: ✅ Verify published git-TS snapshots
        if: inputs.dry_run != 'true'
        run: |
          ONLY="${{ inputs.only }}"
          if [ -z "$ONLY" ] || [ "$ONLY" = "page-components" ] || [ "$ONLY" = "ranking-page-cards" ]; then
            npx tsx apps/web/scripts/verify-page-components-snapshot.ts
          fi
          if [ -z "$ONLY" ] || [ "$ONLY" = "affiliate-ads" ]; then
            npx tsx apps/web/scripts/verify-affiliate-ads-snapshot.ts
          fi

      - name: 🧹 Purge Workers Cache after snapshot sync
        if: inputs.dry_run != 'true'
        run: npx tsx packages/r2-storage/src/scripts/purge-worker-cache.ts --all

  # ranking-items を R2 に push した後、git 側の派生キー (known / sitemap) を再生成して
  # develop に反映し PR を開く。これが無いと新規 metric の item.json は R2 にあっても
  # KNOWN/SITEMAP に載らず、本番で 404 / sitemap 未掲載のままになる (P0-RANKING-INDEX の恒久機構化)。
  sync-ranking-keys:
    needs: sync
    # dry_run では R2 に push していないので keys 再生成もしない。
    # only 指定時は ranking-items か master (全 task) のときだけ (他 task は ranking に無関係)。
    if: >-
      inputs.dry_run != 'true' &&
      (inputs.only == '' || inputs.only == 'ranking-items' || inputs.only == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 🧰 Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      # generate-known-ranking-keys: R2 item.json が 200 の isActive metric を KNOWN に登録。
      # build-sitemap-ranking-keys: KNOWN 全キー + GSC 実績キーの和集合を SITEMAP に出力
      # (新キーは KNOWN 経由で自動的に sitemap 掲載される。--include-new-keys は既定挙動なので不要)。
      # generate-known-tag-keys: R2 blog snapshot の tagMeta を KNOWN_TAG_KEYS に反映。
      #   これを止めると middleware が新しいタグを全て 410 にする。2026-04-26〜07-24 は
      #   生成元 (廃止済リモート D1) が消えたまま凍結し、タグリンク 1,988 本が死んでいた。
      #   正典: .claude/rules/blog-quality-standards.md「内部リンクの実在」
      - name: 🔑 Regenerate known + sitemap ranking keys / known tag keys
        env:
          R2_PUBLIC_FETCH_URL: https://storage.stats47.jp
          NODE_OPTIONS: '--conditions react-server'
        run: |
          (cd apps/web && npx tsx scripts/generate-known-ranking-keys.ts)
          node .claude/scripts/gsc/build-sitemap-ranking-keys.cjs
          (cd apps/web && npx tsx scripts/generate-known-tag-keys.ts)
          (cd apps/web && npx tsx scripts/generate-unpublished-blog-slugs.ts)
          (cd apps/web && npx tsx scripts/generate-sitemap-blog-entries.ts)

      # 新規 ranking の OGP/カード を即生成 (KNOWN 確定直後・source=known で新キーも拾う)。
      # 未生成だと og:image が 404 になるため公開時に先回りする。欠落分のみ生成 (self-heal)。
      # 通常の新規key数に合わせて1回50件に制限する。初回manifest移行は
      # timeoutの長いgenerate-ogp-images.ymlを反復し、この短いPR jobへ持ち込まない。
      # 生成・publish失敗はkeys PRも止め、画像なしrankingの公開を防ぐ。
      - name: 🖼 Generate changed ranking OGP/cards
        env:
          R2_PUBLIC_FETCH_URL: https://storage.stats47.jp
          SITE_ORIGIN: https://stats47.jp
          CLOUDFLARE_R2_BUCKET_NAME: stats47
          R2_S3_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: |
          TSC="apps/web/scripts/tsconfig.ogp.json"
          SC="apps/web/scripts/generate-ogp-images.ts"
          for TYPE in ranking ranking-cards; do
            npx tsx --tsconfig "$TSC" "$SC" --type "$TYPE" --source known --limit 50 --max-generate 50
            PLAN=".local/image-generation-publish-plan-${TYPE}.json"
            test -f "$PLAN" || { echo "exact publish plan が生成されませんでした: $TYPE"; exit 1; }
            npx tsx packages/r2-storage/src/scripts/push-generated-image-set.ts --plan "$PLAN"
          done

      - name: 🔀 Open PR if keys changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ★複数パスは bash 配列で渡す。"$KEY_FILES" と引用すると 3 パスが 1 トークンに潰れ、
          #   git diff は「一致なし = 差分なし」で常に early exit し PR が永久に作られない。
          #   (同型の退行が 2026-07-14 に 6 workflow で発生。ガード: ARG_VECTOR_QUOTED)
          KEY_FILES=(
            packages/ranking/src/config/known-ranking-keys.ts
            apps/web/src/config/sitemap-ranking-keys.ts
            apps/web/src/config/known-tag-keys.ts
            apps/web/src/config/unpublished-blog-slugs.ts
            apps/web/src/config/sitemap-blog-entries.ts
          )
          if git diff --quiet -- "${KEY_FILES[@]}"; then
            echo "ranking / tag keys 差分なし — PR 不要"
            exit 0
          fi
          # ★キー数の増減を Step Summary と PR 本文に出す。減少 = 生きているページの削除に
          #   なりうるので、人が merge を押す前に気づけるようにする。2026-08-17 に
          #   bath-soap-consumption-expenditure が誤削除されたとき、PR 本文には何の手掛かりも
          #   無かった。生成器側は判定不能で中止するよう直したが、config 変更や isActive の
          #   巻き戻しによる正当な減少と誤削除は、件数を見ないと区別できない。
          DELTA_FILE=$(mktemp)
          for f in "${KEY_FILES[@]}"; do
            # ★`|| echo 0` にしない。grep -c は一致 0 でも "0" を出して exit 1 を返すため、
            #   フォールバックが二重に出力され 0 が 2 行になり、整数比較が壊れる。
            BEFORE=$(git show "HEAD:$f" 2>/dev/null | grep -cE '^  "' || true)
            AFTER=$(grep -cE '^  "' "$f" || true)
            [ "$BEFORE" = "$AFTER" ] && continue
            # format 中のバッククォートは markdown のコードスパンで、コマンド置換ではない。
            # 単一引用符のままが正しい (二重引用符にすると本当に置換されてしまう)。
            # shellcheck disable=SC2016
            if [ "$AFTER" -lt "$BEFORE" ]; then
              printf -- '- `%s`: %s → %s ⚠️ **減少**\n' "$f" "$BEFORE" "$AFTER" >> "$DELTA_FILE"
            else
              printf -- '- `%s`: %s → %s\n' "$f" "$BEFORE" "$AFTER" >> "$DELTA_FILE"
            fi
          done
          [ -s "$DELTA_FILE" ] || echo "件数の増減なし (内容のみ変更)" >> "$DELTA_FILE"
          KEY_DELTA_NOTE=$(cat "$DELTA_FILE")
          {
            echo "### ranking / tag キーの増減"
            echo ""
            cat "$DELTA_FILE"
          } >> "$GITHUB_STEP_SUMMARY"

          BRANCH="chore/ranking-keys-sync"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add "${KEY_FILES[@]}"
          git commit -m "chore(keys): sync known ranking / sitemap / tag keys from R2 [skip ci]"
          git push -f origin "$BRANCH"
          # 既存 PR があれば再利用、無ければ作成 (develop→main = 本番デプロイの最終ゲート)。
          # ★自動マージしない: 人間がまとめてデプロイ承認する (デプロイ規律)。
          #
          # ★open な PR だけを数える (2026-08-18 是正)。`gh pr view "$BRANCH"` は
          #   CLOSED / MERGED の PR も拾って exit 0 を返すため、過去に一度でも PR を
          #   閉じた時点でこのガードが恒久的に「既存あり」と誤判定し、以後 PR が
          #   二度と作られなくなる。実際 #544 (CLOSED) が居座り、branch だけ force-push
          #   され続けて同期が本番へ一度も届いていなかった (workflow は success のまま)。
          OPEN_PRS=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$OPEN_PRS" -eq 0 ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(ranking): 新規 ranking キーを KNOWN/SITEMAP に同期" \
              --body "sync-snapshots が R2 に push した item.json を KNOWN/SITEMAP に反映。新規 metric を本番公開 (200) + sitemap 掲載するための派生キー更新。**マージ = 本番デプロイ**なので、まとまったタイミングで承認してください。\n\n### キーの増減\n\n${KEY_DELTA_NOTE}\n\n⚠️ **減少** が付いている行は、生きているページが KNOWN から消える可能性がある。config で isActive を落とした等の心当たりが無ければマージしない。" \
              --label enhancement || true
          fi
