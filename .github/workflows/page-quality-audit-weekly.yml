name: 📐 Page Quality Audit (weekly)

# ページの肥大化・重複・画像切れを公開対象の全URLで、文字の切れ・要素の重なり・アクセシビリティを
# 代表URL 11 件だけブラウザで週次に検知する。代表URLはスマホ・PC のスクショを R2
# `state/page-quality/screenshots/` へ保存して先週と比べ、Claude (読み取り専用) がスクショを確認する。
# 新しく出た UI 違反と agent の指摘は `ui-review-alert` Issue 1 件へまとめる (無ければ閉じる)。
# 肥大化・重複・画像切れの error は従来どおり `page-quality-alert` Issue。
#
# 既存の日次PSI (psi-audit-daily.yml) ・Cloudflare監視とは責務が別 (それらは変更・削除しない)。
# 正典: .claude/rules/page-quality-standards.md

on:
  schedule:
    - cron: "0 18 * * 6" # 土 18:00 UTC = 日 03:00 JST (internal-link-audit 04:00 の前)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  # スクショを R2 state/ へ push する diff-push-r2.ts の認証 (affiliate-ga4-weekly.yml と同じ導出)
  R2_S3_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
  R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
  CLOUDFLARE_R2_BUCKET_NAME: stats47
  R2_PUBLIC_FETCH_URL: https://storage.stats47.jp

concurrency:
  group: page-quality-audit-weekly
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    # 2026-09-23 の実測: 全 6,227 URL の静的検査が CI では並列 8 で 54.5 分 (手元の約 3.5 倍)。
    # スクショ・agent 確認を足しても収まるよう 120 分。Claude を使う他 workflow と時間帯が重ならないことは
    # backlog-loop-routine.test.cjs が検査する。
    timeout-minutes: 120
    steps:
      - name: 🧰 Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install Chromium (代表URLのUI検査用)
        run: npx playwright install --with-deps chromium

      - name: 🔍 Run full page-quality audit (production)
        id: audit
        run: |
          set +e
          npm run page-quality:audit-weekly -- --base-url https://stats47.jp --concurrency 12 --skip-rsc --browser-representative 2>&1 | tee /tmp/page-quality-audit.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: 🧹 Prune old snapshots
        if: always()
        run: node .claude/scripts/lib/prune-state-snapshots.mjs --scope page-quality

      - name: 🖼️ Push raw results and screenshots to R2 state/page-quality/
        # 全 URL の結果 (latest.json 約 10MB)・URL ごとの履歴・スクショは R2 に置き、git には集約だけを残す
        # (2026-09-23 の初回完了で git に 20MB 書き戻し、リポジトリ衛生の 1MB 上限を超えた)。
        id: shots
        if: always() && hashFiles('.local/r2/state/page-quality/latest.json') != ''
        run: npx tsx packages/r2-storage/src/scripts/diff-push-r2.ts --prefix "state/page-quality/"

      - name: 🤖 Review screenshots (Claude・読み取り専用)
        id: review
        if: always() && hashFiles('.local/ci/page-quality/review-input.json') != ''
        timeout-minutes: 20
        uses: anthropics/claude-code-base-action@09641f2ee92b8a382a1c63c69b915d7a4540d6b6 # v2.1.220
        env:
          NODE_VERSION: '20.x'
        with:
          prompt_file: .claude/prompts/ci/page-ui-review.md
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: 'false'
          settings: '{"disableAllHooks":true}'
          claude_args: |
            --model sonnet
            --json-schema '{"type":"object","properties":{"status":{"type":"string","enum":["reviewed","no-issues","blocked"]},"summary":{"type":"string","minLength":10,"maxLength":800},"findings":{"type":"array","maxItems":10,"items":{"type":"object","properties":{"template":{"type":"string"},"device":{"type":"string","enum":["mobile-390","tablet-768","desktop-1440"]},"severity":{"type":"string","enum":["high","medium","low"]},"location":{"type":"string","minLength":5},"issue":{"type":"string","minLength":10},"suggestion":{"type":"string","minLength":5}},"required":["template","device","severity","location","issue","suggestion"],"additionalProperties":false}}},"required":["status","summary","findings"],"additionalProperties":false}'
            --effort medium
            --max-turns 120
            --no-session-persistence
            --setting-sources project
            --permission-mode dontAsk
            --tools "Read,Glob"
            --allowedTools "Read,Glob"
            --disallowedTools "Bash,Write,Edit,WebFetch,WebSearch,Read(.env*),Read(**/.env*)"
            --strict-mcp-config
            --mcp-config '{"mcpServers":{}}'

      - name: 📝 Record UI review
        id: uireview
        if: always() && hashFiles('.local/ci/page-quality/ui-new-violations.json') != ''
        env:
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          CLAUDE_EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          if [ "$REVIEW_OUTCOME" = success ] && [ -s "$CLAUDE_EXECUTION_FILE" ]; then
            node .claude/scripts/lib/summarize-claude-execution.mjs "$CLAUDE_EXECUTION_FILE" >> "$GITHUB_STEP_SUMMARY" || true
            npx tsx .claude/scripts/page-quality/record-ui-review.ts --execution "$CLAUDE_EXECUTION_FILE" --alert-out /tmp/ui-review-alert.md >> "$GITHUB_OUTPUT"
          else
            npx tsx .claude/scripts/page-quality/record-ui-review.ts --no-review "agent step: ${REVIEW_OUTCOME:-not-run}" --alert-out /tmp/ui-review-alert.md >> "$GITHUB_OUTPUT"
          fi
          if [ -f /tmp/ui-review-alert.md ]; then cat /tmp/ui-review-alert.md >> "$GITHUB_STEP_SUMMARY"; fi

      # UI の指摘を週をまたいで追跡し、未対応のものを UI-FIX-* カードとして backlog へ起票する。
      # 修正は backlog-loop-daily (CI の Claude) が行い、本番確認は次の週次がここで行う (消えていれば done、
      # 本番反映後も残っていれば pending に戻して再起票)。本番反映の判定に origin/main の最新マージ時刻を使う。
      # 失敗は握りつぶさない (job を赤にして workflow-health-daily の週次契約で翌朝に知らせる)。
      # 正典: .claude/rules/page-quality-standards.md「UI 指摘のループ」
      - name: 🗂 Track UI findings and file backlog cards
        if: always() && hashFiles('.local/r2/state/page-quality/latest.json') != ''
        run: |
          git fetch --quiet --depth=1 origin main
          ARGS=(--sync --run .local/r2/state/page-quality/latest.json)
          ARGS+=(--review .claude/state/metrics/page-quality/ui-review-latest.json)
          ARGS+=(--main-deployed-at "$(git log -1 --format=%cI origin/main)")
          npx tsx .claude/scripts/page-quality/ui-findings.ts "${ARGS[@]}"

      - name: 📤 Commit audit result to develop
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude/state/metrics/page-quality/
          # UI 指摘キューと起票したカード (live/ は .gitignore 済み)
          git add .claude/state/page-quality/ .claude/todo/backlog.md
          if git diff --cached --quiet; then
            echo "No audit changes"
            exit 0
          fi
          git commit -m "chore(page-quality): weekly full audit $(date -u +%Y-%m-%d) [skip ci]"
          git pull --rebase origin develop
          git push origin develop

      - name: 🚨 Open issue on regressions
        if: always() && steps.audit.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          TITLE="[Page Quality Alert] ページ肥大化・重複の週次監査で退行を検出"
          {
            echo "## ページ品質 週次監査 ($DATE)"
            echo ""
            echo "HTML/RSC肥大化・DOM過剰・リンク重複・広告重複・構造化データ異常・画像切れのerror違反を検出しました。"
            echo "詳細は管理コンソール \`/quality/page-audit\` または以下を参照。"
            echo ""
            echo '```'
            sed -n '/\[page-quality\] 違反/,$p' /tmp/page-quality-audit.log | head -80
            echo '```'
            echo ""
            echo "正典: .claude/rules/page-quality-standards.md"
          } > /tmp/page-quality-issue.md

          gh label create page-quality-alert --description "ページ肥大化・重複・速度の週次監査アラート" --color "d93f0b" --force 2>/dev/null || true

          EXISTING=$(gh issue list --state open --label page-quality-alert --search "\"[Page Quality Alert]\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Existing open issue #$EXISTING — replacing with latest audit"
            gh issue edit "$EXISTING" --title "$TITLE" --body-file /tmp/page-quality-issue.md
          else
            gh issue create --title "$TITLE" --label "page-quality-alert,auto-generated" --body-file /tmp/page-quality-issue.md
          fi

      - name: ✅ Close recovered page-quality alert
        if: always() && steps.audit.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --state open --label page-quality-alert --limit 100 --json number --jq '.[].number' |
            while read -r NUMBER; do
              gh issue close "$NUMBER" --reason completed \
                --comment "ページ品質監査が正常へ復旧したため自動Closeします。"
            done

      - name: 🔔 Update UI review alert
        if: always() && steps.uireview.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_OPEN: ${{ steps.uireview.outputs.alert_open }}
        run: |
          test "$ALERT_OPEN" = true || test "$ALERT_OPEN" = false
          gh label create ui-review-alert --description "ページ UI の週次確認 (新しい UI 違反と agent の指摘)" --color "fbca04" --force 2>/dev/null || true
          gh label create auto-generated --description "機械監査アラート" --color ededed --force 2>/dev/null || true
          TITLE="[UI Review] ページ UI の確認が必要です"
          EXISTING=$(gh issue list --state open --label ui-review-alert --json number --jq '.[0].number // empty')
          if [ "$ALERT_OPEN" = true ]; then
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --title "$TITLE" --body-file /tmp/ui-review-alert.md
            else
              gh issue create --title "$TITLE" --label "ui-review-alert,auto-generated" --body-file /tmp/ui-review-alert.md
            fi
          elif [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --reason completed --comment "新しい UI 違反も agent の指摘も無くなったため自動Closeします。"
          fi
