name: 🔁 Improvement Cycle Weekly (計測→記録→改善)

# 金曜 05:00 JST の fetch-metrics-weekly が前週について作った計測 state (measurement-cycle/latest.json・effect verdict) を入力に、
# improvement-triage を無人で走らせて改善バックログを更新する。Claude は判断を .local/ci/improvement-cycle/proposal.json に
# 書くだけで、台帳へは verify-improvement-cycle-run.mjs が決定的に適用する (`.claude/` は Claude Code の保護パスで、
# dontAsk では Edit が必ず拒否されるため。2026-09-24 run 35996605022 で実測)。適用後の差分は決定的ゲート
# (許可パス・effect 確定禁止・カード削除禁止・秘密の形・書き込み拒否) を通ったものだけを develop へ push する。
# 結果は measurement-cycle/triage-latest.json に残り、
# 金曜 18:00 JST の週次メトリクス Issue (weekly-metrics-issue.yml) と土曜の /weekly-review が読む。
#
# ★無人 Claude は対話セッションと同じ Pro/Max 枠を使う (日次生成ループは歩留まりで 2026-08-21 に削除済み)。
#   週 1 回・最大 8 件に絞り、トークン実績を claude-usage/history.csv に残して費用対効果を判断できるようにする。

on:
  schedule:
    - cron: "0 3 * * 5" # 金 12:00 JST (fetch-metrics-weekly 05:00 の後、週次メトリクス Issue 18:00 の前)
  workflow_dispatch:
    inputs:
      week:
        description: "対象 ISO 週 YYYY-Www (省略時は直近に終わった週 = 金曜の計測が取った週)"
        required: false
        default: ""
      dry_run:
        description: "true: LLM を呼ばず入力とゲートだけ確認する"
        required: false
        default: "false"

permissions:
  contents: write
  issues: write

concurrency:
  group: improvement-cycle
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # claude_args と使用量の記録が同じ値を読む (1 か所で変える)
      CLAUDE_EFFORT: high
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - name: 🧰 Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 2

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📅 Resolve week and check measurement inputs
        id: week
        env:
          INPUT_WEEK: ${{ inputs.week }}
        run: |
          set -euo pipefail
          # 直近に終わった ISO 週 (JST の前の日曜を含む週)。日曜なら 7 日前の日曜
          DOW=$(TZ=Asia/Tokyo date +%w)
          WEEK="${INPUT_WEEK:-$(TZ=Asia/Tokyo date -d "$(( DOW == 0 ? 7 : DOW )) days ago" +%G-W%V)}"
          if ! [[ "$WEEK" =~ ^[0-9]{4}-W[0-9]{2}$ ]]; then
            echo "::error::week は YYYY-Www: $WEEK"
            exit 1
          fi
          STATE=data/measurement-cycle/latest.json
          if [ ! -f "$STATE" ]; then
            echo "::error::計測 state が無い ($STATE)。金曜の fetch-metrics-weekly を確認する"
            exit 1
          fi
          GOT=$(node -e 'process.stdout.write(require("./data/measurement-cycle/latest.json").week)')
          if [ "$GOT" != "$WEEK" ]; then
            echo "::error::計測 state の週 ($GOT) が対象週 ($WEEK) と違う。金曜の取得が失敗したまま記録すると古い計測で判定してしまう"
            exit 1
          fi
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"

      # 金曜の sns-metrics-weekly は fetch-metrics-weekly より後に終わるので、計測時の state にはその週の SNS が入らない。
      # triage の前に同じスクリプトで作り直してローカル commit し、ゲートの base をこの commit にする
      # (ゲートは Claude が変えた差分だけを見る)。push は最後の step がまとめて行う。
      - name: 🔁 Refresh measurement cycle state
        id: refresh
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_JSON }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          WEEK: ${{ steps.week.outputs.week }}
        run: |
          set -euo pipefail
          bash .claude/scripts/metrics/refresh-measurement-cycle.sh "$WEEK"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/measurement-cycle
          if ! git diff --cached --quiet; then
            git commit -q -m "chore(metrics): refresh measurement cycle state ${WEEK} [skip ci]"
          fi
          cat data/measurement-cycle/LATEST.md >> "$GITHUB_STEP_SUMMARY"
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p .local/ci/improvement-cycle # Claude が提案を書く場所 (gitignore 済み・保護パス外)

      - name: 🔐 Require Claude Code OAuth token
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN が未登録です。claude setup-token で発行し Repository Secret へ登録してください"
            exit 1
          fi

      # 鍵 (GA4 / GSC 共通の service account) は ga4-query.mjs / gsc-query.mjs がメモリで使うだけで一時ファイルに書かない。
      # Bash は照会・走査・effect-verdict の dry-run だけを許す。Edit と Agent は渡さない (台帳を直接書けないので不要。
      # 書けるのは保護外の提案ファイルだけで、それ以外の追跡ファイルへの書き込みはゲートの許可パス検査が止める)。
      - name: 🧾 Record measurements with Claude Code (improvement-triage)
        id: claude
        if: ${{ env.DRY_RUN != 'true' }}
        uses: anthropics/claude-code-base-action@57607815d5d9678acb18dae0e5033d87d4dd4177 # Claude Code v2.1.287 (base-action main 2026-10-01。sonnet / opus の別名が 5.5 に解決される版)
        env:
          NODE_VERSION: "20.x"
          GOOGLE_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_JSON }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
        with:
          prompt_file: .claude/prompts/ci/improvement-cycle.md
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: "false"
          settings: |
            {
              "disableAllHooks": true
            }
          claude_args: |
            --model sonnet
            --effort ${{ env.CLAUDE_EFFORT }}
            --max-turns 150
            --no-session-persistence
            --setting-sources project
            --permission-mode dontAsk
            --tools "Read,Write,Glob,Grep,Bash"
            --allowedTools "Read,Write,Glob,Grep,Bash(node .claude/scripts/metrics/ga4-query.mjs *),Bash(node .claude/scripts/metrics/gsc-query.mjs *),Bash(node .claude/scripts/lib/scan-pending-improvements.mjs *),Bash(node .claude/scripts/lib/effect-verdict/cli.mjs --dry-run*)"
            --disallowedTools "WebFetch,WebSearch,Bash(git *),Bash(gh *),Bash(env *),Bash(printenv *),Bash(cat *),Read(.env*),Read(**/.env*)"
            --strict-mcp-config
            --mcp-config '{"mcpServers":{}}'

      - name: 🩺 Summarize Claude execution
        if: ${{ always() && steps.claude.outcome != 'skipped' }}
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          FILE="${CLAUDE_EXECUTION_FILE:-/home/runner/work/_temp/claude-execution-output.json}"
          mkdir -p .local/ci
          node .claude/scripts/lib/summarize-claude-execution.mjs "$FILE" > .local/ci/claude-diagnosis.txt 2>&1 || true
          {
            echo "### Claude 実行サマリ"
            echo '```'
            cat .local/ci/claude-diagnosis.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # サマリは最終メッセージを 600 字で切るので、全文を伏字処理して artifact に残す。
          # 公開 repo なので実行ログ全体 (tool 出力を含む) は上げない
          mkdir -p .local/ci/improvement-cycle
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { redact } from "./.claude/scripts/lib/summarize-claude-execution.mjs";
            const log = JSON.parse(readFileSync(process.argv[1], "utf8"));
            const result = log.find((e) => e?.type === "result");
            process.stdout.write(redact(String(result?.result ?? "(result entry なし)")) + "\n");
          ' "$FILE" > .local/ci/improvement-cycle/final-message.md 2>&1 || true

      - name: ✅ Apply the proposal and gate the diff
        id: gate
        env:
          BASE_SHA: ${{ steps.refresh.outputs.base }}
          WEEK: ${{ steps.week.outputs.week }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CLAUDE_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          ARGS=(--base "$BASE_SHA" --week "$WEEK" --run-url "$RUN_URL")
          if [ "$DRY_RUN" != "true" ]; then
            ARGS+=(--proposal .local/ci/improvement-cycle/proposal.json
              --execution-file "${CLAUDE_EXECUTION_FILE:-/home/runner/work/_temp/claude-execution-output.json}")
          fi
          # 文書検査は「提案の適用で増えた error」だけで止める。適用前からある error (別 workflow の state が
          # 原因など) で triage の結果を捨てない (2026-10-05 Issue #1068: W40 の提案が DG084 で失われた)
          mkdir -p .local/ci/improvement-cycle
          node .claude/scripts/lib/check-docs-governance.cjs --json > .local/ci/improvement-cycle/docs-before.json || true
          node .claude/scripts/metrics/verify-improvement-cycle-run.mjs "${ARGS[@]}"
          node .claude/scripts/lib/check-docs-governance.cjs --json > .local/ci/improvement-cycle/docs-after.json || true
          node .claude/scripts/metrics/check-docs-delta.mjs \
            --before .local/ci/improvement-cycle/docs-before.json --after .local/ci/improvement-cycle/docs-after.json
          node .claude/scripts/lib/check-docs-links.cjs --baseline
          node .claude/scripts/lib/check-docs-code-refs.cjs

      - name: 🗂️ Preserve proposal and final message
        if: ${{ always() && steps.claude.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: improvement-cycle-evidence
          path: |
            .local/ci/improvement-cycle/
            .local/ci/claude-diagnosis.txt
            data/measurement-cycle/triage-latest.json
          include-hidden-files: true
          retention-days: 30

      - name: 📦 Commit and push
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          WEEK: ${{ steps.week.outputs.week }}
        run: |
          set -euo pipefail
          git add -- .claude/todo/improvements.md .claude/todo/backlog.md \
            .claude/skills/analytics/*-improvement/reference/improvement-log.md \
            data/measurement-cycle/triage-latest.json
          if ! git diff --cached --quiet; then
            git commit -q -m "chore(improvements): weekly measurement cycle ${WEEK} [skip ci]"
          fi
          # triage が何も変えなくても、refresh step の state commit は push する
          git fetch -q origin develop
          if [ -z "$(git rev-list origin/develop..HEAD)" ]; then
            echo "変更なし"
            exit 0
          fi
          for i in 1 2 3; do
            if git pull --rebase --quiet origin develop && git push origin HEAD:develop; then
              echo "✅ pushed"
              exit 0
            fi
            echo "push retry $i"; sleep 5
          done
          echo "::error::develop への push に 3 回失敗した"
          exit 1

      # 計測のみ。失敗しても本体の成否を変えない (共通スクリプトが常に exit 0)
      - name: 📊 Record token usage
        if: ${{ always() && steps.claude.outcome != 'skipped' }}
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          # items = この run が削除または更新した施策の数 (ゲート結果から。ゲート前に落ちたら 0)
          ITEMS=$(node -e 'try{const i=require("./data/measurement-cycle/triage-latest.json").improvements;process.stdout.write(String(i.deleted.length+i.updated.length))}catch{process.stdout.write("0")}')
          bash .claude/scripts/lib/record-claude-usage-ci.sh "$CLAUDE_EXECUTION_FILE" improvement-cycle 8 "$ITEMS" "$CLAUDE_EFFORT"

      - name: 🚨 Upsert failure issue
        if: ${{ failure() && env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          WEEK: ${{ steps.week.outputs.week || 'unknown' }}
        run: |
          TITLE="🚨 Improvement cycle failed"
          PROBLEMS="(ゲート結果なし: 入力検査か Claude step で止まった)"
          if [ -s data/measurement-cycle/triage-latest.json ]; then
            PROBLEMS=$(node -e 'const j=require("./data/measurement-cycle/triage-latest.json");process.stdout.write((j.problems||[]).map(p=>"- "+p).join("\n")||"(ゲートは通過。提案の適用で増えた文書 error か、文書リンク / コード参照の検査か、push で失敗)")')
          fi
          DIAG="(診断なし)"
          if [ -s .local/ci/claude-diagnosis.txt ]; then DIAG=$(cat .local/ci/claude-diagnosis.txt); fi
          BODY="週次の計測→記録→改善サイクル (${WEEK}) の無人記録が失敗しました。差分は push していません。

          Run: ${RUN_URL}

          ${PROBLEMS}

          提案は artifact \`improvement-cycle-evidence\` (30 日保持) に残っている。原因を直したあと、develop 上で再適用できる:

          \`\`\`bash
          gh run download ${RUN_ID} -n improvement-cycle-evidence -D /tmp/improvement-cycle-${RUN_ID}
          node .claude/scripts/metrics/verify-improvement-cycle-run.mjs --base HEAD --week ${WEEK} --proposal /tmp/improvement-cycle-${RUN_ID}/.local/ci/improvement-cycle/proposal.json
          \`\`\`

          台帳が提案後に動いていて適用できない行は、上のコマンドが違反として列挙する (その行は手で書き戻す)。

          <details><summary>Claude 実行の診断</summary>

          \`\`\`
          ${DIAG}
          \`\`\`

          </details>"
          gh label create improvement-cycle-alert --color B60205 --description "週次の計測→記録→改善サイクルの失敗" --force 2>/dev/null || true
          NUMBER=$(gh issue list --search "$TITLE in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label auto-generated,improvement-cycle-alert
          fi

      - name: 🧹 Close resolved issue
        if: ${{ success() && env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUMBER=$(gh issue list --search "🚨 Improvement cycle failed in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$NUMBER" ]; then gh issue close "$NUMBER" --reason completed; fi
