name: 🎨 Data ledgers

# 外部の値から作る台帳を作り直し、develop へ書き戻す。読むだけで R2 には書かない。
# - 配色 (data/ranking/color-policies): R2 の値から。サイトと SNS へはデプロイの指標の生成で届く
# - 月次の表 (data/estat/monthly/ledger.json): e-Stat カタログから。判断の無い調査が増えると赤になるが、台帳は書き戻す
# 正典: .claude/rules/metric-config-standards.md「配色の台帳」

on:
  workflow_dispatch:
  push:
    # 新しい workflow は main に入るまで dispatch できないので、道具を変えた push でも作り直す
    branches: [develop]
    paths:
      - "packages/ops/src/metrics/build-color-policies.ts"
      - ".claude/scripts/estat/build-monthly-ledger.mjs"
      - "packages/ops/src/estat/build-monthly-ledger.mjs"
      - "packages/types/src/color-policy.ts"
      - ".github/workflows/ledgers-weekly.yml"
  # CI-CRON-TIMING-01: 計測の後に動かす順序は時刻ずらしでなく workflow_run で保証する。
  # workflows は glob なので `+` は `\\+` で逃がす (search-growth-weekly.yml と同じ)。
  workflow_run:
    workflows: ["📈 Fetch weekly metrics (GSC \\+ GA4 \\+ AdSense)"]
    types: [completed]
  schedule:
    # 予備。workflow_run が起動しなかった週の取りこぼしと、scheduled workflow の死活監視
    # (workflow-health-core.mjs は schedule の run だけを見る) のために残す。JST 日曜 00:30
    - cron: "30 15 * * 6"

permissions:
  contents: write # 台帳の commit-back

concurrency:
  group: data-ledgers
  cancel-in-progress: false

env:
  R2_PUBLIC_FETCH_URL: https://storage.stats47.jp

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 🧰 Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci --ignore-scripts

      - name: 🎨 Build the colour ledger
        id: colour
        run: |
          npm run --silent color-policies:build
          npm run --silent color-policies:check -- --strict

      - name: 📅 Build the monthly ledger
        run: |
          npm run --silent estat:catalog:pull
          npm run --silent estat:monthly

      - name: 📮 Commit the ledgers
        if: ${{ !cancelled() && steps.colour.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/ranking/color-policies/policies.json data/estat/monthly/ledger.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(data): refresh the color and monthly ledgers [skip ci]"
          git pull --rebase origin develop
          git push origin develop
