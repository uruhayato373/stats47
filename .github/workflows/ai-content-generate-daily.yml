name: 🤖 AI Content Daily (Claude Code生成 + 公開)

# ranking ai-content の「全件完成」を日次で進めるループ。
#
#   1. キューを全件スコープで再構築し、needs-regen 上位 N 件を選ぶ
#   2. R2 観測値から key ごとの prompt を決定的に準備する
#   3. Claude Code Base Action (OAuth / Max) で author → audit → 独立 critic を実行する
#   4. 対象全件の outbox + audit + critic PASS を決定的に照合する
#   5. outbox を develop に push し、publish-ai-content.yml を
#      dispatch → gate 再検証 → R2 → CDN purge
#      (★push トリガー任せにしない。既定 GITHUB_TOKEN の push は後続 workflow を発火させない仕様)
#   6. 失敗時は run を赤くし、運用 Issue を upsert する
#
# 品質は「賢いモデル」ではなく「決定的ゲート + critic」で担保する。ゲートは緩めない
# (正典: .claude/rules/ranking-content-standards.md §実データ照合 / §生成パイプライン)。
#
# ★件数とスケジュール (2026-08-06 改訂)
#   baseline は JST 03:00 の 1 回・5 件。**期間限定の boost** を
#   `.claude/config/content-generation-boost.json` で上乗せできる (無ければ baseline のまま)。
#   期間中は件数が上がり、5 時間間隔の追加スロット (JST 08:00 / 13:00 / 18:00) も動く。
#   判定は gate job (`.claude/scripts/lib/content-generation-boost.mjs`) が行う。
#
#   件数と回数のどちらで増やすか (2026-08-11 実測で確定): 1 回あたり固定費が約 15 分/$12
#   (起動時に CLAUDE.md と rules を読む分) あるので 1 件ずつ回すのは無駄。一方バッチを
#   大きくすると 1 件あたりが悪化する — limit 5 = 11.6 分/$6.16 に対し limit 10 =
#   16.9〜21.3 分/$11〜12。同じ context で直列に処理するほど会話が長くなるためで、
#   limit 10 では 213 分の run が出て timeout 240 分に届き 0 件で打ち切られた回もある。
#   **正しい形は「実測で完走できる大きさのバッチ (= 5 件) を、5 時間枠ごとに 1 回」**。
#   産出を増やしたいときは件数ではなくスロット数を増やす。
#
#   boost は `until` で自動失効し、不在中でも放置して元に戻る。件数・回数は設定ファイルを
#   develop へ push するだけで次回実行から変わる (cloud は dispatch できないためこの経路)。
#
# ★安全装置
#   - 遠隔から上げられる上限は MAX_LIMIT = 5 (content-generation-boost.mjs)。timeout 240 分 /
#     max-turns 300 がこの件数を安全率込みで賄えることを content-generation-routine.test.cjs
#     が機械検査する (足りないと途中で切れ、verify が「対象あり・生成物なし」で落ちて
#     その回が丸ごと無駄になる)。上限を上げるには先に実測で完走を示すこと
#   - 直近 2 回が連続失敗なら追加スロットを止め baseline へ戻す (枠に当たった後の空回り防止)
#   - boost 設定が壊れているときは baseline を通し、追加スロットだけ失敗させる
#     (add-on の設定ミスで中核ループを止めない / 1 日 3 回赤くなるので見逃さない)
#   - OAuth token 未登録、対象あり生成0件、audit/critic未通過はすべて hard fail
#   - Claude が変更できるのは target の outbox と gitignore 済み review manifest だけ
#   - Base Action は commit SHA 固定、MCP/Web、project hooks、full output を無効化
#   - 進捗 commit は outbox と同一 commit にする (生成物と進捗がずれない)
#   - push も dispatch も失敗を握り潰さない。届かなければ run を赤くする

on:
  schedule:
    - cron: "0 18 * * *" # JST 03:00 — baseline (常時)
    # 以下は boost 期間中だけ動く追加スロット。5 時間間隔で並べてある。
    # 期間外は gate job が run=false を返して即終了する (Claude を呼ばない)。
    - cron: "0 23 * * *" # JST 08:00 — boost
    - cron: "0 4 * * *" # JST 13:00 — boost
    - cron: "0 9 * * *" # JST 18:00 — boost
  # push トリガー (cloud 用): develop に data/ai-content-generate-requests.json を commit/push
  # すると実行し、消費した request を git rm で commit-back する。cloud セッションは
  # actions:write が無く workflow_dispatch できない (403) ため。data-refresh.yml と同じ方式。
  #   { "limit": 1, "dryRun": false }
  push:
    branches: [develop]
    paths: ['data/ai-content-generate-requests.json']
  workflow_dispatch:
    inputs:
      limit:
        description: "生成件数 (既定5)。実測 5 件 = 約 58 分 (固定費 15 分 + 1 件 11.6 分)。手動指定は boost より優先される"
        required: false
        default: "5"
      dry_run:
        description: "true: LLMを呼ばず対象・promptだけ確認する"
        required: false
        default: "false"

permissions:
  contents: write
  issues: write
  actions: write # publish-ai-content.yml を dispatch するため (既定 token の push は後続 workflow を発火させない)

concurrency:
  group: ai-content-generate
  cancel-in-progress: false

jobs:
  # 走るかどうかと件数だけを決める軽量 job。追加スロットが boost 期間外に発火したときは
  # ここで run=false を返し、generate ごと skip して Claude を呼ばない。
  # 別 job に切ったのは、単一 job だと後続 12 step すべてに if: を付ける必要があり、
  # 付け忘れが「skip したはずなのに Claude が動く」になるため。
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      limit: ${{ steps.decide.outputs.limit }}
      dry_run: ${{ steps.decide.outputs.dry_run }}
    steps:
      - name: 🧰 Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 1

      # 件数の決定順: push request > workflow_dispatch input > boost 設定 > baseline 5。
      # 設定が壊れているときは baseline を通し追加スロットだけ exit 1 で赤くする。
      - name: 🧭 Resolve schedule and limit
        id: decide
        run: |
          node .claude/scripts/lib/content-generation-boost.mjs \
            --workflow ai-content \
            --event "${{ github.event_name }}" \
            --cron "${{ github.event.schedule }}" \
            --baseline-cron "0 18 * * *" \
            --default-limit 5 \
            --request-default-limit 1 \
            --request data/ai-content-generate-requests.json \
            --input-limit "${{ inputs.limit }}" \
            --input-dry-run "${{ inputs.dry_run }}"

  generate:
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      R2_PUBLIC_FETCH_URL: https://storage.stats47.jp
      LIMIT: ${{ needs.gate.outputs.limit }}
      DRY_RUN: ${{ needs.gate.outputs.dry_run }}
    steps:
      - name: 🧰 Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 2

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📊 Rebuild queue, pick targets, and prepare prompts
        id: pick
        run: |
          set -euo pipefail
          mkdir -p .local/ci/ai-content-prompts .local/ci/ai-content-reviews
          node .claude/scripts/ai-content/build-ai-content-queue.mjs --scope all
          # needs-regen 上位 N (impressions 降順) を取得
          node .claude/scripts/ai-content/build-ai-content-queue.mjs --no-build --next "${LIMIT}" \
            > .local/ci/ai-content-targets.txt
          node -e '
            const fs = require("node:fs");
            const keys = fs.readFileSync(".local/ci/ai-content-targets.txt", "utf8").trim().split(/\n/).filter(Boolean);
            for (const key of keys) {
              if (!/^[a-z0-9][a-z0-9-]*$/.test(key)) throw new Error("不正な ranking key: " + key);
            }
          '
          KEYS=$(paste -sd, .local/ci/ai-content-targets.txt)
          COUNT=$(grep -c . .local/ci/ai-content-targets.txt || true)
          echo "keys=$KEYS" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "対象 ${COUNT} 件: ${KEYS:-なし}"
          while IFS= read -r KEY; do
            [ -z "$KEY" ] && continue
            NODE_OPTIONS='--conditions react-server' \
              npm run ai:input --workspace=@stats47/ai-content -- "$KEY" --prompt-only \
              > ".local/ci/ai-content-prompts/${KEY}.txt"
            test -s ".local/ci/ai-content-prompts/${KEY}.txt"
          done < .local/ci/ai-content-targets.txt

      - name: 🔐 Require Claude Code OAuth token
        if: ${{ env.DRY_RUN != 'true' && steps.pick.outputs.count != '0' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN が未登録です。claude setup-token で発行し、Repository Secretへ登録してください"
            exit 1
          fi

      # High-level claude-code-action は schedule event を正式対応対象にしていないため、
      # event 非依存の公式 Base Action を使う。main SHA と内包 Claude Code version を固定する。
      #
      # ★allowedTools の Bash パターンは「末尾 * のプレフィックス一致」しか効かない (2026-08-03)。
      #   途中に * を置いた `... --file data/ai-content-staging/*.json` は実コマンドと一致せず、
      #   その結果 Bash が 1 つも許可されない = author も critic も検証スクリプトを実行できない。
      #   run 30762722415 / 30846501974 が 2 晩連続でこれ (denials 14・生成 0 件・$10.94 を消費)。
      #   引数まで書かず末尾 * に畳み、実引数の妥当性は audit スクリプト自身に見せる。
      #   blog-generate-daily.yml が同型で成功しているのはこの形だから。
      #   機械ガード: .claude/scripts/lib/__tests__/content-generation-routine.test.cjs
      - name: ✍️ Generate and review AI content with Claude Code
        id: claude
        if: ${{ env.DRY_RUN != 'true' && steps.pick.outputs.count != '0' }}
        uses: anthropics/claude-code-base-action@e5758aabe98b80fec1bcbd4a51fe2e1f8935dfc3 # Claude Code v2.1.220 (base-action main 2026-08-02)
        env:
          NODE_VERSION: "20.x"
        with:
          prompt_file: .claude/prompts/ci/ai-content-routine.md
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: "false"
          settings: |
            {
              "disableAllHooks": true
            }
          claude_args: |
            --model sonnet
            --effort high
            --max-turns 300
            --no-session-persistence
            --setting-sources project
            --permission-mode dontAsk
            --tools "Read,Write,Edit,Glob,Grep,Agent,Skill,Bash"
            --allowedTools "Read,Write,Edit,Glob,Grep,Agent,Skill,Bash(node .claude/scripts/ai-content/audit-ai-content.mjs *)"
            --disallowedTools "WebFetch,WebSearch,Bash(env *),Bash(printenv *),Read(.env*),Read(**/.env*)"
            --strict-mcp-config
            --mcp-config '{"mcpServers":{}}'

      # ★失敗を診断可能にする (2026-08-02)。show_full_output は false のままにする
      #   (assistant 本文や tool 出力に secret が混ざる事故を避けるため) が、それだけだと
      #   「is_error だが理由不明」で終わり切り分けができない。実際 2026-08-02 の初回実行は
      #   両 workflow とも turn 1 / cost 0 で落ち、認証か上限かモデルか判別できなかった。
      #   切り分けに要る最小限 (構造フィールド + 伏字済みエラー文 + tool 呼び出し有無) だけ出す。
      # ★verify 落ちでも出す (2026-08-03)。run 30774421511 は Claude が success した後に
      #   verify が「critic の Agent 記録なし」で落ちたが、diagnose が failure 限定だったため
      #   Issue に何の subagent が動いたかが残らなかった。Claude が実際に走った run では常に出す。
      - name: 🩺 Summarize Claude execution
        if: ${{ always() && steps.claude.outcome != 'skipped' }}
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          FILE="${CLAUDE_EXECUTION_FILE:-/home/runner/work/_temp/claude-execution-output.json}"
          mkdir -p .local/ci
          node .claude/scripts/lib/summarize-claude-execution.mjs "$FILE" > .local/ci/claude-diagnosis.txt 2>&1 || true
          {
            echo "### Claude 実行サマリ"
            echo '```'
            cat .local/ci/claude-diagnosis.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: ✅ Verify target completeness, audit, and critic PASS
        id: verify
        if: ${{ env.DRY_RUN != 'true' && steps.pick.outputs.count != '0' }}
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          EXPECTED="${{ steps.pick.outputs.count }}"
          if [ ! -s "$CLAUDE_EXECUTION_FILE" ]; then
            echo "::error::Claude execution log が無く、author / critic 実行を証明できません"
            exit 1
          fi
          # ★partial-publish (2026-08-07): 1 件でも落ちると全件を publish しない
          #   オールオアナッシングを廃止し、通過分だけ publish する。失敗キーは staging を
          #   drop して次回へ繰り越し、連続失敗は record-generation-outcome.mjs が quarantine
          #   へ積む (build-ai-content-queue.mjs が --next から外す)。公開対象 0 件のときだけ
          #   run を赤くする (silent-green 防止)。★per-item 失敗で step を殺さないよう、
          #   fallible command は必ず if で受ける (set -e 下でも継続する)。
          GENERATED=0
          PASSED=""
          FAILED=""
          FAIL_REASON="none"
          while IFS= read -r KEY; do
            [ -z "$KEY" ] && continue
            CONTENT="data/ai-content-staging/${KEY}.json"
            REVIEW=".local/ci/ai-content-reviews/${KEY}.json"
            KEY_OK=1
            KEY_WHY=""
            for AGENT_TYPE in ranking-content-author ranking-content-critic; do
              if ! jq -e --arg agent "$AGENT_TYPE" --arg target "$KEY" \
                'any(.[] | select(.type == "assistant") | .message.content[]?;
                  .type == "tool_use" and .name == "Agent"
                  and .input.subagent_type == $agent
                  and ((.input.prompt // "") | contains($target)))' \
                "$CLAUDE_EXECUTION_FILE" >/dev/null; then
                KEY_OK=0; KEY_WHY="agent-record-missing:${AGENT_TYPE}"
                # どの subagent まで動いたかを残す (呼ばれなかったのか prompt 照合を外したのかの切り分け)。
                echo "観測された subagent: $(jq -r '[.[] | select(.type == \"assistant\") | .message.content[]? | select(.type == \"tool_use\" and .name == \"Agent\") | .input.subagent_type] | unique | join(\", \")' "$CLAUDE_EXECUTION_FILE" 2>/dev/null || echo '(取得不可)')"
                break
              fi
            done
            if [ "$KEY_OK" = 1 ] && [ ! -s "$CONTENT" ]; then
              KEY_OK=0; KEY_WHY="no-staging"
            fi
            if [ "$KEY_OK" = 1 ]; then
              if ! node .claude/scripts/ai-content/audit-ai-content.mjs --file "$CONTENT"; then
                KEY_OK=0; KEY_WHY="audit-blocker"
              fi
            fi
            if [ "$KEY_OK" = 1 ]; then
              if [ ! -s "$REVIEW" ] || [ "$(jq -r '.verdict // empty' "$REVIEW")" != "PASS" ] \
                || [ "$(jq -r '.rankingKey // empty' "$REVIEW")" != "$KEY" ]; then
                KEY_OK=0; KEY_WHY="critic-not-pass"
              fi
            fi
            if [ "$KEY_OK" = 1 ]; then
              PASSED="$PASSED $KEY"
              GENERATED=$((GENERATED + 1))
            else
              echo "::warning::生成失敗のため drop (次回へ繰り越し): ${KEY} (${KEY_WHY})"
              FAILED="$FAILED $KEY"
              FAIL_REASON="$KEY_WHY"
              rm -f "$CONTENT"
            fi
          done < .local/ci/ai-content-targets.txt
          # quarantine 状態を更新 (連続失敗キーを次回 --next から外す)。更新失敗は非致命。
          node .claude/scripts/ai-content/record-generation-outcome.mjs \
            --state .claude/state/ai-content/generation-failures.json \
            --passed "$(echo "$PASSED" | tr ' ' ',')" \
            --failed "$(echo "$FAILED" | tr ' ' ',')" \
            --reason "$FAIL_REASON" \
            --date "$(date -u +%F)" || echo "::warning::quarantine 状態の更新に失敗 (非致命)"
          if [ "$GENERATED" -eq 0 ]; then
            echo "::error::対象 ${EXPECTED} 件すべて生成/critic に失敗 (公開対象 0 件)"
            exit 1
          fi
          if [ -n "${FAILED// /}" ]; then
            echo "::warning::部分成功: ${GENERATED}/${EXPECTED} 件を公開・失敗は次回へ繰り越し:${FAILED}"
          fi
          while IFS= read -r FILE; do
            case "$FILE" in
              data/ai-content-staging/*.json|.claude/state/ai-content/*) ;;
              *)
                echo "::error::Claude routine の許可外変更: ${FILE}"
                exit 1
                ;;
            esac
          # core.quotepath=false が要る (blog routine と同じ理由)。ここの許可パターンは
          # 現状すべて ASCII なので既定でも一致するが、非 ASCII パスが 1 つ混ざった瞬間に
          # 8 進エスケープされて全件 reject になる。両 routine で同じ形に揃えておく。
          done < <(git -c core.quotepath=false status --porcelain=v1 --untracked-files=all | cut -c4-)
          echo "count=$GENERATED" >> "$GITHUB_OUTPUT"
          echo "✅ 公開対象 ${GENERATED}/${EXPECTED} 件 (audit + critic PASS)"

      - name: 📈 Rebuild queue (progress) and commit
        id: commit
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          # 生成物 (outbox) と進捗を同一 commit で push する。
          node .claude/scripts/ai-content/build-ai-content-queue.mjs --scope all || true
          # push トリガーで来た request は同じ commit で消費する (再実行のループを防ぐ)
          if [ "${{ github.event_name }}" = "push" ]; then
            git rm -q --ignore-unmatch data/ai-content-generate-requests.json || true
          fi
          git add data/ai-content-staging .claude/state/ai-content || true
          NEW="${{ steps.verify.outputs.count || '0' }}"
          echo "outbox=${NEW}" >> "$GITHUB_OUTPUT"
          if git diff --cached --quiet; then
            if [ "${{ steps.pick.outputs.count }}" != "0" ]; then
              echo "::error::対象ありなのに commit 対象がありません"
              exit 1
            fi
            echo "対象0件・進捗変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore(ai-content): daily Claude Code generation (outbox ${NEW} 件)"
          for i in 1 2 3; do
            if git pull --rebase --quiet origin develop && git push origin HEAD:develop; then
              echo "✅ pushed (outbox ${NEW} 件)"
              exit 0
            fi
            echo "push retry $i"; sleep 5
          done
          # ★push できなければ生成物が届かない。黙って成功にしない
          echo "::error::develop への push に 3 回失敗した (outbox ${NEW} 件が未配送)"
          exit 1

      # ★outbox を publish へ渡す (2026-07-31 追加)。
      #   GitHub Actions は **既定の GITHUB_TOKEN で push した場合、後続 workflow を発火させない**
      #   (無限ループ防止の仕様)。そのため上の push だけでは publish-ai-content.yml の push トリガーは
      #   発火せず、生成物が outbox に滞留する。実際 2026-07-31 の初回成功時に 2 件が滞留した。
      #   → ここで明示的に dispatch し、**run が生まれたことを確認**してから成功とする。
      - name: 🚀 Dispatch publish-ai-content (outbox を R2 へ)
        if: ${{ env.DRY_RUN != 'true' && steps.verify.outputs.count != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LATEST_BEFORE=$(gh run list --workflow publish-ai-content.yml --branch develop \
            --limit 1 --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run publish-ai-content.yml --ref develop
          # dispatch は非同期。「発火した」と言い切らず run の出現を実測する
          for _ in $(seq 1 12); do
            sleep 5
            LATEST_AFTER=$(gh run list --workflow publish-ai-content.yml --branch develop \
              --limit 1 --json databaseId --jq '.[0].databaseId // 0')
            if [ "${LATEST_AFTER}" != "${LATEST_BEFORE}" ]; then
              echo "✅ publish-ai-content を起動 (run ${LATEST_AFTER} / outbox ${{ steps.commit.outputs.outbox }} 件)"
              exit 0
            fi
          done
          echo "::error::publish-ai-content の run を確認できなかった (outbox が滞留する)"
          exit 1

      - name: 🧹 Close resolved routine issues
        if: ${{ success() && env.DRY_RUN != 'true' && steps.pick.outputs.count != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for TITLE in "🤖 ai-content: 今日の生成対象" "🚨 AI-content routine failed"; do
            NUMBER=$(gh issue list --search "$TITLE in:title" --state open --json number --jq '.[0].number // empty')
            if [ -n "$NUMBER" ]; then gh issue close "$NUMBER" --reason completed; fi
          done

      # ★1 件あたりのトークン実績を残す (2026-08-03)。
      #   件数を 1→5 / 1→3 に引き上げたのに「1 件で何トークンか」を一度も測っていなかった。
      #   execution log には usage が最初から書かれていて、診断 step も既にこのファイルを読んでいる。
      #   捨てていただけなので append-only の履歴にする。
      #   失敗 run こそ知りたい (利用枠に当たったか) ので always()。
      #   計測が本体の成否を左右してはいけないので continue-on-error にする (無視ではなく可視化)。
      - name: 📊 Record token usage
        if: ${{ always() && steps.claude.outcome != 'skipped' }}
        continue-on-error: true
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          FILE="${CLAUDE_EXECUTION_FILE:-/home/runner/work/_temp/claude-execution-output.json}"
          node .claude/scripts/lib/record-claude-usage.mjs "$FILE" \
            --workflow ai-content \
            --run-id "${{ github.run_id }}" \
            --limit "${LIMIT}" \
            --items "${{ steps.verify.outputs.count || '0' }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude/state/metrics/claude-usage || true
          if git diff --cached --quiet; then echo "記録する変更なし"; exit 0; fi
          git commit -q -m "chore(metrics): record Claude token usage [skip ci]"
          git stash push --include-untracked --quiet || true
          for _ in 1 2 3; do
            if git pull --rebase --quiet origin develop && git push origin HEAD:develop; then
              echo "✅ トークン実績を記録した"
              exit 0
            fi
            sleep 5
          done
          echo "::error::トークン実績の push に失敗した (計測のみ・本体には影響しない)"
          exit 1

      - name: 🚨 Upsert failure issue
        if: ${{ failure() && env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="🚨 AI-content routine failed"
          DIAG="(診断なし: Claude step まで到達していないか、execution log を読めなかった)"
          if [ -s .local/ci/claude-diagnosis.txt ]; then DIAG=$(cat .local/ci/claude-diagnosis.txt); fi
          BODY="日次AI-content生成が失敗しました。対象あり生成0件、認証、audit、critic、push/dispatchのいずれかです。

          Run: ${RUN_URL}
          Target count: ${{ steps.pick.outputs.count || 'unknown' }}

          <details><summary>Claude 実行の失敗診断</summary>

          \`\`\`
          ${DIAG}
          \`\`\`

          </details>

          成功するまでgreen扱いにはなりません。"
          NUMBER=$(gh issue list --search "$TITLE in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label auto-generated
          fi

      - name: 📝 Summary
        if: always()
        run: |
          {
            echo "### 進捗 (キュー再構築後)"
            sed -n '/^## サマリ/,/^## いつ修正したか/p' .claude/state/ai-content/LATEST.md | head -20
          } >> "$GITHUB_STEP_SUMMARY"

      # ★request は結果によらず必ず消費する (blog 側と同じ理由。2026-07-31)。
      #   失敗した run が request を残すと、同じ内容の再 push では diff が出ず再実行できない。
      - name: 🧹 Consume request (未消費なら)
        if: ${{ always() && github.event_name == 'push' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch data/ai-content-generate-requests.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "chore(ai-content): consume generate request [skip ci]"
          # ★キュー再構築の step が tracked な state を書き換えるため作業ツリーが汚れる。
          #   そのまま rebase すると "cannot pull with rebase: You have unstaged changes" で
          #   落ち、request が消費されないまま develop に残る (2026-08-02 run 30769885097 で実測)。
          #   残ると同内容の再 push が paths フィルタで発火しなくなる。消費に不要な差分なので退避する。
          git stash push --include-untracked --quiet || true
          for i in 1 2 3; do
            if git pull --rebase --quiet origin develop && git push origin HEAD:develop; then
              echo "✅ request を消費した"
              exit 0
            fi
            echo "consume retry $i"; sleep 5
          done
          echo "::error::request の消費に失敗した (同内容の再 push が発火しなくなる)"
          exit 1
