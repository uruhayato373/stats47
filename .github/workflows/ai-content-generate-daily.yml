name: 🤖 AI Content Daily (キュー更新 + 今日の対象提示)

# ranking ai-content の「全件完成」を日次で進めるループ (2026-07-31 に Gemini から移行)。
#
# ★LLM はこの workflow では呼ばない。GitHub Actions の中で LLM を呼ぶ形は Claude でも
#   Gemini でも別課金になるため、「書く」工程は Claude セッション (Max サブスク内) が担う。
#   ここは決定的で無料な工程だけを回す。
#
#   1. キューを全件スコープで再構築 (R2 が真実源・派生ビュー)
#   2. needs-regen 上位 N 件を Issue に提示 (生成は Claude セッション: /generate-ai-content)
#   3. セッションが outbox に置いた生成物を develop に push し、publish-ai-content.yml を
#      dispatch → 決定的ゲート再検証 → R2 → CDN purge
#      (★push トリガー任せにしない。既定 GITHUB_TOKEN の push は後続 workflow を発火させない仕様)
#   4. キューを再構築して進捗を commit-back (LATEST.md / progress-history.csv)
#
# 品質は「賢いモデル」ではなく「決定的ゲート + critic」で担保する。ゲートは緩めない
# (正典: .claude/rules/ranking-content-standards.md §実データ照合 / §生成パイプライン)。
#
# ★安全装置
#   - LIMIT は publish-ai-content.yml の MAX_PUBLISH (40) を超えない。超えると公開が次回に繰り越す
#   - 進捗 commit は outbox と同一 commit にする (生成物と進捗がずれない)
#   - push も dispatch も失敗を握り潰さない。届かなければ run を赤くする

on:
  schedule:
    - cron: "0 18 * * *" # JST 03:00 (UTC 18:00)
  # push トリガー (cloud 用): develop に data/ai-content-generate-requests.json を commit/push
  # すると実行し、消費した request を git rm で commit-back する。cloud セッションは
  # actions:write が無く workflow_dispatch できない (403) ため。data-refresh.yml と同じ方式。
  #   { "limit": 10, "dryRun": false }
  push:
    branches: [develop]
    paths: ['data/ai-content-generate-requests.json']
  workflow_dispatch:
    inputs:
      limit:
        description: "提示する件数 (既定 10。サブスク消費を実測してから増やす)"
        required: false
        default: "10"
      dry_run:
        description: "true: Issue を出さず対象だけ確認する"
        required: false
        default: "false"

permissions:
  contents: write
  issues: write
  actions: write # publish-ai-content.yml を dispatch するため (既定 token の push は後続 workflow を発火させない)

concurrency:
  group: ai-content-generate
  cancel-in-progress: false

env:
  R2_PUBLIC_FETCH_URL: https://storage.stats47.jp
  # 控えめに始めて実測する。旧 40 は Gemini 前提の根拠なき暫定値なので引き継がない
  LIMIT: ${{ inputs.limit || '10' }}
  DRY_RUN: ${{ inputs.dry_run || 'false' }}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 🧰 Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 2

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      # push トリガー時は request file を、それ以外は workflow_dispatch の inputs を使う。
      # GITHUB_ENV に書くので、後続 step の if: env.DRY_RUN も解決される。
      - name: 🧭 Resolve inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          REQ=data/ai-content-generate-requests.json
          if [ "$EVENT_NAME" = "push" ] && [ -f "$REQ" ]; then
            {
              echo "LIMIT=$(node -e "const r=require('./$REQ');process.stdout.write(String(r.limit??10))")"
              echo "DRY_RUN=$(node -e "const r=require('./$REQ');process.stdout.write(r.dryRun===true?'true':'false')")"
            } >> "$GITHUB_ENV"
            echo "request で上書きした (値は上の行のとおり)"
          fi

      - name: 📊 Rebuild queue (scope=all) and pick targets
        id: pick
        run: |
          node .claude/scripts/ai-content/build-ai-content-queue.mjs --scope all
          # needs-regen 上位 N (impressions 降順) を取得
          node .claude/scripts/ai-content/build-ai-content-queue.mjs --no-build --next "${LIMIT}" > /tmp/targets.txt
          KEYS=$(paste -sd, /tmp/targets.txt)
          COUNT=$(wc -l < /tmp/targets.txt | tr -d ' ')
          echo "keys=$KEYS" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "対象 ${COUNT} 件: $(head -5 /tmp/targets.txt | paste -sd' ')…"

      # ★生成はここでは行わない (2026-07-31 に Gemini から移行)。
      #   GitHub Actions の中で LLM を呼ぶ形は Claude でも Gemini でも別課金になるため、
      #   「書く」工程は Claude セッション (Max サブスク内) が担う。この workflow は
      #   キューを最新化して**今日の対象を提示するところまで**。
      #   セッション側の入口: skill /generate-ai-content (agent: ranking-content-author)
      - name: 📋 今日の対象を Issue に出す
        if: ${{ env.DRY_RUN != 'true' && steps.pick.outputs.count != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="🤖 ai-content: 今日の生成対象"
          BODY=$(
            echo "本日の対象 ${{ steps.pick.outputs.count }} 件です。Claude セッションで次を実行してください:"
            echo
            echo '```'
            echo "/generate-ai-content --keys ${{ steps.pick.outputs.keys }}"
            echo '```'
            echo
            echo "生成 → 決定的ゲート (audit-ai-content.mjs) → critic → outbox → publish の順です。"
            echo "ゲートは緩めません。落ちたら直して通します。"
            echo
            echo "進捗: \`.claude/state/ai-content/LATEST.md\`"
          )
          EXIST=$(gh issue list --search "$TITLE in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXIST" ]; then
            gh issue edit "$EXIST" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label auto-generated
          fi

      - name: 📈 Rebuild queue (progress) and commit
        id: commit
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          # 生成物 (outbox) と進捗を同一 commit で push する。
          node .claude/scripts/ai-content/build-ai-content-queue.mjs --scope all || true
          # push トリガーで来た request は同じ commit で消費する (再実行のループを防ぐ)
          if [ "${{ github.event_name }}" = "push" ]; then
            git rm -q --ignore-unmatch data/ai-content-generate-requests.json || true
          fi
          git add data/ai-content-staging .claude/state/ai-content || true
          # ls ではなく find で数える (SC2012。ファイル名に非英数が入っても壊れない)
          NEW=$(find data/ai-content-staging -maxdepth 1 -name '*.json' -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "outbox=${NEW}" >> "$GITHUB_OUTPUT"
          if git diff --cached --quiet; then
            echo "変更なし (生成 0 件・進捗も不変)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore(ai-content): daily gemini generation (outbox ${NEW} 件)"
          for i in 1 2 3; do
            if git pull --rebase --quiet origin develop && git push origin HEAD:develop; then
              echo "✅ pushed (outbox ${NEW} 件)"
              exit 0
            fi
            echo "push retry $i"; sleep 5
          done
          # ★push できなければ生成物が届かない。黙って成功にしない
          echo "::error::develop への push に 3 回失敗した (outbox ${NEW} 件が未配送)"
          exit 1

      # ★outbox を publish へ渡す (2026-07-31 追加)。
      #   GitHub Actions は **既定の GITHUB_TOKEN で push した場合、後続 workflow を発火させない**
      #   (無限ループ防止の仕様)。そのため上の push だけでは publish-ai-content.yml の push トリガーは
      #   発火せず、生成物が outbox に滞留する。実際 2026-07-31 の初回成功時に 2 件が滞留した。
      #   → ここで明示的に dispatch し、**run が生まれたことを確認**してから成功とする。
      - name: 🚀 Dispatch publish-ai-content (outbox を R2 へ)
        if: ${{ env.DRY_RUN != 'true' && steps.commit.outputs.outbox != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LATEST_BEFORE=$(gh run list --workflow publish-ai-content.yml --branch develop \
            --limit 1 --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run publish-ai-content.yml --ref develop
          # dispatch は非同期。「発火した」と言い切らず run の出現を実測する
          for _ in $(seq 1 12); do
            sleep 5
            LATEST_AFTER=$(gh run list --workflow publish-ai-content.yml --branch develop \
              --limit 1 --json databaseId --jq '.[0].databaseId // 0')
            if [ "${LATEST_AFTER}" != "${LATEST_BEFORE}" ]; then
              echo "✅ publish-ai-content を起動 (run ${LATEST_AFTER} / outbox ${{ steps.commit.outputs.outbox }} 件)"
              exit 0
            fi
          done
          echo "::error::publish-ai-content の run を確認できなかった (outbox が滞留する)"
          exit 1

      - name: 📝 Summary
        if: always()
        run: |
          {
            echo "### 進捗 (キュー再構築後)"
            sed -n '/^## サマリ/,/^## いつ修正したか/p' .claude/state/ai-content/LATEST.md | head -20
          } >> "$GITHUB_STEP_SUMMARY"

      # ★request は結果によらず必ず消費する (blog 側と同じ理由。2026-07-31)。
      #   失敗した run が request を残すと、同じ内容の再 push では diff が出ず再実行できない。
      - name: 🧹 Consume request (未消費なら)
        if: ${{ always() && github.event_name == 'push' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch data/ai-content-generate-requests.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "chore(ai-content): consume generate request [skip ci]"
          git pull --rebase --quiet origin develop && git push origin HEAD:develop
