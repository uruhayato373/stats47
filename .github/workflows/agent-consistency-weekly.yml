name: 🔗 Agent/Skill Consistency (weekly)

# agent/skill/script/hook と文書ガバナンスの整合性ドリフトを週次で機械検出する。
# 従来は Stop hook (`check-consistency-on-stop.js`) のセッション内ゲートのみで、
# セッション外の直接編集や複数セッションの合流によるドリフトは検出されなかった
# (2026-07-03 運営総点検: zombie agent seo-auditor が README/skill 参照とズレたまま放置)。
# error レベル検出時は auto-generated Issue を起票する。warn (orphan 候補) は起票しない。
#
# 正典: .claude/scripts/lib/check-agent-skill-consistency.cjs / .claude/skills/dev/audit-consistency/SKILL.md
#       .claude/rules/docs-vs-issues.md / .claude/skills/management/maintain-docs/SKILL.md

on:
  schedule:
    # 毎週月曜 JST 07:00 (= 日曜 22:00 UTC)。週初に棚卸しして週次計画に反映できるように。
    - cron: "0 22 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: agent-consistency-weekly
  cancel-in-progress: false

jobs:
  consistency-check:
    name: Consistency Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 🧰 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔗 Run consistency check
        id: check
        run: |
          set +e
          node --test .claude/scripts/lib/__tests__/check-agent-skill-consistency.test.cjs
          TEST_EXIT=$?
          node .claude/scripts/lib/check-agent-skill-consistency.cjs > /tmp/consistency-report.txt 2>&1
          CHECK_EXIT=$?
          if [ "$TEST_EXIT" -ne 0 ] || [ "$CHECK_EXIT" -ne 0 ]; then
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
          else
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/consistency-report.txt

      - name: 🧭 Check business plan SSOT
        run: npm run business-plan:check

      - name: 🧩 Check checker wiring
        id: checker_wiring
        run: |
          set +e
          node .claude/scripts/lib/check-checker-wiring.cjs --baseline > /tmp/checker-wiring-report.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/checker-wiring-report.txt

      - name: 🚨 Create issue on unwired checker regression
        if: steps.checker_wiring.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="[Consistency Alert] 新規未配線 checker 検出 ($(date +%Y-%m-%d))"
          EXISTING=$(gh issue list --label "auto-generated" --state open \
            --search "新規未配線 checker in:title" --json number --jq '.[0].number // empty')
          {
            echo "check/audit/validate/verify/lint/guard 系scriptがどこからも参照されていません。"
            echo ""
            echo '```'
            head -60 /tmp/checker-wiring-report.txt
            echo '```'
          } > /tmp/checker-wiring-issue.md
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/checker-wiring-issue.md
          else
            gh issue create --title "$TITLE" --label "auto-generated" --body-file /tmp/checker-wiring-issue.md
          fi

      - name: 📚 Check docs governance, freshness and links
        id: docs
        run: |
          set +e
          node --test \
            .claude/scripts/lib/__tests__/check-docs-governance.test.cjs \
            .claude/scripts/lib/__tests__/check-docs-links.test.cjs \
            > /tmp/docs-test-report.txt 2>&1
          TEST_EXIT=$?
          node .claude/scripts/lib/check-docs-governance.cjs --fail-on-warn \
            > /tmp/docs-governance-report.txt 2>&1
          GOVERNANCE_EXIT=$?
          node .claude/scripts/lib/check-docs-links.cjs --baseline --orphans \
            > /tmp/docs-links-report.txt 2>&1
          LINKS_EXIT=$?
          cat /tmp/docs-test-report.txt
          cat /tmp/docs-governance-report.txt
          cat /tmp/docs-links-report.txt
          if [ "$TEST_EXIT" -ne 0 ] || [ "$GOVERNANCE_EXIT" -ne 0 ] || [ "$LINKS_EXIT" -ne 0 ]; then
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
          else
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 🚨 Create issue on docs governance drift
        if: steps.docs.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="[Docs Alert] 文書ガバナンスまたは鮮度のドリフト ($(date +%Y-%m-%d))"
          EXISTING=$(gh issue list --label "auto-generated" --state open \
            --search "文書ガバナンスまたは鮮度のドリフト in:title" --json number --jq '.[0].number // empty')
          {
            echo "文書の固定構成、TODO契約、鮮度、INDEX、またはリンクの週次検査で異常を検出しました。"
            echo ""
            echo "対処: \`/maintain-docs\` を実行し、意味判断が必要な統合・削除は差分確認後に行ってください。"
            echo ""
            echo '```'
            head -80 /tmp/docs-governance-report.txt
            head -40 /tmp/docs-links-report.txt
            echo '```'
          } > /tmp/docs-governance-issue.md
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/docs-governance-issue.md
          else
            gh issue create --title "$TITLE" --label "auto-generated" --body-file /tmp/docs-governance-issue.md
          fi

      - name: 🔍 Verify public snapshots
        id: snapshots
        run: |
          set +e
          npx tsx apps/web/scripts/verify-page-components-snapshot.ts > /tmp/page-components-verify.txt 2>&1
          PAGE_EXIT=$?
          npx tsx apps/web/scripts/verify-affiliate-ads-snapshot.ts > /tmp/affiliate-ads-verify.txt 2>&1
          AFFILIATE_EXIT=$?
          cat /tmp/page-components-verify.txt
          cat /tmp/affiliate-ads-verify.txt
          if [ "$PAGE_EXIT" -ne 0 ] || [ "$AFFILIATE_EXIT" -ne 0 ]; then
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
          else
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 🚨 Create issue on snapshot drift
        if: steps.snapshots.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="[Consistency Alert] git TS と公開R2 snapshotのドリフト ($(date +%Y-%m-%d))"
          EXISTING=$(gh issue list --label "auto-generated" --state open \
            --search "公開R2 snapshotのドリフト in:title" --json number --jq '.[0].number // empty')
          {
            echo "git TS SSOT と公開R2 snapshotに不一致があります。"
            echo ""
            echo '```'
            head -40 /tmp/page-components-verify.txt
            head -40 /tmp/affiliate-ads-verify.txt
            echo '```'
          } > /tmp/snapshot-drift-issue.md
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/snapshot-drift-issue.md
          else
            gh issue create --title "$TITLE" --label "auto-generated" --body-file /tmp/snapshot-drift-issue.md
          fi

      - name: 🚨 Create issue on error-level drift
        if: steps.check.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="[Consistency Alert] agent/skill 整合性ドリフト検出"
          EXISTING=$(gh issue list --label "auto-generated" --state open \
            --search "\"agent/skill 整合性ドリフト検出\" in:title" --json number --jq '.[0].number // empty')
          {
            echo "週次整合性チェックで error レベルのドリフトを検出しました。"
            echo ""
            echo "対処: \`/audit-consistency\` スキルで機械チェック(床)+意味レビュー(天井)を実施してください。"
            echo ""
            echo '```'
            grep -E "^✖|^⚠|^計" /tmp/consistency-report.txt | head -40
            echo '```'
          } > /tmp/issue-body.md
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "$TITLE" --body-file /tmp/issue-body.md
          else
            gh issue create \
              --title "$TITLE" \
              --label "auto-generated" \
              --body-file /tmp/issue-body.md
          fi

      - name: ✅ Close recovered agent/skill consistency alert
        if: steps.check.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --label "auto-generated" --state open \
            --search "\"agent/skill 整合性ドリフト検出\" in:title" --json number --jq '.[].number' |
            while read -r NUMBER; do
              gh issue close "$NUMBER" --reason completed \
                --comment "agent/skill整合性チェックが正常へ復旧したため自動Closeします。"
            done

      - name: 📦 Check active ranking → R2 coverage (公開漏れ)
        # 逆方向突合: isActive:true + KNOWN なのに R2 item.json が無い「公開漏れ」を検出。
        # 順方向 (GONE なのに生きている) は ranking-key-consistency.test.ts が毎 PR で検証。
        id: coverage
        run: |
          set +e
          node .claude/scripts/ranking/check-active-r2-coverage.mjs > /tmp/coverage-report.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/coverage-report.txt

      - name: 🚨 Create issue on missing R2 snapshots
        if: steps.coverage.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="[Consistency Alert] active ranking の R2 snapshot 欠落 ($(date +%Y-%m-%d))"
          EXISTING=$(gh issue list --label "auto-generated" --state open \
            --search "R2 snapshot 欠落 in:title" --json number --jq '.[0].number // empty')
          {
            echo "isActive:true + KNOWN 登録済みなのに R2 \`app/ranking/<key>/item.json\` が無いキーを検出しました (本番 notFound の公開漏れ)。"
            echo ""
            echo '```'
            head -60 /tmp/coverage-report.txt
            echo '```'
          } > /tmp/coverage-issue.md
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/coverage-issue.md
          else
            gh issue create \
              --title "$TITLE" \
              --label "auto-generated" \
              --body-file /tmp/coverage-issue.md
          fi

      - name: 📦 Check .claude/state size budget (肥大歯止め・WARN のみ)
        # git 追跡下の .claude/state/ が肥大すると clone/checkout が重くなる (監査 2026-07-03: 13MB)。
        # 予算 15MB 超で auto-generated Issue を起票する。PSI/GSC/Cloudflare の生snapshotは
        # 専用producerで保持上限を適用し、履歴SSOTや運用queueは削除しない。
        id: statesize
        run: |
          SIZE_MB=$(du -sm .claude/state 2>/dev/null | cut -f1)
          echo "state_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"
          echo ".claude/state = ${SIZE_MB}MB (予算 15MB)"
          find .claude/state -type f -size +512k -exec du -h {} \; | sort -rh | head -15

      - name: 🚨 Create issue on state bloat
        if: ${{ steps.statesize.outputs.state_mb != '' && fromJSON(steps.statesize.outputs.state_mb) > 15 }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="[Consistency Alert] .claude/state が予算超過 (${{ steps.statesize.outputs.state_mb }}MB > 15MB)"
          EXISTING=$(gh issue list --label "auto-generated" --state open \
            --search "state が予算超過 in:title" --json number --jq '.[0].number // empty')
          {
            echo ".claude/state/ が予算 15MB を超えました (${{ steps.statesize.outputs.state_mb }}MB)。clone/checkout が重くなります。"
            echo ""
            echo "対処: \`npm run state:snapshots:prune\` で安全対象だけを間引き、残りは用途を確認して判断。"
            echo "history CSV・LATEST・queue・resubmit-history は自動削除しないこと。"
            echo ""
            echo '```'
            find .claude/state -type f -size +512k -exec du -h {} \; | sort -rh | head -20
            echo '```'
          } > /tmp/state-issue.md
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "$TITLE" --body-file /tmp/state-issue.md
          else
            gh issue create \
              --title "$TITLE" \
              --label "auto-generated" \
              --body-file /tmp/state-issue.md
          fi

      - name: ✅ Close recovered state budget alert
        if: ${{ steps.statesize.outputs.state_mb != '' && fromJSON(steps.statesize.outputs.state_mb) <= 15 }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --label "auto-generated" --state open \
            --search "\"state が予算超過\" in:title" --json number --jq '.[].number' |
            while read -r NUMBER; do
              gh issue close "$NUMBER" --reason completed \
                --comment ".claude/state が15MB以下へ復旧したため自動Closeします。"
            done

      # 投稿台帳 (posts.json) は SSOT だが、IG cron の記録 step が落ちても run は success に
      # なりうるため、投稿経路とは別にドリフトを検知する。この検知が無かったせいで
      # 2026-05-18〜08-03 の 94 件が 2 ヶ月半気づかれず、主力チャネルの実績が計測不能だった。
      - name: 📸 Check IG 投稿台帳ドリフト
        id: igdrift
        continue-on-error: true
        run: |
          if node .claude/scripts/instagram/record-posted.cjs --check > /tmp/ig-drift.txt 2>&1; then
            echo "drift=0" >> "$GITHUB_OUTPUT"
          else
            echo "drift=1" >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/ig-drift.txt

      - name: 🚨 Create issue on IG ledger drift
        if: ${{ steps.igdrift.outputs.drift == '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="[Consistency Alert] IG 投稿が投稿台帳に記録されていない"
          EXISTING=$(gh issue list --label "auto-generated" --state open \
            --search "IG 投稿が投稿台帳 in:title" --json number --jq '.[0].number // empty')
          {
            echo "\`ig-posted-log.jsonl\` にあって \`.claude/state/sns/posts.json\` に無い投稿があります。"
            echo "台帳に無い投稿は \`/update-sns-metrics\` の対象外になり、リーチ・保存率が計測できません。"
            echo ""
            echo "対処: \`node .claude/scripts/instagram/record-posted.cjs --from-log\` で回収し、"
            echo "\`post-instagram-scheduled.yml\` の記録 step が落ちていないか確認する。"
            echo "正典: \`.claude/rules/sns-content-standards.md\` §3"
            echo ""
            echo '```'
            cat /tmp/ig-drift.txt
            echo '```'
          } > /tmp/ig-issue.md
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "$TITLE" --body-file /tmp/ig-issue.md
          else
            gh issue create --title "$TITLE" --label "auto-generated" --body-file /tmp/ig-issue.md
          fi

      - name: ✅ Close recovered IG ledger alert
        if: ${{ steps.igdrift.outputs.drift == '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --label "auto-generated" --state open \
            --search "\"IG 投稿が投稿台帳\" in:title" --json number --jq '.[].number' |
            while read -r NUMBER; do
              gh issue close "$NUMBER" --reason completed \
                --comment "IG 投稿台帳のドリフトが解消したため自動Closeします。"
            done
