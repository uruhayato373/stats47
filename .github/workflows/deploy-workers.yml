name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  # ★手動再デプロイ (2026-08-04 追加)。コード変更なしで buildId を更新したいときに使う。
  #   例: R2 snapshot を新規に満たした直後。ISR は buildId 単位でキャッシュされるため、
  #   再デプロイしないと「データが無かった頃の HTML」が最大 24h 残る
  #   (purge-cdn は CDN のみで ISR には効かない → .claude/rules/nextjs-ssg-preservation.md)。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    # Metric contract migrations publish the matching snapshots before building.
    # 全指標のスナップショット反映が 40 分を超えて 2 回 cancelled になった (2026-10-09・run 37909376740)。
    # 反映の並列化までの暫定で 90 分にする (DEPLOY-METRIC-RELEASE-TIMEOUT-01)。r2-write を握る時間も延びる点に注意。
    timeout-minutes: 90
    concurrency:
      group: r2-write
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Workers Cache対応のWrangler 4.123+ は Node.js 22+ が必須。
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Detect metric snapshot changes
        id: metric-snapshots
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BEFORE_SHA" ] || ! git cat-file -e "$BEFORE_SHA^{commit}"; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BEFORE_SHA" HEAD > /tmp/metric-release-changed-files.txt
            if grep -Eq '^(data/metrics/|data/metric-sources/|packages/types/src/metric-presentation|packages/data-configs/src/|packages/ranking/src/(builders/|exporters/|scripts/|repositories/schemas/)|apps/web/scripts/(data/page-components/|export-page-components-snapshot))' /tmp/metric-release-changed-files.txt; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Generate and verify metric release snapshots
        if: steps.metric-snapshots.outputs.changed == 'true'
        env:
          R2_PUBLIC_FETCH_URL: https://storage.stats47.jp
        run: |
          npx tsx -r ./packages/ranking/src/scripts/setup-cli.js packages/ranking/src/scripts/generate-ranking-items.ts --stage-dir .local/r2
          npx tsx packages/ranking/src/scripts/generate-municipality-ranking.ts --all-published --source-base https://storage.stats47.jp --output-root .local/r2
          npx tsx -r ./packages/ranking/src/scripts/setup-cli.js packages/ranking/src/scripts/export-master-snapshots.ts --staged-metrics
          npx tsx -r ./packages/ranking/src/scripts/setup-cli.js apps/web/scripts/export-page-components-snapshot.ts
          npm run metrics:verify-snapshots
          node --input-type=module -e '
            import fs from "node:fs";
            import path from "node:path";
            import {createHash} from "node:crypto";
            const root = ".local/r2";
            const allowed = /^app\/(?:ranking\/[a-z0-9-]+\/item\.json|ranking-items\/all\.json|home\/featured\.json|municipalities\/ranking\/[a-z0-9-]+\/(?:item|values)\.json|categories\/(?:all\.json|[a-z0-9-]+\/items\.json)|survey\/(?:all\.json|[a-z0-9-]+\/items\.json)|page-components\/[a-z0-9/-]+\.json)$/;
            const files = fs.readdirSync(root, {recursive:true}).map(key => String(key).split(path.sep).join("/")).filter(key => allowed.test(key)).sort().map(key => {
              const body = fs.readFileSync(path.join(root, key));
              JSON.parse(body.toString("utf8"));
              return {key, bytes:body.length, sha256:createHash("sha256").update(body).digest("hex")};
            });
            if (!files.some(file => file.key === "app/home/featured.json") || !files.some(file => file.key === "app/ranking-items/all.json")) throw new Error("Missing release metadata");
            const body = JSON.stringify({schemaVersion:1,status:"staged-unpublished",files});
            fs.writeFileSync(".local/metric-release-plan.json", body);
            fs.writeFileSync(".local/metric-release-plan.sha256", createHash("sha256").update(body).digest("hex"));
            console.log("Verified exact release scope: " + files.length + " JSON files");
          '

      - name: Publish verified metric snapshots before app build
        if: steps.metric-snapshots.outputs.changed == 'true'
        env:
          R2_S3_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: stats47
        run: |
          npx tsx packages/r2-storage/src/scripts/push-exact-r2-assets.ts --manifest .local/metric-release-plan.json --manifest-sha256 "$(cat .local/metric-release-plan.sha256)"

      - name: 🔐 Verify Cloudflare authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🔍 Verifying Cloudflare authentication..."

          # 環境変数の存在確認
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "❌ エラー: CLOUDFLARE_API_TOKEN が設定されていません"
            echo "📝 解決方法: GitHub リポジトリの Settings > Secrets and variables > Actions で CLOUDFLARE_API_TOKEN を設定してください"
            exit 1
          fi

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "❌ エラー: CLOUDFLARE_ACCOUNT_ID が設定されていません"
            echo "📝 解決方法: GitHub リポジトリの Settings > Secrets and variables > Actions で CLOUDFLARE_ACCOUNT_ID を設定してください"
            exit 1
          fi

          # APIトークンの形式確認（Bearerトークンの場合は先頭が異なる）
          if [[ "$CLOUDFLARE_API_TOKEN" =~ ^[a-zA-Z0-9_-]{40}$ ]]; then
            echo "✅ APIトークンの形式は正しいようです（40文字の英数字）"
          else
            echo "⚠️  警告: APIトークンの形式が期待と異なります（通常は40文字の英数字、ハイフン、アンダースコア）"
          fi

          # Account IDの形式確認
          if [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]]; then
            echo "✅ Account IDの形式は正しいようです（32文字の16進数）"
          else
            echo "⚠️  警告: Account IDの形式が期待と異なります（通常は32文字の16進数）"
          fi

          # Wranglerで認証をテスト
          echo "🧪 Testing authentication with Wrangler..."
          # set -e によりコマンド失敗時に即終了するのを防ぐため || true を追加
          # CLOUDFLARE_API_TOKEN は環境変数から自動的に読み込まれるため、引数での指定は不要（かつエラーになる）
          WRANGLER_OUTPUT=$(npx wrangler whoami 2>&1 || true)
          echo "$WRANGLER_OUTPUT"

          if echo "$WRANGLER_OUTPUT" | grep -q "You are logged in"; then
            echo "✅ 認証成功: Cloudflare APIトークンは有効です"
          else
            echo "❌ 認証失敗: Cloudflare APIトークンが無効または権限が不足しています"
            echo "👇 Wrangler Output:"
            echo "$WRANGLER_OUTPUT"
            echo "📝 解決方法:"
            echo "   1. Cloudflare Dashboard > My Profile > API Tokens で新しいトークンを作成"
            echo "   2. 以下の権限を設定:"
            echo "      - Account - Workers Scripts - Read"
            echo "      - Account - Workers Scripts - Edit"
            echo "      - Account - Account - Read"
            echo "      - Account - D1 - Edit"
            echo "      - Account - R2 - Edit"
            echo "   3. GitHub Secrets で CLOUDFLARE_API_TOKEN を更新"
            exit 1
          fi

          echo "✅ 認証確認完了"

      - name: Build
        working-directory: apps/web
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          NEXT_PUBLIC_ESTAT_APP_ID: ${{ vars.NEXT_PUBLIC_ESTAT_APP_ID }}
          NEXT_PUBLIC_ENV: "production"
          NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL_PRODUCTION }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_GOOGLE_ADSENSE_ENABLED: "true"
          NEXT_PUBLIC_AMAZON_ASSOCIATE_TAG: "stats47-22"
          NODE_OPTIONS: "--max-old-space-size=4096"
          # Phase 2 (D1→R2 移行): generateStaticParams / generateMetadata / sitemap が
          # build 時に R2 snapshot を fetch するため、S3 互換 API の credentials を build env に渡す。
          # CF Workers binding は build 時 (no runtime context) で sync error になるが、
          # fetchFromR2 が S3 fallback に落ちて成功するようにする。
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ vars.CLOUDFLARE_R2_BUCKET_NAME }}
        run: npm run workers:build

      - name: Verify OpenNext build
        working-directory: apps/web
        run: |
          echo "Checking OpenNext build output..."

          # 必須ファイルの存在確認
          REQUIRED_FILES=(
            ".open-next/worker.js"
            ".open-next/server-functions/default/handler.mjs"
            ".open-next/assets"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -e "$file" ]; then
              echo "Error: Required file/directory not found: $file"
              exit 1
            fi
          done

          # wrangler.toml設定の確認
          if ! grep -q 'main = "src/worker-cache-gateway.ts"' wrangler.toml; then
            echo "Error: main entry point not configured correctly in wrangler.toml"
            exit 1
          fi

          # gateway は生成済みOpenNext workerをproxy経由でbundleする。
          if ! grep -q 'from "../.open-next/worker.js"' src/open-next-worker-proxy.js; then
            echo "Error: OpenNext worker proxy is not wired to the generated worker"
            exit 1
          fi

          if ! grep -q '"nodejs_compat"' wrangler.toml; then
            echo "Warning: nodejs_compat flag not found in wrangler.toml. Node.js built-in imports will fail at runtime."
          fi

          # ビルドサイズの確認（警告のみ）
          if [ -f ".open-next/worker.js" ]; then
            WORKER_SIZE=$(stat -c%s ".open-next/worker.js" 2>/dev/null || stat -f%z ".open-next/worker.js" 2>/dev/null || echo "0")
            echo "Worker size: $WORKER_SIZE bytes"
            
            if [ "$WORKER_SIZE" -gt 10485760 ]; then
              echo "Warning: Worker bundle is large (>10MB). This may cause deployment issues."
            fi
          fi

          echo "✅ Build verification passed"

      # デプロイ前ゲート: prerender された SSG ページの <title> を走査し、notFound 固着を deploy 前に弾く。
      # 2026-06-22 障害 (ranking/areas/cities 全件 notFound 固着) の最も汎用的・精密な機械検知。
      # CI build は R2 不可なので、generateStaticParams を持つ R2 依存 route が notFound prerender 化 →
      # ここで検出して deploy をブロックする (broken 版を本番に出さない)。誤検知ゼロ (good title は素通り)。
      # 正典: .claude/rules/nextjs-ssg-preservation.md §generateStaticParams 固着
      - name: 🛡️ Pre-deploy gate — prerender notFound scan
        run: bash .github/scripts/check-prerender-notfound.sh apps/web

      - name: 🔐 Set Secrets for Production
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          WORKER_CACHE_PURGE_SECRET: ${{ secrets.WORKER_CACHE_PURGE_SECRET }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          # 楽天ウェブサービス (新 Rakuten Developers ポータル) の認証ペア。**両方必須**。
          #   RAKUTEN_APP_ID     = Application ID (UUID)
          #   RAKUTEN_ACCESS_KEY = Access Key (楽天の画面で伏せ字表示 = 秘匿値)
          # 商品カード (RakutenItemsCard) とふるさと納税カードの動的表示に使う。
          # 欠けると searchRakutenItems が [] を返し、商品カードは fallback を持たないため
          # **全ページで消える** (2026-08-04 に本番で 0 件だった実測。ふるさと納税は静的リンクへ
          # degrade するため「一応出ている」ように見え、発覚が遅れた)。
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          echo "🔐 Setting secrets for production environment..."

          if [ -z "$WORKER_CACHE_PURGE_SECRET" ]; then
            echo "❌ WORKER_CACHE_PURGE_SECRET is required for safe R2 publication"
            exit 1
          fi

          # シークレット設定用のヘルパー関数
          set_secret() {
            local secret_name=$1
            local secret_value=$2
            
            if [ -z "$secret_value" ]; then
              echo "⚠️  Warning: $secret_name not found in GitHub Secrets"
              return 0
            fi
            
            # 一時的にエラーで停止しないように設定
            set +e
            echo "$secret_value" | npx wrangler secret put "$secret_name" --env production 2>&1 | tee /tmp/wrangler_output.log
            local exit_code=$?
            set -e
            
            # エラーコード10053（Binding name already in use）の場合は警告を出して続行
            if [ $exit_code -ne 0 ]; then
              if grep -q "code: 10053" /tmp/wrangler_output.log || grep -q "already in use" /tmp/wrangler_output.log; then
                echo "⚠️  Warning: $secret_name is already set as a secret or variable. Skipping..."
                return 0
              else
                echo "❌ Error: Failed to set $secret_name"
                cat /tmp/wrangler_output.log
                return $exit_code
              fi
            else
              echo "✅ $secret_name set for production"
            fi
          }

          # AUTH_SECRETを設定（GitHub Secretsから取得）
          set_secret "AUTH_SECRET" "$AUTH_SECRET"

          # R2 snapshot 公開後に Workers Cache を即時無効化する内部APIの認証secret
          set_secret "WORKER_CACHE_PURGE_SECRET" "$WORKER_CACHE_PURGE_SECRET"

          # CLOUDFLARE_ACCOUNT_IDを設定（R2ストレージアクセス用）
          set_secret "CLOUDFLARE_ACCOUNT_ID" "$CLOUDFLARE_ACCOUNT_ID"

          # CLOUDFLARE_API_TOKENを設定（R2ストレージアクセス用）
          set_secret "CLOUDFLARE_API_TOKEN" "$CLOUDFLARE_API_TOKEN"

          # R2ストレージ認証情報を設定
          set_secret "CLOUDFLARE_R2_ACCESS_KEY_ID" "$CLOUDFLARE_R2_ACCESS_KEY_ID"
          set_secret "CLOUDFLARE_R2_SECRET_ACCESS_KEY" "$CLOUDFLARE_R2_SECRET_ACCESS_KEY"

          # 楽天ウェブサービスの認証ペアを設定（商品カード / ふるさと納税カードの動的表示）
          set_secret "RAKUTEN_APP_ID" "$RAKUTEN_APP_ID"
          set_secret "RAKUTEN_ACCESS_KEY" "$RAKUTEN_ACCESS_KEY"

          echo "✅ Secrets configuration completed for production"

      - name: Deploy to Production
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy --env production

      # ウォームの前に、本番が今回のビルドを返し始めたのを確かめてから Workers Cache を全部消す。
      # 2026-10-06: デプロイ後に / の HTML が消えた CSS (404) を参照したまま Workers Cache に残り、
      # ホームが CSS なしで表示された (Issue #1089)。経緯と根拠は script 冒頭。
      - name: 🧹 Reset Workers Cache after deploy
        env:
          WORKER_CACHE_PURGE_SECRET: ${{ secrets.WORKER_CACHE_PURGE_SECRET }}
        run: bash .github/scripts/reset-worker-cache-after-deploy.sh https://stats47.jp apps/web/.open-next/assets

      # デプロイ直後にウォームして Worker + D1 接続を初期化する（コールドスタート対策）。
      - name: Warm cache (Production)
        continue-on-error: true
        run: |
          sleep 10
          bash .github/scripts/warm-cache.sh

      # 各 route テンプレートの代表 URL を content で検査し、notFound 固着 (HTTP 200 だが
      # 「〜が見つかりません」) を検知する。warm-cache は status しか見ないためすり抜ける。
      # 2026-06-22: ranking/areas/cities 全件 notFound 固着がこのゲート不在で本番に出た。
      # 失敗時はワークフローを赤にして即座に気付けるようにする (continue-on-error にしない)。
      # DIFF_BASE (直前 main HEAD) を渡すと、この push で追加された ranking キーも smoke 対象に
      # 加わる (G6・新規公開キーの初回 notFound 検知。squash merge なら before..HEAD = PR diff)
      - name: 🔎 Smoke test (Production routes)
        env:
          DIFF_BASE: ${{ github.event.before }}
        run: |
          sleep 5
          bash .github/scripts/smoke-test-routes.sh https://stats47.jp

      # sitemap index が全 shard を列挙しているかを検査する。
      # ★smoke test では原理的に検知できない欠落を拾う: 各 shard 自体は 200 で正しい
      # 内容を返すのに、index に載っていなければ Google へ提出されない。
      # 2026-08-20: cities (1,080 URL) が 2 か月・japan (19 URL) が新設直後から未提出
      # だったのを、index の件数ハードコードとして発見した (どの監視も緑のままだった)。
      - name: 🗺️ Sitemap index の整合性
        run: bash .github/scripts/check-sitemap-index.sh https://stats47.jp

      # commit message に施策 ID (EXP-NNN / T0-T3-XXX-NN) があれば improvement-log に stub を追記。
      # 詳細: .claude/scripts/lib/append-improvement-log.mjs / .claude/rules/evidence-based-judgment.md
      - name: 📝 Append improvement-log stub
        continue-on-error: true
        run: |
          MSG=$(git log -1 --pretty=%s%n%n%b "$GITHUB_SHA")
          SHA="${GITHUB_SHA:0:7}"
          DATE=$(date -u +%Y-%m-%d)
          node .claude/scripts/lib/append-improvement-log.mjs \
            --message "$MSG" \
            --sha "$SHA" \
            --date "$DATE"

      - name: 💾 Commit improvement-log changes to develop
        continue-on-error: true
        run: |
          if git diff --quiet .claude/skills/analytics/; then
            echo "No improvement-log changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # main ブランチに居る。main の improvement-log に追記した版を develop へコピーすると、
          # develop にだけある追記 (fetch-metrics-weekly の効果判定など) を main の古い版で巻き戻す。
          # main 側の追記は「stub が要るか」の判定にだけ使って捨て、develop へ切り替えてから追記し直す。
          # 契約: workflow-commit-back-core.cjs の findForeignTreeRestore。
          git checkout -- .claude/skills/analytics/

          git fetch origin develop
          git checkout develop
          git pull --rebase origin develop

          node .claude/scripts/lib/append-improvement-log.mjs \
            --message "$(git log -1 --pretty=%s%n%n%b "$GITHUB_SHA")" \
            --sha "${GITHUB_SHA:0:7}" \
            --date "$(date -u +%Y-%m-%d)"
          git add .claude/skills/analytics/

          if git diff --cached --quiet; then
            echo "No actual diff after merge."
            exit 0
          fi

          SHORTSHA="${GITHUB_SHA:0:7}"
          git commit -m "docs(improvement-log): auto-stub for deploy ${SHORTSHA} [skip ci]"
          git push origin develop
