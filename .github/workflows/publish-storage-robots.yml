name: 🤖 Publish storage robots.txt

# storage.stats47.jp (R2 の公開バケット) のルートに robots.txt を置く。
# 原本は packages/r2-storage/src/storage-host/robots.txt。手動起動だけで、既定は dry-run。
# 中身が R2 と同じなら送らない (push-exact-r2-assets は SHA が一致すれば skip する)。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = 送らずに差分だけ表示 / false = R2 へ反映"
        type: choice
        options: ['true', 'false']
        default: 'true'

permissions:
  contents: read

concurrency:
  group: r2-write
  cancel-in-progress: false

env:
  R2_S3_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
  R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
  CLOUDFLARE_R2_BUCKET_NAME: stats47
  R2_PUBLIC_FETCH_URL: https://storage.stats47.jp

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 🧰 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📄 Stage robots.txt
        run: |
          mkdir -p .local/r2
          cp packages/r2-storage/src/storage-host/robots.txt .local/r2/robots.txt
          echo "--- 送る内容 ---"
          cat .local/r2/robots.txt
          echo "--- 現在の公開内容 (無ければ 404) ---"
          curl -s -o /dev/null -w '%{http_code}\n' https://storage.stats47.jp/robots.txt

      - name: 🔎 Dry run
        if: ${{ github.event.inputs.dry_run != 'false' }}
        run: npx tsx packages/r2-storage/src/scripts/push-exact-r2-assets.ts --key robots.txt --dry-run

      - name: 📤 Publish to R2
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: npx tsx packages/r2-storage/src/scripts/push-exact-r2-assets.ts --key robots.txt

      - name: ✅ Verify public response
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          # CDN に古い 404 が残っていても原本と比べられるよう、キャッシュを避ける query を付ける
          curl -sf "https://storage.stats47.jp/robots.txt?verify=${{ github.run_id }}" -o /tmp/robots-live.txt
          diff -u packages/r2-storage/src/storage-host/robots.txt /tmp/robots-live.txt
