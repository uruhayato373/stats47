name: 📈 Fetch weekly metrics (GSC + GA4 + AdSense)

on:
  schedule:
    - cron: "0 11 * * 0" # JST 20:00 Sunday (UTC 11:00)
  workflow_dispatch:
    inputs:
      week:
        description: "ISO week (YYYY-Www). Empty = current week"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: fetch-metrics-weekly
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 🧰 Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📅 Resolve target week
        id: week
        run: |
          INPUT_WEEK="${{ inputs.week }}"
          if [ -n "$INPUT_WEEK" ]; then
            echo "week=$INPUT_WEEK" >> "$GITHUB_OUTPUT"
          else
            # GitHub Actions ubuntu-latest は UTC。JST 20:00 日曜 = UTC 11:00 日曜。
            # ISO 週は ISO-8601 基準（月曜始まり）。日曜の UTC 時点で前週扱いになる場合があるため、
            # JST の日曜日でない可能性も考慮する。ここは UTC の date で ISO 週を取る。
            WEEK=$(date -u +%G-W%V)
            echo "week=$WEEK" >> "$GITHUB_OUTPUT"
          fi
          echo "Week: $(cat "$GITHUB_OUTPUT")"

      # source 単位の failure isolation (§18.3): 1 source の失敗が他 source・digest・commit を
      # 止めない。missing/partial は最終 step の Period contract gate が exit 1 で赤くする
      # (green success として隠さない)。
      - name: 🔍 Fetch GSC snapshot
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_JSON }}
        run: npm run fetch-gsc-snapshot -- ${{ steps.week.outputs.week }}

      - name: 📊 Fetch GA4 snapshot
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: npm run fetch-ga4-snapshot -- ${{ steps.week.outputs.week }}

      - name: 💰 Fetch AdSense snapshot
        env:
          GOOGLE_ADSENSE_CLIENT_ID: ${{ secrets.GOOGLE_ADSENSE_CLIENT_ID }}
          GOOGLE_ADSENSE_CLIENT_SECRET: ${{ secrets.GOOGLE_ADSENSE_CLIENT_SECRET }}
          GOOGLE_ADSENSE_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADSENSE_REFRESH_TOKEN }}
          GOOGLE_ADSENSE_ACCOUNT_ID: ${{ secrets.GOOGLE_ADSENSE_ACCOUNT_ID }}
        continue-on-error: true # OAuth refresh token が切れていても他の計測は進める
        run: npm run fetch-adsense-snapshot -- ${{ steps.week.outputs.week }}

      - name: 📝 Update history.csv and LATEST.md
        run: npm run metrics:digest -- ${{ steps.week.outputs.week }}

      - name: 🌟 NSM weekly snapshot
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        continue-on-error: true
        run: |
          # metrics-reader.mjs はリポジトリルートのキーファイルを直接読むため env から書き出す
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_KEY_JSON" ]; then
            echo "$GOOGLE_SERVICE_ACCOUNT_KEY_JSON" > stats47-f6b5dae19196.json
            chmod 600 stats47-f6b5dae19196.json
          fi
          node .claude/scripts/snapshot-weekly-metrics.mjs ${{ steps.week.outputs.week }} --force
          rm -f stats47-f6b5dae19196.json

      - name: 📄 Write GitHub Step Summary
        if: always()
        run: |
          echo "# Weekly Metrics Snapshot — ${{ steps.week.outputs.week }}" >> "$GITHUB_STEP_SUMMARY"
          for src in gsc ga4 adsense; do
            LATEST=".claude/state/metrics/$src/LATEST.md"
            if [ -f "$LATEST" ]; then
              {
                echo ""
                cat "$LATEST"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: 📦 Stage metrics outputs
        run: |
          mkdir -p /tmp/metrics-publish/snapshots /tmp/metrics-publish/state /tmp/metrics-publish/nsm
          cp -r .claude/skills/analytics/gsc-improvement/reference/snapshots/. /tmp/metrics-publish/snapshots/gsc 2>/dev/null || true
          cp -r .claude/skills/analytics/ga4-improvement/reference/snapshots/. /tmp/metrics-publish/snapshots/ga4 2>/dev/null || true
          cp -r .claude/skills/analytics/adsense-improvement/reference/snapshots/. /tmp/metrics-publish/snapshots/adsense 2>/dev/null || true
          cp -r .claude/state/metrics/. /tmp/metrics-publish/state 2>/dev/null || true
          cp -r .claude/skills/management/nsm-experiment/reference/weekly-snapshots/. /tmp/metrics-publish/nsm 2>/dev/null || true
          find /tmp/metrics-publish -maxdepth 4 -type f | head -40

      - name: 🔀 Switch to develop & restore metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # working tree の変更は /tmp/metrics-publish に退避済。branch 切替前にリセット。
          git reset --hard HEAD
          git clean -fd

          git fetch origin develop
          git checkout develop
          git pull --rebase origin develop

          mkdir -p .claude/skills/analytics/gsc-improvement/reference/snapshots
          mkdir -p .claude/skills/analytics/ga4-improvement/reference/snapshots
          mkdir -p .claude/skills/analytics/adsense-improvement/reference/snapshots
          mkdir -p .claude/state/metrics

          cp -r /tmp/metrics-publish/snapshots/gsc/. .claude/skills/analytics/gsc-improvement/reference/snapshots/ 2>/dev/null || true
          cp -r /tmp/metrics-publish/snapshots/ga4/. .claude/skills/analytics/ga4-improvement/reference/snapshots/ 2>/dev/null || true
          cp -r /tmp/metrics-publish/snapshots/adsense/. .claude/skills/analytics/adsense-improvement/reference/snapshots/ 2>/dev/null || true
          cp -r /tmp/metrics-publish/state/. .claude/state/metrics/ 2>/dev/null || true
          mkdir -p .claude/skills/management/nsm-experiment/reference/weekly-snapshots
          cp -r /tmp/metrics-publish/nsm/. .claude/skills/management/nsm-experiment/reference/weekly-snapshots/ 2>/dev/null || true

      # 是正ループの自動化 (docs/02_実装計画/06_ブログ品質是正ループ.md Phase 2)。
      # develop の最新 history + 今 fetch した GSC snapshot + 公開 R2 audit を入力に
      # 「次に何を直すか」(remediation-queue) を再構築し、due に達した是正 wave の効果を計測する。
      - name: ♻️ Rebuild remediation queue (next-to-fix)
        continue-on-error: true # 品質 audit の R2 取得失敗等で週次計測本体を止めない
        env:
          R2_PUBLIC_FETCH_URL: https://storage.stats47.jp
        run: node .claude/scripts/blog/build-remediation-queue.mjs

      - name: 📐 Measure blog remediation wave impact (wave_id 駆動)
        continue-on-error: true
        run: node .claude/scripts/blog/measure-gsc-impact.mjs --min-weeks 2

      # AdSense 施策の before/after を surface する（判定はせず improvement-triage に委ねる）。
      # deploy 済み施策ごとに history.csv + history-devices.csv で差分を出し、交絡/汚染を明示する。
      # 結果は .claude/state/metrics/adsense/impact-LATEST.md に書かれ、下の git add で commit される。
      - name: 📐 Surface AdSense 施策 impact (before/after)
        continue-on-error: true
        run: node .claude/scripts/metrics/measure-adsense-impact.mjs --out .claude/state/metrics/adsense/impact-LATEST.md

      # 「次に何を書くか」(topic-queue) を再構築する。GSC クエリギャップ + R2 相関 snapshot を
      # 入力にした新規記事ネタの状態付きキュー。生産・レビューはローカル/セッションで人が回す。
      - name: 🆕 Rebuild article topic queue (next-to-write)
        continue-on-error: true # R2/相関の取得失敗で週次計測本体を止めない
        env:
          R2_PUBLIC_FETCH_URL: https://storage.stats47.jp
        run: node .claude/scripts/blog/build-topic-queue.mjs

      - name: 📤 Commit & push to develop
        run: |
          git add .claude/skills/analytics/gsc-improvement/reference/snapshots
          git add .claude/skills/analytics/ga4-improvement/reference/snapshots
          git add .claude/skills/analytics/adsense-improvement/reference/snapshots
          git add .claude/state/metrics
          git add .claude/skills/management/nsm-experiment/reference/weekly-snapshots
          # 是正ループの自動再構築物
          git add .claude/state/blog/remediation-queue.json 2>/dev/null || true
          git add .claude/state/blog/topic-queue.json 2>/dev/null || true
          git add .claude/skills/analytics/gsc-improvement/reference/improvement-log.md 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No metrics changes to publish"
            exit 0
          fi

          git commit -m "chore(metrics): weekly snapshot ${{ steps.week.outputs.week }} + remediation queue/effect [skip ci]"
          git push origin develop

      # 期間契約 gate (§18.2/§18.3): commit の後に走らせ、GSC/GA4 summary の missing/partial・
      # NSM finalized7d の欠落を exit 1 で赤くする。データは commit 済みなので failure isolation は
      # 保たれ、partial を green success として隠さない。
      - name: 🧪 Period contract gate (finalized7d/coverage)
        run: npm run metrics:check-period-contract -- ${{ steps.week.outputs.week }} --strict
