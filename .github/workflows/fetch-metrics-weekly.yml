name: 📈 Fetch weekly metrics (GSC + GA4 + AdSense)

on:
  schedule:
    - cron: "0 11 * * 0" # JST 20:00 Sunday (UTC 11:00)
  workflow_dispatch:
    inputs:
      week:
        description: "ISO week (YYYY-Www). Empty = current week"
        required: false
        default: ""

permissions:
  contents: write
  issues: write # カバレッジキュー再構築の失敗を [Coverage Alert] Issue で通知する

concurrency:
  group: fetch-metrics-weekly
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 🧰 Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📅 Resolve target week
        id: week
        run: |
          INPUT_WEEK="${{ inputs.week }}"
          if [ -n "$INPUT_WEEK" ]; then
            echo "week=$INPUT_WEEK" >> "$GITHUB_OUTPUT"
          else
            # GitHub Actions ubuntu-latest は UTC。JST 20:00 日曜 = UTC 11:00 日曜。
            # ISO 週は ISO-8601 基準（月曜始まり）。日曜の UTC 時点で前週扱いになる場合があるため、
            # JST の日曜日でない可能性も考慮する。ここは UTC の date で ISO 週を取る。
            WEEK=$(date -u +%G-W%V)
            echo "week=$WEEK" >> "$GITHUB_OUTPUT"
          fi
          echo "Week: $(cat "$GITHUB_OUTPUT")"

      # source 単位の failure isolation（weekly-cycle-contract）: 1 source の失敗が他 source・digest・commit を
      # 止めない。missing/partial は最終 step の Period contract gate が exit 1 で赤くする
      # (green success として隠さない)。
      - name: 🔍 Fetch GSC snapshot
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_JSON }}
        run: npm run fetch-gsc-snapshot -- ${{ steps.week.outputs.week }}

      - name: 📊 Fetch GA4 snapshot
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_JSON }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
        run: npm run fetch-ga4-snapshot -- ${{ steps.week.outputs.week }}

      - name: 💰 Fetch AdSense snapshot
        env:
          GOOGLE_ADSENSE_CLIENT_ID: ${{ vars.GOOGLE_ADSENSE_CLIENT_ID || secrets.GOOGLE_ADSENSE_CLIENT_ID }}
          GOOGLE_ADSENSE_CLIENT_SECRET: ${{ secrets.GOOGLE_ADSENSE_CLIENT_SECRET }}
          GOOGLE_ADSENSE_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADSENSE_REFRESH_TOKEN }}
          GOOGLE_ADSENSE_ACCOUNT_ID: ${{ vars.GOOGLE_ADSENSE_ACCOUNT_ID }}
        continue-on-error: true # OAuth refresh token が切れていても他の計測は進める
        run: npm run fetch-adsense-snapshot -- ${{ steps.week.outputs.week }}

      - name: 📝 Update history.csv and LATEST.md
        run: npm run metrics:digest -- ${{ steps.week.outputs.week }}

      - name: 🌟 NSM weekly snapshot
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_JSON }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
        continue-on-error: true
        run: |
          # metrics-reader.mjs はリポジトリルートのキーファイルを直接読むため env から書き出す
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_KEY_JSON" ]; then
            echo "$GOOGLE_SERVICE_ACCOUNT_KEY_JSON" > stats47-f6b5dae19196.json
            chmod 600 stats47-f6b5dae19196.json
          fi
          node .claude/scripts/snapshot-weekly-metrics.mjs ${{ steps.week.outputs.week }} --force
          rm -f stats47-f6b5dae19196.json

      - name: 📄 Write GitHub Step Summary
        if: always()
        run: |
          echo "# Weekly Metrics Snapshot — ${{ steps.week.outputs.week }}" >> "$GITHUB_STEP_SUMMARY"
          for src in gsc ga4 adsense; do
            LATEST=".claude/state/metrics/$src/LATEST.md"
            if [ -f "$LATEST" ]; then
              {
                echo ""
                cat "$LATEST"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: 📦 Stage metrics outputs
        run: |
          mkdir -p /tmp/metrics-publish/snapshots /tmp/metrics-publish/state /tmp/metrics-publish/nsm
          cp -r .claude/skills/analytics/gsc-improvement/reference/snapshots/. /tmp/metrics-publish/snapshots/gsc 2>/dev/null || true
          cp -r .claude/skills/analytics/ga4-improvement/reference/snapshots/. /tmp/metrics-publish/snapshots/ga4 2>/dev/null || true
          cp -r .claude/skills/analytics/adsense-improvement/reference/snapshots/. /tmp/metrics-publish/snapshots/adsense 2>/dev/null || true
          cp -r .claude/state/metrics/. /tmp/metrics-publish/state 2>/dev/null || true
          cp -r .claude/skills/management/nsm-experiment/reference/weekly-snapshots/. /tmp/metrics-publish/nsm 2>/dev/null || true
          find /tmp/metrics-publish -maxdepth 4 -type f | head -40

      - name: 🔀 Switch to develop & restore metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # working tree の変更は /tmp/metrics-publish に退避済。branch 切替前にリセット。
          git reset --hard HEAD
          git clean -fd

          git fetch origin develop
          git checkout develop
          git pull --rebase origin develop

          mkdir -p .claude/skills/analytics/gsc-improvement/reference/snapshots
          mkdir -p .claude/skills/analytics/ga4-improvement/reference/snapshots
          mkdir -p .claude/skills/analytics/adsense-improvement/reference/snapshots
          mkdir -p .claude/state/metrics

          cp -r /tmp/metrics-publish/snapshots/gsc/. .claude/skills/analytics/gsc-improvement/reference/snapshots/ 2>/dev/null || true
          cp -r /tmp/metrics-publish/snapshots/ga4/. .claude/skills/analytics/ga4-improvement/reference/snapshots/ 2>/dev/null || true
          cp -r /tmp/metrics-publish/snapshots/adsense/. .claude/skills/analytics/adsense-improvement/reference/snapshots/ 2>/dev/null || true
          cp -r /tmp/metrics-publish/state/. .claude/state/metrics/ 2>/dev/null || true
          mkdir -p .claude/skills/management/nsm-experiment/reference/weekly-snapshots
          cp -r /tmp/metrics-publish/nsm/. .claude/skills/management/nsm-experiment/reference/weekly-snapshots/ 2>/dev/null || true

      # 是正ループの自動化 (.claude/rules/blog-remediation-loop.md)。
      # develop の最新 history + 今 fetch した GSC snapshot + 公開 R2 audit を入力に
      # 「次に何を直すか」(remediation-queue) を再構築し、due に達した是正 wave の効果を計測する。
      - name: ♻️ Rebuild remediation queue (next-to-fix)
        continue-on-error: true # 品質 audit の R2 取得失敗等で週次計測本体を止めない
        env:
          R2_PUBLIC_FETCH_URL: https://storage.stats47.jp
        run: node .claude/scripts/blog/build-remediation-queue.mjs

      - name: 📐 Measure blog remediation wave impact (wave_id 駆動)
        continue-on-error: true
        run: node .claude/scripts/blog/measure-gsc-impact.mjs --min-weeks 2

      # GSC カバレッジ是正キューを本番 HTTP 実測で再構築する
      # (正典: .claude/skills/analytics/gsc-coverage-remediation/SKILL.md)。
      #
      # export (GSC UI) は Google ログイン済み Playwright profile が要りローカル限定だが、
      # **commit 済み drilldown CSV への再実測は認証不要**なのでここで回せる。これにより
      # 「直した URL が実際に 200/410 になったか」が毎週 verdict に反映される。
      # 2026-06-16 のキューが 7 週間放置され、古い優先度で作業しかけた再発防止。
      #
      # 失敗は握り潰さない (continue-on-error だが outcome を拾って Issue を起票する)。
      # ★step 単位で時間を区切る。probe は並列 12・1 件 12s timeout・上限 2,500 件なので、
      #   全件がタイムアウトする最悪ケースで約 41 分かかり job の timeout-minutes: 30 を食い潰す
      #   (= GSC/GA4/AdSense の週次計測ごと道連れになる)。実測 2,456 件は正常時 2 分程度。
      #   超過したら step が失敗し、下の Raise coverage queue alert が Issue を起票する。
      - name: 🗺 Rebuild GSC coverage queue (本番 HTTP 実測)
        id: coverage_queue
        continue-on-error: true
        timeout-minutes: 12
        run: node .claude/scripts/gsc/build-coverage-queue.mjs

      - name: 📄 Summarize coverage queue
        if: always()
        run: |
          {
            echo ""
            echo "## GSC カバレッジ是正キュー"
            if [ "${{ steps.coverage_queue.outcome }}" != "success" ]; then
              echo ""
              echo "⚠️ 再構築に失敗しました (outcome=${{ steps.coverage_queue.outcome }})。"
            elif [ -f .claude/state/gsc/LATEST.md ]; then
              sed -n '/## 是正キュー/,/^## /p' .claude/state/gsc/LATEST.md | head -20
            else
              echo ""
              echo "LATEST.md がありません。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # 効果判定ループ (.claude/rules/evidence-based-judgment.md §閾値エンジン経由の確定)。
      # 順序は snapshot fetch → digest → measure → verdict → past-effects writer で固定する
      # (逆だと verdict が前週データを読む)。
      #
      # continue-on-error を付けない: ガード hit は正常系 (exit 0) なので、ここが落ちるのは
      # 閾値計算そのものの例外だけ。赤くして気付けるようにする。
      # backlog の status 書き換えはしない (improvement-triage の排他 write を破るため)。
      - name: ⚖️ Decide effect verdicts (閾値エンジン)
        run: |
          # `| tee` は使わない (既定 shell は pipefail 無しなので CLI の失敗が tee の成功に隠れる)
          node .claude/scripts/lib/effect-verdict/cli.mjs --week ${{ steps.week.outputs.week }} > /tmp/effect-verdicts.txt
          cat /tmp/effect-verdicts.txt
          {
            echo ""
            echo '```'
            cat /tmp/effect-verdicts.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # effect/none|adverse を candidate 抑制台帳へ反映する (writer 不在で台帳が空だったのを閉じる)。
      # read 側は search-growth/lib/scoring.mjs と metrics/lib/adsense-diagnostics.mjs。
      - name: 🗂 Write past-effects ledgers (candidate 抑制)
        continue-on-error: true # 台帳更新の失敗で週次計測本体を止めない
        run: node .claude/scripts/lib/write-past-effects.mjs

      # コード側 slot 定数 (apps/web/src/lib/google-adsense/constants.ts) と AdSense 側 ad unit の
      # 突き合わせ検査。ad-units.csv (inventory) は上の fetch-adsense-snapshot が出し、
      # history-units.csv は metrics:digest が出すので、ここは読むだけ。
      # API も browser も叩かないので CI で完結する (Playwright は載せない)。
      # --strict は付けない: adUnitName 未記入等の整備途中は error が出るのが正常で、
      # ここで週次計測本体を落としても直らない。内容を報告して人間/agent に渡す。
      - name: 🔗 Check AdSense unit mapping (code slot ↔ ad unit)
        continue-on-error: true
        run: npm run metrics:check-adsense-units -- ${{ steps.week.outputs.week }}

      # AdSense 収益密度の決定的候補生成 (adsense-diagnostics.mjs・最大3件・提示まで)。
      # 広告配置・Auto ads・deploy の自動変更はしない。Google Admin Playwright はここに載せない。
      - name: 🩺 AdSense diagnostics (candidates ≤3)
        continue-on-error: true
        run: npm run metrics:adsense-diagnostics -- ${{ steps.week.outputs.week }}

      # AdSense 施策の before/after を surface する（判定はせず improvement-triage に委ねる）。
      # deploy 済み施策ごとに history.csv + history-devices.csv で差分を出し、交絡/汚染を明示する。
      # 結果は .claude/state/metrics/adsense/impact-LATEST.md に書かれ、下の git add で commit される。
      - name: 📐 Surface AdSense 施策 impact (before/after)
        continue-on-error: true
        run: node .claude/scripts/metrics/measure-adsense-impact.mjs --out .claude/state/metrics/adsense/impact-LATEST.md

      # 「次に何を書くか」(topic-queue) を再構築する。GSC クエリギャップ + R2 相関 snapshot を
      # 入力にした新規記事ネタの状態付きキュー。生産・レビューはローカル/セッションで人が回す。
      - name: 🆕 Rebuild article topic queue (next-to-write)
        continue-on-error: true # R2/相関の取得失敗で週次計測本体を止めない
        env:
          R2_PUBLIC_FETCH_URL: https://storage.stats47.jp
        run: node .claude/scripts/blog/build-topic-queue.mjs

      # 索引代表 / ホーム注目 / 問いかけコピーの生成物を、今 fetch した GSC snapshot で作り直す。
      # 需要は半桁バケットで量子化してあるので、表示回数が帯を跨いだ週だけ差分が出る。
      # ここで再生成しないと、次の PR で `--check` (static-gates) が落ちる。
      - name: 🏅 Rebuild ranking prominence (index + home featured)
        continue-on-error: true # 生成失敗で週次計測本体を止めない
        run: (cd apps/web && npx tsx scripts/generate-ranking-prominence.ts)

      # 問いかけコピーの導出品質。生成物と SSOT のズレは --check が守るが、
      # 「導出された日本語が読めるか」は誰も見ていないので、怪しい候補を週次で表に出す。
      # 誰も見ていない仕組みは isFeatured (2,295 件中 8 件しか設定されなかった) と同じく腐る。
      - name: 🔍 Audit derived ranking hooks
        continue-on-error: true
        run: (cd apps/web && npx tsx scripts/generate-ranking-prominence.ts --audit | tee -a "$GITHUB_STEP_SUMMARY")

      - name: 📤 Commit & push to develop
        run: |
          # 生成先は packages/data-configs 側 (apps/web と packages/ranking の両方が読むため)。
          # ここを取り違えると再生成しても commit されず、次の PR で --check だけが落ちる。
          git add packages/data-configs/src/prominence/ranking-prominence.generated.ts
          git add .claude/skills/analytics/gsc-improvement/reference/snapshots
          git add .claude/skills/analytics/ga4-improvement/reference/snapshots
          git add .claude/skills/analytics/adsense-improvement/reference/snapshots
          git add .claude/state/metrics
          git add .claude/skills/management/nsm-experiment/reference/weekly-snapshots
          # 是正ループの自動再構築物
          git add .claude/state/blog/remediation-queue.json 2>/dev/null || true
          git add .claude/state/blog/topic-queue.json 2>/dev/null || true
          # GSC カバレッジ是正キュー (再実測で verdict が最新化される)
          git add .claude/state/gsc 2>/dev/null || true
          git add .claude/state/metrics/gsc/coverage-drilldown 2>/dev/null || true
          git add .claude/skills/analytics/gsc-improvement/reference/improvement-log.md 2>/dev/null || true
          # 効果判定ループの成果物 (verdict JSON + 抑制台帳 + 新規 improvement-log)
          git add .claude/state/effect-verdict 2>/dev/null || true
          git add .claude/state/search-growth/past-effects.json 2>/dev/null || true
          git add .claude/state/metrics/adsense/past-effects.json 2>/dev/null || true
          git add .claude/skills/analytics/ga4-improvement/reference/improvement-log.md 2>/dev/null || true
          git add .claude/skills/analytics/cloudflare-cost-improvement/reference/improvement-log.md 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No metrics changes to publish"
            exit 0
          fi

          git commit -m "chore(metrics): weekly snapshot ${{ steps.week.outputs.week }} + remediation queue/effect [skip ci]"
          # pull は前段の step にもあるが、そこから API 取得を挟むのでこの間に develop が進みうる。
          # push の直前で取り直さないと (fetch first) で落ちて週次メトリクスが commit されない (2026-08-16 是正)。
          git pull --rebase --autostash origin develop
          git push origin develop

      # 期間契約 gate（weekly-cycle-contract）: commit の後に走らせ、GSC/GA4 summary の missing/partial・
      # NSM finalized7d の欠落を exit 1 で赤くする。データは commit 済みなので failure isolation は
      # 保たれ、partial を green success として隠さない。
      - name: 🧪 Period contract gate (finalized7d/coverage)
        run: npm run metrics:check-period-contract -- ${{ steps.week.outputs.week }} --strict

      # ── カバレッジキュー失敗の通知 ────────────────────────────────
      # continue-on-error で週次計測本体は止めないが、失敗を green に隠さない。
      # 同一タイトルの open issue があれば編集して重複起票を避ける
      # (internal-link-audit-weekly / ogp-image-audit-weekly と同じ作法)。
      - name: 🚨 Raise coverage queue alert
        if: always() && steps.coverage_queue.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="[Coverage Alert] GSC カバレッジ是正キューの再構築に失敗"
          {
            echo "週次 \`fetch-metrics-weekly\` の \`build-coverage-queue.mjs\` が失敗しました。"
            echo ""
            echo "- outcome: \`${{ steps.coverage_queue.outcome }}\`"
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "## 影響"
            echo ""
            echo "是正キュー (\`.claude/state/gsc/coverage-remediation-queue.json\`) が最新化されません。"
            echo "古い verdict のまま作業すると誤った優先度で動きます"
            echo "(2026-08-06 に 7 週間前のキューで \`fix-5xx\` 誤検知を掴んだ実例あり)。"
            echo ""
            echo "## 再現"
            echo ""
            echo '```bash'
            echo "node .claude/scripts/gsc/build-coverage-queue.mjs"
            echo '```'
            echo ""
            echo "よくある原因: drilldown ディレクトリが無い (要 export + ingest) / 本番 HTTP 実測の失敗。"
            echo "正典: \`.claude/skills/analytics/gsc-coverage-remediation/SKILL.md\`"
          } > /tmp/coverage-issue.md

          gh label create coverage-alert --description "GSC カバレッジ是正ループの異常" --color "b60205" --force 2>/dev/null || true

          EXISTING=$(gh issue list --state open --label coverage-alert --search "\"[Coverage Alert]\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "$TITLE" --body-file /tmp/coverage-issue.md
          else
            gh issue create --title "$TITLE" --label "coverage-alert,auto-generated" --body-file /tmp/coverage-issue.md
          fi

      - name: ✅ Close recovered coverage alert
        if: always() && steps.coverage_queue.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --state open --label coverage-alert --limit 50 --json number --jq '.[].number' |
            while read -r NUMBER; do
              gh issue close "$NUMBER" --reason completed \
                --comment "週次再構築が成功したため自動クローズ (run ${{ github.run_id }})。"
            done
