name: 📊 SNS Metrics Weekly (Instagram)

# X は API 従量課金のため収集対象外。Instagram (Graph API) のみ。
# 毎週日曜 JST 20:30 に実行（fetch-metrics-weekly の 30 分後）。
# YouTube は 2026-08-23 から通常動画3本の限定 pilot。pilot 中は Studio の手動計測と
# GA4 UTM だけを使い、OAuth/API の自動収集は成功判定後まで追加しない。

on:
  schedule:
    - cron: "30 11 * * 0" # JST 20:30 Sunday (UTC 11:30)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sns-metrics-weekly
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 🧰 Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📸 Instagram metrics
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ vars.INSTAGRAM_BUSINESS_ACCOUNT_ID || secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
        run: node .claude/scripts/instagram/fetch-metrics-ci.cjs

      - name: 📤 Commit snapshot to develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin develop
          git checkout develop
          git pull --rebase origin develop

          SNAPSHOT_DIR=".claude/skills/analytics/sns-metrics-improvement/snapshots"
          git add "$SNAPSHOT_DIR"

          if git diff --cached --quiet; then
            echo "変更なし、コミットをスキップ"
            exit 0
          fi

          DATE=$(date -u +%Y-%m-%d)
          git commit -m "chore(sns-metrics): weekly snapshot ${DATE} (instagram) [skip ci]"
          git push origin develop

      - name: 📄 Step Summary
        if: always()
        run: |
          DATE=$(date -u +%Y-%m-%d)
          SNAPSHOT=".claude/skills/analytics/sns-metrics-improvement/snapshots/${DATE}/metrics.csv"
          {
            echo "# SNS Metrics Weekly — ${DATE}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$SNAPSHOT" ]; then
            COUNT=$(wc -l < "$SNAPSHOT")
            {
              echo "- 記録件数: $((COUNT - 1)) 行"
              echo ""
              echo "\`\`\`"
              head -6 "$SNAPSHOT"
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "スナップショットファイルが見つかりません" >> "$GITHUB_STEP_SUMMARY"
          fi
