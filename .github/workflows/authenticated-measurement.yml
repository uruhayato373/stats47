name: Authenticated measurement
run-name: "${{ inputs.catchup_slot && format('Authenticated measurement catch-up {0}', inputs.catchup_slot) || 'Authenticated measurement' }}"

on:
  workflow_dispatch:
    inputs:
      catchup_slot:
        description: "Overdue schedule slot recorded by the health watchdog (blank for a manual run)"
        required: false
        type: string
  schedule:
    - cron: '20 11 * * 4' # 木曜 JST 20:20。Mac の取得 (17:30) の予備で、Mac が取れなかった取得元だけを取る (2026-10-20)
  push:
    branches: [develop]
    paths: ['.github/workflows/authenticated-measurement.yml']

permissions:
  contents: read

concurrency:
  group: authenticated-measurement
  cancel-in-progress: false

jobs:
  # 本取得は Mac (毎週木曜 17:30 JST の measurement-session-refresh.sh → measurement-collect-local.sh。
  # 2026-10-20 に週次化し、Mac の直接取得へ切り替えた。MEASUREMENT-MAC-DIRECT-01)。定期実行はその予備で、
  # Mac の記録が 12 時間以内なら、Mac が pass した取得元は取り直さない (cron は数時間遅れて動くので日付では判定しない)。
  # 遅い予備が同じ枠の成功を auth_required で上書きしないためでもある (2026-09-26 は 17:31 に渡したセッションで 22:47 に失敗)。
  # Mac が動かなかった週は記録が古いので、予備が全取得元を取る。手動・catch-up・push は常に全取得元を取る。
  gate:
    if: github.repository == 'uruhayato373/stats47' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      sources: ${{ steps.check.outputs.sources }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          persist-credentials: false
          sparse-checkout: |
            data/authenticated
            .claude/scripts/measurement
      - id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          SOURCES=$(node --input-type=module -e '
            import { existsSync, readFileSync } from "node:fs";
            import { SOURCES } from "./.claude/scripts/measurement/sources.mjs";
            const all = Object.keys(SOURCES);
            let wanted = all;
            if (process.env.EVENT === "schedule" && existsSync("data/authenticated/latest.json")) {
              const state = JSON.parse(readFileSync("data/authenticated/latest.json", "utf8"));
              const age = Date.now() - Date.parse(state.generatedAt);
              if (age >= 0 && age <= 12 * 3600000) wanted = all.filter((name) => state.sources?.find((s) => s.source === name)?.status !== "pass");
            }
            process.stdout.write(JSON.stringify(wanted));
          ')
          echo "sources=$SOURCES" >> "$GITHUB_OUTPUT"
          if [ "$SOURCES" = '[]' ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Mac の取得で全取得元が pass したため予備を省略する" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "取得する取得元: $SOURCES" >> "$GITHUB_STEP_SUMMARY"
          fi
  collect:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WANTED: ${{ contains(fromJSON(needs.gate.outputs.sources), matrix.source) }}
    strategy:
      fail-fast: false
      max-parallel: 8 # separate services and ephemeral runners; no shared browser profile
      matrix:
        include:
          - {source: a8, secret: MEASUREMENT_SESSION_A8, auth: A8}
          - {source: note, secret: MEASUREMENT_SESSION_NOTE, auth: NOTE}
          - {source: gsc, secret: MEASUREMENT_SESSION_GSC}
          - {source: kdp, secret: MEASUREMENT_SESSION_KDP, auth: KDP}
          - {source: rakuten, secret: MEASUREMENT_SESSION_RAKUTEN, auth: RAKUTEN}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.WANTED == 'true'
        with:
          ref: develop
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.WANTED == 'true'
        with: {node-version: '20', cache: npm}
      - run: npm ci
        if: env.WANTED == 'true'
      - run: npx playwright install --with-deps chromium
        if: env.WANTED == 'true'
      - name: Collect and verify private evidence
        if: env.WANTED == 'true'
        env:
          # Secret は名前で直接引く。secrets[matrix.secret] の動的参照は全 Secret をランナーへ渡す (CodeQL Excessive Secrets Exposure)
          MEASUREMENT_SESSION: ${{ matrix.source == 'a8' && secrets.MEASUREMENT_SESSION_A8 || matrix.source == 'note' && secrets.MEASUREMENT_SESSION_NOTE || matrix.source == 'gsc' && secrets.MEASUREMENT_SESSION_GSC || matrix.source == 'kdp' && secrets.MEASUREMENT_SESSION_KDP || matrix.source == 'rakuten' && secrets.MEASUREMENT_SESSION_RAKUTEN || '' }}
          MEASUREMENT_VAULT_KEY: ${{ secrets.MEASUREMENT_VAULT_KEY }}
          R2_S3_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          SOURCE: ${{ matrix.source }}
          # CI 再ログイン: .claude/config/auth-credentials.json の ciCredential=true の service だけ matrix.auth を持つ。
          # 他の source には空文字が渡り、collect.mjs は入り直しを試みない。
          STATS47_AUTH_SOURCE: ${{ matrix.auth && matrix.source || '' }}
          STATS47_AUTH_USER: ${{ matrix.auth && secrets[format('STATS47_AUTH_{0}_USER', matrix.auth)] || '' }}
          STATS47_AUTH_PASSWORD: ${{ matrix.auth && secrets[format('STATS47_AUTH_{0}_PASSWORD', matrix.auth)] || '' }}
          STATS47_AUTH_TOTP: ${{ matrix.auth && secrets[format('STATS47_AUTH_{0}_TOTP', matrix.auth)] || '' }}
        run: |
          xvfb-run --auto-servernum node .claude/scripts/measurement/collect.mjs "$SOURCE"
      - name: Upload credential-free status only
        if: always() && env.WANTED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: authenticated-status-${{ matrix.source }}-${{ github.run_attempt }}
          path: .local/authenticated-ci-public/*.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn

  record:
    needs: [gate, collect]
    if: always() && needs.collect.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: develop}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        id: artifacts
        with:
          pattern: authenticated-status-*
          path: .local/authenticated-ci-public
          merge-multiple: true
      - name: Record all sources, including missing jobs
        id: record
        if: always() # record missing artifacts without suppressing the failed download step
        env:
          # 取りに行かなかった取得元 (Mac が pass 済み) は前回の行を残す (summarize.mjs)
          MEASUREMENT_SOURCES: ${{ join(fromJSON(needs.gate.outputs.sources), ',') }}
        run: |
          node .claude/scripts/measurement/summarize.mjs
          cat /tmp/authenticated-measurement-summary.md >> "$GITHUB_STEP_SUMMARY"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/authenticated/latest.json data/authenticated/revenue-history.json data/products/sales-ledger.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(metrics): authenticated measurement status [skip ci]'
            for attempt in 1 2 3; do
              if git pull --rebase origin develop && git push origin HEAD:develop; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 5
            done
          fi
      - name: Alert on failure and close on recovery
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE='認証付き計測に要対応の取得元がある'
          gh label create authenticated-measurement-alert --description 'Authenticated measurement collection or session failure' --color b60205 --force
          EXISTING=$(gh issue list --state open --label authenticated-measurement-alert --limit 1 --json number --jq '.[0].number // empty')
          if [ '${{ needs.collect.result }}' = 'success' ] && [ '${{ steps.record.outcome }}' = 'success' ] && [ '${{ steps.artifacts.outcome }}' = 'success' ] && jq -e --arg run "$GITHUB_RUN_ID" '.runId == $run and .status == "pass"' data/authenticated/latest.json >/dev/null; then
            if [ -n "$EXISTING" ]; then gh issue close "$EXISTING" --comment "取得経路が復旧しました: $RUN_URL"; fi
          else
            if [ ! -f /tmp/authenticated-measurement-summary.md ]; then printf '収集または記録ジョブが完了しませんでした。\n' > /tmp/authenticated-measurement-summary.md; fi
            printf '\n実行: %s\n' "$RUN_URL" >> /tmp/authenticated-measurement-summary.md
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --title "$TITLE" --body-file /tmp/authenticated-measurement-summary.md
            else
              gh issue create --title "$TITLE" --label 'authenticated-measurement-alert,auto-generated' --body-file /tmp/authenticated-measurement-summary.md
            fi
            exit 1
          fi
