name: 🔒 Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0' # 毎週日曜日 00:00 UTC
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 🧰 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Enforce dependency security contracts
        run: npm run test:dependency-security

      - name: 🔍 Reject critical/high dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: 🔍 Reject every runtime vulnerability
        run: npm audit --omit=dev --audit-level=low

      - name: 🛡️ Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript,typescript

      - name: 🔍 Perform CodeQL Analysis
        id: codeql
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        continue-on-error: true # 警告のみ、失敗させない
        with:
          # SARIF をファイルに落として次の step で中身を出す。
          # ★理由: 検出結果 (rule / file / line) を読む唯一の経路が Security タブと
          #   code-scanning API で、どちらも一部のセッション/権限からは参照できない。
          #   「CodeQL 3 件」だけが見えて中身が見えないと原因を推測で当てにいくことになり、
          #   実際に 3 回外した (workflow の式インジェクション → prototype 汚染 →
          #   execSync の command injection)。job summary に出せば誰でも読める。
          output: sarif-results

      # ★ロジックはスクリプトに置く。workflow に node -e でインライン展開すると
      #   shellcheck が SC2016 (単一引用符内の ${} は展開されない) を出して
      #   Static Gates が落ちる。中身の検証もスクリプトなら単体で回せる。
      - name: 📋 Dump CodeQL findings (rule / file / line)
        if: always()
        run: node .github/scripts/dump-codeql-sarif.mjs sarif-results | tee -a "$GITHUB_STEP_SUMMARY"

      - name: ✅ Security scan completed
        run: echo "✅ Security scan completed"
