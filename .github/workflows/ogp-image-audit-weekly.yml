name: 🖼 OGP Image Audit (weekly self-heal)

# OGP・リンクカード・note カバーの生成漏れを週次で機械チェックし、欠落を自動修復する。
# 検知も生成もすべて決定的スクリプト (Node fetch + Satori、LLM 不使用)。費用は Actions
# 分数 + R2 HEAD のみ (LLM API 課金ゼロ)。正典: .claude/rules/ogp-image-standards.md。
#
# 流れ: fingerprint 差分だけ生成 (--max-generate で blast radius 制限) → exact plan push →
#       freshness + inventory 最終監査 → inventory を develop に commit-back →
#       それでも陳腐化/欠落が残るときは Issue 起票して workflow も失敗させる。
#
# 新規 ranking 公開時は sync-snapshots.yml のフックが即生成するため、本 workflow は
# セーフティネット (漏れ・note 新規・再生成漏れの回収)。

on:
  schedule:
    - cron: '0 18 * * 6' # 土 18:00 UTC = 日 03:00 JST (既存 cron と非重複)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: r2-write
  cancel-in-progress: false

env:
  R2_PUBLIC_FETCH_URL: https://storage.stats47.jp
  SITE_ORIGIN: https://stats47.jp
  CLOUDFLARE_R2_BUCKET_NAME: stats47
  # S3 API 経由 R2 書き込み (exact image publisher)
  R2_S3_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
  R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 🧰 Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: ♻️ Self-heal changed images (fingerprint差分のみ生成→R2)
        id: image_repair
        run: |
          TSC="apps/web/scripts/tsconfig.ogp.json"
          SC="apps/web/scripts/generate-ogp-images.ts"
          for TYPE in ranking ranking-cards areas note-covers pref-silhouette; do
            echo "=== self-heal $TYPE ==="
            npx tsx --tsconfig "$TSC" "$SC" --type "$TYPE" --limit 500 --max-generate 500
            PLAN=".local/image-generation-publish-plan-${TYPE}.json"
            test -f "$PLAN" || { echo "exact publish plan が生成されませんでした: $TYPE"; exit 1; }
            npx tsx packages/r2-storage/src/scripts/push-generated-image-set.ts --plan "$PLAN"
          done

      - name: 🖼 Self-heal changed blog thumbnails/OGP
        id: blog_repair
        run: |
          npx tsx apps/web/scripts/generate-blog-thumbnails-cloud.ts \
            --limit 500 --max-generate 500
          PLAN=".local/image-generation-publish-plan-blog.json"
          test -f "$PLAN" || { echo "exact publish plan が生成されませんでした: blog"; exit 1; }
          npx tsx packages/r2-storage/src/scripts/push-generated-image-set.ts --plan "$PLAN"

      - name: 🔍 Final audit (fingerprint鮮度 + 欠落)
        if: always()
        id: check
        run: |
          set +e
          STATUS=0
          TSC="apps/web/scripts/tsconfig.ogp.json"
          SC="apps/web/scripts/generate-ogp-images.ts"
          for TYPE in ranking ranking-cards areas note-covers pref-silhouette; do
            npx tsx --tsconfig "$TSC" "$SC" --type "$TYPE" --audit \
              2>&1 | tee -a /tmp/ogp-freshness-audit.log
            [ "${PIPESTATUS[0]}" -eq 0 ] || STATUS=1
          done
          npx tsx apps/web/scripts/generate-blog-thumbnails-cloud.ts --audit \
            2>&1 | tee -a /tmp/ogp-freshness-audit.log
          [ "${PIPESTATUS[0]}" -eq 0 ] || STATUS=1
          node .claude/scripts/ogp/build-image-gallery.mjs --audit --all 2>&1 | tee /tmp/ogp-audit.log
          [ "${PIPESTATUS[0]}" -eq 0 ] || STATUS=1
          if [ "${{ steps.image_repair.outcome }}" != "success" ] || \
             [ "${{ steps.blog_repair.outcome }}" != "success" ]; then
            STATUS=1
          fi
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 📤 Commit inventory to develop
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude/state/ogp/inventory.json
          if git diff --cached --quiet; then
            echo "No inventory changes"
            exit 0
          fi
          git commit -m "chore(ogp): weekly image audit inventory $(date -u +%Y-%m-%d) [skip ci]"
          # ★2026-08-16 是正: pull せずに push していたため、develop が 1 コミットでも進んでいると
          # `! [rejected] (fetch first)` で必ず落ちていた (2 週連続・inventory が commit されない)。
          git pull --rebase origin develop
          git push origin develop

      - name: 🚨 Open issue on unresolved image drift
        if: always() && steps.check.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          TITLE="[OGP Alert] OGP画像の欠落・陳腐化 (自動修復後も残存)"
          {
            echo "## OGP画像 週次監査 ($DATE)"
            echo ""
            echo "自動修復 (fingerprint差分の生成→R2 push) 後も、欠落・陳腐化・repair失敗のいずれかが残っています。"
            echo "対象キー判定、入力データ、または renderer の失敗を確認してください。"
            echo ""
            echo '```'
            {
              grep -E "^\[missing\]|欠落|❌|missing" /tmp/ogp-audit.log
              grep -E "更新必要|fingerprint|required|陳腐化" /tmp/ogp-freshness-audit.log
            } | head -60
            echo '```'
            echo ""
            echo "手動調査: \`OGP_DEBUG=1 npx tsx --tsconfig apps/web/scripts/tsconfig.ogp.json apps/web/scripts/generate-ogp-images.ts --type <type> --key <欠落key> --force\`"
            echo "正典: .claude/rules/ogp-image-standards.md / skill: /audit-ogp-images"
          } > /tmp/ogp-issue.md

          # ラベル自己プロビジョニング (初回起票で label 不在エラーを避ける)
          gh label create ogp-alert --description "OGP画像の生成漏れ (自動修復後も残存)" --color "d93f0b" --force 2>/dev/null || true

          EXISTING=$(gh issue list --state open --label ogp-alert --search "\"[OGP Alert]\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Existing open issue #$EXISTING — replacing with latest audit"
            gh issue edit "$EXISTING" --title "$TITLE" --body-file /tmp/ogp-issue.md
          else
            gh issue create --title "$TITLE" --label "ogp-alert,auto-generated" --body-file /tmp/ogp-issue.md
          fi

      - name: ✅ Close recovered OGP alert
        if: always() && steps.check.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --state open --label ogp-alert --limit 100 --json number --jq '.[].number' |
            while read -r NUMBER; do
              gh issue close "$NUMBER" --reason completed \
                --comment "OGPのfingerprint鮮度・inventory・repairがすべて正常へ復旧したため自動Closeします。"
            done

      - name: ❌ Fail on unresolved image drift
        if: always() && steps.check.outputs.exit_code != '0'
        run: |
          echo "画像の陳腐化・欠落・repair失敗が残っています"
          exit 1
