name: 🔎 GSC URL Inspection (daily)

on:
  schedule:
    - cron: "0 21 * * *" # JST 06:00 = UTC 21:00 (前日)
  workflow_dispatch:
    inputs:
      limit:
        description: "Limit URLs (default 500、空白で全件)"
        required: false
        default: "500"

permissions:
  contents: write
  issues: write

concurrency:
  group: gsc-url-inspection-daily
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # 500 URL × ~7s = 60 分、安全マージン込み
    steps:
      - name: 🧰 Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔎 Run URL Inspection
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          # default 500 URL/日 (60分 + マージン)。空白指定で全件 (timeout 注意)
          LIMIT_OPT="${{ inputs.limit || '500' }}"
          if [ -n "$LIMIT_OPT" ]; then
            node .claude/scripts/gsc/url-inspection-daily.cjs --limit "$LIMIT_OPT"
          else
            node .claude/scripts/gsc/url-inspection-daily.cjs
          fi

      - name: 📅 Resolve date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: 🧹 Retain recent raw inspection snapshots
        # 集計履歴は history.csv、詳細調査は最新7日。古い生CSVはGit履歴から復元できる。
        run: node .claude/scripts/lib/prune-state-snapshots.mjs --scope gsc

      - name: 💾 Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude/state/metrics/gsc/url-inspection/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(gsc): URL Inspection daily snapshot ${{ steps.date.outputs.date }}"
            # 本 job は ~1 時間走り、その間に gsc-auto-resubmit-daily (UTC 22:25 頃) が main を進めるため
            # 素の push は毎日 non-fast-forward で拒否される (2026-07-11〜17 に 7 日連続 fail)。
            # --autostash: 選択 add (state dir のみ) の後に working tree に残る未ステージの
            # 変更 (npm ci 等の副作用) が rebase を止める事象 (2026-07-18 run 29622319874) を回避する。
            # commit 済みの snapshot と resubmit 側は互いに素なので rebase は常にクリーン。
            git pull --rebase --autostash origin develop
            # 投稿/計測 state は develop へ commit-back する (main 直推しは branch-workflow 違反。2026-08-16 是正)
            git push origin develop
          fi

      - name: 💬 Comment summary on parent issue #115
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = '.claude/state/metrics/gsc/url-inspection/LATEST.md';
            if (!fs.existsSync(path)) {
              core.warning('LATEST.md not found, skipping comment');
              return;
            }
            const body = fs.readFileSync(path, 'utf-8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 115,
              body: body,
            });

      - name: 📄 Step Summary
        if: always()
        run: |
          if [ -f .claude/state/metrics/gsc/url-inspection/LATEST.md ]; then
            cat .claude/state/metrics/gsc/url-inspection/LATEST.md >> "$GITHUB_STEP_SUMMARY"
          fi
