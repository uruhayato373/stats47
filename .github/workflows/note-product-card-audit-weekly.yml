name: 🛒 note Product Card Audit (weekly)

# note.com記事の商品カード (embedded-service="external-article" の figure で
# data-src が https://stats47.jp/products/... を指すもの) が実商品
# (apps/web/src/features/products/storefront.generated.ts の STOREFRONT_PRODUCTS) の
# title/description を表示しているかを read-only で週次検知する。
#
# 2種の監査を直列実行:
#   1. catalog整合性  — 全マガジンの productTarget slug が storefront に実在するか (ネットワークなし)
#   2. live 本文突合   — 無料 かつ productTarget を持つマガジン所属の公開記事について、
#                        note公開APIから実本文を取得し商品カードのtitleを期待値と突合する
#
# 正典: .claude/scripts/note/audit-note-product-cards.mjs

on:
  schedule:
    - cron: '20 20 * * 6' # 土 20:20 UTC = 日 05:20 JST (note-circulation-audit-weekly の直後)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: note-product-card-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 🧰 Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Product card audit (catalog整合性 + live本文突合)
        id: audit
        run: |
          set +e
          node .claude/scripts/note/audit-note-product-cards.mjs --live 2>&1 | tee /tmp/note-product-card-audit.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: 📤 Upload audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: note-product-card-audit
          path: |
            /tmp/note-product-card-audit.json
            /tmp/note-product-card-audit.log
          if-no-files-found: warn
          retention-days: 14

      - name: 🚨 Open or update note product card alert
        if: always() && steps.audit.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="[note Product Card Alert] 商品カードのtitle/description不一致"
          {
            echo "## note 商品カード 週次監査"
            echo ""
            echo "note記事の商品カード (products/* を指す external-article figure) が"
            echo "実商品 (storefront.generated.ts) の title/description と一致しない可能性があります。"
            echo ""
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Report artifact: note-product-card-audit"
            echo ""
            echo "### 監査ログ (末尾50行)"
            echo '```'
            tail -50 /tmp/note-product-card-audit.log
            echo '```'
            echo ""
            echo "正典: \`.claude/scripts/note/audit-note-product-cards.mjs\`"
          } > /tmp/note-product-card-issue.md

          EXISTING=$(gh issue list --state open --label auto-generated \
            --search "\"[note Product Card Alert]\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "$TITLE" --body-file /tmp/note-product-card-issue.md
          else
            gh issue create --title "$TITLE" --label "auto-generated" --body-file /tmp/note-product-card-issue.md
          fi

      - name: ✅ Close recovered note product card alert
        if: always() && steps.audit.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --state open --label auto-generated \
            --search "\"[note Product Card Alert]\" in:title" --json number --jq '.[].number' |
            while read -r NUMBER; do
              gh issue close "$NUMBER" --reason completed \
                --comment "note商品カードのtitle/description監査が正常へ復旧したため自動Closeします。"
            done

      - name: ❌ Fail on unresolved product card drift
        if: always() && steps.audit.outputs.exit_code != '0'
        run: exit 1
