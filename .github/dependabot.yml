version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "04:00"
      timezone: Asia/Tokyo
    # 月 1 本の PR にまとめて develop へ入れる (main 宛ての案件ごとの PR が溜まっていた。2026-11-04)
    target-branch: develop
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 1
    commit-message:
      prefix: "ci(deps)"
