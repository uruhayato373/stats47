<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="公衆電話 全国平均の年次推移（1984年ピーク〜2024年）" class="svg-chart">
  <title>公衆電話 全国平均：1984年=19894、2003年=10705、2024年=2045</title>
  <line x1="60" y1="20" x2="60" y2="230" class="svg-axis" stroke="currentColor" stroke-width="1" />
  <line x1="60" y1="230" x2="620" y2="230" class="svg-axis" stroke="currentColor" stroke-width="1" />
  <polyline fill="none" stroke="currentColor" stroke-width="2" class="svg-line"
    points="60,32 130,38 200,60 270,95 340,140 410,178 480,200 550,213 620,222" />
  <circle cx="60" cy="32" r="3" class="svg-point" fill="currentColor"><title>1984年：19894</title></circle>
  <circle cx="270" cy="95" r="3" class="svg-point" fill="currentColor"><title>2003年：10705</title></circle>
  <circle cx="620" cy="222" r="3" class="svg-point" fill="currentColor"><title>2024年：2045</title></circle>
  <text x="60" y="248" font-size="11" text-anchor="middle" class="svg-label" fill="currentColor">1984</text>
  <text x="270" y="248" font-size="11" text-anchor="middle" class="svg-label" fill="currentColor">2003</text>
  <text x="620" y="248" font-size="11" text-anchor="end" class="svg-label" fill="currentColor">2024</text>
  <text x="320" y="270" font-size="12" text-anchor="middle" class="svg-label" fill="currentColor">全国平均（設置密度指標）の推移</text>
</svg>