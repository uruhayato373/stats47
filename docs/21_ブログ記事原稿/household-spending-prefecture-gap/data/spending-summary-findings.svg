<svg width="960" height="326" viewBox="0 0 960 326" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" role="img" aria-label="この記事でわかったこと">
  <rect width="960" height="326" fill="#f9fafb"/>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">この記事でわかったこと</text>
  <rect x="60" y="64" width="840" height="64" fill="#ffffff"/>
  <circle cx="100" cy="96" r="16" fill="#dc2626"/>
  <text x="100" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1</text>
  <text x="140" y="90" font-size="15" font-weight="bold" fill="#1f2937">消費支出は埼玉県が1位（約35.8万円）、沖縄県が47位（約25.6万円）</text>
  <text x="140" y="112" font-size="13" fill="#4b5563">首都圏が上位を占め、1位と47位で約10万円・1.4倍の格差がある</text>
  <rect x="60" y="128" width="840" height="64" fill="#f9fafb"/>
  <circle cx="100" cy="160" r="16" fill="#ea580c"/>
  <text x="100" y="166" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">2</text>
  <text x="140" y="154" font-size="15" font-weight="bold" fill="#1f2937">食料費割合（エンゲル係数）は兵庫県31.8%が最高、栃木県25.2%が最低</text>
  <text x="140" y="176" font-size="13" fill="#4b5563">大都市圏で食料費比率が高く、北関東では低い傾向</text>
  <rect x="60" y="192" width="840" height="64" fill="#ffffff"/>
  <circle cx="100" cy="224" r="16" fill="#0284c7"/>
  <text x="100" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">3</text>
  <text x="140" y="218" font-size="15" font-weight="bold" fill="#1f2937">消費支出が多いほど食料費割合は低い「エンゲルの法則」が概ね成立</text>
  <text x="140" y="240" font-size="13" fill="#4b5563">ただし兵庫・大阪は支出が少ないのに食料費割合が高い例外パターン</text>
  <rect x="60" y="256" width="840" height="64" fill="#f9fafb"/>
  <circle cx="100" cy="288" r="16" fill="#7c3aed"/>
  <text x="100" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">4</text>
  <text x="140" y="282" font-size="15" font-weight="bold" fill="#1f2937">教養娯楽費・被服費は大都市圏で高く、地方で低い</text>
  <text x="140" y="304" font-size="13" fill="#4b5563">東京11.0%・愛知3.9%がそれぞれ1位で、都市部の消費の多様性を反映</text>
</svg>