<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="最低賃金と有効求人倍率の散布図（代表県）">
  <rect width="100%" height="100%" fill="#f8fafc" rx="6"/>
  <text x="10" y="20" font-size="13" font-weight="bold" fill="#1e293b">最低賃金 vs 有効求人倍率（代表県）</text>
  <!-- Axes -->
  <line x1="80" y1="250" x2="680" y2="250" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="80" y1="30" x2="80" y2="250" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Axis labels -->
  <text x="380" y="275" text-anchor="middle" font-size="11" fill="#64748b">最低賃金（円）</text>
  <text x="20" y="145" text-anchor="middle" font-size="11" fill="#64748b" transform="rotate(-90,20,145)">有効求人倍率</text>
  <!-- Data points (approximate positions) -->
  <!-- 福井: 賃金984円, 求人1.94 → x≈350, y≈60 -->
  <circle cx="350" cy="60" r="6" fill="#ef4444"/>
  <text x="360" y="56" font-size="11" fill="#1e293b">福井(求人1位)</text>
  <!-- 神奈川: 賃金1162円, 求人0.88 → x≈580, y≈235 -->
  <circle cx="580" cy="235" r="6" fill="#1d4ed8"/>
  <text x="590" y="231" font-size="11" fill="#1e293b">神奈川</text>
  <!-- 東京: 賃金1163円, 求人1.2 → x≈582, y≈175 -->
  <circle cx="582" cy="175" r="6" fill="#3b82f6"/>
  <text x="592" y="171" font-size="11" fill="#1e293b">東京</text>
  <!-- 秋田: 賃金951円, 求人1.3 → x≈310, y≈155 -->
  <circle cx="310" cy="155" r="6" fill="#f97316"/>
  <text x="320" y="151" font-size="11" fill="#1e293b">秋田</text>
  <!-- 愛知: 賃金1077円, 求人1.5 → x≈470, y≈120 -->
  <circle cx="470" cy="120" r="6" fill="#3b82f6"/>
  <text x="480" y="116" font-size="11" fill="#1e293b">愛知</text>
  <text x="380" y="295" text-anchor="middle" font-size="11" fill="#64748b">出典：厚生労働省「地域別最低賃金」「職業安定業務統計」</text>
</svg>