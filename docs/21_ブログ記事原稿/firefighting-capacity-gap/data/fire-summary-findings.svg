<svg width="960" height="394" viewBox="0 0 960 394" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" role="img" aria-label="この記事でわかったこと"><rect width="960" height="394" fill="#f9fafb"/><text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">この記事でわかったこと</text><rect x="60" y="64" width="840" height="64" fill="#ffffff"/><circle cx="100" cy="96" r="16" fill="#dc2626"/><text x="100" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1</text><text x="140" y="90" font-size="15" font-weight="bold" fill="#1f2937">消防署密度に11.4倍の地域格差</text><text x="140" y="112" font-size="13" fill="#4b5563">東京都21.6署/100km² vs 北海道1.9署──大都市圏に消防署が集中</text><rect x="60" y="128" width="840" height="64" fill="#f9fafb"/><circle cx="100" cy="160" r="16" fill="#ea580c"/><text x="100" y="166" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">2</text><text x="140" y="154" font-size="15" font-weight="bold" fill="#1f2937">出火率は都市部が低く地方が高い</text><text x="140" y="176" font-size="13" fill="#4b5563">茨城県49件 vs 富山県17.7件（10万人当たり）──消防署密度と逆の傾向</text><rect x="60" y="192" width="840" height="64" fill="#ffffff"/><circle cx="100" cy="224" r="16" fill="#0284c7"/><text x="100" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">3</text><text x="140" y="218" font-size="15" font-weight="bold" fill="#1f2937">消防吏員数は秋田が最多、福岡が最少</text><text x="140" y="240" font-size="13" fill="#4b5563">秋田県222人 vs 福岡県98.7人（10万人当たり）──2.2倍の差</text><rect x="60" y="256" width="840" height="64" fill="#f9fafb"/><circle cx="100" cy="288" r="16" fill="#7c3aed"/><text x="100" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">4</text><text x="140" y="282" font-size="15" font-weight="bold" fill="#1f2937">消防費割合は青森が最高、東京が最低</text><text x="140" y="304" font-size="13" fill="#4b5563">青森県6.64% vs 東京都2.06%──地方ほど財政に占める消防費が大きい</text><rect x="60" y="320" width="840" height="64" fill="#ffffff"/><circle cx="100" cy="352" r="16" fill="#059669"/><text x="100" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">5</text><text x="140" y="346" font-size="15" font-weight="bold" fill="#1f2937">救急車は島根が最多、東京が最少</text><text x="140" y="368" font-size="13" fill="#4b5563">島根県12台 vs 東京都2.7台（10万人当たり）──4.4倍の差</text></svg>