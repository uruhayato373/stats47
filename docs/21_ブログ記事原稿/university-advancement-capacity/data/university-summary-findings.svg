<svg width="960" height="326" viewBox="0 0 960 326" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="この記事でわかったこと" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <rect width="960" height="326" fill="#f9fafb"/>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">この記事でわかったこと</text>
  <rect x="60" y="64" width="840" height="64" fill="#ffffff"/>
  <circle cx="100" cy="96" r="16" fill="#dc2626"/>
  <text x="100" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1</text>
  <text x="140" y="90" font-size="15" font-weight="bold" fill="#1f2937">京都・東京が「大学集積地」、収容力指数は200超</text>
  <text x="140" y="112" font-size="13" fill="#4b5563">高校卒業生数に対する大学定員の比率は京都238.4、東京229.8と突出。地方からの学生流入が大きい。</text>
  <rect x="60" y="128" width="840" height="64" fill="#f9fafb"/>
  <circle cx="100" cy="160" r="16" fill="#ea580c"/>
  <text x="100" y="166" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">2</text>
  <text x="140" y="154" font-size="15" font-weight="bold" fill="#1f2937">進学率は東京74.1%、沖縄46.7%で約28ポイントの格差</text>
  <text x="140" y="176" font-size="13" fill="#4b5563">大都市圏ほど高く、東北・九州が低い。大学へのアクセスと経済力が進学率を左右している。</text>
  <rect x="60" y="192" width="840" height="64" fill="#ffffff"/>
  <circle cx="100" cy="224" r="16" fill="#0284c7"/>
  <text x="100" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">3</text>
  <text x="140" y="218" font-size="15" font-weight="bold" fill="#1f2937">県内大学への入学率は愛知71%、鳥取15%──地元定着率に5倍の差</text>
  <text x="140" y="240" font-size="13" fill="#4b5563">大学の多い県は学生を域内に留め、少ない県は県外流出が常態化。人口流出の起点になっている。</text>
  <rect x="60" y="256" width="840" height="64" fill="#f9fafb"/>
  <circle cx="100" cy="288" r="16" fill="#7c3aed"/>
  <text x="100" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">4</text>
  <text x="140" y="282" font-size="15" font-weight="bold" fill="#1f2937">進学率が高い県ほど大卒割合も高い──正の相関が明確</text>
  <text x="140" y="304" font-size="13" fill="#4b5563">高校から大学への進学率と、最終学歴が大卒以上の住民割合は強く連動。教育インフラの地域差が世代を超えて蓄積する。</text>
</svg>