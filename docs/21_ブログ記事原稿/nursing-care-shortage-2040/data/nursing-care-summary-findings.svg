<svg width="960" height="468" viewBox="0 0 960 468" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" role="img" aria-label="この記事でわかったこと"><rect width="960" height="468" fill="#f9fafb"/><text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">この記事でわかったこと</text><rect x="60" y="64" width="840" height="64" fill="#ffffff"/><circle cx="100" cy="96" r="16" fill="#1565c0"/><text x="100" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1</text><text x="140" y="90" font-size="15" font-weight="bold" fill="#1f2937">特養の数は島根40.5所 vs 愛知15.4所──2.6倍の地域差</text><text x="140" y="112" font-size="13" fill="#4b5563">大都市圏ほど施設が少なく、東北・山陰・南九州に多い地域パターン</text><rect x="60" y="128" width="840" height="64" fill="#f9fafb"/><circle cx="100" cy="160" r="16" fill="#2e7d32"/><text x="100" y="166" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">2</text><text x="140" y="154" font-size="15" font-weight="bold" fill="#1f2937">老人ホーム定員は宮崎60.4人 vs 山梨24.4人──2.5倍の差</text><text x="140" y="176" font-size="13" fill="#4b5563">有料老人ホームの普及度が地域差の主因。宮崎は公的・民間施設ともに充実</text><rect x="60" y="192" width="840" height="64" fill="#ffffff"/><circle cx="100" cy="224" r="16" fill="#c62828"/><text x="100" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">3</text><text x="140" y="218" font-size="15" font-weight="bold" fill="#1f2937">介護人材は宮崎2,838人 vs 山梨1,177人──2040年に69万人不足</text><text x="140" y="240" font-size="13" fill="#4b5563">人材が少ない地域では施設があっても受け入れ枠が制限される</text><rect x="60" y="256" width="840" height="64" fill="#f9fafb"/><circle cx="100" cy="288" r="16" fill="#7b1fa2"/><text x="100" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">4</text><text x="140" y="282" font-size="15" font-weight="bold" fill="#1f2937">高齢化率と施設数の相関は弱い──「介護難民リスク」が偏在</text><text x="140" y="304" font-size="13" fill="#4b5563">高齢化が急速に進んだ県で施設整備が追いついていない構造的課題</text><rect x="60" y="320" width="840" height="64" fill="#ffffff"/><circle cx="100" cy="352" r="16" fill="#e65100"/><text x="100" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">5</text><text x="140" y="346" font-size="15" font-weight="bold" fill="#1f2937">老人福祉費トップは神奈川9.8%──大都市圏と地方で異なる課題</text><text x="140" y="368" font-size="13" fill="#4b5563">大都市圏は介護単価の高さ、地方は財政規模の制約がボトルネック</text><rect x="60" y="404" width="840" height="48" fill="#fce4ec" rx="8"/><text x="480" y="434" text-anchor="middle" font-size="13" fill="#c62828" font-weight="bold">施設整備・人材確保・財政負担の3課題が2040年に向けて同時に深刻化する</text></svg>
