<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-label="全国平均貯蓄率の推移（1984-2024年）">
  <rect width="100%" height="100%" fill="#f8fafc" rx="6"/>
  <text x="10" y="20" font-size="13" font-weight="bold" fill="#1e293b">全国平均 貯蓄率の推移（1984-2024年）</text>
  <!-- Y axis labels -->
  <text x="55" y="205" text-anchor="end" font-size="11" fill="#64748b">10%</text>
  <text x="55" y="165" text-anchor="end" font-size="11" fill="#64748b">20%</text>
  <text x="55" y="125" text-anchor="end" font-size="11" fill="#64748b">30%</text>
  <text x="55" y="85" text-anchor="end" font-size="11" fill="#64748b">40%</text>
  <!-- Reference lines -->
  <line x1="60" y1="205" x2="700" y2="205" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="60" y1="165" x2="700" y2="165" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="60" y1="125" x2="700" y2="125" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="60" y1="85" x2="700" y2="85" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Line path (approximate) 1984:11.3% → 1990:21% → 1997:17% → 2010:17% → 2018:26.5% → 2020:35.6% → 2024:35.6% -->
  <polyline points="60,201 160,186 230,190 360,190 480,175 560,133 640,130 700,130" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
  <!-- Annotations -->
  <text x="475" y="172" font-size="10" fill="#dc2626">2018: 26.5%</text>
  <text x="555" y="128" font-size="10" fill="#dc2626">2020: 35.6%</text>
  <text x="60" y="200" font-size="10" fill="#64748b">1984</text>
  <text x="700" y="200" font-size="10" text-anchor="end" fill="#64748b">2024</text>
  <text x="360" y="230" text-anchor="middle" font-size="11" fill="#64748b">出典：総務省「家計調査」</text>
</svg>