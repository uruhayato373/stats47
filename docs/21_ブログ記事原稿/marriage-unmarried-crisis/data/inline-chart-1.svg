<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="婚姻率 × 出生率の位置関係（代表4県）">
  <rect width="100%" height="100%" fill="#f8fafc" rx="6"/>
  <!-- 軸 -->
  <line x1="80" y1="260" x2="660" y2="260" stroke="#94a3b8" stroke-width="2"/>
  <line x1="80" y1="260" x2="80" y2="30" stroke="#94a3b8" stroke-width="2"/>
  <text x="370" y="295" text-anchor="middle" font-size="12" fill="#64748b">婚姻率（人口千人当たり）→</text>
  <text x="25" y="145" text-anchor="middle" font-size="12" fill="#64748b" transform="rotate(-90,25,145)">出生率（合計特殊）→</text>
  <!-- 100ライン相当の目安 -->
  <line x1="80" y1="155" x2="660" y2="155" stroke="#e2e8f0" stroke-dasharray="4"/>
  <text x="665" y="158" font-size="10" fill="#94a3b8">1.40</text>
  <!-- 点（代表4県） -->
  <!-- 東京: 婚姻1位・出生47位 → 右下 -->
  <circle cx="620" cy="240" r="12" fill="#b91c1c" opacity="0.8"/>
  <text x="620" y="270" text-anchor="middle" font-size="12" fill="#b91c1c" font-weight="bold">東京</text>
  <text x="620" y="284" text-anchor="middle" font-size="11" fill="#64748b">婚姻1位・出生47位</text>
  <!-- 沖縄: 婚姻3位・出生1位 → 右上 -->
  <circle cx="560" cy="50" r="12" fill="#1d4ed8" opacity="0.8"/>
  <text x="560" y="38" text-anchor="middle" font-size="12" fill="#1d4ed8" font-weight="bold">沖縄</text>
  <text x="560" y="26" text-anchor="middle" font-size="11" fill="#64748b">婚姻3位・出生1位</text>
  <!-- 秋田: 婚姻最下位・出生下位 → 左下 -->
  <circle cx="130" cy="220" r="12" fill="#f97316" opacity="0.8"/>
  <text x="130" y="215" text-anchor="middle" font-size="12" fill="#f97316" font-weight="bold">秋田</text>
  <text x="130" y="240" text-anchor="middle" font-size="11" fill="#64748b">婚姻最下位</text>
  <!-- 島根: 婚姻中位・出生高め → 中上 -->
  <circle cx="280" cy="90" r="12" fill="#16a34a" opacity="0.8"/>
  <text x="280" y="80" text-anchor="middle" font-size="12" fill="#16a34a" font-weight="bold">島根</text>
  <text x="280" y="98" text-anchor="middle" font-size="11" fill="#64748b">婚姻低め・出生高め</text>
  <text x="370" y="310" text-anchor="middle" font-size="11" fill="#64748b">婚姻率と出生率の関係（2022年データ・模式図）</text>
</svg>