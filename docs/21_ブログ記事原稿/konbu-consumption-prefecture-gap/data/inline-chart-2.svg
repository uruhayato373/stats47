<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="こんぶ消費量と北前船ルートの対応（模式図）">
  <rect width="100%" height="100%" fill="#f8fafc" rx="6"/>
  <text x="360" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">消費量と北前船ルートの重なり（上位10県）</text>
  <!-- 北前船ルート -->
  <text x="120" y="60" font-size="11" fill="#6366f1">北海道（産地）</text>
  <line x1="190" y1="60" x2="230" y2="70" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>
  <text x="240" y="75" font-size="11" fill="#6366f1">北前船ルート</text>
  <line x1="330" y1="70" x2="370" y2="60" stroke="#6366f1" stroke-width="2"/>
  <text x="380" y="55" font-size="11" fill="#6366f1">→ 東北・北陸（消費地）</text>
  <!-- 上位3 -->
  <rect x="60" y="90" width="120" height="30" fill="#dbeafe" rx="4"/>
  <text x="120" y="110" text-anchor="middle" font-size="11" fill="#1d4ed8">岩手1位 535g</text>
  <rect x="200" y="90" width="120" height="30" fill="#dbeafe" rx="4"/>
  <text x="260" y="110" text-anchor="middle" font-size="11" fill="#1d4ed8">山形2位 420g</text>
  <rect x="340" y="90" width="120" height="30" fill="#dbeafe" rx="4"/>
  <text x="400" y="110" text-anchor="middle" font-size="11" fill="#1d4ed8">秋田3位 361g</text>
  <!-- 産地 -->
  <rect x="480" y="90" width="120" height="30" fill="#fee2e2" rx="4"/>
  <text x="540" y="110" text-anchor="middle" font-size="11" fill="#dc2626">北海道46位 57g</text>
  <!-- 逆説 -->
  <text x="360" y="165" text-anchor="middle" font-size="11" fill="#64748b">産地（北海道）より消費地（東北・北陸）で多く消費される逆説</text>
</svg>