  <text x="90" y="103.6" font-size="18" class="svg-title"><tspan x="90" dy="0">『谷戸』は群馬県・神奈川県・埼玉県・東京都など南関東の西側に多く、居住地名1000件あた</tspan><tspan x="90" dy="22">り最大8.0件(群馬県)にのぼります。</tspan></text>
  <rect x="40" y="154" width="880" height="72" class="svg-plot" rx="8"/>
