  <text x="90" y="185.6" font-size="18" class="svg-title"><tspan x="90" dy="0">『谷津』は千葉県が突出し、居住地名1000件あたり5.0件。千葉県には『谷戸』を含む地名</tspan><tspan x="90" dy="22">が1件もありません。</tspan></text>
  <rect x="40" y="236" width="880" height="72" class="svg-plot" rx="8"/>
