  <text x="90" y="267.6" font-size="18" class="svg-title"><tspan x="90" dy="0">境界は県境にほぼ沿っており、東京湾を挟んだ西側(神奈川・東京・埼玉・群馬)は谷戸、東側(</tspan><tspan x="90" dy="22">千葉・茨城)は谷津が優勢です。</tspan></text>
  <rect x="40" y="318" width="880" height="72" class="svg-plot" rx="8"/>
