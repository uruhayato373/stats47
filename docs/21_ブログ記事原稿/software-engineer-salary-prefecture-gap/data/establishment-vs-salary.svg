<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" role="img" aria-label="IT事業所の集積と年収のねじれ">
  <style>
    .svg-bg { fill: #ffffff; }
    .svg-title { fill: #1f2937; }
    .svg-sub { fill: #6b7280; }
    .svg-axis { fill: #374151; }
    .svg-tick { fill: #6b7280; }
    .svg-grid { stroke: #e5e7eb; }
    .svg-badge-num { fill: #ffffff; }
