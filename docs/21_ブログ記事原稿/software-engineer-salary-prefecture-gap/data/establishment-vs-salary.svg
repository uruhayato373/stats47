    }
  </style>
  <rect width="680" height="430" class="svg-bg" rx="8"/>
  <text x="340.0" y="28" text-anchor="middle" font-size="16" font-weight="bold" class="svg-title">IT事業所の集積と年収のねじれ</text>
  <text x="340.0" y="48" text-anchor="middle" font-size="11" class="svg-sub">情報通信業 事業所数（青棒・全国シェア）と 年収順位（右端）</text>
  <text x="102" y="112.2" text-anchor="end" font-size="12" class="svg-axis">東京都</text>
  <rect x="110" y="86.0" width="360.0" height="44.4" fill="#2563eb" rx="3"/>
  <text x="476.0" y="112.2" font-size="11" class="svg-tick">22,591所 (34.1%)</text>
  <text x="666" y="112.2" text-anchor="end" font-size="12" font-weight="bold" fill="#dc2626">年収6位 571.7万</text>
  <text x="102" y="172.6" text-anchor="end" font-size="12" class="svg-axis">大阪府</text>
  <rect x="110" y="146.4" width="98.0" height="44.4" fill="#2563eb" rx="3"/>
  <text x="214.0" y="172.6" font-size="11" class="svg-tick">6,152所 (9.3%)</text>
  <text x="666" y="172.6" text-anchor="end" font-size="12" font-weight="bold" fill="#dc2626">年収4位 584.5万</text>
  <text x="102" y="233.0" text-anchor="end" font-size="12" class="svg-axis">神奈川県</text>
  <rect x="110" y="206.8" width="64.3" height="44.4" fill="#2563eb" rx="3"/>
  <text x="180.3" y="233.0" font-size="11" class="svg-tick">4,032所 (6.1%)</text>
  <text x="666" y="233.0" text-anchor="end" font-size="12" font-weight="bold" fill="#dc2626">年収18位 522.4万</text>
  <text x="102" y="293.4" text-anchor="end" font-size="12" class="svg-axis">愛知県</text>
  <rect x="110" y="267.2" width="56.1" height="44.4" fill="#2563eb" rx="3"/>
  <text x="172.1" y="293.4" font-size="11" class="svg-tick">3,518所 (5.3%)</text>
  <text x="666" y="293.4" text-anchor="end" font-size="12" font-weight="bold" fill="#dc2626">年収2位 596.5万</text>
