  <text x="90" y="267.6" font-size="18" class="svg-title"><tspan x="90" dy="0">農業就業人口は約210万人。2010年の約261万人から</tspan><tspan x="90" dy="22">5年で約50万人減少した</tspan></text>
  <rect x="40" y="318" width="880" height="72" class="svg-plot" rx="8"/>
  <circle cx="58" cy="354" r="18" fill="#dc2626"/>
