  <text x="90" y="349.6" font-size="18" class="svg-title"><tspan x="90" dy="0">就業人口が多い県ほど放棄面積も大きい（北海道・茨城・福島</tspan><tspan x="90" dy="22">）。母数が大きいほど離農が面積に表れる</tspan></text>
  <rect x="40" y="400" width="880" height="72" class="svg-plot" rx="8"/>
