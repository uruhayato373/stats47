  <text x="90" y="431.6" font-size="18" class="svg-title"><tspan x="90" dy="0">集約化は地域差が極端。北海道は1戸30.3haで青森4.</tspan><tspan x="90" dy="22">0haの7.6倍、都市部は0.6ha台と零細</tspan></text>
