  <text x="90" y="185.6" font-size="18" class="svg-title"><tspan x="90" dy="0">上位は東北・北関東に集中。福島は原発事故の避難区域、関東</tspan><tspan x="90" dy="22">平野の県は農地の絶対量が大きい</tspan></text>
  <rect x="40" y="236" width="880" height="72" class="svg-plot" rx="8"/>
