  <text x="90" y="103.6" font-size="18" class="svg-title"><tspan x="90" dy="0">全国の耕作放棄地は42.3万ha（埼玉県の面積に匹敵）。</tspan><tspan x="90" dy="22">福島2万5,226ha・茨城2万3,918haが突出</tspan></text>
