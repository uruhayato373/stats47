<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="婚姻率 上位・下位（人口千人当たり、2022年）">
  <text x="320" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">婚姻率 上位5・下位4（人口千人当たり、2022年）</text>
  <text x="200" y="46" text-anchor="end" font-size="11" fill="#2563eb" font-weight="bold">上位（大都市圏）</text>

