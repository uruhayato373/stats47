  <text x="417" y="291" font-size="12" fill="#1e293b">2.97</text>

  <rect x="200" y="302" width="187" height="20" fill="#ea580c" rx="2"/>
  <text x="195" y="317" text-anchor="end" font-size="12" fill="#334155">秋田</text>
