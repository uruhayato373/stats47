  <text x="532" y="97" font-size="12" fill="#1e293b">4.60</text>

  <rect x="200" y="108" width="316" height="20" fill="#3b82f6" rx="2"/>
  <text x="195" y="123" text-anchor="end" font-size="12" fill="#334155">沖縄</text>
  <text x="522" y="123" font-size="12" fill="#1e293b">4.46</text>

  <rect x="200" y="134" width="316" height="20" fill="#60a5fa" rx="2"/>
  <text x="195" y="149" text-anchor="end" font-size="12" fill="#334155">愛知</text>
  <text x="522" y="149" font-size="12" fill="#1e293b">4.46</text>

  <rect x="200" y="160" width="308" height="20" fill="#60a5fa" rx="2"/>
