  <text x="514" y="175" font-size="12" fill="#1e293b">4.35</text>

  <line x1="60" y1="194" x2="600" y2="194" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="200" y="214" text-anchor="end" font-size="11" fill="#ea580c" font-weight="bold">下位（東北）</text>

  <!-- 下位: 橙系 -->
  <rect x="200" y="224" width="217" height="20" fill="#fb923c" rx="2"/>
  <text x="195" y="239" text-anchor="end" font-size="12" fill="#334155">山形</text>
  <text x="423" y="239" font-size="12" fill="#1e293b">3.06</text>

  <rect x="200" y="250" width="215" height="20" fill="#f97316" rx="2"/>
