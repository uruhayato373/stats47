<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-label="離婚率 上位・下位（人口千人当たり、2022年）">
  <text x="320" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">離婚率 上位4・下位4（人口千人当たり、2022年）</text>
  <text x="200" y="46" text-anchor="end" font-size="11" fill="#2563eb" font-weight="bold">上位（西・南日本）</text>

  <!-- 上位: 青系 -->
  <rect x="200" y="56" width="360" height="20" fill="#2563eb" rx="2"/>
  <text x="195" y="71" text-anchor="end" font-size="12" fill="#334155">沖縄</text>
  <text x="566" y="71" font-size="12" fill="#1e293b" font-weight="bold">2.10（断トツ1位）</text>

  <rect x="200" y="82" width="286" height="20" fill="#3b82f6" rx="2"/>
  <text x="195" y="97" text-anchor="end" font-size="12" fill="#334155">宮崎</text>
  <text x="492" y="97" font-size="12" fill="#1e293b">1.67</text>

  <rect x="200" y="108" width="276" height="20" fill="#60a5fa" rx="2"/>
  <text x="195" y="123" text-anchor="end" font-size="12" fill="#334155">大阪</text>
  <text x="482" y="123" font-size="12" fill="#1e293b">1.61</text>

  <rect x="200" y="134" width="276" height="20" fill="#60a5fa" rx="2"/>
  <text x="195" y="149" text-anchor="end" font-size="12" fill="#334155">福岡</text>
  <text x="482" y="149" font-size="12" fill="#1e293b">1.61</text>

  <line x1="60" y1="168" x2="600" y2="168" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="200" y="188" text-anchor="end" font-size="11" fill="#ea580c" font-weight="bold">下位（北陸）</text>

  <!-- 下位: 橙系 -->
  <rect x="200" y="198" width="193" height="20" fill="#fb923c" rx="2"/>
  <text x="195" y="213" text-anchor="end" font-size="12" fill="#334155">福井</text>
  <text x="399" y="213" font-size="12" fill="#1e293b">1.13</text>

  <rect x="200" y="224" width="192" height="20" fill="#f97316" rx="2"/>
  <text x="195" y="239" text-anchor="end" font-size="12" fill="#334155">新潟</text>
  <text x="398" y="239" font-size="12" fill="#1e293b">1.12</text>

  <rect x="200" y="250" width="192" height="20" fill="#f97316" rx="2"/>
  <text x="195" y="265" text-anchor="end" font-size="12" fill="#334155">石川</text>
  <text x="398" y="265" font-size="12" fill="#1e293b">1.12</text>

  <rect x="200" y="276" width="181" height="20" fill="#ea580c" rx="2"/>
  <text x="195" y="291" text-anchor="end" font-size="12" fill="#334155">富山</text>
  <text x="387" y="291" font-size="12" fill="#1e293b" font-weight="bold">1.06（最低）</text>

  <text x="320" y="322" text-anchor="middle" font-size="11" fill="#64748b">※婚姻率1位の東京は離婚率29位（1.37）── 結婚が多い＝離婚が多いは成立しない</text>
  <text x="320" y="336" text-anchor="middle" font-size="10" fill="#94a3b8">出典: 厚生労働省「人口動態統計」2022年</text>
</svg>
