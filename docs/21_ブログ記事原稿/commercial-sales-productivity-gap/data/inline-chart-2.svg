  <rect x="100" y="58" width="360" height="26" fill="#16a34a" rx="3"/>
  <text x="96" y="75" text-anchor="end" font-size="12" fill="#334155">高知</text>
  <text x="465" y="75" font-size="12" fill="#1e293b">5.28店/千人（全国1位）</text>
  <rect x="100" y="92" width="338" height="26" fill="#22c55e" rx="3"/>
  <text x="96" y="109" text-anchor="end" font-size="12" fill="#334155">秋田</text>
  <text x="443" y="109" font-size="12" fill="#1e293b">4.95店/千人</text>
  <rect x="100" y="126" width="320" height="26" fill="#4ade80" rx="3"/>
  <text x="96" y="143" text-anchor="end" font-size="12" fill="#334155">長崎</text>
