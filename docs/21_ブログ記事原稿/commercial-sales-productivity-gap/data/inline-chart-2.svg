<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320">
  <rect width="680" height="320" fill="#f8fafc"/>
  <text x="340" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">飲食料品小売店数（人口千人当たり）上位・下位 各5県</text>
