  <text x="90" y="207.6" font-size="18" class="svg-title"><tspan x="90" dy="0">1位東京都（約4,743万人泊）と最下位島根県（約7万人</tspan><tspan x="90" dy="22">泊）の差は約700倍。地方分散は依然として進んでいない</tspan></text>
