  <text x="90" y="103.6" font-size="18" class="svg-title"><tspan x="90" dy="0">外国人延べ宿泊者数は全国で約1.39億人泊（2024年度</tspan><tspan x="90" dy="22">）。上位4都道府県（東京・大阪・京都・北海道）だけで約6</tspan><tspan x="90" dy="22">7.5%を占める</tspan></text>
