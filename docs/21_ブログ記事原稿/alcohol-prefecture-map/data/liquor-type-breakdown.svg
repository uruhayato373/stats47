<svg width="780" height="482" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" role="img" aria-label="酒類別消費量の内訳">
  <title>酒類別消費量の内訳（2018年度）</title>
  <rect width="680" height="420" fill="#fafafa" rx="8"/>
  <text x="340" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">酒類別消費量の内訳（2018年度）</text>
  <text x="212" y="85" text-anchor="end" font-size="11" fill="#374151">リキュール・その他の醸造酒等</text>
  <rect x="220" y="65" width="400" height="30" rx="4" fill="#ef5350" opacity="0.85"/>
  <text x="626" y="85" font-size="11" fill="#374151" font-weight="600">2,760 （33.5%）</text>
  <text x="212" y="125" text-anchor="end" font-size="11" fill="#374151">ビール</text>
  <rect x="220" y="105" width="345.7971014492754" height="30" rx="4" fill="#2e7d32" opacity="0.85"/>
  <text x="571.7971014492754" y="125" font-size="11" fill="#374151" font-weight="600">2,386 （28.9%）</text>
  <text x="212" y="165" text-anchor="end" font-size="11" fill="#374151">焼酎</text>
  <rect x="220" y="145" width="112.89855072463769" height="30" rx="4" fill="#4dd0e1" opacity="0.85"/>
  <text x="338.8985507246377" y="165" font-size="11" fill="#374151" font-weight="600">779 （9.4%）</text>
  <text x="212" y="205" text-anchor="end" font-size="11" fill="#374151">その他</text>
  <rect x="220" y="185" width="96.81159420289856" height="30" rx="4" fill="#ff9800" opacity="0.85"/>
  <text x="322.81159420289856" y="205" font-size="11" fill="#374151" font-weight="600">668 （8.1%）</text>
  <text x="212" y="245" text-anchor="end" font-size="11" fill="#374151">発泡酒</text>
  <rect x="220" y="225" width="89.85507246376811" height="30" rx="4" fill="#66bb6a" opacity="0.85"/>
  <text x="315.8550724637681" y="245" font-size="11" fill="#374151" font-weight="600">620 （7.5%）</text>
  <text x="212" y="285" text-anchor="end" font-size="11" fill="#374151">清酒</text>
  <rect x="220" y="265" width="70.86956521739131" height="30" rx="4" fill="#1565c0" opacity="0.85"/>
  <text x="296.8695652173913" y="285" font-size="11" fill="#374151" font-weight="600">489 （5.9%）</text>
  <text x="212" y="325" text-anchor="end" font-size="11" fill="#374151">果実酒</text>
  <rect x="220" y="305" width="52.46376811594203" height="30" rx="4" fill="#c0ca33" opacity="0.85"/>
  <text x="278.463768115942" y="325" font-size="11" fill="#374151" font-weight="600">362 （4.4%）</text>
  <text x="212" y="365" text-anchor="end" font-size="11" fill="#374151">ウイスキー・ブランデー</text>
  <rect x="220" y="345" width="26.231884057971016" height="30" rx="4" fill="#7b1fa2" opacity="0.85"/>
  <text x="252.231884057971" y="365" font-size="11" fill="#374151" font-weight="600">181 （2.2%）</text>
</svg>