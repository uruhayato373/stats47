<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img" aria-label="インバウンド宿泊者数3タイプの比較">
  <rect width="100%" height="100%" fill="#f8fafc" rx="6"/>
  <text x="360" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">インバウンド集客3タイプ（2024年）</text>
  <!-- Type A -->
  <rect x="40" y="40" width="180" height="90" fill="#dbeafe" rx="6"/>
  <text x="130" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">空港ハブ依存型</text>
  <text x="130" y="80" text-anchor="middle" font-size="11" fill="#334155">東京・大阪・京都</text>
  <text x="130" y="96" text-anchor="middle" font-size="11" fill="#334155">福岡・千葉・愛知</text>
  <text x="130" y="116" text-anchor="middle" font-size="10" fill="#64748b">ハブ空港2時間圏</text>
  <!-- Type B -->
  <rect x="270" y="40" width="180" height="90" fill="#d1fae5" rx="6"/>
  <text x="360" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">ブランド資源型</text>
  <text x="360" y="80" text-anchor="middle" font-size="11" fill="#334155">北海道・沖縄</text>
  <text x="360" y="96" text-anchor="middle" font-size="11" fill="#334155">（石川は移行途中）</text>
  <text x="360" y="116" text-anchor="middle" font-size="10" fill="#64748b">代替不可能な観光資源</text>
  <!-- Type C -->
  <rect x="500" y="40" width="180" height="90" fill="#fee2e2" rx="6"/>
  <text x="590" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">構造的不利型</text>
  <text x="590" y="80" text-anchor="middle" font-size="11" fill="#334155">山陰・北東北・北陸末端</text>
  <text x="590" y="96" text-anchor="middle" font-size="11" fill="#334155">高知・秋田・福井・島根</text>
  <text x="590" y="116" text-anchor="middle" font-size="10" fill="#64748b">空港遠・認知低・資源未活用</text>
</svg>