  <text x="90" y="311.6" font-size="18" class="svg-title"><tspan x="90" dy="0">テレワーク率が高い県は副業率・転職率も高い傾向。通勤時間</tspan><tspan x="90" dy="22">の節約と地理的制約の緩和が、働き方全体の柔軟性を高めてい</tspan><tspan x="90" dy="22">る</tspan></text>
