  <text x="90" y="207.6" font-size="18" class="svg-title"><tspan x="90" dy="0">格差の主因は産業構造──情報通信業の集積が実施率を左右。</tspan><tspan x="90" dy="22">農林漁業・製造業・建設業が中心の地域は現場作業が不可欠で</tspan><tspan x="90" dy="22">テレワーク率が低い</tspan></text>
