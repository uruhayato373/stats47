  <text x="90" y="415.6" font-size="18" class="svg-title"><tspan x="90" dy="0">テレワーク格差はキャリア選択肢の格差に直結。地方では「こ</tspan><tspan x="90" dy="22">の地域で働ける仕事」が限られ、転職・副業の選択肢が狭まる</tspan><tspan x="90" dy="22">構造</tspan></text>
