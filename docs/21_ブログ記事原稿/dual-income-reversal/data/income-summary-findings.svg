<svg width="680" height="298" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 298" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" role="img" aria-label="この記事でわかったこと"><rect width="680" height="298" fill="#fafafa" rx="8"/><rect x="10" y="16" width="660" height="68" fill="#fff" rx="4"/><circle cx="36" cy="50" r="14" fill="#1565c0"/><text x="36" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">1</text><text x="60" y="43" font-size="13" font-weight="bold" fill="#333">月収1位は東京79.4万円、47位は沖縄49.4万円</text><text x="60" y="63" font-size="11" fill="#6b7280">勤労者世帯の実収入は首都圏が上位を占め、1位と47位で約1.6倍の差</text><rect x="10" y="84" width="660" height="68" fill="#f9fafb" rx="4"/><circle cx="36" cy="118" r="14" fill="#2e7d32"/><text x="36" y="123" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">2</text><text x="60" y="111" font-size="13" font-weight="bold" fill="#333">共働き率が高い県は「世帯力」で逆転</text><text x="60" y="131" font-size="11" fill="#6b7280">山形は世帯主収入38位→実収入9位。富山・福井も共働きで大幅ランクアップ</text><rect x="10" y="152" width="660" height="68" fill="#fff" rx="4"/><circle cx="36" cy="186" r="14" fill="#e65100"/><text x="36" y="191" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">3</text><text x="60" y="179" font-size="13" font-weight="bold" fill="#333">首都圏は「世帯主一馬力型」</text><text x="60" y="199" font-size="11" fill="#6b7280">埼玉・千葉は世帯主依存度が約79%。高い通勤収入に依存する構造</text><rect x="10" y="220" width="660" height="68" fill="#f9fafb" rx="4"/><circle cx="36" cy="254" r="14" fill="#6a1b9a"/><text x="36" y="259" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">4</text><text x="60" y="247" font-size="13" font-weight="bold" fill="#333">50年で名目2.6倍、バブル期ピークをようやく超えた</text><text x="60" y="267" font-size="11" fill="#6b7280">1975年の24万円→2024年の63万円。1997年のピーク水準を27年かけて回復</text></svg>