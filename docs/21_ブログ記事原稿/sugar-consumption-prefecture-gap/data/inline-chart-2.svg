<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-label="砂糖消費量4クラスターの概念図">
  <rect width="100%" height="100%" fill="#f8fafc" rx="6"/>
  <text x="360" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">砂糖消費量4クラスターの背景（2024年）</text>
  <rect x="20" y="40" width="155" height="130" fill="#dbeafe" rx="6"/>
  <text x="97" y="62" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">東海クラスター</text>
  <text x="97" y="80" text-anchor="middle" font-size="11" fill="#334155">三重1位（5,020g）</text>
  <text x="97" y="96" text-anchor="middle" font-size="10" fill="#475569">煮魚・煮物文化</text>
  <text x="97" y="112" text-anchor="middle" font-size="10" fill="#475569">甘辛醤油の伝統</text>
  <text x="97" y="128" text-anchor="middle" font-size="10" fill="#475569">家庭料理主体</text>
  <rect x="190" y="40" width="155" height="130" fill="#d1fae5" rx="6"/>
  <text x="267" y="62" text-anchor="middle" font-size="11" font-weight="bold" fill="#065f46">九州クラスター</text>
  <text x="267" y="80" text-anchor="middle" font-size="11" fill="#334155">宮崎2位・佐賀6位・長崎10位</text>
  <text x="267" y="96" text-anchor="middle" font-size="10" fill="#475569">甘い醤油文化（九州）</text>
  <text x="267" y="112" text-anchor="middle" font-size="10" fill="#475569">砂糖多用の郷土料理</text>
  <text x="267" y="128" text-anchor="middle" font-size="10" fill="#475569">冷や汁・甘辛煮</text>
  <rect x="360" y="40" width="155" height="130" fill="#fef3c7" rx="6"/>
  <text x="437" y="62" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">山陰・四国クラスター</text>
  <text x="437" y="80" text-anchor="middle" font-size="11" fill="#334155">鳥取3位・香川5位・島根8位</text>
  <text x="437" y="96" text-anchor="middle" font-size="10" fill="#475569">白下糖・和菓子文化</text>
  <text x="437" y="112" text-anchor="middle" font-size="10" fill="#475569">和菓子消費が多い地域</text>
  <text x="437" y="128" text-anchor="middle" font-size="10" fill="#475569">甘味噌・煮しめ</text>
  <rect x="530" y="40" width="170" height="130" fill="#fce7f3" rx="6"/>
  <text x="615" y="62" text-anchor="middle" font-size="11" font-weight="bold" fill="#9d174d">東北・北陸クラスター</text>
  <text x="615" y="80" text-anchor="middle" font-size="11" fill="#334155">山形7位・新潟9位</text>
  <text x="615" y="96" text-anchor="middle" font-size="10" fill="#475569">保存食・煮物文化</text>
  <text x="615" y="112" text-anchor="middle" font-size="10" fill="#475569">芋煮・甘辛煮物</text>
  <text x="615" y="128" text-anchor="middle" font-size="10" fill="#475569">あんこ系郷土菓子</text>
</svg>