<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" width="680" height="370" style="font-family:system-ui,sans-serif;">
  <title>ピアノ・電子ピアノ所有数量 上位5県・下位5県（1000世帯あたり台数・2014年度）</title>
  <text x="340" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a" font-family="system-ui,sans-serif">ピアノ・電子ピアノ所有数量 上位5県・下位5県（2014年度）</text>
  <text x="340" y="41" text-anchor="middle" font-size="11" fill="#64748b" font-family="system-ui,sans-serif">二人以上の世帯 1000世帯あたり台数・出典: 総務省 社会・人口統計体系</text>
