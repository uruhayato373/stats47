<svg viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg" aria-label="トラック運転者年収の地域構造">
  <rect x="0" y="0" width="600" height="220" fill="#f8fafc"/>
  <text x="300" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">トラック運転者年収の地域構造（年収帯別）</text>
  <!-- 500万超 -->
  <rect x="40" y="50" width="180" height="36" fill="#1e40af" rx="4"/>
  <text x="130" y="73" text-anchor="middle" font-size="12" fill="white">500万円超（14県）</text>
  <text x="230" y="73" font-size="11" fill="#334155">東京・神奈川・三重・兵庫・熊本など太平洋ベルト＋港湾</text>
  <!-- 450-500万 -->
  <rect x="40" y="98" width="140" height="36" fill="#3b82f6" rx="4"/>
  <text x="110" y="121" text-anchor="middle" font-size="12" fill="white">450〜500万（19県）</text>
  <text x="190" y="121" font-size="11" fill="#334155">中間層・内陸工業県</text>
  <!-- 450万未満 -->
  <rect x="40" y="146" width="100" height="36" fill="#93c5fd" rx="4"/>
  <text x="90" y="169" text-anchor="middle" font-size="12" fill="#1e293b">450万未満（14県）</text>
  <text x="150" y="169" font-size="11" fill="#334155">東北北部・九州南部・離島（荷主企業が少ない地域）</text>
  <text x="300" y="210" text-anchor="middle" font-size="10" fill="#64748b">出典: 厚生労働省「賃金構造基本統計調査」2023年</text>
</svg>