<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-label="主要魚種の北海道シェア（2015年）">
  <rect width="100%" height="100%" fill="#f8fafc" rx="6"/>
  <text x="320" y="22" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="bold">主要魚種の北海道シェア（2015年）</text>
  <!-- ホタテ 99.2% -->
  <text x="118" y="60" text-anchor="end" font-size="12" fill="#475569">ホタテガイ</text>
  <rect x="126" y="44" width="476" height="22" fill="#1d4ed8" rx="2"/>
  <text x="608" y="60" font-size="11" fill="#1d4ed8" font-weight="bold">99.2%</text>
  <!-- スケトウダラ 92.9% -->
  <text x="118" y="92" text-anchor="end" font-size="12" fill="#475569">スケトウダラ</text>
  <rect x="126" y="76" width="445" height="22" fill="#1d4ed8" rx="2"/>
  <text x="577" y="92" font-size="11" fill="#1d4ed8">92.9%</text>
  <!-- コンブ 90.2% -->
  <text x="118" y="124" text-anchor="end" font-size="12" fill="#475569">コンブ類</text>
  <rect x="126" y="108" width="432" height="22" fill="#3b82f6" rx="2"/>
  <text x="564" y="124" font-size="11" fill="#3b82f6">90.2%</text>
  <!-- サンマ 47% -->
  <text x="118" y="156" text-anchor="end" font-size="12" fill="#475569">サンマ</text>
  <rect x="126" y="140" width="225" height="22" fill="#60a5fa" rx="2"/>
  <text x="357" y="156" font-size="11" fill="#334155">47.0%</text>
  <!-- カツオ 34.1% 静岡 -->
  <text x="118" y="188" text-anchor="end" font-size="12" fill="#475569">カツオ（静岡）</text>
  <rect x="126" y="172" width="163" height="22" fill="#f59e0b" rx="2"/>
  <text x="295" y="188" font-size="11" fill="#334155">34.1%</text>
</svg>