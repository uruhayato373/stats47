<svg viewBox={`0 0 ${width} ${height}`}>
      <defs>
        {graph.links.map((link, i) => (
          <linearGradient
            key={i}
            id={`grad-${i}`}
            gradientUnits="userSpaceOnUse"
            x1={link.source.x1}
            x2={link.target.x0}
          >
            <stop offset="0%" stopColor={colorForNode(link.source)} />
            <stop offset="100%" stopColor={colorForNode(link.target)} />
          </linearGradient>
        ))}
      </defs>

      <g fill="none">
        {graph.links.map((link, i) => (
          <path
            key={i}
            d={sankeyLinkHorizontal()(link)}
            stroke={`url(#grad-${i})`}
            strokeWidth={Math.max(1, link.width)}
            strokeOpacity={0.5}
          />
        ))}
      </g>

      <g>
        {graph.nodes.map((node) => (
          <rect
            key={node.id}
            x={node.x0}
            y={node.y0}
            width={node.x1 - node.x0}
            height={node.y1 - node.y0}
            fill={colorForNode(node)}
          />
        ))}
      </g>

      <g fontSize={11} fill="#0f172a">
        {graph.nodes.map((node) => (
          <text
            key={node.id}
            x={node.x0 < width / 2 ? node.x1 + 6 : node.x0 - 6}
            y={(node.y0 + node.y1) / 2}
            dy="0.35em"
            textAnchor={node.x0 < width / 2 ? "start" : "end"}
          >
            {labelFor(node.id)}
          </text>
        ))}
      </g>
    </svg>