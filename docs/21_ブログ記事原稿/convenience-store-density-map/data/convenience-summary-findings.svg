<svg width="960" height="368" viewBox="0 0 960 368" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" role="img" aria-label="この記事でわかったこと"><rect width="960" height="368" fill="#f9fafb"/><text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">この記事でわかったこと</text><rect x="60" y="64" width="840" height="64" fill="#ffffff"/><circle cx="100" cy="96" r="16" fill="#dc2626"/><text x="100" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1</text><text x="140" y="90" font-size="15" font-weight="bold" fill="#1f2937">北海道が1位（40.6所/10万人）</text><text x="140" y="112" font-size="13" fill="#4b5563">2位の宮城県・山梨県（33.3所）を大きく引き離し、47位の奈良県（17.1所）の約2.4倍</text><rect x="60" y="128" width="840" height="64" fill="#f9fafb"/><circle cx="100" cy="160" r="16" fill="#ea580c"/><text x="100" y="166" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">2</text><text x="140" y="154" font-size="15" font-weight="bold" fill="#1f2937">大都市ほどコンビニが少ない逆転現象</text><text x="140" y="176" font-size="13" fill="#4b5563">大阪45位、兵庫44位、埼玉41位──人口密度が高い県ほど10万人当たりの店舗数は少ない</text><rect x="60" y="192" width="840" height="64" fill="#ffffff"/><circle cx="100" cy="224" r="16" fill="#0284c7"/><text x="100" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">3</text><text x="140" y="218" font-size="15" font-weight="bold" fill="#1f2937">東北・北関東にコンビニ密集ベルト</text><text x="140" y="240" font-size="13" fill="#4b5563">岩手5位、茨城・栃木6位、群馬8位、青森9位──車社会の地域でコンビニが生活インフラ化</text><rect x="60" y="256" width="840" height="64" fill="#f9fafb"/><circle cx="100" cy="288" r="16" fill="#7c3aed"/><text x="100" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">4</text><text x="140" y="282" font-size="15" font-weight="bold" fill="#1f2937">コンビニと小売店は逆相関</text><text x="140" y="304" font-size="13" fill="#4b5563">島根は小売店1位（13.61店/千人）だがコンビニ24位──個人商店が多い地域ではコンビニが少ない</text><rect x="60" y="320" width="840" height="64" fill="#ffffff"/><circle cx="100" cy="352" r="16" fill="#059669"/><text x="100" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">5</text><text x="140" y="346" font-size="15" font-weight="bold" fill="#1f2937">近畿圏がコンビニ密度で下位に集中</text><text x="140" y="368" font-size="13" fill="#4b5563">奈良47位、香川46位、大阪45位、兵庫44位──私鉄沿線の駅前商店街が代替機能を担う</text></svg>