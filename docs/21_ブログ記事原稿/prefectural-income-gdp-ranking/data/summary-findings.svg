  <text x="90" y="103.6" font-size="18" class="svg-title"><tspan x="90" dy="0">1人あたり県民所得1位は東京521万円、2位は意外にも愛</tspan><tspan x="90" dy="22">知343万円。上位は製造業が盛んな「ものづくり県」</tspan></text>
