  <text x="90" y="185.6" font-size="18" class="svg-title"><tspan x="90" dy="0">県内総生産（GDP）は人口の多い大都市圏が上位。1位東京</tspan><tspan x="90" dy="22">114兆円、2位大阪41兆円で2.8倍差</tspan></text>
