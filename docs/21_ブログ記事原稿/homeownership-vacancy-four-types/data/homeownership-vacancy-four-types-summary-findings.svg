  <text x="90" y="103.6" font-size="18" class="svg-title"><tspan x="90" dy="0">持ち家率と空き家率には、ゆるやかな正の相関(r=0.46)がありました。持ち家が多い県ほ</tspan><tspan x="90" dy="22">ど空き家も多い傾向はありますが、例外も目立ちます。</tspan></text>
