  <text x="90" y="185.6" font-size="18" class="svg-title"><tspan x="90" dy="0">空き家率が最も高いのは徳島県の21.3%で、和歌山・鹿児島・山梨・高知と地方が上位を占め</tspan><tspan x="90" dy="22">ます。</tspan></text>
