<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" role="img" aria-label="この記事でわかったこと">
  <rect width="960" height="340" fill="#f9fafb"/>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">この記事でわかったこと</text>
  <rect x="60" y="64" width="840" height="64" fill="#ffffff"/>
  <circle cx="100" cy="96" r="16" fill="#dc2626"/>
  <text x="100" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1</text>
  <text x="140" y="90" font-size="15" font-weight="bold" fill="#1f2937">東京都が唯一の「1超」で圧倒的トップ</text>
  <text x="140" y="114" font-size="13" fill="#4b5563">財政力指数1.06は47都道府県で唯一の1超え。2位の愛知県（0.87）に0.20ポイント差をつけて独走状態</text>
  <rect x="60" y="128" width="840" height="64" fill="#f9fafb"/>
  <circle cx="100" cy="160" r="16" fill="#ea580c"/>
  <text x="100" y="166" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">2</text>
  <text x="140" y="154" font-size="15" font-weight="bold" fill="#1f2937">上位は三大都市圏に集中</text>
  <text x="140" y="178" font-size="13" fill="#4b5563">トップ10のうち東京・神奈川・千葉・埼玉・愛知・大阪・静岡の7都府県が三大都市圏。人口集積が税収力に直結</text>
  <rect x="60" y="192" width="840" height="64" fill="#ffffff"/>
  <circle cx="100" cy="224" r="16" fill="#0284c7"/>
  <text x="100" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">3</text>
  <text x="140" y="218" font-size="15" font-weight="bold" fill="#1f2937">財政力指数と自主財源比率は強い正の相関</text>
  <text x="140" y="242" font-size="13" fill="#4b5563">財政力指数が高い県ほど地方税等の自主財源割合が高い。東京都89.1%に対し高知県は25.7%と約3.5倍の格差</text>
  <rect x="60" y="256" width="840" height="64" fill="#f9fafb"/>
  <circle cx="100" cy="288" r="16" fill="#7c3aed"/>
  <text x="100" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">4</text>
  <text x="140" y="282" font-size="15" font-weight="bold" fill="#1f2937">下位県は交付税依存の構造</text>
  <text x="140" y="306" font-size="13" fill="#4b5563">下位5県（島根・高知・鳥取・秋田・徳島）は指数0.25〜0.31。財政需要に対する自前の税収が約3割にとどまる</text>
</svg>