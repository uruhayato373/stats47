  <text x="90" y="431.6" font-size="18" class="svg-title"><tspan x="90" dy="0">食の地域差は消費「額」だけでは測れない──支出額は物価や</tspan><tspan x="90" dy="22">所得の影響を受け、消費「量」とは異なる点に注意が必要です</tspan></text>
