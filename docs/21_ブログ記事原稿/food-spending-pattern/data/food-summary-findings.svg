  <text x="58" y="114" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">1</text>
  <text x="90" y="103.6" font-size="18" class="svg-title"><tspan x="90" dy="0">米文化圏 vs パン文化圏が明確に存在──東北・九州は米</tspan><tspan x="90" dy="22">、近畿はパン。主食レベルで食文化の地域差があります</tspan></text>
  <rect x="40" y="154" width="880" height="72" class="svg-plot" rx="8"/>
  <circle cx="58" cy="190" r="18" fill="#dc2626"/>
  <text x="58" y="196" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">2</text>
  <text x="90" y="185.6" font-size="18" class="svg-title"><tspan x="90" dy="0">米とパンは負の相関ではない──米を食べる県がパンを食べな</tspan><tspan x="90" dy="22">いわけではなく、食費全体の水準が影響します</tspan></text>
  <rect x="40" y="236" width="880" height="72" class="svg-plot" rx="8"/>
  <circle cx="58" cy="272" r="18" fill="#dc2626"/>
  <text x="58" y="278" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">3</text>
  <text x="90" y="267.6" font-size="18" class="svg-title"><tspan x="90" dy="0">香川は生うどん・そば消費額で圧倒的1位──2位以下に大差</tspan><tspan x="90" dy="22">をつけ、データが「うどん県」の通称を裏付けます</tspan></text>
  <rect x="40" y="318" width="880" height="72" class="svg-plot" rx="8"/>
  <circle cx="58" cy="354" r="18" fill="#dc2626"/>
  <text x="58" y="360" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">4</text>
  <text x="90" y="349.6" font-size="18" class="svg-title"><tspan x="90" dy="0">カップ麺1位は青森県──東北・北陸など寒冷地が上位を占め</tspan><tspan x="90" dy="22">、気候や生活スタイルとの関連がうかがえます</tspan></text>
  <rect x="40" y="400" width="880" height="72" class="svg-plot" rx="8"/>
