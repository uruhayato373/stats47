  <text x="90" y="349.6" font-size="18" class="svg-title"><tspan x="90" dy="0">「河内」を含む地名は山口県が100件で全国最多。大分県54件、広島県51件、岡山県35件</tspan><tspan x="90" dy="22">と中国・九州地方に多く分布しています。</tspan></text>
