  <text x="90" y="267.6" font-size="18" class="svg-title"><tspan x="90" dy="0">「河」の比率(川+河に占める割合)がもっとも高いのは鳥取県65.9%で、2位福井県42.</tspan><tspan x="90" dy="22">3%、3位山口県38.7%と続きます。</tspan></text>
