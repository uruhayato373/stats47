  <text x="90" y="103.6" font-size="18" class="svg-title"><tspan x="90" dy="0">全国の居住地名のうち「川」は13,624件、「河」は2,325件で、「川」が「河」の5.</tspan><tspan x="90" dy="22">9倍にのぼります。</tspan></text>
