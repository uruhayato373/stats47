<svg viewBox="0 0 600 280" xmlns="http://www.w3.org/2000/svg" aria-label="最低賃金の推移（2010-2024）">
  <rect x="0" y="0" width="600" height="280" fill="#f8fafc"/>
  <text x="300" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">最低賃金の推移（2010〜2024年）</text>
  <!-- 縦軸ライン -->
  <line x1="70" y1="50" x2="70" y2="230" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="70" y1="230" x2="560" y2="230" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- 東京ライン（概略） -->
  <polyline points="70,195 130,190 190,180 250,168 310,155 370,135 430,115 490,98 550,82" fill="none" stroke="#1e40af" stroke-width="2.5"/>
  <text x="555" y="79" font-size="11" fill="#1e40af">東京 1,163円</text>
  <!-- 全国加重平均 -->
  <polyline points="70,210 130,206 190,200 250,190 310,178 370,162 430,142 490,126 550,107" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="555" y="110" font-size="11" fill="#3b82f6">全国 1,055円</text>
  <!-- 最低県ライン -->
  <polyline points="70,216 130,212 190,207 250,198 310,188 370,174 430,155 490,140 550,127" fill="none" stroke="#ef4444" stroke-width="2.5"/>
  <text x="555" y="130" font-size="11" fill="#ef4444">秋田 951円</text>
  <!-- 格差表示 -->
  <line x1="550" y1="82" x2="550" y2="127" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="542" y="107" text-anchor="end" font-size="10" fill="#6b7280">格差212円</text>
  <!-- 年ラベル -->
  <text x="70" y="248" text-anchor="middle" font-size="10" fill="#64748b">2010</text>
  <text x="550" y="248" text-anchor="middle" font-size="10" fill="#64748b">2024</text>
  <text x="300" y="268" text-anchor="middle" font-size="10" fill="#64748b">出典: e-Stat 社会生活統計指標</text>
  <!-- コロナ -->
  <line x1="390" y1="50" x2="390" y2="230" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3" opacity="0.7"/>
  <text x="395" y="65" font-size="9" fill="#b45309">2020年+1円</text>
</svg>