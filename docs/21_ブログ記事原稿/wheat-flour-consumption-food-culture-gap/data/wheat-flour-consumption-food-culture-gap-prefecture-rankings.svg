<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" font-family="system-ui, -apple-system, 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif">
  <title>小麦粉消費量 上位5県・下位5県（2024年・家計調査・二人以上世帯）</title>
  <desc>1位 三重県 3,072g、最下位 山梨県 1,284g。上位5県（青）と下位5県（橙）の年間家庭購入量。</desc>

  <text x="20" y="32" font-size="18" font-weight="700" fill="#2563eb">小麦粉消費量 上位5県</text>
  <text x="20" y="52" font-size="12" fill="#64748b">2024年・家計調査（二人以上世帯）・年間購入量 g</text>

  <!-- Top 5 (blue) : max 3072 -> bar width scale: value/3072*430 -->
  <!-- row1 三重 3072 -->
  <text x="20" y="84" font-size="13" fill="#475569">1位 三重県</text>
  <rect x="120" y="72" width="430" height="16" rx="2" fill="#2563eb"/>
  <text x="558" y="85" font-size="13" font-weight="700" fill="#2563eb">3,072g</text>
  <!-- row2 千葉 2807 -->
  <text x="20" y="112" font-size="13" fill="#475569">2位 千葉県</text>
  <rect x="120" y="100" width="392" height="16" rx="2" fill="#3b82f6"/>
  <text x="520" y="113" font-size="13" font-weight="700" fill="#2563eb">2,807g</text>
  <!-- row3 長野 2799 -->
  <text x="20" y="140" font-size="13" fill="#475569">3位 長野県</text>
  <rect x="120" y="128" width="391" height="16" rx="2" fill="#3b82f6"/>
  <text x="519" y="141" font-size="13" font-weight="700" fill="#2563eb">2,799g</text>
  <!-- row4 岐阜 2792 -->
  <text x="20" y="168" font-size="13" fill="#475569">4位 岐阜県</text>
  <rect x="120" y="156" width="390" height="16" rx="2" fill="#60a5fa"/>
  <text x="518" y="169" font-size="13" font-weight="700" fill="#2563eb">2,792g</text>
  <!-- row5 熊本 2655 -->
  <text x="20" y="196" font-size="13" fill="#475569">5位 熊本県</text>
  <rect x="120" y="184" width="371" height="16" rx="2" fill="#60a5fa"/>
  <text x="499" y="197" font-size="13" font-weight="700" fill="#2563eb">2,655g</text>

  <line x1="20" y1="222" x2="740" y2="222" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="20" y="252" font-size="18" font-weight="700" fill="#ea580c">小麦粉消費量 下位5県</text>
  <text x="20" y="272" font-size="12" fill="#64748b">同調査・年間購入量 g（少ない順）</text>

  <!-- Bottom 5 (orange) -->
  <!-- 新潟 1548 #43 -->
  <text x="20" y="304" font-size="13" fill="#475569">43位 新潟県</text>
  <rect x="120" y="292" width="216" height="16" rx="2" fill="#fb923c"/>
  <text x="344" y="305" font-size="13" font-weight="700" fill="#ea580c">1,548g</text>
  <!-- 宮城 1547 #44 -->
  <text x="20" y="332" font-size="13" fill="#475569">44位 宮城県</text>
  <rect x="120" y="320" width="216" height="16" rx="2" fill="#fb923c"/>
  <text x="344" y="333" font-size="13" font-weight="700" fill="#ea580c">1,547g</text>
  <!-- 富山 1486 #45 -->
  <text x="20" y="360" font-size="13" fill="#475569">45位 富山県</text>
  <rect x="120" y="348" width="208" height="16" rx="2" fill="#f97316"/>
  <text x="336" y="361" font-size="13" font-weight="700" fill="#ea580c">1,486g</text>
  <!-- 高知 1473 #46 -->
  <text x="20" y="388" font-size="13" fill="#475569">46位 高知県</text>
  <rect x="120" y="376" width="206" height="16" rx="2" fill="#f97316"/>
  <text x="334" y="389" font-size="13" font-weight="700" fill="#ea580c">1,473g</text>
  <!-- 山梨 1284 #47 -->
  <text x="20" y="416" font-size="13" fill="#475569">47位 山梨県</text>
  <rect x="120" y="404" width="180" height="16" rx="2" fill="#ea580c"/>
  <text x="308" y="417" font-size="13" font-weight="700" fill="#ea580c">1,284g</text>

  <text x="20" y="452" font-size="12" fill="#64748b">出典: 総務省「家計調査」2024年（e-Stat 経由）。家庭が小売店で購入した小麦粉の量。</text>
  <text x="20" y="472" font-size="12" fill="#64748b">外食・業務用・加工品の小麦粉は含まない。1位 三重と最下位 山梨の差は約2.4倍。</text>
</svg>
