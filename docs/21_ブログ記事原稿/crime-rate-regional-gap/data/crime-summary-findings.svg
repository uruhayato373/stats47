<svg width="960" height="390" viewBox="0 0 960 390" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" role="img" aria-label="この記事でわかったこと"><rect width="960" height="390" fill="#f9fafb"/><text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">この記事でわかったこと</text><rect x="60" y="64" width="840" height="64" fill="#ffffff"/><circle cx="100" cy="96" r="16" fill="#dc2626"/><text x="100" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1</text><text x="140" y="90" font-size="15" font-weight="bold" fill="#1f2937">大阪府が最も治安が悪い</text><text x="140" y="112" font-size="13" fill="#4b5563">窃盗犯認知件数6.65件/千人──全国平均の約2倍、47位の長崎県の約4倍</text><rect x="60" y="128" width="840" height="64" fill="#f9fafb"/><circle cx="100" cy="160" r="16" fill="#ea580c"/><text x="100" y="166" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">2</text><text x="140" y="154" font-size="15" font-weight="bold" fill="#1f2937">検挙率と犯罪件数は逆相関</text><text x="140" y="176" font-size="13" fill="#4b5563">犯罪が多い県ほど検挙率が低い──大阪26.7%、島根72.7%と約3倍の差</text><rect x="60" y="192" width="840" height="64" fill="#ffffff"/><circle cx="100" cy="224" r="16" fill="#0284c7"/><text x="100" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">3</text><text x="140" y="218" font-size="15" font-weight="bold" fill="#1f2937">犯罪の「中身」が県ごとに違う</text><text x="140" y="240" font-size="13" fill="#4b5563">窃盗犯が8割の栃木、粗暴犯が16%の山形──地域ごとにリスクの質が異なる</text><rect x="60" y="256" width="840" height="64" fill="#f9fafb"/><circle cx="100" cy="288" r="16" fill="#7c3aed"/><text x="100" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">4</text><text x="140" y="282" font-size="15" font-weight="bold" fill="#1f2937">2002年ピークから20年で6分の1に激減</text><text x="140" y="304" font-size="13" fill="#4b5563">しかし2022年から反転上昇──コロナ後の社会変化が治安に影響</text><rect x="60" y="320" width="840" height="64" fill="#ffffff"/><circle cx="100" cy="352" r="16" fill="#059669"/><text x="100" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">5</text><text x="140" y="346" font-size="15" font-weight="bold" fill="#1f2937">治安が良い県は東北・九州に集中</text><text x="140" y="368" font-size="13" fill="#4b5563">長崎・岩手・秋田──人口が少なくコミュニティの結びつきが強い県が上位</text></svg>