<svg width="960" height="430" viewBox="0 0 960 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="この記事でわかったこと">
  <title>この記事でわかったこと</title>
  <rect width="960" height="430" fill="#fafafa" rx="8"/>
  <text x="480" y="38" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="22" font-weight="bold" fill="#1f2937">この記事でわかったこと</text>
  <line x1="380" y1="50" x2="580" y2="50" stroke="#e5e7eb" stroke-width="2"/>
  <circle cx="60" cy="112" r="20" fill="#dc2626"/>
  <text x="60" y="119" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="18" font-weight="bold" fill="#ffffff">1</text>
  <text x="95" y="118" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="15" fill="#1f2937">労災発生頻度は高知県（3.70）が最高、徳島県（0.97）が最低で約3.8倍の差</text>
  <circle cx="60" cy="176" r="20" fill="#ea580c"/>
  <text x="60" y="183" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="18" font-weight="bold" fill="#ffffff">2</text>
  <text x="95" y="182" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="15" fill="#1f2937">強度率は香川県（1.08）が突出──2位の福井県（0.25）に4倍以上の差</text>
  <circle cx="60" cy="240" r="20" fill="#0284c7"/>
  <text x="60" y="247" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="18" font-weight="bold" fill="#ffffff">3</text>
  <text x="95" y="246" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="15" fill="#1f2937">労災保険平均支給額は西日本が高く、東京・神奈川は全国最低水準</text>
  <circle cx="60" cy="304" r="20" fill="#7c3aed"/>
  <text x="60" y="311" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="18" font-weight="bold" fill="#ffffff">4</text>
  <text x="95" y="310" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="15" fill="#1f2937">度数率と強度率は必ずしも相関しない──頻度が高くても軽傷中心の県がある</text>
  <circle cx="60" cy="368" r="20" fill="#059669"/>
  <text x="60" y="375" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="18" font-weight="bold" fill="#ffffff">5</text>
  <text x="95" y="374" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="15" fill="#1f2937">労災給付率は高知14.3% vs 東京3.0%──産業構造が地域差を生む</text>
</svg>