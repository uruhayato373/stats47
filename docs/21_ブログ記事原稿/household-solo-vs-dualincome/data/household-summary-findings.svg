<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" role="img" aria-label="この記事でわかったこと"><rect width="960" height="340" fill="#f9fafb"/><text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">この記事でわかったこと</text><rect x="60" y="64" width="840" height="64" fill="#ffffff"/><circle cx="100" cy="96" r="16" fill="#dc2626"/><text x="100" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1</text><text x="140" y="90" font-size="15" font-weight="bold" fill="#1f2937">東京都の単独世帯割合50.2%は山形県28.4%の約1.8倍</text><text x="140" y="112" font-size="13" fill="#4b5563">大都市ほど一人暮らしが増加──都市化と世帯の小規模化は表裏一体の関係</text><rect x="60" y="128" width="840" height="64" fill="#f9fafb"/><circle cx="100" cy="160" r="16" fill="#ea580c"/><text x="100" y="166" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">2</text><text x="140" y="154" font-size="15" font-weight="bold" fill="#1f2937">単独世帯割合と共働き割合は強い逆相関</text><text x="140" y="176" font-size="13" fill="#4b5563">一人暮らしが多い都市部ほど共働き世帯が少ない──福井34.7% vs 東京17.4%で2倍の差</text><rect x="60" y="192" width="840" height="64" fill="#ffffff"/><circle cx="100" cy="224" r="16" fill="#0284c7"/><text x="100" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">3</text><text x="140" y="218" font-size="15" font-weight="bold" fill="#1f2937">共働き世帯は北陸・甲信越に集中</text><text x="140" y="240" font-size="13" fill="#4b5563">福井・山形・富山がトップ3──三世代同居の多さが子育てしながら働く環境を支える</text><rect x="60" y="256" width="840" height="64" fill="#f9fafb"/><circle cx="100" cy="288" r="16" fill="#7c3aed"/><text x="100" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">4</text><text x="140" y="282" font-size="15" font-weight="bold" fill="#1f2937">平均世帯人員は山形県2.61人、東京都1.92人で0.69人差</text><text x="140" y="304" font-size="13" fill="#4b5563">核家族化・単独世帯化の進行度が世帯人員に直結──地方ほど大家族が残る</text></svg>