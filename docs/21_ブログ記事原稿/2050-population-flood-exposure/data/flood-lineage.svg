<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="人口と洪水区域から県別比率を作る工程" font-family="Hiragino Sans,Noto Sans JP,sans-serif"><title>人口と洪水区域から県別比率を作る工程</title>  <style>
    .svg-bg{fill:#ffffff}
    .svg-plot{fill:#f9fafb}
    .svg-plot-border{stroke:#d1d5db}
    .svg-title{fill:#1f2937}
    .svg-axis{fill:#374151}
    .svg-tick{fill:#6b7280}
    .svg-grid{stroke:#e5e7eb}
    @media (prefers-color-scheme:dark){
    .svg-bg{fill:#0f172a}
    .svg-plot{fill:#1e293b}
    .svg-plot-border{stroke:#334155}
    .svg-title{fill:#e2e8f0}
    .svg-axis{fill:#cbd5e1}
    .svg-tick{fill:#94a3b8}
    .svg-grid{stroke:#334155}
    }
  </style><rect width="960" height="600" class="svg-bg"/><g class="svg-axis"><text x="60" y="44" font-size="28" font-weight="700">人口と洪水区域から県別比率を作る工程</text><rect x="60" y="76" width="840" height="86" rx="8" fill="none" stroke="#8495a7"/><text x="90" y="110" font-size="24" font-weight="700">計算入力：人口メッシュと洪水ポリゴン</text><text x="90" y="141" font-size="20">177,791メッシュ × 201ファイル（107＋94）</text><text x="480" y="194" font-size="28" text-anchor="middle">↓</text><rect x="60" y="214" width="840" height="86" rx="8" fill="none" stroke="#8495a7"/><text x="90" y="248" font-size="24" font-weight="700">空間演算：メッシュ中心点の包含判定</text><text x="90" y="279" font-size="20">複数の洪水区域に含まれても、人口は1回だけ加算</text><text x="480" y="332" font-size="28" text-anchor="middle">↓</text><rect x="60" y="352" width="840" height="86" rx="8" fill="none" stroke="#8495a7"/><text x="90" y="386" font-size="24" font-weight="700">県別途中データ：判定結果と人口を保存</text><text x="90" y="417" font-size="20">全国 29,737メッシュが区域内と判定</text><text x="480" y="470" font-size="28" text-anchor="middle">↓</text><rect x="60" y="490" width="840" height="86" rx="8" fill="none" stroke="#8495a7"/><text x="90" y="524" font-size="24" font-weight="700">集計：区域内人口 ÷ 県内人口</text><text x="90" y="555" font-size="20">47県の結果と、47県の保存則を照合</text></g></svg>