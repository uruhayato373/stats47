<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="中学2年男子 平均身長 上位5県と下位5県">
  <style>
    .bar-top { fill: #2563eb; }
    .bar-bottom { fill: #94a3b8; }
    .lbl { fill: currentColor; font-size: 13px; font-family: sans-serif; }
    .val { fill: currentColor; font-size: 12px; font-family: sans-serif; }
    .axis { stroke: currentColor; opacity: 0.25; }
  </style>
  <text class="lbl" x="16" y="24" font-weight="bold">中2男子 平均身長 上位5県・下位5県 (2023, cm)</text>
  <!-- scale: x = 130 + (value-159)*100 で 159→130, 164→630 付近に展開 -->
  <g transform="translate(0,40)">
    <!-- 上位 -->
    <text class="lbl" x="16" y="20">秋田</text><rect class="bar-top" x="120" y="8" width="460" height="16"/><text class="val" x="586" y="20">163.6</text>
    <text class="lbl" x="16" y="48">青森</text><rect class="bar-top" x="120" y="36" width="390" height="16"/><text class="val" x="516" y="48">162.9</text>
    <text class="lbl" x="16" y="76">山形</text><rect class="bar-top" x="120" y="64" width="360" height="16"/><text class="val" x="486" y="76">162.6</text>
    <text class="lbl" x="16" y="104">北海道</text><rect class="bar-top" x="120" y="92" width="350" height="16"/><text class="val" x="476" y="104">162.5</text>
    <text class="lbl" x="16" y="132">富山</text><rect class="bar-top" x="120" y="120" width="350" height="16"/><text class="val" x="476" y="132">162.5</text>
    <line class="axis" x1="120" y1="148" x2="120" y2="290"/>
    <!-- 下位 -->
    <text class="lbl" x="16" y="180">岡山</text><rect class="bar-bottom" x="120" y="168" width="140" height="16"/><text class="val" x="266" y="180">160.4</text>
    <text class="lbl" x="16" y="208">島根</text><rect class="bar-bottom" x="120" y="196" width="90" height="16"/><text class="val" x="216" y="208">159.9</text>
    <text class="lbl" x="16" y="236">山口</text><rect class="bar-bottom" x="120" y="224" width="90" height="16"/><text class="val" x="216" y="236">159.9</text>
    <text class="lbl" x="16" y="264">沖縄</text><rect class="bar-bottom" x="120" y="252" width="80" height="16"/><text class="val" x="206" y="264">159.8</text>
    <text class="lbl" x="16" y="292">高知</text><rect class="bar-bottom" x="120" y="280" width="70" height="16"/><text class="val" x="196" y="292">159.7</text>
  </g>
</svg>