<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 258" width="700" height="258" font-family="system-ui,sans-serif">
  <title>人口10万人あたりパスポート発行件数 上位3・下位3（2024年・件）</title>
  <rect x="0" y="0" width="700" height="258" fill="#ffffff" rx="6"/>
  <text x="350" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a" font-family="system-ui,sans-serif">人口10万人あたりパスポート発行件数 上位3・下位3（2024年・件）</text>
    <rect x="110" y="50" width="450.0" height="24" fill="#1e6fb5" rx="2"/>
    <text x="104" y="67" text-anchor="end" font-size="12" fill="#1e293b" font-family="system-ui,sans-serif">東京</text>
    <text x="566.0" y="67" text-anchor="start" font-size="11" fill="#1e40af" font-family="system-ui,sans-serif">5,090件</text>
    <rect x="110" y="80" width="347.4" height="24" fill="#1e6fb5" rx="2"/>
    <text x="104" y="97" text-anchor="end" font-size="12" fill="#1e293b" font-family="system-ui,sans-serif">神奈川</text>
    <text x="463.4" y="97" text-anchor="start" font-size="11" fill="#1e40af" font-family="system-ui,sans-serif">3,929件</text>
    <rect x="110" y="110" width="329.8" height="24" fill="#1e6fb5" rx="2"/>
    <text x="104" y="127" text-anchor="end" font-size="12" fill="#1e293b" font-family="system-ui,sans-serif">大阪</text>
    <text x="445.8" y="127" text-anchor="start" font-size="11" fill="#1e40af" font-family="system-ui,sans-serif">3,730件</text>
    <line x1="110" y1="143" x2="680" y2="143" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="104" y="141" text-anchor="end" font-size="9" fill="#94a3b8" font-family="system-ui,sans-serif">上位</text>
    <rect x="110" y="152" width="100.3" height="24" fill="#ea7317" rx="2"/>
    <text x="104" y="169" text-anchor="end" font-size="12" fill="#1e293b" font-family="system-ui,sans-serif">岩手</text>
    <text x="216.3" y="169" text-anchor="start" font-size="11" fill="#9a3412" font-family="system-ui,sans-serif">1,134件</text>
    <rect x="110" y="182" width="93.8" height="24" fill="#ea7317" rx="2"/>
    <text x="104" y="199" text-anchor="end" font-size="12" fill="#1e293b" font-family="system-ui,sans-serif">青森</text>
    <text x="209.8" y="199" text-anchor="start" font-size="11" fill="#9a3412" font-family="system-ui,sans-serif">1,061件</text>
    <rect x="110" y="212" width="91.3" height="24" fill="#ea7317" rx="2"/>
    <text x="104" y="229" text-anchor="end" font-size="12" fill="#1e293b" font-family="system-ui,sans-serif">秋田</text>
    <text x="207.3" y="229" text-anchor="start" font-size="11" fill="#9a3412" font-family="system-ui,sans-serif">1,033件</text>
</svg>
