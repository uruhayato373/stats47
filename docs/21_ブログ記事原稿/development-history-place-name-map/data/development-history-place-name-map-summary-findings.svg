  <text x="90" y="103.6" font-size="18" class="svg-title"><tspan x="90" dy="0">『新田』を含む居住地名は全国で約2,900あり、居住地名1000件あたりで見ると新潟県が</tspan><tspan x="90" dy="22">49件と突出しています。</tspan></text>
  <rect x="40" y="154" width="880" height="72" class="svg-plot" rx="8"/>
