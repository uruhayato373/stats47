  <text x="90" y="267.6" font-size="18" class="svg-title"><tspan x="90" dy="0">一方、北海道の開拓を示す『開拓』地名は全国で約130件と少なく、地名に開発史が刻まれる形</tspan><tspan x="90" dy="22">は地域で異なります。</tspan></text>
  <rect x="40" y="318" width="880" height="72" class="svg-plot" rx="8"/>
