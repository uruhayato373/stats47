  <text x="90" y="349.6" font-size="18" class="svg-title"><tspan x="90" dy="0">地名は江戸時代以降の土地開発の記録ですが、表記だけから成立年代を断定することはできません</tspan><tspan x="90" dy="22">。</tspan></text>
