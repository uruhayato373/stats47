  <text x="90" y="185.6" font-size="18" class="svg-title"><tspan x="90" dy="0">茨城県・埼玉県・千葉県など、関東平野の県も上位に並び、河川の沖積平野で新田開発が盛んだっ</tspan><tspan x="90" dy="22">た歴史を映します。</tspan></text>
  <rect x="40" y="236" width="880" height="72" class="svg-plot" rx="8"/>
