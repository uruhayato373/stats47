<svg width="960" height="398" viewBox="0 0 960 398" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" role="img" aria-label="この記事でわかったこと">
<rect width="960" height="398" fill="#f9fafb"/>
<text x="480" y="48" text-anchor="middle" font-size="26" font-weight="bold" fill="#1f2937">この記事でわかったこと</text>
<rect x="50" y="78" width="860" height="80" fill="#ffffff" rx="8"/>
<circle cx="94" cy="118" r="20" fill="#dc2626"/>
<text x="94" y="125" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">1</text>
<text x="130" y="110" font-size="18" font-weight="bold" fill="#1f2937">1位は東京の18.2%</text>
<text x="130" y="136" font-size="16" fill="#4b5563">下位の秋田（5%）との差は約3.6倍</text>
<rect x="50" y="158" width="860" height="80" fill="#f9fafb" rx="8"/>
<circle cx="94" cy="198" r="20" fill="#ea580c"/>
<text x="94" y="205" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">2</text>
<text x="130" y="190" font-size="18" font-weight="bold" fill="#1f2937">女性の方が海外旅行率が高い県が多い</text>
<text x="130" y="216" font-size="16" fill="#4b5563">特に都市部では女性の海外旅行行動者率が男性を上回る傾向</text>
<rect x="50" y="238" width="860" height="80" fill="#ffffff" rx="8"/>
<circle cx="94" cy="278" r="20" fill="#0284c7"/>
<text x="94" y="285" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">3</text>
<text x="130" y="270" font-size="18" font-weight="bold" fill="#1f2937">所得との相関は緩やか</text>
<text x="130" y="296" font-size="16" fill="#4b5563">高所得でも海外旅行率が低い県があり、空港アクセスや県民性も影響</text>
<rect x="50" y="318" width="860" height="80" fill="#f9fafb" rx="8"/>
<circle cx="94" cy="358" r="20" fill="#7c3aed"/>
<text x="94" y="365" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">4</text>
<text x="130" y="350" font-size="18" font-weight="bold" fill="#1f2937">国内旅行率とは必ずしも連動しない</text>
<text x="130" y="376" font-size="16" fill="#4b5563">国内旅行が活発でも海外は低い県があり「内向き度」に差がある</text>
</svg>
