<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 552" width="720" height="552" role="img" aria-label="2050年 将来人口増減率 上位5と下位5">
  <title>将来人口増減率（2020→2050）：増えるのは東京だけ +2.5%、秋田 -41.6%</title>
  <style>
    .bg{fill:#ffffff}
    .ttl{fill:#0f172a}
    .sub{fill:#475569}
    .lbl{fill:#1e293b}
    .val{fill:#1e293b}
    .axis{stroke:#94a3b8}
    .zero{fill:#64748b}
    .bar-top{fill:#1d4ed8}
    .bar-bot{fill:#ea580c}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0f172a}
      .ttl{fill:#f1f5f9}
      .sub{fill:#cbd5e1}
      .lbl{fill:#e2e8f0}
      .val{fill:#e2e8f0}
      .axis{stroke:#64748b}
      .zero{fill:#94a3b8}
      .bar-top{fill:#60a5fa}
      .bar-bot{fill:#fb923c}
    }
  </style>
  <rect class="bg" x="0" y="0" width="720" height="552"/>
  <text class="ttl" x="20" y="34" font-size="17" font-weight="bold">将来人口増減率（2020→2050）上位5・下位5</text>
  <text class="sub" x="20" y="56" font-size="12">単位：％（プラス＝人口増）／出典：IPSS 令和5年推計</text>
  <text class="sub" x="20" y="76" font-size="12">青＝減りにくい上位5（東京のみプラス）／橙＝消えていく下位5</text>
  <line class="axis" x1="660.0" y1="92" x2="660.0" y2="486" stroke-width="1"/>
  <text class="zero" x="660.0" y="502" font-size="11" text-anchor="middle">0%</text>
  <text class="lbl" x="20" y="116" font-size="13" font-weight="600">東京都</text>
  <rect class="bar-top" x="660.0" y="100" width="33.3" height="22" rx="2"/>
  <text class="val" x="699.3" y="116" font-size="12" text-anchor="start" font-weight="bold">+2.5%</text>
  <text class="lbl" x="20" y="156" font-size="13" font-weight="600">沖縄県</text>
  <rect class="bar-top" x="590.5" y="140" width="69.5" height="22" rx="2"/>
  <text class="val" x="584.5" y="156" font-size="12" text-anchor="end">-5.2%</text>
  <text class="lbl" x="20" y="196" font-size="13" font-weight="600">神奈川県</text>
  <rect class="bar-top" x="557.1" y="180" width="102.9" height="22" rx="2"/>
  <text class="val" x="551.1" y="196" font-size="12" text-anchor="end">-7.7%</text>
  <text class="lbl" x="20" y="236" font-size="13" font-weight="600">千葉県</text>
  <rect class="bar-top" x="533.9" y="220" width="126.1" height="22" rx="2"/>
  <text class="val" x="527.9" y="236" font-size="12" text-anchor="end">-9.5%</text>
  <text class="lbl" x="20" y="276" font-size="13" font-weight="600">埼玉県</text>
  <rect class="bar-top" x="530.9" y="260" width="129.1" height="22" rx="2"/>
  <text class="val" x="524.9" y="276" font-size="12" text-anchor="end">-9.7%</text>
  <text class="lbl" x="20" y="316" font-size="13" font-weight="600">長崎県</text>
  <rect class="bar-bot" x="209.3" y="300" width="450.7" height="22" rx="2"/>
  <text class="val" x="203.3" y="316" font-size="12" text-anchor="end">-33.8%</text>
  <text class="lbl" x="20" y="356" font-size="13" font-weight="600">高知県</text>
  <rect class="bar-bot" x="196.3" y="340" width="463.7" height="22" rx="2"/>
  <text class="val" x="190.3" y="356" font-size="12" text-anchor="end">-34.8%</text>
  <text class="lbl" x="20" y="396" font-size="13" font-weight="600">岩手県</text>
  <rect class="bar-bot" x="189.3" y="380" width="470.7" height="22" rx="2"/>
  <text class="val" x="183.3" y="396" font-size="12" text-anchor="end">-35.3%</text>
  <text class="lbl" x="20" y="436" font-size="13" font-weight="600">青森県</text>
  <rect class="bar-bot" x="139.6" y="420" width="520.4" height="22" rx="2"/>
  <text class="val" x="133.6" y="436" font-size="12" text-anchor="end">-39.0%</text>
  <text class="lbl" x="20" y="476" font-size="13" font-weight="600">秋田県</text>
  <rect class="bar-bot" x="105.5" y="460" width="554.5" height="22" rx="2"/>
  <text class="val" x="99.5" y="476" font-size="12" text-anchor="end" font-weight="bold">-41.6%</text>
  <text class="sub" x="20" y="530" font-size="11">秋田が最大の -41.6%。上位は首都圏3県（神奈川・千葉・埼玉）と沖縄が並ぶ。</text>
</svg>