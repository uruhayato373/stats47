<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="勤労者世帯の実収入ランキング上位10・下位5（2024年）">
  <rect width="100%" height="100%" fill="#f8fafc" rx="6"/>
