  <text x="114" y="48" text-anchor="end" font-size="12" fill="#475569">1. 東京都</text>
  <rect x="124" y="32" width="480" height="20" fill="#1d4ed8" rx="2"/>
  <text x="610" y="48" font-size="11" fill="#334155">794千円</text>
  <text x="114" y="74" text-anchor="end" font-size="12" fill="#475569">2. 埼玉県</text>
  <rect x="124" y="58" width="461.8" height="20" fill="#3b82f6" rx="2"/>
