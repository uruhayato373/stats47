  <text x="114" y="126" text-anchor="end" font-size="12" fill="#475569">4. 奈良県</text>
  <rect x="124" y="110" width="446.6" height="20" fill="#3b82f6" rx="2"/>
  <text x="576" y="126" font-size="11" fill="#334155">739千円</text>
  <text x="114" y="152" text-anchor="end" font-size="12" fill="#475569">5. 神奈川県</text>
