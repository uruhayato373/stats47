<svg width="960" height="478" viewBox="0 0 960 478" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" role="img" aria-label="この記事でわかったこと">
<rect width="960" height="478" fill="#f9fafb"/>
<text x="480" y="48" text-anchor="middle" font-size="26" font-weight="bold" fill="#1f2937">この記事でわかったこと</text>
<rect x="50" y="78" width="860" height="80" fill="#ffffff" rx="8"/>
<circle cx="94" cy="118" r="20" fill="#dc2626"/>
<text x="94" y="125" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">1</text>
<text x="130" y="110" font-size="18" font-weight="bold" fill="#1f2937">人口あたり施設数で最大13倍超の地域格差</text>
<text x="130" y="136" font-size="16" fill="#4b5563">上位は秋田県（95.5）、下位は大阪府（13.6）</text>
<rect x="50" y="158" width="860" height="80" fill="#f9fafb" rx="8"/>
<circle cx="94" cy="198" r="20" fill="#ea580c"/>
<text x="94" y="205" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">2</text>
<text x="130" y="190" font-size="18" font-weight="bold" fill="#1f2937">施設が多い＝運動する、とは限らない</text>
<text x="130" y="216" font-size="16" fill="#4b5563">施設数（人口比）とスポーツ行動者率の相関は弱く、都市部の方が行動者率は高い</text>
<rect x="50" y="238" width="860" height="80" fill="#ffffff" rx="8"/>
<circle cx="94" cy="278" r="20" fill="#0284c7"/>
<text x="94" y="285" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">3</text>
<text x="130" y="270" font-size="18" font-weight="bold" fill="#1f2937">都市部は民間頼み、地方は公共依存</text>
<text x="130" y="296" font-size="16" fill="#4b5563">東京は民間施設比率が高く、地方は公共施設が運動環境の柱</text>
<rect x="50" y="318" width="860" height="80" fill="#f9fafb" rx="8"/>
<circle cx="94" cy="358" r="20" fill="#7c3aed"/>
<text x="94" y="365" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">4</text>
<text x="130" y="350" font-size="18" font-weight="bold" fill="#1f2937">ゴルフ場は関東に集中、キャンプ場は北海道・長野</text>
<text x="130" y="376" font-size="16" fill="#4b5563">施設の種類によって地域偏在パターンが大きく異なる</text>
<rect x="50" y="398" width="860" height="80" fill="#ffffff" rx="8"/>
<circle cx="94" cy="438" r="20" fill="#059669"/>
<text x="94" y="445" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">5</text>
<text x="130" y="430" font-size="18" font-weight="bold" fill="#1f2937">男女のスポーツ行動者率格差は県によって最大10pt超</text>
<text x="130" y="456" font-size="16" fill="#4b5563">男女差が大きい県は地方に多く、女性の運動機会確保が課題</text>
</svg>
