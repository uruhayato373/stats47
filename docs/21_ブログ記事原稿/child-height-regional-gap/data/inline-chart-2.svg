<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" style="max-width:480px;width:100%;font-family:sans-serif">
  <title>中学2年 男女の平均身長の関係</title>
  <rect width="480" height="320" fill="#f8fafc" rx="8"/>
  <text x="240" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">男子身長 × 女子身長（2023年）</text>
  <text x="240" y="38" text-anchor="middle" font-size="11" fill="#64748b">r = 0.82（強い正の相関）</text>
  <!-- 軸 -->
  <line x1="60" y1="270" x2="440" y2="270" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="60" y1="50" x2="60" y2="270" stroke="#cbd5e1" stroke-width="1"/>
  <text x="250" y="295" text-anchor="middle" font-size="10" fill="#64748b">男子身長（cm）</text>
  <text x="20" y="165" text-anchor="middle" font-size="10" fill="#64748b" transform="rotate(-90,20,165)">女子身長（cm）</text>
  <!-- 軸ラベル -->
  <text x="60" y="284" text-anchor="middle" font-size="9" fill="#94a3b8">159</text>
  <text x="155" y="284" text-anchor="middle" font-size="9" fill="#94a3b8">161</text>
  <text x="250" y="284" text-anchor="middle" font-size="9" fill="#94a3b8">162</text>
  <text x="345" y="284" text-anchor="middle" font-size="9" fill="#94a3b8">163</text>
  <text x="440" y="284" text-anchor="middle" font-size="9" fill="#94a3b8">164</text>
  <!-- トレンドライン -->
  <line x1="80" y1="250" x2="420" y2="80" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4"/>
  <!-- 代表点 -->
  <circle cx="400" cy="90" r="5" fill="#3b82f6"/>
  <text x="406" y="88" font-size="9" fill="#1e40af">秋田</text>
  <circle cx="355" cy="95" r="4" fill="#3b82f6"/>
  <text x="361" y="93" font-size="9" fill="#1e40af">青森</text>
  <circle cx="320" cy="110" r="4" fill="#60a5fa"/>
  <text x="326" y="108" font-size="9" fill="#1e40af">富山</text>
  <circle cx="100" cy="240" r="5" fill="#ef4444"/>
  <text x="106" y="238" font-size="9" fill="#dc2626">高知</text>
  <circle cx="90" cy="235" r="4" fill="#f87171"/>
  <text x="62" y="248" font-size="9" fill="#dc2626">沖縄</text>
  <circle cx="230" cy="165" r="4" fill="#94a3b8"/>
  <text x="236" y="163" font-size="9" fill="#475569">東京</text>
  <!-- 相関係数ボックス -->
  <rect x="320" y="235" width="130" height="28" fill="#eff6ff" rx="4" stroke="#bfdbfe"/>
  <text x="385" y="252" text-anchor="middle" font-size="10" fill="#1e40af">相関 r=0.82（強）</text>
</svg>