<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" style="max-width:600px;width:100%;font-family:sans-serif">
  <title>中学2年男子の平均身長ランキング（上位10・下位10）</title>
  <!-- 背景 -->
  <rect width="600" height="420" fill="#f8fafc" rx="8"/>
  <text x="300" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">中学2年男子の平均身長（2023年）</text>
  <text x="300" y="40" text-anchor="middle" font-size="11" fill="#64748b">上位10県・下位10県（cm）</text>
  <!-- 上位10 -->
  <g transform="translate(0,50)">
    <!-- bars top 10 -->
    <rect x="120" y="10" width="220" height="20" fill="#3b82f6" rx="2"/>
    <rect x="120" y="34" width="214" height="20" fill="#3b82f6" rx="2"/>
    <rect x="120" y="58" width="210" height="20" fill="#3b82f6" rx="2"/>
    <rect x="120" y="82" width="209" height="20" fill="#60a5fa" rx="2"/>
    <rect x="120" y="106" width="207" height="20" fill="#60a5fa" rx="2"/>
    <rect x="120" y="130" width="200" height="20" fill="#60a5fa" rx="2"/>
    <rect x="120" y="154" width="199" height="20" fill="#93c5fd" rx="2"/>
    <rect x="120" y="178" width="198" height="20" fill="#93c5fd" rx="2"/>
    <rect x="120" y="202" width="198" height="20" fill="#93c5fd" rx="2"/>
    <rect x="120" y="226" width="197" height="20" fill="#93c5fd" rx="2"/>
    <!-- labels top 10 -->
    <text x="115" y="25" text-anchor="end" font-size="11" fill="#334155">1. 秋田</text>
    <text x="115" y="49" text-anchor="end" font-size="11" fill="#334155">2. 青森</text>
    <text x="115" y="73" text-anchor="end" font-size="11" fill="#334155">3. 山形</text>
    <text x="115" y="97" text-anchor="end" font-size="11" fill="#334155">4. 富山</text>
    <text x="115" y="121" text-anchor="end" font-size="11" fill="#334155">5. 新潟</text>
    <text x="115" y="145" text-anchor="end" font-size="11" fill="#334155">6. 北海道</text>
    <text x="115" y="169" text-anchor="end" font-size="11" fill="#334155">7. 石川</text>
    <text x="115" y="193" text-anchor="end" font-size="11" fill="#334155">8. 福井</text>
    <text x="115" y="217" text-anchor="end" font-size="11" fill="#334155">9. 岩手</text>
    <text x="115" y="241" text-anchor="end" font-size="11" fill="#334155">10. 神奈川</text>
    <!-- values top 10 -->
    <text x="345" y="25" font-size="11" fill="#1e40af" font-weight="bold">163.6</text>
    <text x="339" y="49" font-size="11" fill="#1e40af" font-weight="bold">162.9</text>
    <text x="335" y="73" font-size="11" fill="#1e40af" font-weight="bold">162.6</text>
    <text x="334" y="97" font-size="11" fill="#1e40af">162.5</text>
    <text x="332" y="121" font-size="11" fill="#1e40af">162.3</text>
    <text x="325" y="145" font-size="11" fill="#1e40af">161.8</text>
    <text x="324" y="169" font-size="11" fill="#1e40af">161.8</text>
    <text x="323" y="193" font-size="11" fill="#1e40af">161.6</text>
    <text x="323" y="217" font-size="11" fill="#1e40af">161.5</text>
    <text x="322" y="241" font-size="11" fill="#1e40af">161.4</text>
  </g>
  <!-- 下位10 -->
  <g transform="translate(0,50)">
    <!-- 区切り線 -->
    <line x1="20" y1="258" x2="580" y2="258" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4"/>
    <text x="300" y="276" text-anchor="middle" font-size="10" fill="#94a3b8">…（全国平均 161.1cm）…</text>
    <!-- bars bottom 10 -->
    <rect x="120" y="285" width="162" height="20" fill="#fca5a5" rx="2"/>
    <rect x="120" y="309" width="162" height="20" fill="#fca5a5" rx="2"/>
    <rect x="120" y="333" width="163" height="20" fill="#f87171" rx="2"/>
    <rect x="120" y="357" width="159" height="20" fill="#ef4444" rx="2"/>
    <!-- labels bottom -->
    <text x="115" y="300" text-anchor="end" font-size="11" fill="#334155">44. 島根</text>
    <text x="115" y="324" text-anchor="end" font-size="11" fill="#334155">44. 山口</text>
    <text x="115" y="348" text-anchor="end" font-size="11" fill="#334155">46. 沖縄</text>
    <text x="115" y="372" text-anchor="end" font-size="11" fill="#334155">47. 高知</text>
    <!-- values bottom -->
    <text x="287" y="300" font-size="11" fill="#dc2626">159.9</text>
    <text x="287" y="324" font-size="11" fill="#dc2626">159.9</text>
    <text x="288" y="348" font-size="11" fill="#dc2626">159.8</text>
    <text x="284" y="372" font-size="11" fill="#dc2626" font-weight="bold">159.7</text>
  </g>
  <text x="300" y="415" text-anchor="middle" font-size="10" fill="#94a3b8">出典: 文部科学省「学校保健統計調査」2023年</text>
</svg>