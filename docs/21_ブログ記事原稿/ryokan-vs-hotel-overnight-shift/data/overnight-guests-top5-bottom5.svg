<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-label="延べ宿泊者数 上位5・下位5（2024年度、全施設合計）">
  <title>延べ宿泊者数 上位5・下位5（2024年度・全施設合計・万人泊）</title>
  <text x="150" y="26" font-size="16" font-weight="700" fill="currentColor">延べ宿泊者数 上位5・下位5（万人泊・2024年度）</text>
  <text x="150" y="44" font-size="12" fill="currentColor" opacity="0.7">全施設合計。上位＝青／下位＝橙。バー長は最大値（東京）基準</text>
  <line x1="150" y1="52" x2="150" y2="448" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="10" y1="248" x2="660" y2="248" stroke="currentColor" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="138" y="73" text-anchor="end" dominant-baseline="central" font-size="14" font-weight="600" fill="currentColor">1位 東京</text>
