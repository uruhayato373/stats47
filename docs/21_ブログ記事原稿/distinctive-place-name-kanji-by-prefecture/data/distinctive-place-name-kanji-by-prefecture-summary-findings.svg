  <text x="90" y="103.6" font-size="18" class="svg-title"><tspan x="90" dy="0">特徴度が最も高いのは沖縄県で、「謝」という漢字が全国平均の177.0倍の頻度で地名に使わ</tspan><tspan x="90" dy="22">れています(該当29件)。</tspan></text>
