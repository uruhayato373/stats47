  <text x="90" y="185.6" font-size="18" class="svg-title"><tspan x="90" dy="0">2位は滋賀県の「個」(全国平均の126.5倍)、3位は山梨県の「垈」(121.5倍)で、</tspan><tspan x="90" dy="22">いずれも県内地名総数が3,000件未満と少ない県が上位に集まっています。</tspan></text>
  <rect x="40" y="236" width="880" height="116" class="svg-plot" rx="8"/>
