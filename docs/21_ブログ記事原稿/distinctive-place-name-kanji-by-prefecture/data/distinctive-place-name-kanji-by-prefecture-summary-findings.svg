  <text x="90" y="267.6" font-size="18" class="svg-title"><tspan x="90" dy="0">居住地名の総数(母数)が多い県ほど特徴度スコアは低くなる傾向があり、総数とスコアの相関係</tspan><tspan x="90" dy="22">数はr=-0.691でした。地名総数が29,350件と全国最多の北海道は特徴度スコアが1</tspan><tspan x="90" dy="22">1.8倍(最下位)にとどまり、これは北海道の地名に特徴がないのではなく、アイヌ語由来のあ</tspan><tspan x="90" dy="22">て字が幅広く分散し単一の漢字に集中しないことを示しています。</tspan></text>
