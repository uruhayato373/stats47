  <text x="58" y="125" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">1</text>
  <text x="90" y="103.6" font-size="18" class="svg-title"><tspan x="90" dy="0">都市ガス到達率は大都市圏と地方で4.6倍の差。大阪府10</tspan><tspan x="90" dy="22">6.7%に対し徳島県23.4%。地方はLPガス・灯油に依</tspan><tspan x="90" dy="22">存</tspan></text>
  <rect x="40" y="176" width="880" height="94" class="svg-plot" rx="8"/>
  <circle cx="58" cy="223" r="18" fill="#dc2626"/>
  <text x="58" y="229" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">2</text>
  <text x="90" y="207.6" font-size="18" class="svg-title"><tspan x="90" dy="0">「発電県」と「消費県」は一致しない。発電上位は原発・火力</tspan><tspan x="90" dy="22">の立地県（千葉・神奈川・福島・福井）、消費上位は東京・愛</tspan><tspan x="90" dy="22">知・大阪などの大都市圏</tspan></text>
  <rect x="40" y="280" width="880" height="72" class="svg-plot" rx="8"/>
  <circle cx="58" cy="316" r="18" fill="#dc2626"/>
  <text x="58" y="322" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">3</text>
  <text x="90" y="311.6" font-size="18" class="svg-title"><tspan x="90" dy="0">埼玉県は発電量が全国最下位（約54万MWh）なのに需要は</tspan><tspan x="90" dy="22">全国6位。電力を県外から大量に「輸入」している</tspan></text>
  <rect x="40" y="362" width="880" height="94" class="svg-plot" rx="8"/>
  <circle cx="58" cy="409" r="18" fill="#dc2626"/>
  <text x="58" y="415" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">4</text>
  <text x="90" y="393.6" font-size="18" class="svg-title"><tspan x="90" dy="0">ガソリン販売量は2004年の約6,323万KLをピークに</tspan><tspan x="90" dy="22">、2023年は約4,500万KLへ減少。燃費改善と人口減</tspan><tspan x="90" dy="22">が主因</tspan></text>
  <rect x="40" y="466" width="880" height="94" class="svg-plot" rx="8"/>
  <circle cx="58" cy="513" r="18" fill="#dc2626"/>
  <text x="58" y="519" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">5</text>
  <text x="90" y="497.6" font-size="18" class="svg-title"><tspan x="90" dy="0">脱炭素政策は地域のエネルギー構造に応じた設計が必要。普及</tspan><tspan x="90" dy="22">率・自動車依存度・気候が異なり、一律の施策では格差が拡大</tspan><tspan x="90" dy="22">するリスク</tspan></text>
