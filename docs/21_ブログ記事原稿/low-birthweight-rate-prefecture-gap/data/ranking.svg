xt x="498.9" y="315" font-size="12" fill="#64748b">85.7‰</text><text x="150" y="349" text-anchor="end" font-size="13" fill="#94a3b8">46. 香川県</text><rect x="158" y="333" width="328.6" height="22" rx="2" fill="#ea7317"><title>香川県：低出生体重児率=84.6</title></rect><text x="494.6" y="349" font-size="12" fill="#64748b">84.6‰</text><text x="150" y="383" text-anchor="end" font-size="13" fill="#94a3b8">47. 徳島県</text><rect x="158" y="367" width="311.5" height="22" rx="2" fill="#ea7317"><title>徳島県：低出生体重児率=80.2</title></rect><text x="477.5" y="383" font-size="12" fill="#64748b">80.2‰</text>
