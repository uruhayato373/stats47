<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380">
  <rect width="640" height="380" fill="#f8fafc"/>
  <text x="320" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">合計特殊出生率と平均婚姻年齢（初婚の妻）の散布図</text>
  <!-- axes -->
  <line x1="80" y1="320" x2="580" y2="320" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="80" y1="40" x2="80" y2="320" stroke="#cbd5e1" stroke-width="1"/>
  <!-- axis labels -->
  <text x="320" y="355" text-anchor="middle" font-size="11" fill="#64748b">合計特殊出生率</text>
  <text x="25" y="200" text-anchor="middle" font-size="11" fill="#64748b" transform="rotate(-90,25,200)">平均婚姻年齢（妻）</text>
  <!-- axis values x -->
  <text x="80" y="338" text-anchor="middle" font-size="10" fill="#64748b">0.9</text>
  <text x="208" y="338" text-anchor="middle" font-size="10" fill="#64748b">1.1</text>
  <text x="336" y="338" text-anchor="middle" font-size="10" fill="#64748b">1.3</text>
  <text x="464" y="338" text-anchor="middle" font-size="10" fill="#64748b">1.5</text>
  <text x="564" y="338" text-anchor="middle" font-size="10" fill="#64748b">1.6</text>
  <!-- axis values y -->
  <text x="72" y="323" text-anchor="end" font-size="10" fill="#64748b">31</text>
  <text x="72" y="243" text-anchor="end" font-size="10" fill="#64748b">30</text>
  <text x="72" y="163" text-anchor="end" font-size="10" fill="#64748b">29</text>
  <text x="72" y="83" text-anchor="end" font-size="10" fill="#64748b">28</text>
  <!-- trend line approx -->
  <line x1="100" y1="305" x2="560" y2="90" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6"/>
  <!-- key data points -->
  <!-- 東京 (0.99, 30.7歳) -->
  <circle cx="92" cy="258" r="6" fill="#ef4444"/>
  <text x="100" y="252" font-size="10" fill="#ef4444">東京 0.99/30.7歳</text>
  <!-- 沖縄 (1.60, 29.5歳) -->
  <circle cx="560" cy="178" r="6" fill="#16a34a"/>
  <text x="510" y="172" font-size="10" fill="#16a34a">沖縄 1.60/29.5歳</text>
  <!-- 島根 (1.46, 28.9歳) -->
  <circle cx="464" cy="130" r="5" fill="#2563eb"/>
  <text x="472" y="130" font-size="10" fill="#2563eb">島根 1.46/28.9歳</text>
  <!-- 福井 (1.46, 29.0歳) -->
  <circle cx="464" cy="138" r="5" fill="#2563eb"/>
  <!-- 鹿児島 (1.48, 29.6歳) -->
  <circle cx="496" cy="186" r="5" fill="#7c3aed"/>
  <text x="500" y="200" font-size="10" fill="#7c3aed">鹿児島 1.48/29.6歳</text>
  <!-- 神奈川 (1.13, 30.3歳) -->
  <circle cx="240" cy="234" r="5" fill="#f97316"/>
  <text x="245" y="230" font-size="10" fill="#f97316">神奈川 1.13/30.3歳</text>
  <!-- 相関係数注記 -->
  <text x="120" y="70" font-size="12" fill="#1e293b">r = −0.60（中程度の負の相関）</text>
</svg>