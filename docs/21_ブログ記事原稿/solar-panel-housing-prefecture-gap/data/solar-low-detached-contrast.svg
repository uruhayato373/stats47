<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 396" width="680" height="396" font-family="system-ui,sans-serif">
  <title>太陽光下位県の一戸建住宅比率：都市型と豪雪地の対比（2023年）</title>
  <text x="340" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#64748b">太陽光が普及しない県の一戸建住宅比率（2023年）</text>
  <text x="340" y="40" text-anchor="middle" font-size="11" fill="#94a3b8">都市型は「屋根が無い」／豪雪地は「屋根はあるが普及せず」</text>
  <rect x="84" y="60" width="147.3" height="22" fill="#ea580c" rx="2"/>
  <text x="78" y="74.0" text-anchor="end" font-size="11" fill="#64748b">東京</text>
  <text x="237.3" y="73.0" text-anchor="start" font-size="10" fill="#475569">戸建26.3%</text>
  <text x="237.3" y="84.0" text-anchor="start" font-size="9" fill="#94a3b8">太陽光1.8%(47位)</text>
  <rect x="84" y="88" width="222.9" height="22" fill="#ea580c" rx="2"/>
  <text x="78" y="102.0" text-anchor="end" font-size="11" fill="#64748b">大阪</text>
  <text x="312.9" y="101.0" text-anchor="start" font-size="10" fill="#475569">戸建39.8%</text>
  <text x="312.9" y="112.0" text-anchor="start" font-size="9" fill="#94a3b8">太陽光2.6%(43位)</text>
  <rect x="84" y="116" width="227.9" height="22" fill="#ea580c" rx="2"/>
  <text x="78" y="130.0" text-anchor="end" font-size="11" fill="#64748b">神奈川</text>
  <text x="317.9" y="129.0" text-anchor="start" font-size="10" fill="#475569">戸建40.7%</text>
  <text x="317.9" y="140.0" text-anchor="start" font-size="9" fill="#94a3b8">太陽光3%(40位)</text>
  <rect x="84" y="144" width="285.6" height="22" fill="#ea580c" rx="2"/>
  <text x="78" y="158.0" text-anchor="end" font-size="11" fill="#64748b">愛知</text>
  <text x="375.6" y="157.0" text-anchor="start" font-size="10" fill="#475569">戸建51%</text>
  <text x="375.6" y="168.0" text-anchor="start" font-size="9" fill="#94a3b8">太陽光6.5%(21位)</text>
  <rect x="84" y="172" width="290.6" height="22" fill="#ea580c" rx="2"/>
  <text x="78" y="186.0" text-anchor="end" font-size="11" fill="#64748b">北海</text>
  <text x="380.6" y="185.0" text-anchor="start" font-size="10" fill="#475569">戸建51.9%</text>
  <text x="380.6" y="196.0" text-anchor="start" font-size="9" fill="#94a3b8">太陽光1.8%(46位)</text>
  <rect x="84" y="208" width="444.6" height="22" fill="#0891b2" rx="2"/>
  <text x="78" y="222.0" text-anchor="end" font-size="11" fill="#64748b">秋田</text>
  <text x="534.6" y="221.0" text-anchor="start" font-size="10" fill="#475569">戸建79.4%</text>
  <text x="534.6" y="232.0" text-anchor="start" font-size="9" fill="#94a3b8">太陽光2.3%(45位)</text>
  <rect x="84" y="236" width="413.8" height="22" fill="#0891b2" rx="2"/>
  <text x="78" y="250.0" text-anchor="end" font-size="11" fill="#64748b">新潟</text>
  <text x="503.8" y="249.0" text-anchor="start" font-size="10" fill="#475569">戸建73.9%</text>
  <text x="503.8" y="260.0" text-anchor="start" font-size="9" fill="#94a3b8">太陽光2.3%(44位)</text>
  <rect x="84" y="264" width="421.7" height="22" fill="#0891b2" rx="2"/>
  <text x="78" y="278.0" text-anchor="end" font-size="11" fill="#64748b">青森</text>
  <text x="511.7" y="277.0" text-anchor="start" font-size="10" fill="#475569">戸建75.3%</text>
  <text x="511.7" y="288.0" text-anchor="start" font-size="9" fill="#94a3b8">太陽光2.8%(42位)</text>
  <rect x="84" y="292" width="414.4" height="22" fill="#0891b2" rx="2"/>
  <text x="78" y="306.0" text-anchor="end" font-size="11" fill="#64748b">富山</text>
  <text x="504.4" y="305.0" text-anchor="start" font-size="10" fill="#475569">戸建74%</text>
  <text x="504.4" y="316.0" text-anchor="start" font-size="9" fill="#94a3b8">太陽光3.9%(37位)</text>
  <rect x="84" y="320" width="418.3" height="22" fill="#0891b2" rx="2"/>
  <text x="78" y="334.0" text-anchor="end" font-size="11" fill="#64748b">福井</text>
  <text x="508.3" y="333.0" text-anchor="start" font-size="10" fill="#475569">戸建74.7%</text>
  <text x="508.3" y="344.0" text-anchor="start" font-size="9" fill="#94a3b8">太陽光4.5%(34位)</text>
</svg>
