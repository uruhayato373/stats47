<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 294" width="680" height="294" font-family="system-ui,sans-serif">
  <title>持ち家比率 上位3・下位5（2023年・住宅・土地統計調査）</title>
  <text x="340" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#64748b">持ち家比率 上位3・下位5（2023年）</text>
  <rect x="84" y="44" width="431.8" height="22" fill="#2563eb" rx="2"/>
  <text x="78" y="58.0" text-anchor="end" font-size="11" fill="#64748b">秋田</text>
  <text x="521.8" y="58.0" text-anchor="start" font-size="10" fill="#475569">77.1%（1位）</text>
  <rect x="84" y="72" width="420.0" height="22" fill="#2563eb" rx="2"/>
  <text x="78" y="86.0" text-anchor="end" font-size="11" fill="#64748b">山形</text>
  <text x="510.0" y="86.0" text-anchor="start" font-size="10" fill="#475569">75%（2位）</text>
  <rect x="84" y="100" width="419.4" height="22" fill="#2563eb" rx="2"/>
  <text x="78" y="114.0" text-anchor="end" font-size="11" fill="#64748b">富山</text>
  <text x="509.4" y="114.0" text-anchor="start" font-size="10" fill="#475569">74.9%（3位）</text>
  <line x1="84" y1="130.0" x2="560.0" y2="130.0" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="84" y="138" width="319.2" height="22" fill="#ea580c" rx="2"/>
  <text x="78" y="152.0" text-anchor="end" font-size="11" fill="#64748b">北海</text>
  <text x="409.2" y="152.0" text-anchor="start" font-size="10" fill="#475569">57%（43位）</text>
  <rect x="84" y="166" width="305.2" height="22" fill="#ea580c" rx="2"/>
  <text x="78" y="180.0" text-anchor="end" font-size="11" fill="#64748b">大阪</text>
  <text x="395.2" y="180.0" text-anchor="start" font-size="10" fill="#475569">54.5%（44位）</text>
  <rect x="84" y="194" width="295.1" height="22" fill="#ea580c" rx="2"/>
  <text x="78" y="208.0" text-anchor="end" font-size="11" fill="#64748b">福岡</text>
  <text x="385.1" y="208.0" text-anchor="start" font-size="10" fill="#475569">52.7%（45位）</text>
  <rect x="84" y="222" width="250.3" height="22" fill="#ea580c" rx="2"/>
  <text x="78" y="236.0" text-anchor="end" font-size="11" fill="#64748b">東京</text>
  <text x="340.3" y="236.0" text-anchor="start" font-size="10" fill="#475569">44.7%（46位）</text>
  <rect x="84" y="250" width="238.6" height="22" fill="#ea580c" rx="2"/>
  <text x="78" y="264.0" text-anchor="end" font-size="11" fill="#64748b">沖縄</text>
  <text x="328.6" y="264.0" text-anchor="start" font-size="10" fill="#475569">42.6%（47位）</text>
