<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" role="img" aria-label="国際協力ボランティア行動者率 上位5・下位5">
  <title>国際協力ボランティア行動者率 上位5・下位5（2006年・社会生活基本調査）</title>
  <style>
    .ttl { font: 700 19px system-ui, sans-serif; fill: #64748b; }
    .grp { font: 700 14px system-ui, sans-serif; fill: #64748b; }
    .lbl { font: 600 14px system-ui, sans-serif; fill: #64748b; }
    .val { font: 700 14px system-ui, sans-serif; }
    .axis { stroke: #94a3b8; stroke-width: 1; }
  </style>

  <text class="ttl" x="20" y="34">国際協力ボランティア行動者率 上位5・下位5（2006年）</text>

  <!-- 上位グループ -->
  <text class="grp" x="20" y="70">上位5県（高い）</text>

  <!-- 東京都 2.1 -->
  <text class="lbl" x="20" y="98" text-anchor="start">東京都</text>
  <rect x="92" y="86" width="462" height="16" rx="2" fill="#2563eb"/>
  <text class="val" x="562" y="98" fill="#2563eb">2.1%</text>

  <!-- 滋賀県 2.1 -->
  <text class="lbl" x="20" y="124" text-anchor="start">滋賀県</text>
  <rect x="92" y="112" width="462" height="16" rx="2" fill="#2563eb"/>
  <text class="val" x="562" y="124" fill="#2563eb">2.1%</text>

  <!-- 神奈川県 2.0 -->
  <text class="lbl" x="20" y="150" text-anchor="start">神奈川県</text>
  <rect x="92" y="138" width="440" height="16" rx="2" fill="#3b82f6"/>
  <text class="val" x="540" y="150" fill="#3b82f6">2.0%</text>

  <!-- 山梨県 2.0 -->
  <text class="lbl" x="20" y="176" text-anchor="start">山梨県</text>
  <rect x="92" y="164" width="440" height="16" rx="2" fill="#3b82f6"/>
  <text class="val" x="540" y="176" fill="#3b82f6">2.0%</text>

  <!-- 広島県 1.9 -->
  <text class="lbl" x="20" y="202" text-anchor="start">広島県</text>
  <rect x="92" y="190" width="418" height="16" rx="2" fill="#3b82f6"/>
  <text class="val" x="518" y="202" fill="#3b82f6">1.9%</text>

  <line class="axis" x1="92" y1="226" x2="92" y2="478"/>

  <!-- 下位グループ -->
  <text class="grp" x="20" y="270">下位5県（低い）</text>

  <!-- 福岡県 0.9 -->
  <text class="lbl" x="20" y="298" text-anchor="start">福岡県</text>
  <rect x="92" y="286" width="198" height="16" rx="2" fill="#f59e0b"/>
  <text class="val" x="298" y="298" fill="#d97706">0.9%</text>

  <!-- 秋田県 0.8 -->
  <text class="lbl" x="20" y="324" text-anchor="start">秋田県</text>
  <rect x="92" y="312" width="176" height="16" rx="2" fill="#f97316"/>
  <text class="val" x="276" y="324" fill="#ea580c">0.8%</text>

  <!-- 高知県 0.8 -->
  <text class="lbl" x="20" y="350" text-anchor="start">高知県</text>
  <rect x="92" y="338" width="176" height="16" rx="2" fill="#f97316"/>
  <text class="val" x="276" y="350" fill="#ea580c">0.8%</text>

  <!-- 大分県 0.8 -->
  <text class="lbl" x="20" y="376" text-anchor="start">大分県</text>
  <rect x="92" y="364" width="176" height="16" rx="2" fill="#f97316"/>
  <text class="val" x="276" y="376" fill="#ea580c">0.8%</text>

  <!-- 新潟県 0.7 -->
  <text class="lbl" x="20" y="402" text-anchor="start">新潟県</text>
  <rect x="92" y="390" width="154" height="16" rx="2" fill="#ea580c"/>
  <text class="val" x="254" y="402" fill="#ea580c">0.7%</text>

  <text class="lbl" x="20" y="450" font-size="12">上位は東京都・滋賀県の2.1%、最下位は新潟県の0.7%。</text>
  <text class="lbl" x="20" y="470" font-size="12">1位と最下位で約3倍の開きがあります。</text>
</svg>
