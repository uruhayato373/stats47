<svg width="960" height="478" viewBox="0 0 960 478" xmlns="http://www.w3.org/2000/svg"
     font-family="'Hiragino Sans','Noto Sans JP',sans-serif"
     role="img" aria-label="この記事でわかったこと">
  <title>この記事でわかったこと</title>
  <rect width="960" height="478" fill="#f9fafb"/>
  <text x="480" y="48" text-anchor="middle" font-family="'Noto Sans JP',sans-serif" font-size="26" font-weight="bold" fill="#1f2937">この記事でわかったこと</text>

  <rect x="50" y="78" width="860" height="80" fill="#fff" rx="8"/>
  <circle cx="94" cy="118" r="20" fill="#dc2626"/>
  <text x="94" y="125" text-anchor="middle" font-family="'Noto Sans JP',sans-serif" font-size="16" font-weight="bold" fill="#fff">1</text>
  <text x="130" y="110" font-family="'Noto Sans JP',sans-serif" font-size="18" font-weight="bold" fill="#1f2937">うどん圏は西日本</text>
  <text x="130" y="136" font-family="'Noto Sans JP',sans-serif" font-size="15" fill="#4b5563">香川1位・四国〜関西全体で乾うどん消費量が多い</text>
  <rect x="50" y="158" width="860" height="80" fill="#f9fafb" rx="8"/>
  <circle cx="94" cy="198" r="20" fill="#ea580c"/>
  <text x="94" y="205" text-anchor="middle" font-family="'Noto Sans JP',sans-serif" font-size="16" font-weight="bold" fill="#fff">2</text>
  <text x="130" y="190" font-family="'Noto Sans JP',sans-serif" font-size="18" font-weight="bold" fill="#1f2937">ラーメン圏は東北・北陸</text>
  <text x="130" y="216" font-family="'Noto Sans JP',sans-serif" font-size="15" fill="#4b5563">山形1位で年22,389円。1位と47位の差は5.7倍</text>
  <rect x="50" y="238" width="860" height="80" fill="#fff" rx="8"/>
  <circle cx="94" cy="278" r="20" fill="#0284c7"/>
  <text x="94" y="285" text-anchor="middle" font-family="'Noto Sans JP',sans-serif" font-size="16" font-weight="bold" fill="#fff">3</text>
  <text x="130" y="270" font-family="'Noto Sans JP',sans-serif" font-size="18" font-weight="bold" fill="#1f2937">逆相関の構造</text>
  <text x="130" y="296" font-family="'Noto Sans JP',sans-serif" font-size="15" fill="#4b5563">うどん消費が多い県ほどラーメン支出が少ない傾向</text>
  <rect x="50" y="318" width="860" height="80" fill="#f9fafb" rx="8"/>
  <circle cx="94" cy="358" r="20" fill="#7c3aed"/>
  <text x="94" y="365" text-anchor="middle" font-family="'Noto Sans JP',sans-serif" font-size="16" font-weight="bold" fill="#fff">4</text>
  <text x="130" y="350" font-family="'Noto Sans JP',sans-serif" font-size="18" font-weight="bold" fill="#1f2937">そばは「どちらでもない圏」</text>
  <text x="130" y="376" font-family="'Noto Sans JP',sans-serif" font-size="15" fill="#4b5563">長野・山形・新潟などラーメンとそばが共存する地域</text>
  <rect x="50" y="398" width="860" height="80" fill="#fff" rx="8"/>
  <circle cx="94" cy="438" r="20" fill="#059669"/>
  <text x="94" y="445" text-anchor="middle" font-family="'Noto Sans JP',sans-serif" font-size="16" font-weight="bold" fill="#fff">5</text>
  <text x="130" y="430" font-family="'Noto Sans JP',sans-serif" font-size="18" font-weight="bold" fill="#1f2937">沖縄は麺類特異点</text>
  <text x="130" y="456" font-family="'Noto Sans JP',sans-serif" font-size="15" fill="#4b5563">うどん・ラーメンとも低い。そば（沖縄そば）文化圏</text>

</svg>