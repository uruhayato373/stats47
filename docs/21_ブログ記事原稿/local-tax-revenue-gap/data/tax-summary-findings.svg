<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" role="img" aria-label="この記事でわかったこと"><rect width="960" height="340" fill="#f9fafb"/><text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">この記事でわかったこと</text><rect x="60" y="64" width="840" height="64" fill="#ffffff"/><circle cx="100" cy="96" r="16" fill="#dc2626"/><text x="100" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1</text><text x="140" y="90" font-size="15" font-weight="bold" fill="#1f2937">東京都の地方税割合63.4%は島根県15.5%の約4倍</text><text x="140" y="112" font-size="13" fill="#4b5563">歳入の自主財源比率に最大4倍の格差──地方自治の「自立度」に圧倒的な差</text><rect x="60" y="128" width="840" height="64" fill="#f9fafb"/><circle cx="100" cy="160" r="16" fill="#ea580c"/><text x="100" y="166" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">2</text><text x="140" y="154" font-size="15" font-weight="bold" fill="#1f2937">地方税割合と地方交付税割合は強い逆相関</text><text x="140" y="176" font-size="13" fill="#4b5563">自主財源が少ない県ほど交付税依存が高い──高知37.4%、東京0%と両極に分化</text><rect x="60" y="192" width="840" height="64" fill="#ffffff"/><circle cx="100" cy="224" r="16" fill="#0284c7"/><text x="100" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">3</text><text x="140" y="218" font-size="15" font-weight="bold" fill="#1f2937">納税義務者割合が税収格差の構造的要因</text><text x="140" y="240" font-size="13" fill="#4b5563">東京51.5% vs 沖縄40.1%──生産年齢人口の多寡が税収力を直接左右する</text><rect x="60" y="256" width="840" height="64" fill="#f9fafb"/><circle cx="100" cy="288" r="16" fill="#7c3aed"/><text x="100" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">4</text><text x="140" y="282" font-size="15" font-weight="bold" fill="#1f2937">国庫支出金で格差は一部是正されるが限定的</text><text x="140" y="304" font-size="13" fill="#4b5563">沖縄32.5%、東京12.9%──交付税と合わせた再分配で最低限の財政基盤を確保</text></svg>