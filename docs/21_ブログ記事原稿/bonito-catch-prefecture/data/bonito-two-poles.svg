<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 224" role="img" aria-label="静岡（焼津）と宮城（気仙沼）のカツオ漁獲量比較（2015年）" font-family="system-ui, -apple-system, sans-serif"><title>静岡（焼津・冷凍遠洋）と宮城（気仙沼・生鮮近海）のカツオ漁獲量（2015年、単位トン）</title><text x="150" y="28" font-size="17" font-weight="700" fill="#1e293b">焼津（冷凍・遠洋）と気仙沼（生鮮・近海）の二極構造</text><text x="150" y="48" font-size="12" fill="#64748b">統計上の都道府県別漁獲量（2015年、単位: トン）</text><text x="140" y="83" font-size="13" font-weight="600" text-anchor="end" fill="#334155">静岡県（焼津）</text><text x="140" y="99" font-size="10.5" text-anchor="end" fill="#94a3b8">冷凍・遠洋カツオの本拠地</text><rect x="150" y="60" width="500" height="46" rx="3" fill="#2563eb"><title>静岡県（焼津）: 81,295 トン</title></rect><text x="658" y="88" font-size="14" font-weight="700" fill="#475569">81,295</text><text x="140" y="157" font-size="13" font-weight="600" text-anchor="end" fill="#334155">宮城県（気仙沼）</text><text x="140" y="173" font-size="10.5" text-anchor="end" fill="#94a3b8">生鮮カツオの水揚げ拠点</text><rect x="150" y="134" width="122" height="46" rx="3" fill="#0d9488"><title>宮城県（気仙沼）: 19,828 トン</title></rect><text x="280" y="162" font-size="14" font-weight="700" fill="#475569">19,828</text></svg>