<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="入院受療率 上位5県と下位5県の比較" style="width:100%;height:auto;font-family:sans-serif">
  <style>
    .bar-top { fill: #2563eb; }
    .bar-bottom { fill: #94a3b8; }
    .lbl { fill: #334155; font-size: 13px; }
    .val { fill: #334155; font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .bar-top { fill: #60a5fa; }
      .bar-bottom { fill: #64748b; }
      .lbl, .val { fill: #cbd5e1; }
    }
  </style>
  <g>
    <text class="lbl" x="8" y="24">高知</text><rect class="bar-top" x="90" y="12" width="468" height="18"/><text class="val" x="564" y="26">1,785</text>
    <text class="lbl" x="8" y="54">鹿児島</text><rect class="bar-top" x="90" y="42" width="457" height="18"/><text class="val" x="553" y="56">1,743</text>
    <text class="lbl" x="8" y="84">長崎</text><rect class="bar-top" x="90" y="72" width="433" height="18"/><text class="val" x="529" y="86">1,651</text>
    <text class="lbl" x="8" y="114">山口</text><rect class="bar-top" x="90" y="102" width="402" height="18"/><text class="val" x="498" y="116">1,534</text>
    <text class="lbl" x="8" y="144">熊本</text><rect class="bar-top" x="90" y="132" width="401" height="18"/><text class="val" x="497" y="146">1,531</text>
    <text class="lbl" x="8" y="204">千葉</text><rect class="bar-bottom" x="90" y="192" width="194" height="18"/><text class="val" x="290" y="206">741</text>
    <text class="lbl" x="8" y="234">愛知</text><rect class="bar-bottom" x="90" y="222" width="187" height="18"/><text class="val" x="283" y="236">712</text>
    <text class="lbl" x="8" y="264">埼玉</text><rect class="bar-bottom" x="90" y="252" width="184" height="18"/><text class="val" x="280" y="266">702</text>
    <text class="lbl" x="8" y="294">東京</text><rect class="bar-bottom" x="90" y="282" width="176" height="18"/><text class="val" x="272" y="296">671</text>
    <text class="lbl" x="8" y="324">神奈川</text><rect class="bar-bottom" x="90" y="312" width="174" height="18"/><text class="val" x="270" y="326">665</text>
  </g>
</svg>