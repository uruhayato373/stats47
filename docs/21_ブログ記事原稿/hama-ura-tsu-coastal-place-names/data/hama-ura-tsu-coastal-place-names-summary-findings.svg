  <text x="90" y="103.6" font-size="18" class="svg-title"><tspan x="90" dy="0">『浦』を含む居住地名は長崎県で突出し、居住地名1000件あたり67.6件と2位愛媛県(2</tspan><tspan x="90" dy="22">6.6件)を大きく引き離しています。</tspan></text>
  <rect x="40" y="154" width="880" height="72" class="svg-plot" rx="8"/>
  <circle cx="58" cy="190" r="18" fill="#dc2626"/>
  <text x="58" y="196" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">2</text>
  <text x="90" y="185.6" font-size="18" class="svg-title"><tspan x="90" dy="0">『浜』は長崎(23.3)・香川(22.4)・沖縄(21.8)が上位で、瀬戸内海や琉球弧な</tspan><tspan x="90" dy="22">ど波の穏やかな海岸に多く見られます。</tspan></text>
  <rect x="40" y="236" width="880" height="72" class="svg-plot" rx="8"/>
  <circle cx="58" cy="272" r="18" fill="#dc2626"/>
  <text x="58" y="278" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">3</text>
  <text x="90" y="267.6" font-size="18" class="svg-title"><tspan x="90" dy="0">『津』は全国3語の中で最も広く分布し、内陸8県のうち7県(滋賀・岐阜・奈良・群馬・山梨・</tspan><tspan x="90" dy="22">栃木・長野)で最多の海岸系文字になっています。</tspan></text>
  <rect x="40" y="318" width="880" height="72" class="svg-plot" rx="8"/>
  <circle cx="58" cy="354" r="18" fill="#dc2626"/>
  <text x="58" y="360" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">4</text>
  <text x="90" y="349.6" font-size="18" class="svg-title"><tspan x="90" dy="0">滋賀県は津が居住地名1000件あたり37.0件と全国1位で、琵琶湖沿いの『大津』『今津』</tspan><tspan x="90" dy="22">など、かつての湊の記憶を伝えています。</tspan></text>
