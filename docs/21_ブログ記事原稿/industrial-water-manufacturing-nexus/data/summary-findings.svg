  <text x="58" y="125" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">1</text>
  <text x="90" y="103.6" font-size="18" class="svg-title"><tspan x="90" dy="0">千葉県が工業用水量1位（約1,612万m3/日）。京葉工</tspan><tspan x="90" dy="22">業地域の石油化学・鉄鋼コンビナートが大量の冷却水・工程水</tspan><tspan x="90" dy="22">を消費</tspan></text>
  <rect x="40" y="176" width="880" height="94" class="svg-plot" rx="8"/>
  <circle cx="58" cy="223" r="18" fill="#dc2626"/>
  <text x="58" y="229" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">2</text>
  <text x="90" y="207.6" font-size="18" class="svg-title"><tspan x="90" dy="0">上位5県（千葉・山口・愛知・兵庫・岡山）で全国の約44.</tspan><tspan x="90" dy="22">7%を占め、いずれも臨海工業地帯。太平洋ベルトと瀬戸内に</tspan><tspan x="90" dy="22">帯状に集中</tspan></text>
  <rect x="40" y="280" width="880" height="72" class="svg-plot" rx="8"/>
  <circle cx="58" cy="316" r="18" fill="#dc2626"/>
  <text x="58" y="322" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">3</text>
  <text x="90" y="311.6" font-size="18" class="svg-title"><tspan x="90" dy="0">水使用量と出荷額は必ずしも比例しない。愛知は出荷額1位だ</tspan><tspan x="90" dy="22">が水使用量は3位、滋賀は少ない水で出荷額15位を実現</tspan></text>
  <rect x="40" y="362" width="880" height="94" class="svg-plot" rx="8"/>
  <circle cx="58" cy="409" r="18" fill="#dc2626"/>
  <text x="58" y="415" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">4</text>
  <text x="90" y="393.6" font-size="18" class="svg-title"><tspan x="90" dy="0">水効率1位は奈良県、最下位は山口県でその差は約83倍。高</tspan><tspan x="90" dy="22">効率県は内陸の精密機械・電子部品型、低効率県は臨海の素材</tspan><tspan x="90" dy="22">産業型</tspan></text>
  <rect x="40" y="466" width="880" height="72" class="svg-plot" rx="8"/>
  <circle cx="58" cy="502" r="18" fill="#dc2626"/>
  <text x="58" y="508" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">5</text>
  <text x="90" y="497.6" font-size="18" class="svg-title"><tspan x="90" dy="0">TSMC熊本・Rapidus北海道など半導体新工場の超純</tspan><tspan x="90" dy="22">水需要が急増し、水資源の確保が工場立地戦略の新たな条件に</tspan></text>
