<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-label="工業用水量 都道府県別 上位5・下位5 (2015年度)" font-family="system-ui, -apple-system, 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif">
  <title>工業用水量 都道府県別 上位5・下位5 (2015年度、万m3/日)</title>
  <text x="20" y="30" font-size="18" font-weight="700" fill="#64748b">工業用水量 上位5・下位5（2015年度・万m3/日）</text>

  <!-- 軸基準線 -->
  <line x1="170" y1="55" x2="170" y2="455" stroke="#94a3b8" stroke-width="1" />

  <!-- 上位5 (青系) max基準 1612万 -> bar幅 max 480px -->
  <!-- row height 36 -->
  <g font-size="13">
    <!-- 千葉 1612 -->
    <text x="160" y="78" text-anchor="end" fill="#64748b" font-weight="600">1. 千葉県</text>
    <rect x="170" y="66" width="480" height="20" fill="#2563eb" rx="2"/>
    <text x="656" y="81" font-size="12" fill="#64748b" font-weight="600">1,612万</text>
    <!-- 山口 1570 -->
    <text x="160" y="114" text-anchor="end" fill="#64748b" font-weight="600">2. 山口県</text>
    <rect x="170" y="102" width="467" height="20" fill="#2563eb" rx="2"/>
    <text x="643" y="117" font-size="12" fill="#64748b" font-weight="600">1,570万</text>
    <!-- 愛知 1454 -->
    <text x="160" y="150" text-anchor="end" fill="#64748b" font-weight="600">3. 愛知県</text>
    <rect x="170" y="138" width="433" height="20" fill="#2563eb" rx="2"/>
    <text x="609" y="153" font-size="12" fill="#64748b" font-weight="600">1,454万</text>
    <!-- 兵庫 1373 -->
    <text x="160" y="186" text-anchor="end" fill="#64748b" font-weight="600">4. 兵庫県</text>
    <rect x="170" y="174" width="409" height="20" fill="#2563eb" rx="2"/>
    <text x="585" y="189" font-size="12" fill="#64748b" font-weight="600">1,373万</text>
    <!-- 岡山 937 -->
    <text x="160" y="222" text-anchor="end" fill="#64748b" font-weight="600">5. 岡山県</text>
    <rect x="170" y="210" width="279" height="20" fill="#2563eb" rx="2"/>
    <text x="455" y="225" font-size="12" fill="#64748b" font-weight="600">937万</text>
  </g>

  <!-- 区切り -->
  <line x1="20" y1="246" x2="700" y2="246" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4" />
  <text x="20" y="266" font-size="12" fill="#94a3b8">↓ 下位5県（最下位グループ）</text>

  <!-- 下位5 (橙系) 値が小さいので最小幅を確保して見せる -->
  <g font-size="13">
    <!-- 高知 19.1万 -->
    <text x="160" y="294" text-anchor="end" fill="#64748b" font-weight="600">43. 高知県</text>
    <rect x="170" y="282" width="14" height="20" fill="#ea580c" rx="2"/>
    <text x="190" y="297" font-size="12" fill="#64748b" font-weight="600">19.1万</text>
    <!-- 長崎 16.9万 -->
    <text x="160" y="330" text-anchor="end" fill="#64748b" font-weight="600">44. 長崎県</text>
    <rect x="170" y="318" width="12" height="20" fill="#ea580c" rx="2"/>
    <text x="188" y="333" font-size="12" fill="#64748b" font-weight="600">16.9万</text>
    <!-- 鳥取 16.0万 -->
    <text x="160" y="366" text-anchor="end" fill="#64748b" font-weight="600">45. 鳥取県</text>
    <rect x="170" y="354" width="11" height="20" fill="#ea580c" rx="2"/>
    <text x="187" y="369" font-size="12" fill="#64748b" font-weight="600">16.0万</text>
    <!-- 山梨 11.1万 -->
    <text x="160" y="402" text-anchor="end" fill="#64748b" font-weight="600">46. 山梨県</text>
    <rect x="170" y="390" width="8" height="20" fill="#ea580c" rx="2"/>
    <text x="184" y="405" font-size="12" fill="#64748b" font-weight="600">11.1万</text>
    <!-- 奈良 4.9万 -->
    <text x="160" y="438" text-anchor="end" fill="#64748b" font-weight="600">47. 奈良県</text>
    <rect x="170" y="426" width="4" height="20" fill="#ea580c" rx="2"/>
    <text x="180" y="441" font-size="12" fill="#64748b" font-weight="600">4.9万</text>
  </g>

  <text x="20" y="470" font-size="11" fill="#94a3b8">出典: e-Stat 社会・人口統計体系（2015年度）／棒の長さは万m3/日。上位と下位はスケールが大きく異なります</text>
</svg>
