<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="sans-serif" role="img" aria-label="主要職種の平均年収比較（2023年）上位5職種と下位5職種">
  <title>主要職種の平均年収比較（2023年）— 上位5職種・下位5職種</title>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#64748b">主要職種の平均年収比較（2023年・万円）</text>
  <text x="20" y="50" font-size="12" fill="#94a3b8">上位5職種（青）と下位5職種（橙）。ソフトウェア作成者を強調</text>

  <!-- value axis reference: max 1442.8 -> bar max width 470px starting at x=235 -->
  <!-- Top 5 (blue #2563eb) -->
  <!-- 医師 1442.8 -->
  <text x="225" y="84" font-size="13" text-anchor="end" fill="#475569">医師</text>
  <rect x="235" y="73" width="470" height="16" rx="2" fill="#2563eb"/>
  <text x="711" y="86" font-size="12" text-anchor="end" fill="#ffffff" font-weight="bold">1442.8</text>

  <!-- 大学教授 977.8 -->
  <text x="225" y="114" font-size="13" text-anchor="end" fill="#475569">大学教授</text>
  <rect x="235" y="103" width="319" height="16" rx="2" fill="#2563eb"/>
  <text x="560" y="116" font-size="12" text-anchor="start" fill="#2563eb">977.8</text>

  <!-- 大学准教授 811.7 -->
  <text x="225" y="144" font-size="13" text-anchor="end" fill="#475569">大学准教授</text>
  <rect x="235" y="133" width="264" height="16" rx="2" fill="#2563eb"/>
  <text x="505" y="146" font-size="12" text-anchor="start" fill="#2563eb">811.7</text>

  <!-- 研究者 670.2 -->
  <text x="225" y="174" font-size="13" text-anchor="end" fill="#475569">研究者</text>
  <rect x="235" y="163" width="218" height="16" rx="2" fill="#2563eb"/>
  <text x="459" y="176" font-size="12" text-anchor="start" fill="#2563eb">670.2</text>

  <!-- 高校教員 614.9 -->
  <text x="225" y="204" font-size="13" text-anchor="end" fill="#475569">高校教員</text>
  <rect x="235" y="193" width="200" height="16" rx="2" fill="#2563eb"/>
  <text x="441" y="206" font-size="12" text-anchor="start" fill="#2563eb">614.9</text>

  <!-- separator -->
  <line x1="20" y1="228" x2="740" y2="228" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="20" y="246" font-size="11" fill="#94a3b8">…（中位職種は省略）…</text>

  <!-- Bottom 5 (orange #ea580c) -->
  <!-- 建築技術者 559.3 -->
  <text x="225" y="276" font-size="13" text-anchor="end" fill="#475569">建築技術者</text>
  <rect x="235" y="265" width="182" height="16" rx="2" fill="#ea580c"/>
  <text x="423" y="278" font-size="12" text-anchor="start" fill="#ea580c">559.3</text>

  <!-- 電気工 539.5 -->
  <text x="225" y="306" font-size="13" text-anchor="end" fill="#475569">電気工</text>
  <rect x="235" y="295" width="176" height="16" rx="2" fill="#ea580c"/>
  <text x="417" y="308" font-size="12" text-anchor="start" fill="#ea580c">539.5</text>

  <!-- ソフトウェア作成者 507.9 (highlight) -->
  <text x="225" y="336" font-size="13" text-anchor="end" fill="#0f172a" font-weight="bold">ソフトウェア作成者</text>
  <rect x="235" y="325" width="165" height="16" rx="2" fill="#c2410c" stroke="#7c2d12" stroke-width="1.5"/>
  <text x="406" y="338" font-size="12" text-anchor="start" fill="#c2410c" font-weight="bold">507.9</text>

  <!-- 看護師 499.3 -->
  <text x="225" y="366" font-size="13" text-anchor="end" fill="#475569">看護師</text>
  <rect x="235" y="355" width="163" height="16" rx="2" fill="#ea580c"/>
  <text x="404" y="368" font-size="12" text-anchor="start" fill="#ea580c">499.3</text>

  <!-- トラック運転手 467.8 -->
  <text x="225" y="396" font-size="13" text-anchor="end" fill="#475569">トラック運転手</text>
  <rect x="235" y="385" width="152" height="16" rx="2" fill="#ea580c"/>
  <text x="393" y="398" font-size="12" text-anchor="start" fill="#ea580c">467.8</text>

  <text x="20" y="438" font-size="11" fill="#94a3b8">出典: 厚生労働省「賃金構造基本統計調査」2023年（全国平均・推計値）</text>
</svg>
