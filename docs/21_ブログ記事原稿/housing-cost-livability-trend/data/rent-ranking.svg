  <rect x="150" y="246" width="133" height="14" fill="#fb923c"/>
  <text x="289" y="257" font-size="10" fill="#1e293b">3,601円</text>
  <!-- 45 大分県 3587 → 133px -->
  <text x="142" y="278" text-anchor="end" font-size="11" fill="#1e293b">大分県</text>
  <rect x="150" y="268" width="133" height="14" fill="#f97316"/>
  <text x="289" y="279" font-size="10" fill="#1e293b">3,587円</text>
