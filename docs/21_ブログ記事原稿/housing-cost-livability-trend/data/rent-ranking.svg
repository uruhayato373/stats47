  <text x="142" y="162" text-anchor="end" font-size="11" fill="#1e293b">埼玉県</text>
  <rect x="150" y="152" width="216" height="14" fill="#3b82f6"/>
  <text x="372" y="163" font-size="10" fill="#1e293b">5,837円</text>

  <text x="200" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#ea580c">下位5県（安い）</text>

  <!-- BOTTOM 5 (orange) -->
  <!-- 43 徳島県 3665 → 135px -->
  <text x="142" y="234" text-anchor="end" font-size="11" fill="#1e293b">徳島県</text>
  <rect x="150" y="224" width="135" height="14" fill="#fb923c"/>
  <text x="291" y="235" font-size="10" fill="#1e293b">3,665円</text>
