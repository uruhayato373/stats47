  <text x="283" y="323" font-size="10" fill="#1e293b">3,442円</text>

  <text x="320" y="360" text-anchor="middle" font-size="11" fill="#475569">1位 東京都は最下位 和歌山県の約2.8倍（9,736円 vs 3,442円）</text>
  <text x="320" y="378" text-anchor="middle" font-size="10" fill="#64748b">7位 宮城県 5,267円が8位 愛知県 5,229円を上回る</text>
  <text x="320" y="424" text-anchor="middle" font-size="10" fill="#94a3b8">出典: 総務省「住宅・土地統計調査」e-Stat 社会・人口統計体系（2024年）</text>
