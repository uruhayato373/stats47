<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" aria-label="民営賃貸住宅家賃 上位5・下位5（3.3m2当たり円、2024年）">
  <title>民営賃貸住宅家賃 上位5・下位5（3.3m2当たり円、2024年）</title>
  <text x="320" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">民営賃貸住宅家賃 上位5・下位5（3.3m2当たり円・2024年）</text>
  <text x="200" y="50" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563eb">上位5県（高い）</text>

  <!-- Scale: max value 9736 → bar max width 360px from x=150. px/yen = 360/9736 = 0.03697 -->
  <!-- TOP 5 (blue) -->
  <!-- 1 東京都 9736 -->
  <text x="142" y="74" text-anchor="end" font-size="11" fill="#1e293b">東京都</text>
  <rect x="150" y="64" width="360" height="14" fill="#2563eb"/>
  <text x="516" y="75" font-size="10" fill="#1e293b">9,736円</text>
  <!-- 2 神奈川県 6670 → 247px -->
  <text x="142" y="96" text-anchor="end" font-size="11" fill="#1e293b">神奈川県</text>
  <rect x="150" y="86" width="247" height="14" fill="#3b82f6"/>
  <text x="403" y="97" font-size="10" fill="#1e293b">6,670円</text>
  <!-- 3 大阪府 6182 → 229px -->
  <text x="142" y="118" text-anchor="end" font-size="11" fill="#1e293b">大阪府</text>
  <rect x="150" y="108" width="229" height="14" fill="#3b82f6"/>
  <text x="385" y="119" font-size="10" fill="#1e293b">6,182円</text>
  <!-- 4 京都府 5962 → 220px -->
  <text x="142" y="140" text-anchor="end" font-size="11" fill="#1e293b">京都府</text>
  <rect x="150" y="130" width="220" height="14" fill="#3b82f6"/>
  <text x="376" y="141" font-size="10" fill="#1e293b">5,962円</text>
