<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" font-family="system-ui, -apple-system, 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif" role="img" aria-label="月間平均実労働時間（男性）上位5・下位5 都道府県（2024年）">
  <title>月間平均実労働時間（男性）上位5・下位5 都道府県（2024年）</title>
  <desc>上位は群馬180時間・青森179・福井179・岐阜179・兵庫179。下位は東京170・秋田172・沖縄172・徳島173・山形173。最長と最短の差は10時間。</desc>
  <style>
    .svg-bg{fill:#fafafa}
    .svg-title{fill:#1e293b}
    .svg-subtitle{fill:#64748b}
    .svg-label{fill:#334155}
    .svg-rank{fill:#94a3b8}
    .svg-legend{fill:#475569}
    .svg-foot{fill:#94a3b8}
    .svg-divider{stroke:#cbd5e1}
    @media (prefers-color-scheme:dark){
      .svg-bg{fill:#1f2937}
      .svg-title{fill:#f9fafb}
      .svg-subtitle{fill:#9ca3af}
      .svg-label{fill:#e5e7eb}
      .svg-rank{fill:#9ca3af}
      .svg-legend{fill:#d1d5db}
      .svg-foot{fill:#9ca3af}
      .svg-divider{stroke:#4b5563}
    }
  </style>

  <rect width="720" height="520" class="svg-bg" rx="8"/>

  <!-- 値はすべて2024年・男性・月間平均実労働時間（時間）。バー長は168時間を基点にスケール -->
  <text x="24" y="34" font-size="19" font-weight="700" class="svg-title">月間平均実労働時間（男性）上位5・下位5（2024年）</text>
  <text x="24" y="56" font-size="13" class="svg-subtitle">単位：時間／月　最長 群馬180 ─ 最短 東京170（差10時間）</text>

  <!-- 凡例 -->
  <rect x="500" y="24" width="14" height="14" fill="#2563eb"/>
  <text x="520" y="36" font-size="12" class="svg-legend">長い（上位5）</text>
  <rect x="500" y="44" width="14" height="14" fill="#ea7317"/>
  <text x="520" y="56" font-size="12" class="svg-legend">短い（下位5）</text>

  <!-- スケール: x = 200 + (value-168) * 24px/時間。168→200, 180→488 -->
  <!-- 群馬 180 -->
  <text x="24" y="98" font-size="14" class="svg-label">群馬</text>
  <rect x="200" y="86" width="288" height="18" rx="2" fill="#2563eb"/>
  <text x="496" y="100" font-size="13" font-weight="600" fill="#3b82f6">180</text>
  <text x="76" y="98" font-size="11" class="svg-rank">1位</text>

  <!-- 青森 179 -->
  <text x="24" y="128" font-size="14" class="svg-label">青森</text>
  <rect x="200" y="116" width="264" height="18" rx="2" fill="#3b82f6"/>
  <text x="472" y="130" font-size="13" font-weight="600" fill="#3b82f6">179</text>
  <text x="76" y="128" font-size="11" class="svg-rank">2位</text>

  <!-- 福井 179 -->
  <text x="24" y="158" font-size="14" class="svg-label">福井</text>
  <rect x="200" y="146" width="264" height="18" rx="2" fill="#3b82f6"/>
  <text x="472" y="160" font-size="13" font-weight="600" fill="#3b82f6">179</text>
  <text x="76" y="158" font-size="11" class="svg-rank">2位</text>

  <!-- 岐阜 179 -->
  <text x="24" y="188" font-size="14" class="svg-label">岐阜</text>
  <rect x="200" y="176" width="264" height="18" rx="2" fill="#3b82f6"/>
  <text x="472" y="190" font-size="13" font-weight="600" fill="#3b82f6">179</text>
  <text x="76" y="188" font-size="11" class="svg-rank">2位</text>

  <!-- 兵庫 179 -->
  <text x="24" y="218" font-size="14" class="svg-label">兵庫</text>
  <rect x="200" y="206" width="264" height="18" rx="2" fill="#3b82f6"/>
  <text x="472" y="220" font-size="13" font-weight="600" fill="#3b82f6">179</text>
  <text x="76" y="218" font-size="11" class="svg-rank">2位</text>

  <!-- 区切り -->
  <line x1="24" y1="244" x2="696" y2="244" class="svg-divider" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="24" y="266" font-size="12" class="svg-foot">— 中位（24位 富山176時間）は省略・全47件はランキングへ —</text>

  <!-- 山形 173 -->
  <text x="24" y="306" font-size="14" class="svg-label">山形</text>
  <rect x="200" y="294" width="120" height="18" rx="2" fill="#f59e0b"/>
  <text x="328" y="308" font-size="13" font-weight="600" fill="#f59e0b">173</text>
  <text x="76" y="306" font-size="11" class="svg-rank">43位</text>

  <!-- 徳島 173 -->
  <text x="24" y="336" font-size="14" class="svg-label">徳島</text>
  <rect x="200" y="324" width="120" height="18" rx="2" fill="#f59e0b"/>
  <text x="328" y="338" font-size="13" font-weight="600" fill="#f59e0b">173</text>
  <text x="76" y="336" font-size="11" class="svg-rank">43位</text>

  <!-- 沖縄 172 -->
  <text x="24" y="366" font-size="14" class="svg-label">沖縄</text>
  <rect x="200" y="354" width="96" height="18" rx="2" fill="#ea7317"/>
  <text x="304" y="368" font-size="13" font-weight="600" fill="#f59e0b">172</text>
  <text x="76" y="366" font-size="11" class="svg-rank">45位</text>

  <!-- 秋田 172 -->
  <text x="24" y="396" font-size="14" class="svg-label">秋田</text>
  <rect x="200" y="384" width="96" height="18" rx="2" fill="#ea7317"/>
  <text x="304" y="398" font-size="13" font-weight="600" fill="#f59e0b">172</text>
  <text x="76" y="396" font-size="11" class="svg-rank">45位</text>

  <!-- 東京 170 -->
  <text x="24" y="426" font-size="14" class="svg-label">東京</text>
  <rect x="200" y="414" width="48" height="18" rx="2" fill="#dc6803"/>
  <text x="256" y="428" font-size="13" font-weight="600" fill="#f59e0b">170</text>
  <text x="76" y="426" font-size="11" class="svg-rank">47位</text>

  <text x="24" y="470" font-size="12" class="svg-foot">バー長は168時間を基点にした差分。全国平均は176時間。</text>
  <text x="24" y="490" font-size="11" class="svg-foot">出典：厚生労働省 e-Stat 統計データ（2024年）</text>
</svg>
