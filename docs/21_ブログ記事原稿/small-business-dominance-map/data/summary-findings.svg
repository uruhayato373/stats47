<svg width="960" height="390" viewBox="0 0 960 390" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" role="img" aria-label="この記事でわかったこと"><rect width="960" height="390" fill="#f9fafb"/><text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">この記事でわかったこと</text><rect x="60" y="60" width="840" height="64" fill="#ffffff"/><circle cx="100" cy="92" r="16" fill="#dc2626"/><text x="100" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1</text><text x="140" y="86" font-size="15" font-weight="bold" fill="#1f2937">和歌山県が零細事業所割合で全国1位</text><text x="140" y="108" font-size="13" fill="#4b5563">従業者1〜4人の事業所が全体の62.8%──47位の千葉県（53.4%）と9.4ポイントの差</text><rect x="60" y="124" width="840" height="64" fill="#f9fafb"/><circle cx="100" cy="156" r="16" fill="#ea580c"/><text x="100" y="162" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">2</text><text x="140" y="150" font-size="15" font-weight="bold" fill="#1f2937">零細事業所が多い県は中部・四国・近畿に集中</text><text x="140" y="172" font-size="13" fill="#4b5563">和歌山・山梨・徳島・長野・山形──地方の中小都市が上位を占め、大都市圏が下位に並ぶ</text><rect x="60" y="188" width="840" height="64" fill="#ffffff"/><circle cx="100" cy="220" r="16" fill="#0284c7"/><text x="100" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">3</text><text x="140" y="214" font-size="15" font-weight="bold" fill="#1f2937">東京都は大企業従業者割合29.1%で断トツ</text><text x="140" y="236" font-size="13" fill="#4b5563">2位の愛知県（19.3%）に10ポイント差──首都圏一極集中の構造が数値に現れる</text><rect x="60" y="252" width="840" height="64" fill="#f9fafb"/><circle cx="100" cy="284" r="16" fill="#7c3aed"/><text x="100" y="290" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">4</text><text x="140" y="278" font-size="15" font-weight="bold" fill="#1f2937">零細が多い県ほど大企業従業者は少ない</text><text x="140" y="300" font-size="13" fill="#4b5563">和歌山は零細従業者15.2%に対し大企業従業者5.0%──東京の真逆（7.5% vs 29.1%）</text><rect x="60" y="316" width="840" height="64" fill="#ffffff"/><circle cx="100" cy="348" r="16" fill="#059669"/><text x="100" y="354" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">5</text><text x="140" y="342" font-size="15" font-weight="bold" fill="#1f2937">岐阜県は第2次産業事業所比率が全国1位</text><text x="140" y="364" font-size="13" fill="#4b5563">製造業の24.1%が事業所を構成──第3次産業偏重の沖縄（88.3%）と好対照</text></svg>