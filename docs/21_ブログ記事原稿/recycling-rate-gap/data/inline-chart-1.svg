<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <rect width="640" height="300" fill="#f8fafc"/>
  <text x="320" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">リサイクル率 上位10・下位10（2023年）</text>
  <!-- 上位 -->
  <rect x="120" y="38" width="291" height="18" fill="#22c55e" rx="2"/>
  <text x="115" y="51" text-anchor="end" font-size="11" fill="#475569">岡山</text>
  <text x="417" y="51" font-size="11" fill="#1e293b">29.0%（1位）</text>
  <rect x="120" y="60" width="283" height="18" fill="#22c55e" rx="2" opacity=".88"/>
  <text x="115" y="73" text-anchor="end" font-size="11" fill="#475569">鳥取</text>
  <text x="409" y="73" font-size="11" fill="#1e293b">28.2%</text>
  <rect x="120" y="82" width="250" height="18" fill="#22c55e" rx="2" opacity=".8"/>
  <text x="115" y="95" text-anchor="end" font-size="11" fill="#475569">東京</text>
  <text x="376" y="95" font-size="11" fill="#1e293b">24.9%</text>
  <!-- 下位 -->
  <text x="320" y="158" text-anchor="middle" font-size="11" fill="#64748b">…</text>
  <rect x="120" y="166" width="130" height="18" fill="#f97316" rx="2" opacity=".65"/>
  <text x="115" y="179" text-anchor="end" font-size="11" fill="#475569">大阪・青森</text>
  <text x="256" y="179" font-size="11" fill="#1e293b">12.6%（45位タイ）</text>
  <rect x="120" y="188" width="120" height="18" fill="#f97316" rx="2" opacity=".6"/>
  <text x="115" y="201" text-anchor="end" font-size="11" fill="#475569">和歌山</text>
  <text x="246" y="201" font-size="11" fill="#1e293b">11.9%（最下位）</text>
  <!-- 差を示す -->
  <text x="120" y="240" font-size="11" fill="#475569">岡山（29.0%）と和歌山（11.9%）の差:</text>
  <text x="120" y="257" font-size="11" fill="#1e293b" font-weight="bold">→ 2.4倍のリサイクル率格差（分別品目・処理施設の整備差が主因）</text>
  <text x="320" y="290" text-anchor="middle" font-size="10" fill="#94a3b8">出典: e-Stat 社会生活統計指標 2023年</text>
</svg>