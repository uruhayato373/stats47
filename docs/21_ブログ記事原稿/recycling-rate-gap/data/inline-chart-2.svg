<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <rect width="640" height="300" fill="#f8fafc"/>
  <text x="320" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">最終処分場残余容量 下位10県（容量が少ない＝逼迫）（2023年）</text>
  <rect x="220" y="38" width="12" height="18" fill="#ef4444" rx="2"/>
  <text x="215" y="51" text-anchor="end" font-size="11" fill="#475569">徳島</text>
  <text x="238" y="51" font-size="11" fill="#1e293b">57,097 m3（最も逼迫）</text>
  <rect x="220" y="60" width="17" height="18" fill="#ef4444" rx="2" opacity=".85"/>
  <text x="215" y="73" text-anchor="end" font-size="11" fill="#475569">鳥取</text>
  <text x="243" y="73" font-size="11" fill="#1e293b">166,456 m3</text>
  <rect x="220" y="82" width="21" height="18" fill="#ef4444" rx="2" opacity=".8"/>
  <text x="215" y="95" text-anchor="end" font-size="11" fill="#475569">佐賀</text>
  <text x="247" y="95" font-size="11" fill="#1e293b">207,472 m3</text>
  <rect x="220" y="104" width="25" height="18" fill="#f97316" rx="2" opacity=".75"/>
  <text x="215" y="117" text-anchor="end" font-size="11" fill="#475569">島根</text>
  <text x="251" y="117" font-size="11" fill="#1e293b">約240,000 m3</text>
  <rect x="220" y="126" width="32" height="18" fill="#f97316" rx="2" opacity=".7"/>
  <text x="215" y="139" text-anchor="end" font-size="11" fill="#475569">香川</text>
  <text x="258" y="139" font-size="11" fill="#1e293b">約310,000 m3</text>
  <!-- 参考: 東京 -->
  <rect x="220" y="198" width="300" height="18" fill="#3b82f6" rx="2" opacity=".7"/>
  <text x="215" y="211" text-anchor="end" font-size="11" fill="#475569">東京（参考）</text>
  <text x="526" y="211" font-size="11" fill="#1e293b">21,770,620 m3</text>
  <text x="120" y="248" font-size="11" fill="#475569">※鳥取は2位のリサイクル率（28.2%）を誇りながら残余容量は全国46位</text>
  <text x="120" y="264" font-size="11" fill="#1e293b">→「高いリサイクル率」と「逼迫する処分場」が同時に存在するパラドックス</text>
  <text x="320" y="292" text-anchor="middle" font-size="10" fill="#94a3b8">出典: e-Stat 社会生活統計指標 2023年</text>
</svg>