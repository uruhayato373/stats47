  <text x="90" y="393.6" font-size="18" class="svg-title"><tspan x="90" dy="0">全国平均は1992年以降ほぼマイナス基調（2007-08</tspan><tspan x="90" dy="22">のミニバブルを除く）、2024年は+1.3%まで回復</tspan></text>
