  <text x="90" y="289.6" font-size="18" class="svg-title"><tspan x="90" dy="0">面積比率と変動率の相関はほぼゼロ（-0.08）。面積上位</tspan><tspan x="90" dy="22">の島根・鳥取・愛媛はマイナスで「広さ」は値上がりを保証し</tspan><tspan x="90" dy="22">ない</tspan></text>
