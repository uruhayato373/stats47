  <text x="90" y="103.6" font-size="18" class="svg-title"><tspan x="90" dy="0">商業地変動率1位は東京+8.4%、最下位は徳島-1.4%</tspan><tspan x="90" dy="22">。47都道府県で28県がプラス・17県がマイナス・2県が</tspan><tspan x="90" dy="22">横ばい</tspan></text>
