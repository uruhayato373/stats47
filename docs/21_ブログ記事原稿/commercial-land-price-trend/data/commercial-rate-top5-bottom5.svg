<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 392" width="680" height="392" font-family="system-ui,sans-serif">
  <title>商業地 標準価格対前年平均変動率 上位5・下位5（2024年度）</title>
  <text x="340" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155" font-family="system-ui,sans-serif">商業地 変動率 上位5・下位5（2024年度・単位%）</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#64748b" font-family="system-ui,sans-serif">青=上昇（上位5） / 橙=下落（下位5）</text>
    <line x1="160.3" y1="52" x2="160.3" y2="368" stroke="#94a3b8" stroke-width="1"/>
    <text x="160.3" y="384" text-anchor="middle" font-size="10" fill="#94a3b8" font-family="system-ui,sans-serif">0%</text>
    <text x="84" y="75" text-anchor="end" font-size="12" fill="#64748b" font-family="system-ui,sans-serif">東京</text>
    <rect x="160.3" y="60" width="409.7" height="18" fill="#2f6fd0" rx="2"/>
    <text x="576.0" y="75" text-anchor="start" font-size="11" fill="#475569" font-family="system-ui,sans-serif">+8.4%（1位）</text>
    <text x="84" y="105" text-anchor="end" font-size="12" fill="#64748b" font-family="system-ui,sans-serif">大阪</text>
    <rect x="160.3" y="90" width="356.0" height="18" fill="#2f6fd0" rx="2"/>
    <text x="522.3" y="105" text-anchor="start" font-size="11" fill="#475569" font-family="system-ui,sans-serif">+7.3%（2位）</text>
    <text x="84" y="135" text-anchor="end" font-size="12" fill="#64748b" font-family="system-ui,sans-serif">福岡</text>
    <rect x="160.3" y="120" width="326.8" height="18" fill="#2f6fd0" rx="2"/>
    <text x="493.1" y="135" text-anchor="start" font-size="11" fill="#475569" font-family="system-ui,sans-serif">+6.7%（3位）</text>
    <text x="84" y="165" text-anchor="end" font-size="12" fill="#64748b" font-family="system-ui,sans-serif">神奈川</text>
    <rect x="160.3" y="150" width="302.4" height="18" fill="#2f6fd0" rx="2"/>
    <text x="468.7" y="165" text-anchor="start" font-size="11" fill="#475569" font-family="system-ui,sans-serif">+6.2%（4位）</text>
    <text x="84" y="195" text-anchor="end" font-size="12" fill="#64748b" font-family="system-ui,sans-serif">沖縄</text>
    <rect x="160.3" y="180" width="297.5" height="18" fill="#2f6fd0" rx="2"/>
    <text x="463.8" y="195" text-anchor="start" font-size="11" fill="#475569" font-family="system-ui,sans-serif">+6.1%（5位）</text>
    <line x1="92" y1="208" x2="570" y2="208" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="84" y="237" text-anchor="end" font-size="12" fill="#64748b" font-family="system-ui,sans-serif">徳島</text>
    <rect x="92.0" y="222" width="68.3" height="18" fill="#e07b2c" rx="2"/>
    <text x="86.0" y="237" text-anchor="end" font-size="11" fill="#475569" font-family="system-ui,sans-serif">-1.4%（47位）</text>
    <text x="84" y="267" text-anchor="end" font-size="12" fill="#64748b" font-family="system-ui,sans-serif">岩手</text>
    <rect x="106.6" y="252" width="53.7" height="18" fill="#e07b2c" rx="2"/>
    <text x="100.6" y="267" text-anchor="end" font-size="11" fill="#475569" font-family="system-ui,sans-serif">-1.1%（46位）</text>
    <text x="84" y="297" text-anchor="end" font-size="12" fill="#64748b" font-family="system-ui,sans-serif">愛媛</text>
    <rect x="111.5" y="282" width="48.8" height="18" fill="#e07b2c" rx="2"/>
    <text x="105.5" y="297" text-anchor="end" font-size="11" fill="#475569" font-family="system-ui,sans-serif">-1%（44位）</text>
    <text x="84" y="327" text-anchor="end" font-size="12" fill="#64748b" font-family="system-ui,sans-serif">鳥取</text>
    <rect x="116.4" y="312" width="43.9" height="18" fill="#e07b2c" rx="2"/>
    <text x="110.4" y="327" text-anchor="end" font-size="11" fill="#475569" font-family="system-ui,sans-serif">-0.9%（42位）</text>
    <text x="84" y="357" text-anchor="end" font-size="12" fill="#64748b" font-family="system-ui,sans-serif">島根</text>
    <rect x="116.4" y="342" width="43.9" height="18" fill="#e07b2c" rx="2"/>
    <text x="110.4" y="357" text-anchor="end" font-size="11" fill="#475569" font-family="system-ui,sans-serif">-0.9%（42位）</text>
</svg>
