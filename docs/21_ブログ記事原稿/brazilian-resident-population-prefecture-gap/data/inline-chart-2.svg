<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img" aria-label="チェーンマイグレーションの自己強化ループ">
  <rect width="100%" height="100%" fill="#f8fafc" rx="6"/>
  <text x="360" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">チェーンマイグレーションの自己強化ループ</text>
  <rect x="50" y="40" width="160" height="50" fill="#dbeafe" rx="6"/>
  <text x="130" y="62" text-anchor="middle" font-size="11" fill="#1d4ed8">製造業による</text>
  <text x="130" y="78" text-anchor="middle" font-size="11" fill="#1d4ed8">初期雇用（1990年〜）</text>
  <rect x="280" y="40" width="160" height="50" fill="#d1fae5" rx="6"/>
  <text x="360" y="62" text-anchor="middle" font-size="11" fill="#065f46">生活インフラ整備</text>
  <text x="360" y="78" text-anchor="middle" font-size="11" fill="#065f46">（学校・商店・教会）</text>
  <rect x="510" y="40" width="160" height="50" fill="#fef3c7" rx="6"/>
  <text x="590" y="62" text-anchor="middle" font-size="11" fill="#92400e">後続移住者の</text>
  <text x="590" y="78" text-anchor="middle" font-size="11" fill="#92400e">同地域選択</text>
  <line x1="210" y1="65" x2="280" y2="65" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="440" y1="65" x2="510" y2="65" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M 670 90 Q 670 145 360 150 Q 50 145 50 90" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5"/>
  <text x="360" y="168" text-anchor="middle" font-size="10" fill="#64748b">集中が続くからコミュニティが充実し、充実するから集中が続く</text>
</svg>