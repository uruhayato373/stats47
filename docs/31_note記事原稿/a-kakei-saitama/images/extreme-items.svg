  <text x="551" y="213.04" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#1f2937">外壁・塀等工事費</text>
  <text x="712.64" y="212.68" text-anchor="end" font-family="'Noto Sans JP', sans-serif" font-size="13" fill="#b71c1c" font-weight="600">0.01倍</text>
