  <rect x="498" y="236" width="432" height="56" rx="6" fill="#fef2f2"/>
  <circle cx="526" cy="264" r="17" fill="#b71c1c"/>  <text x="526" y="269.04" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">3</text>
  <text x="551" y="269.04" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#1f2937">自動車保険料以外の輸送機器保険料</text>
