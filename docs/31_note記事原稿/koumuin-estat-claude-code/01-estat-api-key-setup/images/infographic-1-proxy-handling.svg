<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<style>
  text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif; }
  .mono { font-family: 'SF Mono', Menlo, Consolas, monospace; }
</style>

<rect width="1200" height="600" fill="#fafafa"/>

<text x="600" y="50" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e293b">庁内プロキシ環境での HTTPS リクエストの流れ</text>
<line x1="430" y1="68" x2="770" y2="68" stroke="#0891b2" stroke-width="3" stroke-linecap="round"/>

<!-- 庁内 PC -->
<g transform="translate(80, 180)">
  <rect width="200" height="160" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <rect x="0" y="0" width="200" height="40" rx="12" fill="#0891b2"/>
  <text x="100" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">庁内 PC</text>
  <text x="100" y="70" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Claude Code 実行</text>
  <text x="100" y="95" text-anchor="middle" font-size="12" fill="#475569" class="mono">undici.ProxyAgent</text>
  <text x="100" y="120" text-anchor="middle" font-size="11" fill="#64748b">HTTPS_PROXY を自動検出</text>
  <text x="100" y="140" text-anchor="middle" font-size="11" fill="#64748b">packages/estat-api 経由</text>
</g>

<!-- Arrow 1 -->
<path d="M 290 260 L 360 260" stroke="#0891b2" stroke-width="3" fill="none" marker-end="url(#a3)"/>
<text x="325" y="248" text-anchor="middle" font-size="11" font-weight="600" fill="#0891b2">HTTPS</text>

<!-- プロキシ -->
<g transform="translate(370, 180)">
  <rect width="200" height="160" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <rect x="0" y="0" width="200" height="40" rx="12" fill="#f59e0b"/>
  <text x="100" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">庁内プロキシ</text>
  <text x="100" y="70" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">proxy.gov.local:8080</text>
  <text x="100" y="100" text-anchor="middle" font-size="11" fill="#92400e">SSL インスペクション</text>
  <text x="100" y="118" text-anchor="middle" font-size="11" fill="#92400e">許可ドメインのみ通過</text>
  <text x="100" y="142" text-anchor="middle" font-size="10" fill="#64748b">IT 部門が運用</text>
</g>

<!-- Arrow 2 -->
<path d="M 580 260 L 650 260" stroke="#0891b2" stroke-width="3" fill="none" marker-end="url(#a3)"/>
<text x="615" y="248" text-anchor="middle" font-size="11" font-weight="600" fill="#0891b2">HTTPS</text>

<!-- e-Stat -->
<g transform="translate(660, 180)">
  <rect width="200" height="160" rx="12" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
  <rect x="0" y="0" width="200" height="40" rx="12" fill="#0891b2"/>
  <text x="100" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">e-Stat API</text>
  <text x="100" y="70" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" class="mono">api.e-stat.go.jp</text>
  <text x="100" y="100" text-anchor="middle" font-size="11" fill="#475569">政府統計の総合窓口</text>
  <text x="100" y="120" text-anchor="middle" font-size="11" fill="#475569">総務省 統計局</text>
  <text x="100" y="142" text-anchor="middle" font-size="10" fill="#64748b">60 req/min レート制限</text>
</g>

<!-- Arrow 3 (return) -->
<path d="M 760 350 Q 760 420, 380 420 Q 100 420, 180 350" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#a4)" stroke-dasharray="6,4"/>
<text x="600" y="445" text-anchor="middle" font-size="12" font-weight="600" fill="#10b981">JSON レスポンス (47 都道府県データ等)</text>

<!-- Code snippet -->
<g transform="translate(880, 180)">
  <rect width="280" height="240" rx="12" fill="#1e293b"/>
  <text x="20" y="32" font-size="12" font-weight="700" fill="#10b981" class="mono"># .env.local</text>
  <text x="20" y="58" font-size="11" fill="#fafafa" class="mono">NEXT_PUBLIC_ESTAT_APP_ID=...</text>
  <text x="20" y="80" font-size="11" fill="#fafafa" class="mono">HTTPS_PROXY=http://...</text>
  <text x="20" y="115" font-size="12" font-weight="700" fill="#10b981" class="mono"># コード側 (自動適用)</text>
  <text x="20" y="138" font-size="10" fill="#fafafa" class="mono">import { ProxyAgent }</text>
  <text x="20" y="155" font-size="10" fill="#fafafa" class="mono">  from "undici";</text>
  <text x="20" y="180" font-size="10" fill="#fafafa" class="mono">const proxy = process.env</text>
  <text x="20" y="195" font-size="10" fill="#fafafa" class="mono">  .HTTPS_PROXY;</text>
  <text x="20" y="220" font-size="10" fill="#fafafa" class="mono">fetch(url, { dispatcher:</text>
  <text x="20" y="235" font-size="10" fill="#fafafa" class="mono">  new ProxyAgent(proxy) });</text>
</g>

<!-- Bottom guidance -->
<rect x="80" y="490" width="1040" height="80" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
<text x="600" y="520" text-anchor="middle" font-size="14" font-weight="700" fill="#7c3aed">CLAUDE.md 規約: packages/estat-api は HTTPS_PROXY を自動検出するためコード変更不要</text>
<text x="600" y="545" text-anchor="middle" font-size="12" fill="#475569">macOS / Windows 共通。プロキシ未設定の自宅 PC では undici は素通し。</text>
<text x="600" y="563" text-anchor="middle" font-size="11" fill="#64748b">出典: 政府統計の総合窓口 (e-Stat) API 仕様 / CLAUDE.md (.claude/rules/local-environment.md)</text>

<defs>
  <marker id="a3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#0891b2"/>
  </marker>
  <marker id="a4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#10b981"/>
  </marker>
</defs>
</svg>
