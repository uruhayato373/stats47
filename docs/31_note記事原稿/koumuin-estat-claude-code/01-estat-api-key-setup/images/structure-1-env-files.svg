<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<style>
  text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif; }
  .mono { font-family: 'SF Mono', Menlo, Consolas, monospace; }
</style>

<rect width="1200" height="600" fill="#fafafa"/>

<text x="600" y="50" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e293b">.env / .env.local の優先順位とファイル配置</text>
<line x1="430" y1="68" x2="770" y2="68" stroke="#0891b2" stroke-width="3" stroke-linecap="round"/>

<!-- Project root tree -->
<g transform="translate(60, 110)">
  <rect width="380" height="440" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="0" y="0" width="380" height="40" rx="12" fill="#1e293b"/>
  <text x="20" y="26" font-size="14" font-weight="700" fill="#ffffff" class="mono">📁 プロジェクトルート</text>

  <text x="20" y="80" font-size="14" fill="#475569" class="mono">stats47-project/</text>
  <text x="40" y="108" font-size="13" fill="#94a3b8" class="mono">├─ .env</text>
  <text x="40" y="130" font-size="11" fill="#94a3b8" class="mono">│   (共通の既定値・Git管理OK)</text>
  <text x="40" y="158" font-size="13" font-weight="700" fill="#0891b2" class="mono">├─ .env.local ← 個人設定</text>
  <text x="40" y="180" font-size="11" font-weight="600" fill="#0891b2" class="mono">│   .gitignore 済み・APIキー格納</text>
  <text x="40" y="208" font-size="13" fill="#94a3b8" class="mono">├─ .env.production</text>
  <text x="40" y="230" font-size="11" fill="#94a3b8" class="mono">│   (デプロイ環境用)</text>
  <text x="40" y="258" font-size="13" fill="#475569" class="mono">├─ apps/</text>
  <text x="40" y="280" font-size="13" fill="#475569" class="mono">│   └─ web/</text>
  <text x="40" y="302" font-size="13" fill="#475569" class="mono">├─ packages/</text>
  <text x="40" y="324" font-size="13" fill="#475569" class="mono">├─ .gitignore</text>
  <text x="40" y="346" font-size="13" fill="#475569" class="mono">└─ package.json</text>

  <rect x="20" y="370" width="340" height="50" rx="8" fill="#fef3c7"/>
  <text x="190" y="392" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">⚠️ .env.local は絶対に Git に上げない</text>
  <text x="190" y="410" text-anchor="middle" font-size="11" fill="#92400e">.gitignore に必ず .env.local を追加</text>
</g>

<!-- Priority order -->
<g transform="translate(500, 110)">
  <rect width="640" height="440" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="0" y="0" width="640" height="40" rx="12" fill="#0891b2"/>
  <text x="20" y="26" font-size="14" font-weight="700" fill="#ffffff">読み込み優先順位 (上が強い)</text>

  <!-- Tier 1 -->
  <g transform="translate(20, 60)">
    <rect width="600" height="60" rx="8" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
    <text x="20" y="28" font-size="13" font-weight="700" fill="#0891b2">1. .env.local</text>
    <text x="20" y="48" font-size="12" fill="#1e293b">個人開発端末固有。APIキーはここに置く。Git管理外。</text>
  </g>

  <!-- Tier 2 -->
  <g transform="translate(20, 130)">
    <rect width="600" height="60" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
    <text x="20" y="28" font-size="13" font-weight="700" fill="#7c3aed">2. .env.production / .env.development</text>
    <text x="20" y="48" font-size="12" fill="#1e293b">環境別の上書き。庁内ではほぼ使わない (個人端末は development)。</text>
  </g>

  <!-- Tier 3 -->
  <g transform="translate(20, 200)">
    <rect width="600" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="20" y="28" font-size="13" font-weight="700" fill="#475569">3. .env</text>
    <text x="20" y="48" font-size="12" fill="#1e293b">プロジェクト共通の既定値。Gitに含めてもよい (公開可能な値のみ)。</text>
  </g>

  <!-- Variable -->
  <g transform="translate(20, 280)">
    <rect width="600" height="140" rx="8" fill="#1e293b"/>
    <text x="300" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#10b981" class="mono"># .env.local の中身</text>
    <text x="20" y="62" font-size="13" fill="#fafafa" class="mono">NEXT_PUBLIC_ESTAT_APP_ID=xxxxxxxxxx</text>
    <text x="20" y="86" font-size="12" fill="#94a3b8" class="mono"># 庁内ネットワーク用 (任意)</text>
    <text x="20" y="108" font-size="13" fill="#fafafa" class="mono">HTTPS_PROXY=http://proxy.gov.local:8080</text>
    <text x="20" y="130" font-size="13" fill="#fafafa" class="mono">HTTP_PROXY=http://proxy.gov.local:8080</text>
  </g>
</g>
</svg>
