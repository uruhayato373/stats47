<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360">
<style>
  text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif; }
</style>

<rect width="1200" height="360" fill="#fafafa"/>

<text x="600" y="48" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">e-Stat API キー発行から動作確認までのフロー</text>
<line x1="430" y1="64" x2="770" y2="64" stroke="#0891b2" stroke-width="3" stroke-linecap="round"/>

<!-- Step 1 -->
<g transform="translate(40, 130)">
  <rect width="200" height="80" rx="8" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <text x="100" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#0891b2">STEP 1</text>
  <text x="100" y="55" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">e-Stat マイページ</text>
  <text x="100" y="73" text-anchor="middle" font-size="11" fill="#64748b">アカウント登録 (無料)</text>
</g>

<path d="M 245 170 L 285 170" stroke="#0891b2" stroke-width="2" fill="none" marker-end="url(#a1)"/>

<!-- Step 2 -->
<g transform="translate(290, 130)">
  <rect width="200" height="80" rx="8" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <text x="100" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#0891b2">STEP 2</text>
  <text x="100" y="55" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">アプリ登録</text>
  <text x="100" y="73" text-anchor="middle" font-size="11" fill="#64748b">名称・URL 入力 (即時)</text>
</g>

<path d="M 495 170 L 535 170" stroke="#0891b2" stroke-width="2" fill="none" marker-end="url(#a1)"/>

<!-- Step 3 -->
<g transform="translate(540, 130)">
  <rect width="200" height="80" rx="8" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
  <text x="100" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#0891b2">STEP 3</text>
  <text x="100" y="55" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">appId 発行</text>
  <text x="100" y="73" text-anchor="middle" font-size="11" fill="#64748b">利用申請不要・即時</text>
</g>

<path d="M 745 170 L 785 170" stroke="#0891b2" stroke-width="2" fill="none" marker-end="url(#a1)"/>

<!-- Step 4 -->
<g transform="translate(790, 130)">
  <rect width="200" height="80" rx="8" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <text x="100" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#0891b2">STEP 4</text>
  <text x="100" y="55" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">.env.local に設定</text>
  <text x="100" y="73" text-anchor="middle" font-size="11" fill="#64748b">NEXT_PUBLIC_ESTAT_APP_ID</text>
</g>

<!-- Step 5: 下に配置 -->
<g transform="translate(540, 250)">
  <rect width="450" height="60" rx="8" fill="#10b981"/>
  <text x="225" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">STEP 5</text>
  <text x="225" y="48" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">curl で動作確認 → JSON 返却で完了 (所要 30 分)</text>
</g>

<path d="M 890 215 L 890 245" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#a2)"/>

<defs>
  <marker id="a1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#0891b2"/>
  </marker>
  <marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#10b981"/>
  </marker>
</defs>
</svg>
