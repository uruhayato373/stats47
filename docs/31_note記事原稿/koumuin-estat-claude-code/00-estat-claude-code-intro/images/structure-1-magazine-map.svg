<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<style>
  text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif; }
</style>

<rect width="1200" height="600" fill="#fafafa"/>

<text x="600" y="50" text-anchor="middle" font-size="26" font-weight="bold" fill="#1e293b">マガジン全 12 本の地図</text>
<line x1="450" y1="68" x2="750" y2="68" stroke="#0891b2" stroke-width="3" stroke-linecap="round"/>

<!-- Stage 1: 入口 -->
<g transform="translate(40, 110)">
  <rect width="180" height="60" rx="8" fill="#0891b2"/>
  <text x="90" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">入口 (intro)</text>
  <text x="90" y="52" text-anchor="middle" font-size="12" fill="#cffafe">#00</text>
</g>

<!-- Arrow 1 -->
<path d="M 230 140 L 270 140" stroke="#0891b2" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

<!-- Stage 2: 環境構築 -->
<g transform="translate(280, 110)">
  <rect width="180" height="60" rx="8" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <text x="90" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#0891b2">環境構築 (setup)</text>
  <text x="90" y="50" text-anchor="middle" font-size="12" fill="#64748b">#01 ¥300</text>
</g>

<path d="M 470 140 L 510 140" stroke="#0891b2" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

<!-- Stage 3: 検索 → 取得 -->
<g transform="translate(520, 110)">
  <rect width="180" height="60" rx="8" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <text x="90" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#0891b2">検索 (search)</text>
  <text x="90" y="50" text-anchor="middle" font-size="12" fill="#64748b">#02 ¥300</text>
</g>

<path d="M 710 140 L 750 140" stroke="#0891b2" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

<g transform="translate(760, 110)">
  <rect width="180" height="60" rx="8" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <text x="90" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#10b981">取得 (fetch)</text>
  <text x="90" y="50" text-anchor="middle" font-size="12" fill="#64748b">#03 無料</text>
</g>

<!-- Stage 4: 分析 4 本 -->
<text x="80" y="220" font-size="14" font-weight="700" fill="#475569">分析編 (4 本)</text>
<line x1="40" y1="232" x2="180" y2="232" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>

<g transform="translate(40, 250)">
  <rect width="270" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="135" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">#04 Excel ダウンロード解析</text>
  <text x="135" y="46" text-anchor="middle" font-size="11" fill="#64748b">excel | ¥300 | 統計担当向け</text>
</g>

<g transform="translate(330, 250)">
  <rect width="270" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="135" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">#05 派生指標 (pandas/duckdb)</text>
  <text x="135" y="46" text-anchor="middle" font-size="11" fill="#64748b">analysis | ¥300 | 統計担当</text>
</g>

<g transform="translate(620, 250)">
  <rect width="270" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="135" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">#06 都道府県コードマージ</text>
  <text x="135" y="46" text-anchor="middle" font-size="11" fill="#64748b">analysis | ¥300 | 統計担当</text>
</g>

<g transform="translate(910, 250)">
  <rect width="250" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="125" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">#07 前年比 / 経年差分</text>
  <text x="125" y="46" text-anchor="middle" font-size="11" fill="#64748b">analysis | ¥300 | 財政課</text>
</g>

<!-- Stage 5: 出力 -->
<text x="80" y="345" font-size="14" font-weight="700" fill="#475569">出力編 (2 本)</text>
<line x1="40" y1="357" x2="180" y2="357" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>

<g transform="translate(40, 375)">
  <rect width="270" height="56" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1"/>
  <text x="135" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#10b981">#08 ベンチマーク表 5 分作成</text>
  <text x="135" y="46" text-anchor="middle" font-size="11" fill="#64748b">output | 無料 | 議会事務局</text>
</g>

<g transform="translate(330, 375)">
  <rect width="270" height="56" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1"/>
  <text x="135" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#10b981">#09 議会向けチャート生成</text>
  <text x="135" y="46" text-anchor="middle" font-size="11" fill="#64748b">output | ¥300 | 議会事務局</text>
</g>

<!-- Stage 6: 運用 -->
<text x="80" y="470" font-size="14" font-weight="700" fill="#475569">運用編 (2 本)</text>
<line x1="40" y1="482" x2="180" y2="482" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>

<g transform="translate(40, 500)">
  <rect width="270" height="56" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="135" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">#10 Claude Skills でルーチン化</text>
  <text x="135" y="46" text-anchor="middle" font-size="11" fill="#64748b">skills | ¥300 | 情報システム</text>
</g>

<g transform="translate(330, 500)">
  <rect width="270" height="56" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="135" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">#11 MCP sqlite で社内検索</text>
  <text x="135" y="46" text-anchor="middle" font-size="11" fill="#64748b">mcp | ¥300 | 情報システム</text>
</g>

<text x="1160" y="555" text-anchor="end" font-size="11" fill="#94a3b8">★ 無料 = #00 / #03 / #08</text>

<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#0891b2"/>
  </marker>
</defs>
</svg>
