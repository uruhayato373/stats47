<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360">
<style>
  text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif; }
</style>

<rect width="1200" height="360" fill="#fafafa"/>
<text x="600" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">fetch-estat-data パイプライン</text>
<text x="600" y="78" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b">2 つのパラメータ → 整形済みランキング JSON</text>

<!-- Box 1: input -->
<rect x="40" y="130" width="220" height="100" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
<text x="150" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#0891b2">INPUT</text>
<text x="150" y="188" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">statsDataId</text>
<text x="150" y="210" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">cdCat01</text>

<!-- Arrow -->
<line x1="270" y1="180" x2="320" y2="180" stroke="#0891b2" stroke-width="2"/>
<polygon points="320,175 332,180 320,185" fill="#0891b2"/>

<!-- Box 2: fetch -->
<rect x="340" y="130" width="220" height="100" rx="10" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
<text x="450" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#0891b2">FETCH</text>
<text x="450" y="188" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">e-Stat API</text>
<text x="450" y="210" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b">getStatsData</text>

<!-- Arrow -->
<line x1="570" y1="180" x2="620" y2="180" stroke="#0891b2" stroke-width="2"/>
<polygon points="620,175 632,180 620,185" fill="#0891b2"/>

<!-- Box 3: transform -->
<rect x="640" y="130" width="220" height="100" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
<text x="750" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#0891b2">TRANSFORM</text>
<text x="750" y="188" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">47 県フィルタ</text>
<text x="750" y="210" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b">同値タイランク付与</text>

<!-- Arrow -->
<line x1="870" y1="180" x2="920" y2="180" stroke="#0891b2" stroke-width="2"/>
<polygon points="920,175 932,180 920,185" fill="#0891b2"/>

<!-- Box 4: output -->
<rect x="940" y="130" width="220" height="100" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
<text x="1050" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#10b981">OUTPUT</text>
<text x="1050" y="188" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">ランキング JSON</text>
<text x="1050" y="210" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b">47 県 × value × rank</text>

<!-- Bottom note -->
<text x="600" y="290" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Web 画面で 47 県を 1 つずつ落とす運用 (半日) → API 経由 (30 秒)</text>
<text x="600" y="315" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b">出典: 政府統計の総合窓口 (e-Stat)</text>
</svg>
