<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<style>
  text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif; }
</style>

<rect width="1200" height="600" fill="#fafafa"/>
<text x="600" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Web で 47 回 vs API で 1 回</text>
<text x="600" y="78" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b">47 都道府県のデータ収集にかかる時間</text>

<!-- Left: Web -->
<rect x="60" y="120" width="520" height="420" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
<text x="320" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#f59e0b">従来: Web 画面でダウンロード</text>

<!-- Grid 47 dots -->
<g fill="#fed7aa" stroke="#f59e0b" stroke-width="1">
<circle cx="120" cy="220" r="14"/><circle cx="170" cy="220" r="14"/><circle cx="220" cy="220" r="14"/>
<circle cx="270" cy="220" r="14"/><circle cx="320" cy="220" r="14"/><circle cx="370" cy="220" r="14"/>
<circle cx="420" cy="220" r="14"/><circle cx="470" cy="220" r="14"/><circle cx="520" cy="220" r="14"/>
<circle cx="120" cy="260" r="14"/><circle cx="170" cy="260" r="14"/><circle cx="220" cy="260" r="14"/>
<circle cx="270" cy="260" r="14"/><circle cx="320" cy="260" r="14"/><circle cx="370" cy="260" r="14"/>
<circle cx="420" cy="260" r="14"/><circle cx="470" cy="260" r="14"/><circle cx="520" cy="260" r="14"/>
<circle cx="120" cy="300" r="14"/><circle cx="170" cy="300" r="14"/><circle cx="220" cy="300" r="14"/>
<circle cx="270" cy="300" r="14"/><circle cx="320" cy="300" r="14"/><circle cx="370" cy="300" r="14"/>
<circle cx="420" cy="300" r="14"/><circle cx="470" cy="300" r="14"/><circle cx="520" cy="300" r="14"/>
<circle cx="120" cy="340" r="14"/><circle cx="170" cy="340" r="14"/><circle cx="220" cy="340" r="14"/>
<circle cx="270" cy="340" r="14"/><circle cx="320" cy="340" r="14"/><circle cx="370" cy="340" r="14"/>
<circle cx="420" cy="340" r="14"/><circle cx="470" cy="340" r="14"/><circle cx="520" cy="340" r="14"/>
<circle cx="120" cy="380" r="14"/><circle cx="170" cy="380" r="14"/><circle cx="220" cy="380" r="14"/>
<circle cx="270" cy="380" r="14"/><circle cx="320" cy="380" r="14"/><circle cx="370" cy="380" r="14"/>
<circle cx="420" cy="380" r="14"/><circle cx="470" cy="380" r="14"/><circle cx="520" cy="380" r="14"/>
<circle cx="120" cy="420" r="14"/><circle cx="170" cy="420" r="14"/>
</g>

<text x="320" y="480" text-anchor="middle" font-size="56" font-weight="900" fill="#f59e0b">半日</text>
<text x="320" y="515" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b">47 回クリック + Excel 整形</text>

<!-- Right: API -->
<rect x="620" y="120" width="520" height="420" rx="14" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
<text x="880" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#10b981">本記事: API + Claude Code</text>

<!-- Single large circle -->
<circle cx="880" cy="310" r="100" fill="#d1fae5" stroke="#10b981" stroke-width="3"/>
<text x="880" y="305" text-anchor="middle" font-size="20" font-weight="700" fill="#10b981">1 リクエスト</text>
<text x="880" y="335" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b">47 県 + 全年度</text>

<text x="880" y="480" text-anchor="middle" font-size="56" font-weight="900" fill="#10b981">30 秒</text>
<text x="880" y="515" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b">JSON が手元に届く</text>

<text x="600" y="580" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b">stats47.jp の全ランキングが本手順で日次更新中 / 出典: 政府統計の総合窓口 (e-Stat)</text>
</svg>
