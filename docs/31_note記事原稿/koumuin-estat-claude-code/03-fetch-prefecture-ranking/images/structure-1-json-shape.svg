<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<style>
  text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif; }
  .mono { font-family: 'SF Mono', 'Menlo', 'Consolas', monospace; }
</style>

<rect width="1200" height="600" fill="#fafafa"/>
<text x="600" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">出力 JSON の構造</text>
<text x="600" y="78" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b">Excel / グラフ / Web どこにでも流せる形</text>

<!-- Root box -->
<rect x="100" y="120" width="1000" height="430" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

<!-- Header: メタフィールド -->
<rect x="100" y="120" width="1000" height="48" rx="10" fill="#cffafe"/>
<text x="120" y="150" font-size="14" font-weight="700" fill="#0891b2">メタフィールド</text>

<text x="140" y="195" font-size="14" font-weight="700" class="mono" fill="#1e293b">rankingKey</text>
<text x="380" y="195" font-size="13" font-weight="500" fill="#64748b">"total-population" — ランキングの識別子</text>

<text x="140" y="225" font-size="14" font-weight="700" class="mono" fill="#1e293b">yearCode</text>
<text x="380" y="225" font-size="13" font-weight="500" fill="#64748b">"2023" — 実データの最新年</text>

<text x="140" y="255" font-size="14" font-weight="700" class="mono" fill="#1e293b">yearName</text>
<text x="380" y="255" font-size="13" font-weight="500" fill="#64748b">"2023年" — 人間が読む表記</text>

<text x="140" y="285" font-size="14" font-weight="700" class="mono" fill="#1e293b">categoryName</text>
<text x="380" y="285" font-size="13" font-weight="500" fill="#64748b">"総人口" — 指標名</text>

<text x="140" y="315" font-size="14" font-weight="700" class="mono" fill="#1e293b">unit</text>
<text x="380" y="315" font-size="13" font-weight="500" fill="#64748b">"人" — 単位</text>

<!-- Section: data 配列 -->
<line x1="120" y1="340" x2="1080" y2="340" stroke="#e2e8f0" stroke-width="1"/>
<text x="140" y="370" font-size="14" font-weight="700" class="mono" fill="#0891b2">data: [</text>
<text x="160" y="395" font-size="13" font-weight="500" class="mono" fill="#1e293b">{ areaCode: "13000", areaName: "東京都", value: 14086000, rank: 1 },</text>
<text x="160" y="420" font-size="13" font-weight="500" class="mono" fill="#1e293b">{ areaCode: "14000", areaName: "神奈川県", value:  9229000, rank: 2 },</text>
<text x="160" y="445" font-size="13" font-weight="500" class="mono" fill="#1e293b">{ areaCode: "27000", areaName: "大阪府",   value:  8762000, rank: 3 },</text>
<text x="160" y="470" font-size="13" font-weight="500" class="mono" fill="#64748b">...</text>
<text x="160" y="495" font-size="13" font-weight="500" class="mono" fill="#1e293b">{ areaCode: "31000", areaName: "鳥取県",   value:   537000, rank: 47 }</text>
<text x="140" y="525" font-size="14" font-weight="700" class="mono" fill="#0891b2">]</text>

<text x="600" y="570" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b">value 降順 + 同値タイランク (rank が連番でなく順位)</text>
</svg>
