<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360">
<style>
  text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif; }
</style>

<rect width="1200" height="360" fill="#fafafa"/>

<text x="600" y="48" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">statsDataId 特定からデータ取得までの 3 ステップ</text>
<line x1="430" y1="64" x2="770" y2="64" stroke="#0891b2" stroke-width="3" stroke-linecap="round"/>

<!-- Step 1: Search -->
<g transform="translate(80, 130)">
  <rect width="280" height="120" rx="12" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
  <text x="140" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#0891b2">STEP 1 — 探す</text>
  <text x="140" y="64" text-anchor="middle" font-size="20" font-weight="900" fill="#0891b2">/search-estat</text>
  <text x="140" y="92" text-anchor="middle" font-size="12" fill="#1e293b">キーワード or 分野コードで</text>
  <text x="140" y="110" text-anchor="middle" font-size="12" fill="#1e293b">statsDataId 候補を一覧</text>
</g>

<path d="M 370 190 L 410 190" stroke="#0891b2" stroke-width="3" fill="none" marker-end="url(#a5)"/>

<!-- Step 2: Inspect -->
<g transform="translate(420, 130)">
  <rect width="280" height="120" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <text x="140" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#0891b2">STEP 2 — 中身を把握</text>
  <text x="140" y="64" text-anchor="middle" font-size="18" font-weight="900" fill="#0891b2">/inspect-estat-meta</text>
  <text x="140" y="92" text-anchor="middle" font-size="12" fill="#1e293b">カテゴリ・年・地域の</text>
  <text x="140" y="110" text-anchor="middle" font-size="12" fill="#1e293b">3 ディメンションを確認</text>
</g>

<path d="M 710 190 L 750 190" stroke="#0891b2" stroke-width="3" fill="none" marker-end="url(#a5)"/>

<!-- Step 3: Fetch -->
<g transform="translate(760, 130)">
  <rect width="280" height="120" rx="12" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="140" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#10b981">STEP 3 — 取得</text>
  <text x="140" y="64" text-anchor="middle" font-size="18" font-weight="900" fill="#10b981">/fetch-estat-data</text>
  <text x="140" y="92" text-anchor="middle" font-size="12" fill="#1e293b">47 都道府県 JSON 出力</text>
  <text x="140" y="110" text-anchor="middle" font-size="12" fill="#1e293b">(本記事の対象外、#03 で扱う)</text>
</g>

<!-- Subtext -->
<rect x="80" y="280" width="960" height="48" rx="8" fill="#fef3c7"/>
<text x="560" y="307" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">本記事 (#02) は STEP 1-2 を扱う。STEP 3 は #03 (無料) で扱う。</text>

<defs>
  <marker id="a5" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#0891b2"/>
  </marker>
</defs>
</svg>
