<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<style>
  text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif; }
  .mono { font-family: 'SF Mono', Menlo, Consolas, monospace; }
</style>

<rect width="1200" height="600" fill="#fafafa"/>

<text x="600" y="50" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e293b">e-Stat の階層構造 (調査 → 統計表 → 表番号 → カテゴリ → 値)</text>
<line x1="380" y1="68" x2="820" y2="68" stroke="#0891b2" stroke-width="3" stroke-linecap="round"/>

<!-- Layer 1: 調査 -->
<g transform="translate(60, 110)">
  <rect width="1080" height="70" rx="8" fill="#0891b2"/>
  <text x="40" y="32" font-size="14" font-weight="700" fill="#ffffff">Layer 1 — 政府統計コード (statsCode, 8桁)</text>
  <text x="40" y="55" font-size="13" fill="#cffafe" class="mono">例: 00200524 (国勢調査) / 00200532 (人口推計) / 00200502 (住民基本台帳人口移動報告)</text>
</g>

<line x1="600" y1="180" x2="600" y2="210" stroke="#0891b2" stroke-width="2" marker-end="url(#a6)"/>

<!-- Layer 2: 統計表 -->
<g transform="translate(60, 220)">
  <rect width="1080" height="70" rx="8" fill="#7c3aed"/>
  <text x="40" y="32" font-size="14" font-weight="700" fill="#ffffff">Layer 2 — 統計表 (statsTable)</text>
  <text x="40" y="55" font-size="13" fill="#ede9fe" class="mono">例: 「国勢調査 > 人口等基本集計」「国勢調査 > 就業状態等基本集計」</text>
</g>

<line x1="600" y1="290" x2="600" y2="320" stroke="#7c3aed" stroke-width="2" marker-end="url(#a7)"/>

<!-- Layer 3: 表番号 = statsDataId -->
<g transform="translate(60, 330)">
  <rect width="1080" height="80" rx="8" fill="#10b981"/>
  <text x="40" y="32" font-size="14" font-weight="700" fill="#ffffff">Layer 3 — 統計表 ID (statsDataId, 10 桁) ← /fetch-estat-data の引数</text>
  <text x="40" y="55" font-size="13" fill="#d1fae5" class="mono">例: 0003445078 (国勢調査 人口・面積・人口密度) / 0003445758 (賃金構造基本統計調査)</text>
  <text x="40" y="74" font-size="12" fill="#d1fae5">★ 本記事はここまでを最短特定するためのガイド</text>
</g>

<line x1="600" y1="410" x2="600" y2="440" stroke="#10b981" stroke-width="2" marker-end="url(#a8)"/>

<!-- Layer 4: カテゴリ + 値 -->
<g transform="translate(60, 450)">
  <rect width="520" height="120" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="20" y="28" font-size="13" font-weight="700" fill="#475569">Layer 4a — カテゴリ (cat01, cat02, ...)</text>
  <text x="20" y="52" font-size="12" fill="#1e293b" class="mono">cat01: 男女・年齢区分</text>
  <text x="20" y="72" font-size="12" fill="#1e293b" class="mono">cat02: 産業分類</text>
  <text x="20" y="92" font-size="12" fill="#1e293b" class="mono">tab: 集計表区分</text>
  <text x="20" y="110" font-size="11" fill="#64748b">→ /inspect-estat-meta で全列挙</text>
</g>

<g transform="translate(620, 450)">
  <rect width="520" height="120" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="20" y="28" font-size="13" font-weight="700" fill="#475569">Layer 4b — 年 / 地域 / 値</text>
  <text x="20" y="52" font-size="12" fill="#1e293b" class="mono">time: 2024000000 形式</text>
  <text x="20" y="72" font-size="12" fill="#1e293b" class="mono">area: 5桁 (01000〜47000)</text>
  <text x="20" y="92" font-size="12" fill="#1e293b" class="mono">value: 実測値 (数値)</text>
  <text x="20" y="110" font-size="11" fill="#64748b">→ /fetch-estat-data が JSON 化</text>
</g>

<defs>
  <marker id="a6" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#0891b2"/>
  </marker>
  <marker id="a7" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
  </marker>
  <marker id="a8" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#10b981"/>
  </marker>
</defs>
</svg>
