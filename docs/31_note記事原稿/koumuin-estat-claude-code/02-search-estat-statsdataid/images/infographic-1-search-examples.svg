<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<style>
  text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif; }
  .mono { font-family: 'SF Mono', Menlo, Consolas, monospace; }
</style>

<rect width="1200" height="600" fill="#fafafa"/>

<text x="600" y="50" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e293b">検索パターン 3 種類の Before / After</text>
<line x1="430" y1="68" x2="770" y2="68" stroke="#0891b2" stroke-width="3" stroke-linecap="round"/>

<!-- Pattern 1: Keyword -->
<g transform="translate(60, 110)">
  <rect width="350" height="240" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <rect x="0" y="0" width="350" height="44" rx="12" fill="#0891b2"/>
  <text x="20" y="29" font-size="14" font-weight="700" fill="#ffffff">パターン 1: キーワード検索</text>

  <text x="20" y="78" font-size="12" font-weight="700" fill="#94a3b8">BEFORE</text>
  <text x="20" y="100" font-size="13" fill="#1e293b">e-Stat サイトで「待機児童」と検索</text>
  <text x="20" y="118" font-size="13" fill="#1e293b">→ 50 件超、目視で 1 件特定</text>
  <text x="20" y="138" font-size="13" font-weight="700" fill="#dc2626">所要 20-30 分</text>

  <line x1="20" y1="155" x2="330" y2="155" stroke="#e2e8f0" stroke-width="1"/>

  <text x="20" y="178" font-size="12" font-weight="700" fill="#0891b2">AFTER</text>
  <text x="20" y="198" font-size="12" fill="#1e293b" class="mono">/search-estat 待機児童</text>
  <text x="20" y="218" font-size="13" fill="#1e293b">→ 上位 20 件、Claude が推薦</text>
  <text x="20" y="234" font-size="13" font-weight="700" fill="#10b981">所要 1 分</text>
</g>

<!-- Pattern 2: Field code -->
<g transform="translate(425, 110)">
  <rect width="350" height="240" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="0" y="0" width="350" height="44" rx="12" fill="#7c3aed"/>
  <text x="20" y="29" font-size="14" font-weight="700" fill="#ffffff">パターン 2: 統計分野コード</text>

  <text x="20" y="78" font-size="12" font-weight="700" fill="#94a3b8">BEFORE</text>
  <text x="20" y="100" font-size="13" fill="#1e293b">e-Stat 「分野で探す」から</text>
  <text x="20" y="118" font-size="13" fill="#1e293b">階層を辿って候補絞り込み</text>
  <text x="20" y="138" font-size="13" font-weight="700" fill="#dc2626">所要 15-20 分</text>

  <line x1="20" y1="155" x2="330" y2="155" stroke="#e2e8f0" stroke-width="1"/>

  <text x="20" y="178" font-size="12" font-weight="700" fill="#7c3aed">AFTER</text>
  <text x="20" y="198" font-size="12" fill="#1e293b" class="mono">statsField=15 (社会保障・衛生)</text>
  <text x="20" y="218" font-size="13" fill="#1e293b">→ 当該分野の主要表を一括取得</text>
  <text x="20" y="234" font-size="13" font-weight="700" fill="#10b981">所要 30 秒</text>
</g>

<!-- Pattern 3: Stats code -->
<g transform="translate(790, 110)">
  <rect width="350" height="240" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <rect x="0" y="0" width="350" height="44" rx="12" fill="#10b981"/>
  <text x="20" y="29" font-size="14" font-weight="700" fill="#ffffff">パターン 3: 政府統計コード</text>

  <text x="20" y="78" font-size="12" font-weight="700" fill="#94a3b8">BEFORE</text>
  <text x="20" y="100" font-size="13" fill="#1e293b">該当調査 (国勢調査等) の URL を</text>
  <text x="20" y="118" font-size="13" fill="#1e293b">パンくず辿りで特定</text>
  <text x="20" y="138" font-size="13" font-weight="700" fill="#dc2626">所要 10-15 分</text>

  <line x1="20" y1="155" x2="330" y2="155" stroke="#e2e8f0" stroke-width="1"/>

  <text x="20" y="178" font-size="12" font-weight="700" fill="#10b981">AFTER</text>
  <text x="20" y="198" font-size="12" fill="#1e293b" class="mono">statsCode=00200524 (国勢調査)</text>
  <text x="20" y="218" font-size="13" fill="#1e293b">→ 当該調査の全表を一覧取得</text>
  <text x="20" y="234" font-size="13" font-weight="700" fill="#10b981">所要 15 秒</text>
</g>

<!-- Bottom: catalog -->
<rect x="60" y="395" width="1080" height="160" rx="12" fill="#cffafe" stroke="#0891b2" stroke-width="1"/>
<text x="600" y="430" text-anchor="middle" font-size="18" font-weight="bold" fill="#0891b2">さらに高速: ローカルカタログ検索 (estat_metainfo)</text>
<text x="600" y="460" text-anchor="middle" font-size="13" fill="#1e293b">/search-estat は API を叩く前に、ローカル DB の estat_metainfo (8,000+ 件) を検索する設計。</text>
<text x="600" y="482" text-anchor="middle" font-size="13" fill="#1e293b">同じ statsDataId を 2 回目以降は API 不要で即取得 (キャッシュヒット時 0.1 秒)。</text>
<text x="600" y="510" text-anchor="middle" font-size="12" fill="#475569">stats47.jp の運用ではこのカタログに約 2,000 件の登録済み (registered) + 候補 (candidate) を蓄積。</text>
<text x="600" y="535" text-anchor="middle" font-size="11" fill="#64748b">出典: 政府統計の総合窓口 (e-Stat)</text>
</svg>
