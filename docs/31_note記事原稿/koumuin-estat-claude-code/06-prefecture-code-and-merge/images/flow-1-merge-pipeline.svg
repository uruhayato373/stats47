<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" font-family="'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif">
  <rect width="1200" height="360" fill="#fafafa"/>
  <text x="600" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">統計データ + マスタ → 結合 → 派生指標</text>
  <text x="600" y="62" text-anchor="middle" font-size="13" fill="#64748b">人口 10 万人あたり医師数を出す典型パイプライン</text>

  <defs>
    <marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Top branch: 医師数 -->
  <rect x="60" y="100" width="180" height="70" fill="#cffafe" stroke="#0891b2" stroke-width="1.5" rx="6"/>
  <text x="150" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#0e7490">e-Stat 医師数</text>
  <text x="150" y="143" text-anchor="middle" font-size="11" fill="#0e7490">getStatsData API</text>
  <text x="150" y="158" text-anchor="middle" font-size="11" fill="#0e7490">pref_code, count</text>

  <!-- Bottom branch: 人口 -->
  <rect x="60" y="200" width="180" height="70" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" rx="6"/>
  <text x="150" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#5b21b6">住民基本台帳人口</text>
  <text x="150" y="243" text-anchor="middle" font-size="11" fill="#5b21b6">e-Stat マスタ</text>
  <text x="150" y="258" text-anchor="middle" font-size="11" fill="#5b21b6">pref_code, pop</text>

  <line x1="240" y1="135" x2="288" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#arrM)"/>
  <line x1="240" y1="235" x2="288" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#arrM)"/>

  <!-- Step 2: 正規化 -->
  <rect x="290" y="140" width="180" height="90" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" rx="6"/>
  <text x="380" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">コード正規化</text>
  <text x="380" y="185" text-anchor="middle" font-size="11" fill="#92400e">pref_code を 5 桁化</text>
  <text x="380" y="202" text-anchor="middle" font-size="11" fill="#92400e">dtype=str で読込</text>
  <text x="380" y="219" text-anchor="middle" font-size="11" fill="#92400e">"01000" 〜 "47000"</text>

  <line x1="470" y1="185" x2="498" y2="185" stroke="#475569" stroke-width="2" marker-end="url(#arrM)"/>

  <!-- Step 3: 結合 -->
  <rect x="500" y="140" width="180" height="90" fill="#ffffff" stroke="#0891b2" stroke-width="2.5" rx="6"/>
  <text x="590" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#0e7490">pandas.merge</text>
  <text x="590" y="185" text-anchor="middle" font-size="11" fill="#0e7490">on="pref_code"</text>
  <text x="590" y="202" text-anchor="middle" font-size="11" fill="#0e7490">how="inner"</text>
  <text x="590" y="219" text-anchor="middle" font-size="11" fill="#0e7490">validate="1:1"</text>

  <line x1="680" y1="185" x2="708" y2="185" stroke="#475569" stroke-width="2" marker-end="url(#arrM)"/>

  <!-- Step 4: 派生指標 -->
  <rect x="710" y="140" width="180" height="90" fill="#cffafe" stroke="#0891b2" stroke-width="1.5" rx="6"/>
  <text x="800" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#0e7490">派生指標を計算</text>
  <text x="800" y="185" text-anchor="middle" font-size="11" fill="#0e7490">count / pop * 1e5</text>
  <text x="800" y="202" text-anchor="middle" font-size="11" fill="#0e7490">人口 10 万人あたり</text>
  <text x="800" y="219" text-anchor="middle" font-size="11" fill="#0e7490">医師数 (47 件)</text>

  <line x1="890" y1="185" x2="918" y2="185" stroke="#475569" stroke-width="2" marker-end="url(#arrM)"/>

  <!-- Final: 出力 -->
  <rect x="920" y="140" width="200" height="90" fill="#d1fae5" stroke="#059669" stroke-width="2.5" rx="6"/>
  <text x="1020" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">出力 (47 行)</text>
  <text x="1020" y="185" text-anchor="middle" font-size="11" fill="#065f46">ランキング表</text>
  <text x="1020" y="202" text-anchor="middle" font-size="11" fill="#065f46">CSV / Excel / Markdown</text>
  <text x="1020" y="219" text-anchor="middle" font-size="11" fill="#065f46">stats47 と同パターン</text>

  <!-- Bottom comparison -->
  <rect x="200" y="290" width="800" height="50" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3" rx="4"/>
  <text x="600" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">Before: Excel VLOOKUP 整備 2-3 時間 × 月 3-5 件</text>
  <text x="600" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#059669">After: スキル一発 5 分 (初回構築 2 時間で完了)</text>
</svg>
