<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif">
  <rect width="1200" height="600" fill="#fafafa"/>
  <text x="600" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">都道府県 → 市区町村 → 区・大字 の階層構造</text>
  <text x="600" y="66" text-anchor="middle" font-size="13" fill="#64748b">5 桁コードで上位 2 桁が都道府県、政令市は下 3 桁で区を表現</text>

  <defs>
    <marker id="arrH" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Level 1: 都道府県 -->
  <rect x="450" y="100" width="300" height="80" fill="#cffafe" stroke="#0891b2" stroke-width="2.5" rx="8"/>
  <text x="600" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#0e7490">都道府県 (47 件)</text>
  <text x="600" y="150" text-anchor="middle" font-size="13" fill="#0e7490">5 桁 "X0000" 形式</text>
  <text x="600" y="168" text-anchor="middle" font-size="12" fill="#0e7490">"01000" 北海道 〜 "47000" 沖縄県</text>

  <line x1="600" y1="180" x2="600" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#arrH)"/>

  <!-- Level 2: 市区町村 -->
  <rect x="350" y="220" width="500" height="80" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" rx="8"/>
  <text x="600" y="248" text-anchor="middle" font-size="16" font-weight="bold" fill="#5b21b6">市区町村 (約 1,700 件)</text>
  <text x="600" y="270" text-anchor="middle" font-size="13" fill="#5b21b6">5 桁 "XXYYY" 形式 / 上位 2 桁 = 都道府県コード</text>
  <text x="600" y="288" text-anchor="middle" font-size="12" fill="#5b21b6">"01100" 札幌市 / "13101" 千代田区 / "27100" 大阪市</text>

  <line x1="600" y1="300" x2="600" y2="330" stroke="#475569" stroke-width="2" marker-end="url(#arrH)"/>

  <!-- Level 3: 政令市区 -->
  <rect x="200" y="340" width="380" height="80" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="8"/>
  <text x="390" y="368" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">政令市の区 (約 175 件)</text>
  <text x="390" y="390" text-anchor="middle" font-size="12" fill="#92400e">"XX1YZ" 形式 / 下 3 桁の上位が区</text>
  <text x="390" y="406" text-anchor="middle" font-size="11" fill="#92400e">"01101" 札幌市中央区 / "14130" 川崎市川崎区</text>

  <!-- Level 3b: 大字 -->
  <rect x="620" y="340" width="380" height="80" fill="#fce7f3" stroke="#9d174d" stroke-width="2" rx="8"/>
  <text x="810" y="368" text-anchor="middle" font-size="15" font-weight="bold" fill="#9d174d">大字・町字 (約 50 万件)</text>
  <text x="810" y="390" text-anchor="middle" font-size="12" fill="#9d174d">e-Stat の小地域統計で使用</text>
  <text x="810" y="406" text-anchor="middle" font-size="11" fill="#9d174d">国勢調査の町丁字別集計など</text>

  <!-- Conversion examples -->
  <rect x="60" y="460" width="1080" height="120" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="6"/>
  <text x="80" y="488" font-size="14" font-weight="bold" fill="#1e293b">よく使うコード変換パターン</text>

  <text x="80" y="515" font-size="12" fill="#475569" font-weight="bold">市区町村 → 都道府県:</text>
  <text x="280" y="515" font-size="12" fill="#0891b2" font-family="ui-monospace, monospace">code[:2] + "000"</text>
  <text x="500" y="515" font-size="12" fill="#64748b">例: "13101" → "13000"</text>

  <text x="80" y="538" font-size="12" fill="#475569" font-weight="bold">JIS 2 桁 → e-Stat 5 桁:</text>
  <text x="280" y="538" font-size="12" fill="#0891b2" font-family="ui-monospace, monospace">f"{int(s):02d}000"</text>
  <text x="500" y="538" font-size="12" fill="#64748b">例: 13 → "13000"</text>

  <text x="80" y="561" font-size="12" fill="#475569" font-weight="bold">政令市区 → 政令市:</text>
  <text x="280" y="561" font-size="12" fill="#0891b2" font-family="ui-monospace, monospace">code[:3] + "00"</text>
  <text x="500" y="561" font-size="12" fill="#64748b">例: "01101" → "01100" (区を集約)</text>
</svg>
