<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360">
<style>
  text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif; }
</style>

<rect width="1200" height="360" fill="#fafafa"/>
<text x="600" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">派生指標計算パイプライン</text>
<text x="600" y="78" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b">生データ → 人口結合 → 派生指標 → ランキング</text>

<!-- Box 1: raw -->
<rect x="40" y="130" width="200" height="100" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
<text x="140" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#0891b2">RAW</text>
<text x="140" y="188" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">医師数 / 婚姻数</text>
<text x="140" y="210" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b">e-Stat JSON</text>

<line x1="250" y1="180" x2="290" y2="180" stroke="#0891b2" stroke-width="2"/>
<polygon points="290,175 302,180 290,185" fill="#0891b2"/>

<!-- Box 2: join -->
<rect x="310" y="130" width="200" height="100" rx="10" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
<text x="410" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#0891b2">JOIN</text>
<text x="410" y="188" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">人口データ結合</text>
<text x="410" y="210" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b">areaCode + year</text>

<line x1="520" y1="180" x2="560" y2="180" stroke="#0891b2" stroke-width="2"/>
<polygon points="560,175 572,180 560,185" fill="#0891b2"/>

<!-- Box 3: derive -->
<rect x="580" y="130" width="200" height="100" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
<text x="680" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">DERIVE</text>
<text x="680" y="188" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">人口当たり / 順位</text>
<text x="680" y="210" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b">偏差値 / 5 年平均</text>

<line x1="790" y1="180" x2="830" y2="180" stroke="#0891b2" stroke-width="2"/>
<polygon points="830,175 842,180 830,185" fill="#0891b2"/>

<!-- Box 4: output -->
<rect x="850" y="130" width="290" height="100" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
<text x="995" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#10b981">OUTPUT</text>
<text x="995" y="188" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">議会答弁 / 補助金資料 / Web</text>
<text x="995" y="210" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b">「全国 N 位、偏差値 N」が出る</text>

<text x="600" y="290" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Excel 半日 (10 指標) → スクリプト化で 5 分 / 月次運用 30 秒</text>
<text x="600" y="315" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b">出典: 政府統計の総合窓口 (e-Stat)</text>
</svg>
