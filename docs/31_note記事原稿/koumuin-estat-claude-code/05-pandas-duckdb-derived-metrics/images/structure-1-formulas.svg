<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<style>
  text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif; }
  .mono { font-family: 'SF Mono', 'Menlo', 'Consolas', monospace; }
</style>

<rect width="1200" height="600" fill="#fafafa"/>
<text x="600" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">派生指標 4 大パターン</text>
<text x="600" y="78" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b">議会答弁・補助金申請・庁内資料を組み立てる骨格</text>

<!-- Card 1: per capita -->
<rect x="60" y="120" width="540" height="200" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
<rect x="60" y="120" width="540" height="44" rx="12" fill="#cffafe"/>
<text x="80" y="150" font-size="16" font-weight="700" fill="#0891b2">1. 単位当たり (per_capita / per_100k)</text>
<text x="80" y="195" font-size="14" class="mono" fill="#1e293b">value / population * 100_000</text>
<text x="80" y="230" font-size="13" fill="#64748b">人口・面積・世帯数で割って規模差を均す</text>
<text x="80" y="255" font-size="13" font-weight="600" fill="#1e293b">用途: 人口 10 万人当たり医師数、面積当たり林道 km</text>
<text x="80" y="290" font-size="12" class="mono" fill="#0891b2">df["per_100k"] = df["value"] / df["pop"] * 100_000</text>

<!-- Card 2: rank -->
<rect x="620" y="120" width="540" height="200" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
<rect x="620" y="120" width="540" height="44" rx="12" fill="#ede9fe"/>
<text x="640" y="150" font-size="16" font-weight="700" fill="#7c3aed">2. 順位 (rank)</text>
<text x="640" y="195" font-size="14" class="mono" fill="#1e293b">rank(desc, method=min)  [同値タイランク]</text>
<text x="640" y="230" font-size="13" fill="#64748b">議員・住民に「全国 N 位」で直感的に伝わる</text>
<text x="640" y="255" font-size="13" font-weight="600" fill="#1e293b">用途: 議会答弁の冒頭一行サマリ</text>
<text x="640" y="290" font-size="12" class="mono" fill="#7c3aed">df["rank"] = df["per_100k"].rank(ascending=False, method="min")</text>

<!-- Card 3: deviation -->
<rect x="60" y="340" width="540" height="200" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
<rect x="60" y="340" width="540" height="44" rx="12" fill="#cffafe"/>
<text x="80" y="370" font-size="16" font-weight="700" fill="#0891b2">3. 偏差値 (z-score × 10 + 50)</text>
<text x="80" y="415" font-size="14" class="mono" fill="#1e293b">50 + (value − mean) / std × 10</text>
<text x="80" y="450" font-size="13" fill="#64748b">「全国平均と比べてどれだけ突出しているか」を絶対量で示す</text>
<text x="80" y="475" font-size="13" font-weight="600" fill="#1e293b">用途: 経年比較、補助金申請の妥当性主張</text>
<text x="80" y="510" font-size="12" class="mono" fill="#0891b2">50 + (df["v"] - df["v"].mean()) / df["v"].std() * 10</text>

<!-- Card 4: rolling -->
<rect x="620" y="340" width="540" height="200" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
<rect x="620" y="340" width="540" height="44" rx="12" fill="#ede9fe"/>
<text x="640" y="370" font-size="16" font-weight="700" fill="#7c3aed">4. 経年平均・差分 (rolling / diff)</text>
<text x="640" y="415" font-size="14" class="mono" fill="#1e293b">rolling(window=5).mean()  /  diff()</text>
<text x="640" y="450" font-size="13" fill="#64748b">単年度のブレを均し、政策効果のトレンドを抽出</text>
<text x="640" y="475" font-size="13" font-weight="600" fill="#1e293b">用途: 5 年平均、前年比、年率変化</text>
<text x="640" y="510" font-size="12" class="mono" fill="#7c3aed">.rolling(window=5, min_periods=1).mean()</text>

<text x="600" y="580" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b">stats47.jp の約 2,000 ランキングはこの 4 パターンの組み合わせで生成</text>
</svg>
