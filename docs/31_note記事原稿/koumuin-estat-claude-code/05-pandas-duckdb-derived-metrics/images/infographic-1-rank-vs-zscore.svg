<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<style>
  text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif; }
</style>

<rect width="1200" height="600" fill="#fafafa"/>
<text x="600" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">順位 vs 偏差値 — どう使い分けるか</text>
<text x="600" y="78" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b">同じデータでも見え方が変わる。場面で選ぶ</text>

<!-- Left card: rank -->
<rect x="60" y="120" width="520" height="420" rx="14" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
<rect x="60" y="120" width="520" height="60" rx="14" fill="#cffafe"/>
<text x="320" y="160" text-anchor="middle" font-size="22" font-weight="700" fill="#0891b2">順位 (rank)</text>

<text x="90" y="215" font-size="14" font-weight="700" fill="#1e293b">向いている場面</text>
<g fill="#1e293b" font-size="13">
<text x="90" y="245">• 議会答弁の冒頭一行サマリ</text>
<text x="90" y="270">• 住民向け広報資料</text>
<text x="90" y="295">• プレス発表用キャッチ</text>
</g>

<text x="90" y="335" font-size="14" font-weight="700" fill="#1e293b">具体例</text>
<rect x="80" y="350" width="460" height="80" rx="8" fill="#fafafa" stroke="#e2e8f0" stroke-width="1"/>
<text x="100" y="378" font-size="14" font-weight="600" fill="#1e293b">「人口 10 万人当たり医師数は」</text>
<text x="100" y="402" font-size="20" font-weight="700" fill="#0891b2">全国 35 位</text>
<text x="100" y="424" font-size="12" font-weight="500" fill="#64748b">→ 議員が瞬時に「下から数えた方が早い」と理解</text>

<text x="320" y="475" text-anchor="middle" font-size="32" font-weight="900" fill="#0891b2">直感的</text>
<text x="320" y="510" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b">1 位と 47 位の間が等間隔に見える</text>

<!-- Right card: deviation -->
<rect x="620" y="120" width="520" height="420" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
<rect x="620" y="120" width="520" height="60" rx="14" fill="#ede9fe"/>
<text x="880" y="160" text-anchor="middle" font-size="22" font-weight="700" fill="#7c3aed">偏差値 (z-score)</text>

<text x="650" y="215" font-size="14" font-weight="700" fill="#1e293b">向いている場面</text>
<g fill="#1e293b" font-size="13">
<text x="650" y="245">• 経年変化の追跡 (全国平均が動いても比較可)</text>
<text x="650" y="270">• 上位 / 下位の絶対差を見たいとき</text>
<text x="650" y="295">• 補助金申請のエビデンス</text>
</g>

<text x="650" y="335" font-size="14" font-weight="700" fill="#1e293b">具体例</text>
<rect x="640" y="350" width="460" height="80" rx="8" fill="#fafafa" stroke="#e2e8f0" stroke-width="1"/>
<text x="660" y="378" font-size="14" font-weight="600" fill="#1e293b">「同 指標で全国比は」</text>
<text x="660" y="402" font-size="20" font-weight="700" fill="#7c3aed">偏差値 38.5</text>
<text x="660" y="424" font-size="12" font-weight="500" fill="#64748b">→ 「平均から 1.15 σ 下、有意な不足」が定量化</text>

<text x="880" y="475" text-anchor="middle" font-size="32" font-weight="900" fill="#7c3aed">定量的</text>
<text x="880" y="510" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b">1 位と 2 位、46 位と 47 位の差が見える</text>

<text x="600" y="580" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b">補助金申請は両者併記が定石: 「順位 35 位、偏差値 38」</text>
</svg>
