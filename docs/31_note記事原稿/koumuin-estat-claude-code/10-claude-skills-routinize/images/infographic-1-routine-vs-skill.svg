<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<style>
  text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif; }
</style>

<rect width="1200" height="600" fill="#fafafa"/>

<text x="600" y="55" text-anchor="middle" font-size="26" font-weight="bold" fill="#1e293b">手作業 vs skill 化 — 同じ業務の所要時間</text>
<line x1="400" y1="75" x2="800" y2="75" stroke="#0891b2" stroke-width="3" stroke-linecap="round"/>

<!-- Before card -->
<g transform="translate(60, 120)">
  <rect width="520" height="320" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="0" y="0" width="520" height="6" fill="#94a3b8"/>
  <text x="260" y="50" text-anchor="middle" font-size="16" font-weight="700" fill="#475569" letter-spacing="2">BEFORE — 手作業</text>

  <text x="260" y="115" text-anchor="middle" font-size="64" font-weight="900" fill="#94a3b8">8-16</text>
  <text x="260" y="148" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">時間 / 月</text>

  <line x1="60" y1="180" x2="460" y2="180" stroke="#e2e8f0"/>

  <text x="80" y="210" font-size="13" fill="#475569">・ 統計表 ID を毎回探す</text>
  <text x="80" y="232" font-size="13" fill="#475569">・ API キーの保存先を探す</text>
  <text x="80" y="254" font-size="13" fill="#475569">・ ダウンロード形式を毎回間違える</text>
  <text x="80" y="276" font-size="13" fill="#475569">・ Excel に手作業で貼り直す</text>
  <text x="80" y="298" font-size="13" fill="#475569">・ 異動時は新任が丸 1 日溶かす</text>
</g>

<!-- Arrow -->
<g transform="translate(580, 270)">
  <path d="M 0 0 L 40 0 M 30 -10 L 40 0 L 30 10" stroke="#0891b2" stroke-width="3" fill="none"/>
</g>

<!-- After card -->
<g transform="translate(620, 120)">
  <rect width="520" height="320" rx="12" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
  <rect x="0" y="0" width="520" height="6" fill="#0891b2"/>
  <text x="260" y="50" text-anchor="middle" font-size="16" font-weight="700" fill="#0891b2" letter-spacing="2">AFTER — skill 化</text>

  <text x="260" y="115" text-anchor="middle" font-size="64" font-weight="900" fill="#0891b2">5</text>
  <text x="260" y="148" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">分 / 月</text>

  <line x1="60" y1="180" x2="460" y2="180" stroke="#0891b2" opacity="0.3"/>

  <text x="80" y="210" font-size="13" fill="#1e293b">・ /monthly-estat-update と打つだけ</text>
  <text x="80" y="232" font-size="13" fill="#1e293b">・ 統計表 ID は SKILL.md に固定</text>
  <text x="80" y="254" font-size="13" fill="#1e293b">・ API キーは環境変数で永続化</text>
  <text x="80" y="276" font-size="13" fill="#1e293b">・ CSV 整形 + 前年比計算が自動</text>
  <text x="80" y="298" font-size="13" fill="#1e293b">・ 異動者は SKILL.md を読むだけ</text>
</g>

<!-- ROI summary -->
<rect x="60" y="470" width="1080" height="100" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
<text x="600" y="500" text-anchor="middle" font-size="18" font-weight="bold" fill="#7c3aed">年間 96-192 時間削減 = 12-24 日相当 / 初回投資 1 日で回収</text>
<text x="600" y="528" text-anchor="middle" font-size="14" fill="#475569">複数業務を skill 化すれば効果は積み上がる。stats47.jp は十数個の skill で毎日更新を回している。</text>
<text x="600" y="554" text-anchor="middle" font-size="11" fill="#64748b">出典: 政府統計の総合窓口 (e-Stat) — 商用利用可・出典明記必須</text>
</svg>
