<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif">
  <rect width="1200" height="600" fill="#fafafa"/>
  <text x="600" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">時系列データの 3 形式</text>
  <text x="600" y="66" text-anchor="middle" font-size="13" fill="#64748b">long → wide → 比較表 の変換は pandas / DuckDB で 1 行</text>

  <!-- Long format -->
  <text x="200" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#0e7490">long-format (e-Stat API 出力)</text>
  <text x="200" y="130" text-anchor="middle" font-size="11" fill="#64748b">1 行 = 1 県 × 1 年度</text>

  <rect x="60" y="145" width="280" height="280" fill="#ffffff" stroke="#0891b2" stroke-width="2" rx="6"/>
  <line x1="60" y1="180" x2="340" y2="180" stroke="#cffafe" stroke-width="32"/>
  <text x="100" y="170" font-size="12" font-weight="bold" fill="#0e7490">areaCode</text>
  <text x="180" y="170" font-size="12" font-weight="bold" fill="#0e7490">yearCode</text>
  <text x="280" y="170" font-size="12" font-weight="bold" fill="#0e7490">value</text>

  <text x="100" y="205" font-size="12" fill="#1e293b">"01000"</text>
  <text x="180" y="205" font-size="12" fill="#1e293b">"2022"</text>
  <text x="280" y="205" font-size="12" fill="#1e293b">540</text>

  <text x="100" y="225" font-size="12" fill="#1e293b">"01000"</text>
  <text x="180" y="225" font-size="12" fill="#1e293b">"2023"</text>
  <text x="280" y="225" font-size="12" fill="#1e293b">562</text>

  <text x="100" y="245" font-size="12" fill="#1e293b">"01000"</text>
  <text x="180" y="245" font-size="12" fill="#1e293b">"2024"</text>
  <text x="280" y="245" font-size="12" fill="#1e293b">581</text>

  <text x="100" y="270" font-size="12" fill="#1e293b">"13000"</text>
  <text x="180" y="270" font-size="12" fill="#1e293b">"2022"</text>
  <text x="280" y="270" font-size="12" fill="#1e293b">720</text>

  <text x="100" y="290" font-size="12" fill="#1e293b">"13000"</text>
  <text x="180" y="290" font-size="12" fill="#1e293b">"2023"</text>
  <text x="280" y="290" font-size="12" fill="#1e293b">735</text>

  <text x="100" y="310" font-size="12" fill="#1e293b">"13000"</text>
  <text x="180" y="310" font-size="12" fill="#1e293b">"2024"</text>
  <text x="280" y="310" font-size="12" fill="#1e293b">751</text>

  <text x="100" y="335" font-size="12" fill="#64748b">...</text>
  <text x="180" y="335" font-size="12" fill="#64748b">...</text>
  <text x="280" y="335" font-size="12" fill="#64748b">...</text>

  <text x="200" y="395" text-anchor="middle" font-size="12" fill="#64748b">47 県 × 5 年 = 235 行</text>
  <text x="200" y="412" text-anchor="middle" font-size="11" fill="#64748b">DuckDB の LAG() に最適</text>

  <!-- Arrow -->
  <defs>
    <marker id="arrTS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <line x1="350" y1="280" x2="420" y2="280" stroke="#475569" stroke-width="2.5" marker-end="url(#arrTS)"/>
  <text x="385" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">.pivot()</text>

  <!-- Wide format -->
  <text x="600" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#5b21b6">wide-format (ピボット後)</text>
  <text x="600" y="130" text-anchor="middle" font-size="11" fill="#64748b">1 行 = 1 県、列 = 年度</text>

  <rect x="430" y="145" width="340" height="280" fill="#ffffff" stroke="#7c3aed" stroke-width="2" rx="6"/>
  <line x1="430" y1="180" x2="770" y2="180" stroke="#ede9fe" stroke-width="32"/>
  <text x="475" y="170" font-size="12" font-weight="bold" fill="#5b21b6">areaCode</text>
  <text x="570" y="170" font-size="12" font-weight="bold" fill="#5b21b6">2022</text>
  <text x="640" y="170" font-size="12" font-weight="bold" fill="#5b21b6">2023</text>
  <text x="710" y="170" font-size="12" font-weight="bold" fill="#5b21b6">2024</text>

  <text x="475" y="205" font-size="12" fill="#1e293b">"01000"</text>
  <text x="570" y="205" font-size="12" fill="#1e293b">540</text>
  <text x="640" y="205" font-size="12" fill="#1e293b">562</text>
  <text x="710" y="205" font-size="12" fill="#1e293b">581</text>

  <text x="475" y="230" font-size="12" fill="#1e293b">"13000"</text>
  <text x="570" y="230" font-size="12" fill="#1e293b">720</text>
  <text x="640" y="230" font-size="12" fill="#1e293b">735</text>
  <text x="710" y="230" font-size="12" fill="#1e293b">751</text>

  <text x="475" y="255" font-size="12" fill="#1e293b">"27000"</text>
  <text x="570" y="255" font-size="12" fill="#1e293b">680</text>
  <text x="640" y="255" font-size="12" fill="#1e293b">692</text>
  <text x="710" y="255" font-size="12" fill="#1e293b">705</text>

  <text x="475" y="335" font-size="12" fill="#64748b">...</text>
  <text x="570" y="335" font-size="12" fill="#64748b">...</text>
  <text x="640" y="335" font-size="12" fill="#64748b">...</text>
  <text x="710" y="335" font-size="12" fill="#64748b">...</text>

  <text x="600" y="395" text-anchor="middle" font-size="12" fill="#64748b">47 行 × 5 列</text>
  <text x="600" y="412" text-anchor="middle" font-size="11" fill="#64748b">pandas .diff() / .pct_change() に最適</text>

  <line x1="780" y1="280" x2="850" y2="280" stroke="#475569" stroke-width="2.5" marker-end="url(#arrTS)"/>
  <text x="815" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">.diff()</text>

  <!-- Diff format -->
  <text x="990" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">比較表 (議会答弁用)</text>
  <text x="990" y="130" text-anchor="middle" font-size="11" fill="#64748b">前年差・前年比・順位</text>

  <rect x="860" y="145" width="280" height="280" fill="#ffffff" stroke="#f59e0b" stroke-width="2" rx="6"/>
  <line x1="860" y1="180" x2="1140" y2="180" stroke="#fef3c7" stroke-width="32"/>
  <text x="895" y="170" font-size="11" font-weight="bold" fill="#92400e">areaCode</text>
  <text x="985" y="170" font-size="11" font-weight="bold" fill="#92400e">diff</text>
  <text x="1050" y="170" font-size="11" font-weight="bold" fill="#92400e">pct</text>
  <text x="1110" y="170" font-size="11" font-weight="bold" fill="#92400e">rank</text>

  <text x="895" y="205" font-size="12" fill="#1e293b">"01000"</text>
  <text x="985" y="205" font-size="12" fill="#059669">+19</text>
  <text x="1050" y="205" font-size="12" fill="#059669">+3.4%</text>
  <text x="1110" y="205" font-size="12" fill="#1e293b">12</text>

  <text x="895" y="230" font-size="12" fill="#1e293b">"13000"</text>
  <text x="985" y="230" font-size="12" fill="#059669">+16</text>
  <text x="1050" y="230" font-size="12" fill="#059669">+2.2%</text>
  <text x="1110" y="230" font-size="12" fill="#1e293b">21</text>

  <text x="895" y="255" font-size="12" fill="#1e293b">"27000"</text>
  <text x="985" y="255" font-size="12" fill="#059669">+13</text>
  <text x="1050" y="255" font-size="12" fill="#059669">+1.9%</text>
  <text x="1110" y="255" font-size="12" fill="#1e293b">26</text>

  <text x="895" y="280" font-size="12" fill="#1e293b">"39000"</text>
  <text x="985" y="280" font-size="12" fill="#dc2626">-8</text>
  <text x="1050" y="280" font-size="12" fill="#dc2626">-1.5%</text>
  <text x="1110" y="280" font-size="12" fill="#1e293b">44</text>

  <text x="895" y="335" font-size="12" fill="#64748b">...</text>
  <text x="985" y="335" font-size="12" fill="#64748b">...</text>
  <text x="1050" y="335" font-size="12" fill="#64748b">...</text>
  <text x="1110" y="335" font-size="12" fill="#64748b">...</text>

  <text x="1000" y="395" text-anchor="middle" font-size="12" fill="#64748b">並べ替え順 = 増減幅</text>
  <text x="1000" y="412" text-anchor="middle" font-size="11" fill="#64748b">議会答弁・政策評価向け</text>

  <!-- Footer note -->
  <rect x="60" y="460" width="1080" height="100" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="6"/>
  <text x="80" y="488" font-size="14" font-weight="bold" fill="#1e293b">特殊値の処理 (e-Stat 仕様)</text>
  <text x="80" y="513" font-size="12" fill="#475569">  「-」 = データなし (調査対象外 / 該当なし) → NaN に置換</text>
  <text x="80" y="533" font-size="12" fill="#475569">  「X」 = 秘匿 (個人情報保護 / 統計法 41 条) → NaN に置換 + is_redacted フラグ保持</text>
  <text x="80" y="553" font-size="12" fill="#64748b">出典: 政府統計の総合窓口 (e-Stat) より</text>
</svg>
