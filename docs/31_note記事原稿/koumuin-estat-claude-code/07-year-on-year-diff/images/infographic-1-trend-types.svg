<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif">
  <rect width="1200" height="600" fill="#fafafa"/>
  <text x="600" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">5 年トレンドの 4 パターン分類</text>
  <text x="600" y="66" text-anchor="middle" font-size="13" fill="#64748b">傾き × 変動係数で 47 都道府県を 4 つの軌跡に分ける</text>

  <!-- 4 quadrants -->
  <!-- 上昇 (top-left) -->
  <rect x="80" y="110" width="500" height="200" fill="#d1fae5" stroke="#059669" stroke-width="2" rx="8"/>
  <text x="100" y="142" font-size="18" font-weight="bold" fill="#065f46">上昇</text>
  <text x="100" y="164" font-size="12" fill="#065f46">年率 +2.0% 以上 / 変動係数 ≦ 15%</text>

  <!-- Mini chart 上昇 -->
  <polyline points="380,275 410,260 440,242 470,225 500,205 530,180" fill="none" stroke="#059669" stroke-width="3"/>
  <circle cx="380" cy="275" r="4" fill="#059669"/>
  <circle cx="410" cy="260" r="4" fill="#059669"/>
  <circle cx="440" cy="242" r="4" fill="#059669"/>
  <circle cx="470" cy="225" r="4" fill="#059669"/>
  <circle cx="500" cy="205" r="4" fill="#059669"/>
  <circle cx="530" cy="180" r="4" fill="#059669"/>
  <text x="100" y="195" font-size="11" fill="#064e3b">例: 高齢化率、医療費、独居世帯</text>
  <text x="100" y="215" font-size="11" fill="#064e3b">議会説明: 「右肩上がり傾向、施策強化」</text>

  <!-- 下降 (top-right) -->
  <rect x="620" y="110" width="500" height="200" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="8"/>
  <text x="640" y="142" font-size="18" font-weight="bold" fill="#991b1b">下降</text>
  <text x="640" y="164" font-size="12" fill="#991b1b">年率 -2.0% 以下 / 変動係数 ≦ 15%</text>

  <!-- Mini chart 下降 -->
  <polyline points="920,180 950,200 980,225 1010,245 1040,260 1070,275" fill="none" stroke="#dc2626" stroke-width="3"/>
  <circle cx="920" cy="180" r="4" fill="#dc2626"/>
  <circle cx="950" cy="200" r="4" fill="#dc2626"/>
  <circle cx="980" cy="225" r="4" fill="#dc2626"/>
  <circle cx="1010" cy="245" r="4" fill="#dc2626"/>
  <circle cx="1040" cy="260" r="4" fill="#dc2626"/>
  <circle cx="1070" cy="275" r="4" fill="#dc2626"/>
  <text x="640" y="195" font-size="11" fill="#7f1d1d">例: 出生数、若年人口、農業就業者</text>
  <text x="640" y="215" font-size="11" fill="#7f1d1d">議会説明: 「対策の効果検証が必要」</text>

  <!-- 安定 (bottom-left) -->
  <rect x="80" y="330" width="500" height="200" fill="#cffafe" stroke="#0891b2" stroke-width="2" rx="8"/>
  <text x="100" y="362" font-size="18" font-weight="bold" fill="#0e7490">安定</text>
  <text x="100" y="384" font-size="12" fill="#0e7490">年率 ±2.0% 以内 / 変動係数 ≦ 15%</text>

  <!-- Mini chart 安定 -->
  <polyline points="380,470 410,468 440,470 470,468 500,470 530,470" fill="none" stroke="#0891b2" stroke-width="3"/>
  <circle cx="380" cy="470" r="4" fill="#0891b2"/>
  <circle cx="410" cy="468" r="4" fill="#0891b2"/>
  <circle cx="440" cy="470" r="4" fill="#0891b2"/>
  <circle cx="470" cy="468" r="4" fill="#0891b2"/>
  <circle cx="500" cy="470" r="4" fill="#0891b2"/>
  <circle cx="530" cy="470" r="4" fill="#0891b2"/>
  <text x="100" y="415" font-size="11" fill="#155e75">例: 公務員数、就業率、可住地面積</text>
  <text x="100" y="435" font-size="11" fill="#155e75">議会説明: 「現状維持、構造的変化なし」</text>

  <!-- 揺れ (bottom-right) -->
  <rect x="620" y="330" width="500" height="200" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="8"/>
  <text x="640" y="362" font-size="18" font-weight="bold" fill="#92400e">揺れ</text>
  <text x="640" y="384" font-size="12" fill="#92400e">変動係数 > 15% (傾き問わず)</text>

  <!-- Mini chart 揺れ -->
  <polyline points="920,450 950,420 980,475 1010,400 1040,460 1070,430" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="920" cy="450" r="4" fill="#f59e0b"/>
  <circle cx="950" cy="420" r="4" fill="#f59e0b"/>
  <circle cx="980" cy="475" r="4" fill="#f59e0b"/>
  <circle cx="1010" cy="400" r="4" fill="#f59e0b"/>
  <circle cx="1040" cy="460" r="4" fill="#f59e0b"/>
  <circle cx="1070" cy="430" r="4" fill="#f59e0b"/>
  <text x="640" y="415" font-size="11" fill="#78350f">例: 観光客数、漁獲量、訪日外国人</text>
  <text x="640" y="435" font-size="11" fill="#78350f">議会説明: 「外的要因の影響大、別途分析」</text>

  <!-- Footer -->
  <rect x="80" y="550" width="1040" height="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="4"/>
  <text x="100" y="571" font-size="12" fill="#64748b">閾値は分野により調整: 物価系 ±1.0% / 10%、人口系 ±0.5% / 5% が目安</text>
</svg>
