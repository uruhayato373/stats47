<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<style>
  text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif; }
</style>

<rect width="1200" height="600" fill="#fafafa"/>

<text x="600" y="50" text-anchor="middle" font-size="26" font-weight="bold" fill="#1e293b">stats47.jp のアーキテクチャ (簡略版)</text>
<line x1="420" y1="70" x2="780" y2="70" stroke="#0891b2" stroke-width="3" stroke-linecap="round"/>

<!-- Layer 1: データ取得 -->
<text x="80" y="125" font-size="14" font-weight="700" fill="#475569">① データ取得層</text>
<line x1="40" y1="137" x2="180" y2="137" stroke="#0891b2" stroke-width="2"/>

<g transform="translate(60, 150)">
  <rect width="220" height="60" rx="8" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <text x="110" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#0891b2">e-Stat API</text>
  <text x="110" y="48" text-anchor="middle" font-size="11" fill="#64748b">統計表 ID で取得</text>
</g>

<g transform="translate(300, 150)">
  <rect width="220" height="60" rx="8" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <text x="110" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#0891b2">/fetch-estat-data</text>
  <text x="110" y="48" text-anchor="middle" font-size="11" fill="#64748b">取得 skill</text>
</g>

<path d="M 290 180 L 295 180" stroke="#0891b2" stroke-width="2" fill="none"/>

<!-- Layer 2: DB -->
<text x="80" y="265" font-size="14" font-weight="700" fill="#475569">② DB 層</text>
<line x1="40" y1="277" x2="180" y2="277" stroke="#7c3aed" stroke-width="2"/>

<g transform="translate(60, 290)">
  <rect width="460" height="80" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="230" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#7c3aed">Cloudflare D1 (SQLite 互換)</text>
  <text x="230" y="56" text-anchor="middle" font-size="12" fill="#475569">47 県 × 約 2,000 指標 ≒ 約 50 万行 / 数百 MB</text>
  <text x="230" y="72" text-anchor="middle" font-size="11" fill="#64748b">主要テーブル: indicators / prefectures / observations / categories</text>
</g>

<g transform="translate(540, 290)">
  <rect width="220" height="80" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="110" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#7c3aed">R2 (オブジェクト)</text>
  <text x="110" y="56" text-anchor="middle" font-size="12" fill="#475569">スナップショット JSON</text>
  <text x="110" y="72" text-anchor="middle" font-size="11" fill="#64748b">app/ranking/ ほか</text>
</g>

<!-- Layer 3: 配信 -->
<text x="80" y="405" font-size="14" font-weight="700" fill="#475569">③ 配信 / 検索層</text>
<line x1="40" y1="417" x2="200" y2="417" stroke="#10b981" stroke-width="2"/>

<g transform="translate(60, 430)">
  <rect width="220" height="60" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="110" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#10b981">Cloudflare Pages</text>
  <text x="110" y="48" text-anchor="middle" font-size="11" fill="#64748b">stats47.jp (Web 公開)</text>
</g>

<g transform="translate(300, 430)">
  <rect width="220" height="60" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="110" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#10b981">MCP sqlite</text>
  <text x="110" y="48" text-anchor="middle" font-size="11" fill="#64748b">Claude Code から SQL</text>
</g>

<g transform="translate(540, 430)">
  <rect width="220" height="60" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="110" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#10b981">Claude Code</text>
  <text x="110" y="48" text-anchor="middle" font-size="11" fill="#64748b">毎日の更新 skill 群</text>
</g>

<!-- Side: 1 自治体規模 -->
<g transform="translate(820, 150)">
  <rect width="320" height="340" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="160" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e" letter-spacing="1">1 自治体で再現するなら</text>

  <text x="20" y="80" font-size="12" font-weight="700" fill="#1e293b">規模:</text>
  <text x="20" y="100" font-size="12" fill="#475569">stats47 の 1/10-1/20 で十分</text>
  <text x="20" y="118" font-size="12" fill="#475569">200 指標 × 47 県 ≒ 9,400 行</text>

  <text x="20" y="155" font-size="12" font-weight="700" fill="#1e293b">構成:</text>
  <text x="20" y="175" font-size="12" fill="#475569">・ ローカル SQLite 1 ファイル</text>
  <text x="20" y="193" font-size="12" fill="#475569">・ Claude Code (CLI)</text>
  <text x="20" y="211" font-size="12" fill="#475569">・ .mcp.json (sqlite 1 行)</text>
  <text x="20" y="229" font-size="12" fill="#475569">・ .claude/skills/ (任意)</text>

  <text x="20" y="265" font-size="12" font-weight="700" fill="#1e293b">投資:</text>
  <text x="20" y="285" font-size="12" fill="#475569">・ 初回 2-3 日</text>
  <text x="20" y="303" font-size="12" fill="#475569">・ ライセンス料 ¥0</text>
  <text x="20" y="321" font-size="12" fill="#475569">・ 投資回収 約 1 ヶ月</text>
</g>

<!-- Footer -->
<rect x="60" y="510" width="1080" height="60" rx="8" fill="#cffafe" stroke="#0891b2" stroke-width="1"/>
<text x="600" y="538" text-anchor="middle" font-size="14" font-weight="bold" fill="#0891b2">同じ仕組みを 1/10 規模で。クラウド BI 不要・LGWAN 制約下でも動作・三層分離内で完結</text>
<text x="600" y="560" text-anchor="middle" font-size="11" fill="#64748b">出典: 政府統計の総合窓口 (e-Stat) — 商用利用可・出典明記必須</text>
</svg>
