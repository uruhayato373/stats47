<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<style>
  text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif; }
</style>

<rect width="1200" height="600" fill="#fafafa"/>

<text x="600" y="50" text-anchor="middle" font-size="26" font-weight="bold" fill="#1e293b">MCP の全体像 — .mcp.json と外部ツールの関係</text>
<line x1="400" y1="70" x2="800" y2="70" stroke="#0891b2" stroke-width="3" stroke-linecap="round"/>

<!-- Claude Code (center top) -->
<g transform="translate(450, 110)">
  <rect width="300" height="100" rx="12" fill="#cffafe" stroke="#0891b2" stroke-width="3"/>
  <text x="150" y="38" text-anchor="middle" font-size="13" font-weight="700" fill="#0891b2" letter-spacing="2">CENTER</text>
  <text x="150" y="70" text-anchor="middle" font-size="22" font-weight="900" fill="#0891b2">Claude Code</text>
  <text x="150" y="92" text-anchor="middle" font-size="12" fill="#475569">ローカル CLI ツール</text>
</g>

<!-- .mcp.json (between Claude Code and MCP servers) -->
<g transform="translate(500, 240)">
  <rect width="200" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="100" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">.mcp.json</text>
  <text x="100" y="45" text-anchor="middle" font-size="10" fill="#475569">サーバー登録ファイル</text>
</g>

<!-- Arrows from Claude Code to .mcp.json and to servers -->
<path d="M 600 215 L 600 235" stroke="#0891b2" stroke-width="2" fill="none"/>

<!-- 5 MCP servers below -->
<!-- sqlite -->
<g transform="translate(60, 340)">
  <rect width="200" height="100" rx="8" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <rect x="0" y="0" width="200" height="6" fill="#0891b2"/>
  <text x="100" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#0891b2">MCP sqlite</text>
  <text x="100" y="56" text-anchor="middle" font-size="11" fill="#475569">SQLite ファイルへの</text>
  <text x="100" y="72" text-anchor="middle" font-size="11" fill="#475569">SQL 実行</text>
  <text x="100" y="92" text-anchor="middle" font-size="10" fill="#0891b2" font-weight="600">★ 本記事の主役</text>
</g>

<!-- playwright -->
<g transform="translate(280, 340)">
  <rect width="200" height="100" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
  <rect x="0" y="0" width="200" height="6" fill="#7c3aed"/>
  <text x="100" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#7c3aed">MCP playwright</text>
  <text x="100" y="60" text-anchor="middle" font-size="11" fill="#475569">ブラウザ自動操作</text>
  <text x="100" y="80" text-anchor="middle" font-size="11" fill="#475569">スクリーンショット</text>
</g>

<!-- git -->
<g transform="translate(500, 340)">
  <rect width="200" height="100" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1"/>
  <rect x="0" y="0" width="200" height="6" fill="#10b981"/>
  <text x="100" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#10b981">MCP git</text>
  <text x="100" y="60" text-anchor="middle" font-size="11" fill="#475569">Git リポジトリ操作</text>
  <text x="100" y="80" text-anchor="middle" font-size="11" fill="#475569">commit / log / diff</text>
</g>

<!-- github -->
<g transform="translate(720, 340)">
  <rect width="200" height="100" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1"/>
  <rect x="0" y="0" width="200" height="6" fill="#475569"/>
  <text x="100" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">MCP github</text>
  <text x="100" y="60" text-anchor="middle" font-size="11" fill="#475569">Issue / PR 操作</text>
  <text x="100" y="80" text-anchor="middle" font-size="11" fill="#475569">レビュー連携</text>
</g>

<!-- mlit -->
<g transform="translate(940, 340)">
  <rect width="200" height="100" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1"/>
  <rect x="0" y="0" width="200" height="6" fill="#f59e0b"/>
  <text x="100" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">MCP mlit-dpf</text>
  <text x="100" y="60" text-anchor="middle" font-size="11" fill="#475569">国交省データ</text>
  <text x="100" y="80" text-anchor="middle" font-size="11" fill="#475569">プラットフォーム</text>
</g>

<!-- Connection lines from .mcp.json to each server -->
<path d="M 550 290 L 160 340" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3" fill="none"/>
<path d="M 580 290 L 380 340" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3" fill="none"/>
<path d="M 600 290 L 600 340" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3" fill="none"/>
<path d="M 620 290 L 820 340" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3" fill="none"/>
<path d="M 650 290 L 1040 340" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3" fill="none"/>

<!-- Footer -->
<rect x="60" y="480" width="1080" height="90" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
<text x="600" y="512" text-anchor="middle" font-size="16" font-weight="bold" fill="#7c3aed">.mcp.json に 1 行追加するだけで Claude Code が外部ツールを呼べる</text>
<text x="600" y="540" text-anchor="middle" font-size="13" fill="#475569">自治体での 1st step は sqlite だけで十分。慣れてから git・github を追加する。</text>
<text x="600" y="562" text-anchor="middle" font-size="11" fill="#64748b">出典: 政府統計の総合窓口 (e-Stat) — 商用利用可・出典明記必須</text>
</svg>
