<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<style>
  text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif; }
  .mono { font-family: 'SF Mono', 'Menlo', 'Consolas', monospace; }
</style>

<rect width="1200" height="600" fill="#fafafa"/>
<text x="600" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">e-Stat Excel の典型構造</text>
<text x="600" y="78" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b">5 シート構成 + 結合セル + 元号年が標準仕様</text>

<!-- Workbook container -->
<rect x="80" y="120" width="1040" height="430" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="100" y="145" font-size="14" font-weight="700" fill="#475569">prefecture-gdp.xlsx</text>

<!-- Sheet tabs (top row) -->
<g>
<rect x="100" y="160" width="180" height="36" rx="6" fill="#fafafa" stroke="#e2e8f0" stroke-width="1"/>
<text x="190" y="184" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">表紙 / 凡例</text>

<rect x="290" y="160" width="180" height="36" rx="6" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
<text x="380" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#0891b2">表 1 名目県内総生産</text>

<rect x="480" y="160" width="180" height="36" rx="6" fill="#fafafa" stroke="#e2e8f0" stroke-width="1"/>
<text x="570" y="184" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">表 2 実質県内総生産</text>

<rect x="670" y="160" width="180" height="36" rx="6" fill="#fafafa" stroke="#e2e8f0" stroke-width="1"/>
<text x="760" y="184" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">表 3 構成比</text>

<rect x="860" y="160" width="180" height="36" rx="6" fill="#fafafa" stroke="#e2e8f0" stroke-width="1"/>
<text x="950" y="184" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">注釈</text>
</g>

<!-- Sheet detail: 表 1 -->
<text x="100" y="230" font-size="14" font-weight="700" fill="#0891b2">▼ 表 1 名目県内総生産 (アクティブシート)</text>

<!-- Header row (2 levels) -->
<rect x="100" y="245" width="120" height="32" fill="#cffafe" stroke="#0891b2" stroke-width="1"/>
<rect x="220" y="245" width="120" height="32" fill="#cffafe" stroke="#0891b2" stroke-width="1"/>
<rect x="340" y="245" width="660" height="32" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
<text x="160" y="266" text-anchor="middle" font-size="12" font-weight="600" class="mono" fill="#1e293b">都道府県コード</text>
<text x="280" y="266" text-anchor="middle" font-size="12" font-weight="600" class="mono" fill="#1e293b">都道府県名</text>
<text x="670" y="266" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">年度ヘッダー (平成 / 令和 混在)</text>

<rect x="100" y="277" width="120" height="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="220" y="277" width="120" height="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="340" y="277" width="110" height="28" fill="#fff7ed" stroke="#e2e8f0" stroke-width="1"/>
<rect x="450" y="277" width="110" height="28" fill="#fff7ed" stroke="#e2e8f0" stroke-width="1"/>
<rect x="560" y="277" width="110" height="28" fill="#fff7ed" stroke="#e2e8f0" stroke-width="1"/>
<rect x="670" y="277" width="110" height="28" fill="#fff7ed" stroke="#e2e8f0" stroke-width="1"/>
<rect x="780" y="277" width="110" height="28" fill="#fff7ed" stroke="#e2e8f0" stroke-width="1"/>
<rect x="890" y="277" width="110" height="28" fill="#fff7ed" stroke="#e2e8f0" stroke-width="1"/>
<text x="395" y="295" text-anchor="middle" font-size="11" class="mono" fill="#1e293b">平成 23 年度</text>
<text x="505" y="295" text-anchor="middle" font-size="11" class="mono" fill="#1e293b">平成 24 年度</text>
<text x="615" y="295" text-anchor="middle" font-size="11" class="mono" fill="#1e293b">平成 30 年度</text>
<text x="725" y="295" text-anchor="middle" font-size="11" class="mono" fill="#1e293b">令和 元年度</text>
<text x="835" y="295" text-anchor="middle" font-size="11" class="mono" fill="#1e293b">令和 3 年度</text>
<text x="945" y="295" text-anchor="middle" font-size="11" class="mono" fill="#1e293b">令和 5 年度</text>

<!-- Data rows -->
<g>
<rect x="100" y="305" width="120" height="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="220" y="305" width="120" height="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="340" y="305" width="660" height="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="160" y="323" text-anchor="middle" font-size="12" class="mono" fill="#1e293b">01</text>
<text x="280" y="323" text-anchor="middle" font-size="12" class="mono" fill="#1e293b">北海道</text>
<text x="670" y="323" text-anchor="middle" font-size="11" class="mono" fill="#64748b">19,234,000  |  19,567,000  |  ...</text>

<rect x="100" y="333" width="120" height="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="220" y="333" width="120" height="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="340" y="333" width="660" height="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="160" y="351" text-anchor="middle" font-size="12" class="mono" fill="#1e293b">02</text>
<text x="280" y="351" text-anchor="middle" font-size="12" class="mono" fill="#1e293b">青森県</text>
<text x="670" y="351" text-anchor="middle" font-size="11" class="mono" fill="#64748b">4,358,000  |  4,412,000  |  ...</text>

<text x="280" y="380" text-anchor="middle" font-size="13" fill="#64748b">... (47 県分) ...</text>

<rect x="100" y="395" width="120" height="28" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
<rect x="220" y="395" width="120" height="28" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
<rect x="340" y="395" width="660" height="28" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
<text x="160" y="413" text-anchor="middle" font-size="12" class="mono" fill="#92400e">00</text>
<text x="280" y="413" text-anchor="middle" font-size="12" class="mono" fill="#92400e">全国 (合計)</text>
<text x="670" y="413" text-anchor="middle" font-size="11" class="mono" fill="#92400e">499,200,000  |  ... ← 集計に混ぜると 2 倍になる</text>
</g>

<!-- 注意ボックス -->
<rect x="100" y="445" width="900" height="85" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
<text x="120" y="470" font-size="13" font-weight="700" fill="#92400e">この Excel で踏みやすい地雷</text>
<text x="120" y="492" font-size="12" fill="#92400e">• 表 1 と表 2 で同じレイアウトだが、列ヘッダーの「平成」「令和」表記が混在している</text>
<text x="120" y="510" font-size="12" fill="#92400e">• 「都道府県コード」「都道府県名」のセル結合 / 末尾の「全国」「再掲」「小計」行</text>
</svg>
