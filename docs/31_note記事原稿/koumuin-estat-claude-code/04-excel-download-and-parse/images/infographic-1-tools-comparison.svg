<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<style>
  text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif; }
</style>

<rect width="1200" height="600" fill="#fafafa"/>
<text x="600" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">pandas vs DuckDB 使い分け</text>
<text x="600" y="78" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b">場面で選ぶ。両方使うのが実運用の最適解</text>

<!-- Left: pandas -->
<rect x="60" y="120" width="520" height="420" rx="14" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
<rect x="60" y="120" width="520" height="60" rx="14" fill="#cffafe"/>
<text x="320" y="160" text-anchor="middle" font-size="22" font-weight="700" fill="#0891b2">pandas (openpyxl)</text>

<text x="90" y="215" font-size="14" font-weight="700" fill="#1e293b">向いている場面</text>

<g fill="#1e293b" font-size="13">
<text x="90" y="245">• 多シート + セル結合 + 元号変換</text>
<text x="90" y="270">• 不整形 Excel の構造把握</text>
<text x="90" y="295">• 数値中に文字混在 (秘匿マスク など)</text>
<text x="90" y="320">• Python 既存資産との連携</text>
<text x="90" y="345">• .xls 旧形式 (xlrd 経由)</text>
</g>

<rect x="80" y="370" width="480" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
<text x="100" y="392" font-size="12" font-weight="700" fill="#92400e">弱み</text>
<text x="100" y="412" font-size="12" fill="#92400e">数百万行を超えるとメモリと速度がきつい</text>

<text x="320" y="475" text-anchor="middle" font-size="32" font-weight="900" fill="#0891b2">柔軟性</text>
<text x="320" y="510" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b">e-Stat の癖を吸収しやすい</text>

<!-- Right: DuckDB -->
<rect x="620" y="120" width="520" height="420" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
<rect x="620" y="120" width="520" height="60" rx="14" fill="#ede9fe"/>
<text x="880" y="160" text-anchor="middle" font-size="22" font-weight="700" fill="#7c3aed">DuckDB</text>

<text x="650" y="215" font-size="14" font-weight="700" fill="#1e293b">向いている場面</text>

<g fill="#1e293b" font-size="13">
<text x="650" y="245">• 複数ファイル横断の JOIN 集計</text>
<text x="650" y="270">• Power Query / Access 経験者の移行</text>
<text x="650" y="295">• 数億行・全国市区町村 1,700 自治体</text>
<text x="650" y="320">• Parquet / CSV / Excel の SQL 横断</text>
<text x="650" y="345">• 単一バイナリ配布 (インストール簡単)</text>
</g>

<rect x="640" y="370" width="480" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
<text x="660" y="392" font-size="12" font-weight="700" fill="#92400e">弱み</text>
<text x="660" y="412" font-size="12" fill="#92400e">.xls (旧形式) 非対応 / 複雑な不整形 Excel</text>

<text x="880" y="475" text-anchor="middle" font-size="32" font-weight="900" fill="#7c3aed">SQL 親和</text>
<text x="880" y="510" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b">集計と JOIN は圧倒的に書きやすい</text>

<text x="600" y="580" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b">推奨: pandas で構造把握 + 整形 → Parquet 保存 → 以降の集計は DuckDB</text>
</svg>
