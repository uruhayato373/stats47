<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520">
  <style>text{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP',sans-serif;}</style>
  <rect width="1280" height="520" fill="#ffffff"/>
  <text x="640" y="60" text-anchor="middle" font-size="30" font-weight="800" fill="#0f172a">財政指標の同規模比較：5 つの工程（手順 8 で毎年の作業にする）</text>

  <g font-size="20">
    <rect x="40" y="130" width="220" height="200" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="150" y="175" text-anchor="middle" font-weight="800" fill="#1d4ed8">① 取得（手順 1）</text>
    <text x="150" y="220" text-anchor="middle" fill="#0f172a">e-Stat の 2 表</text>
    <text x="150" y="252" text-anchor="middle" font-size="16" fill="#475569">財政 0000020204</text>
    <text x="150" y="278" text-anchor="middle" font-size="16" fill="#475569">人口 0000020201</text>

    <rect x="285" y="130" width="220" height="200" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="395" y="175" text-anchor="middle" font-weight="800" fill="#c2410c">② 記号の処理（手順 2）</text>
    <text x="395" y="220" text-anchor="middle" fill="#0f172a">将来負担比率の</text>
    <text x="395" y="250" text-anchor="middle" fill="#0f172a">「－」は 0 とする</text>
    <text x="395" y="282" text-anchor="middle" font-size="16" fill="#475569">他指標の「－」は除外</text>

    <rect x="530" y="130" width="220" height="200" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="640" y="175" text-anchor="middle" font-weight="800" fill="#1d4ed8">③ 同規模（手順 3）</text>
    <text x="640" y="220" text-anchor="middle" fill="#0f172a">人口 ±20% の市</text>
    <text x="640" y="252" text-anchor="middle" font-size="16" fill="#475569">政令市の区・町村は</text>
    <text x="640" y="278" text-anchor="middle" font-size="16" fill="#475569">対象外</text>

    <rect x="775" y="130" width="220" height="200" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="885" y="175" text-anchor="middle" font-weight="800" fill="#1d4ed8">④ 順位・推移（4〜6）</text>
    <text x="885" y="220" text-anchor="middle" fill="#0f172a">指標ごとの</text>
    <text x="885" y="250" text-anchor="middle" fill="#0f172a">良い方向で順位</text>
    <text x="885" y="282" text-anchor="middle" font-size="16" fill="#475569">＋ 法定基準との距離</text>

    <rect x="1020" y="130" width="220" height="200" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="1130" y="175" text-anchor="middle" font-weight="800" fill="#15803d">⑤ 所見文（手順 7）</text>
    <text x="1130" y="220" text-anchor="middle" fill="#0f172a">AI が下書き</text>
    <text x="1130" y="250" text-anchor="middle" fill="#0f172a">原因は書かせない</text>
    <text x="1130" y="282" text-anchor="middle" font-size="16" fill="#475569">数値は人が突き合わせる</text>
  </g>

  <g fill="#94a3b8">
    <polygon points="283,230 268,221 268,239"/>
    <polygon points="528,230 513,221 513,239"/>
    <polygon points="773,230 758,221 758,239"/>
    <polygon points="1018,230 1003,221 1003,239"/>
  </g>

  <rect x="190" y="370" width="900" height="64" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="640" y="410" text-anchor="middle" font-size="20" fill="#334155">AI への指示に「－」の意味・良い方向・3 か年平均の 3 点を必ず書く</text>
  <text x="1240" y="495" text-anchor="end" font-size="14" fill="#94a3b8">出典: 政府統計の総合窓口（e-Stat）「社会・人口統計体系」</text>
</svg>
