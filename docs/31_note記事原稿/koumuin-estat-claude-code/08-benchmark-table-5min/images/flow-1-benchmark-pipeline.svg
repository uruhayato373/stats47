<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" font-family="'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif">
  <rect width="1200" height="360" fill="#fafafa"/>
  <text x="600" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">他自治体ベンチマーク表 生成パイプライン</text>
  <text x="600" y="62" text-anchor="middle" font-size="13" fill="#64748b">47 県取得 → 同規模抽出 → 3 軸比較 → Markdown / Excel 出力</text>

  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Step 1: e-Stat -->
  <rect x="40" y="120" width="170" height="80" fill="#cffafe" stroke="#0891b2" stroke-width="1.5" rx="6"/>
  <text x="125" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#0e7490">e-Stat API</text>
  <text x="125" y="165" text-anchor="middle" font-size="11" fill="#0e7490">/fetch-estat-data</text>
  <text x="125" y="182" text-anchor="middle" font-size="11" fill="#0e7490">47 県 1 リクエスト</text>

  <line x1="210" y1="160" x2="238" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrB)"/>

  <!-- Step 2: 同規模抽出 -->
  <rect x="240" y="120" width="180" height="80" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" rx="6"/>
  <text x="330" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">同規模自治体抽出</text>
  <text x="330" y="165" text-anchor="middle" font-size="11" fill="#92400e">人口 ±30%</text>
  <text x="330" y="182" text-anchor="middle" font-size="11" fill="#92400e">面積 ±50%</text>

  <line x1="420" y1="160" x2="448" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrB)"/>

  <!-- Step 3: 3 軸計算 -->
  <rect x="450" y="120" width="180" height="80" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" rx="6"/>
  <text x="540" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#5b21b6">3 軸を計算</text>
  <text x="540" y="160" text-anchor="middle" font-size="11" fill="#5b21b6">(1) 全国順位</text>
  <text x="540" y="175" text-anchor="middle" font-size="11" fill="#5b21b6">(2) 全国平均比</text>
  <text x="540" y="190" text-anchor="middle" font-size="11" fill="#5b21b6">(3) 同規模平均比</text>

  <line x1="630" y1="160" x2="658" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrB)"/>

  <!-- Step 4: 整形 -->
  <rect x="660" y="120" width="170" height="80" fill="#fce7f3" stroke="#9d174d" stroke-width="1.5" rx="6"/>
  <text x="745" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#9d174d">テンプレ整形</text>
  <text x="745" y="165" text-anchor="middle" font-size="11" fill="#9d174d">出典表記を自動付与</text>
  <text x="745" y="182" text-anchor="middle" font-size="11" fill="#9d174d">凡例・脚注を付ける</text>

  <line x1="830" y1="160" x2="858" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrB)"/>

  <!-- Step 5: 出力 -->
  <g>
    <rect x="860" y="95" width="200" height="36" fill="#d1fae5" stroke="#059669" stroke-width="1.5" rx="4"/>
    <text x="960" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">Markdown (答弁原稿)</text>
  </g>
  <g>
    <rect x="860" y="140" width="200" height="36" fill="#d1fae5" stroke="#059669" stroke-width="1.5" rx="4"/>
    <text x="960" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">Excel (決裁ルート)</text>
  </g>
  <g>
    <rect x="860" y="185" width="200" height="36" fill="#d1fae5" stroke="#059669" stroke-width="1.5" rx="4"/>
    <text x="960" y="208" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">PDF (印刷配布)</text>
  </g>

  <!-- Bottom comparison -->
  <rect x="180" y="250" width="800" height="50" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3" rx="4"/>
  <text x="580" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">Before: Excel 手作業 1〜2 時間 × 月 5-10 件 = 月 7-14 時間</text>
  <text x="580" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#059669">After: /benchmark-table 一発 5 分 (初回構築 1-2 時間)</text>

  <text x="600" y="334" text-anchor="middle" font-size="12" fill="#64748b">出典: 政府統計の総合窓口 (e-Stat) より / 5 桁地域コード統一</text>
</svg>
