<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="670" viewBox="0 0 1280 670">
  <defs>
    <radialGradient id="tone" cx="16%" cy="14%" r="60%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- コントラスト確保のスクリム (背景を暗く沈める) -->
  <rect width="1280" height="670" fill="#060a13" opacity="0.44"/>
  <!-- カテゴリトーン (左上グロー) -->
  <rect width="1280" height="670" fill="url(#tone)"/>
  <!-- 上下のアクセント極細ライン -->
  <rect x="0" y="0" width="1280" height="5" fill="#fb923c" opacity="0.9"/>

  <!-- 中央ボックス -->
  <rect x="150" y="125" width="980" height="420" rx="22"
    fill="#0b1220" fill-opacity="0.62"
    stroke="#fb923c" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- 上段左: 番号+カテゴリ -->
  <rect x="190" y="165" width="161" height="40" rx="20"
    fill="#fb923c" fill-opacity="0.16"
    stroke="#fb923c" stroke-opacity="0.6" stroke-width="1"/>
  <text x="270.5" y="192" text-anchor="middle"
    font-size="17" font-weight="700" letter-spacing="1.5"
    font-family="'Arial','Helvetica',sans-serif" fill="#fb923c">#08  OUTPUT</text>

  <!-- 上段右: 無料/有料 -->
  <rect x="1012" y="165" width="78" height="40" rx="20" fill="#22c55e"/>
  <text x="1051" y="192" text-anchor="middle"
    font-size="18" font-weight="800" fill="#0b1220">無料</text>

  <!-- タイトル (中央) -->
  <style>text{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP',sans-serif;}</style>
  <text x="640" y="310" text-anchor="middle" font-size="50" font-weight="800" fill="#f8fafc">他自治体ベンチマー</text>
  <text x="640" y="376" text-anchor="middle" font-size="50" font-weight="800" fill="#f8fafc">ク表を 5 分で作る</text>

  <!-- アクセントディバイダ -->
  <rect x="606" y="449" width="68" height="4" rx="2" fill="#fb923c"/>

  <!-- 下段: シリーズ + フッター -->
  <text x="640" y="493" text-anchor="middle" font-size="19" font-weight="600" fill="#cbd5e1" opacity="0.92">公務員 × e-Stat × Claude Code</text>
  <text x="640" y="521" text-anchor="middle" font-size="15" font-weight="500" fill="#94a3b8" opacity="0.8">公務員のための e-Stat 活用術 ・ stats47.jp</text>
</svg>