<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif">
  <rect width="1200" height="600" fill="#fafafa"/>
  <text x="600" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">ベンチマークの 3 軸</text>
  <text x="600" y="66" text-anchor="middle" font-size="13" fill="#64748b">議会答弁で必ず問われる 3 つの比較視点をそれぞれ提示する</text>

  <!-- Axis 1: 順位 -->
  <rect x="60" y="110" width="340" height="200" fill="#cffafe" stroke="#0891b2" stroke-width="2" rx="8"/>
  <text x="80" y="142" font-size="18" font-weight="bold" fill="#0e7490">軸 1: 全国順位</text>
  <text x="80" y="164" font-size="12" fill="#0e7490">47 県 / 全市町村の中で何位か</text>

  <!-- Rank visual: bars -->
  <rect x="80" y="190" width="20" height="100" fill="#0891b2" opacity="0.3"/>
  <rect x="105" y="200" width="20" height="90" fill="#0891b2" opacity="0.4"/>
  <rect x="130" y="210" width="20" height="80" fill="#0891b2" opacity="0.5"/>
  <rect x="155" y="220" width="20" height="70" fill="#0891b2" opacity="0.6"/>
  <rect x="180" y="160" width="20" height="130" fill="#0891b2"/>
  <text x="190" y="155" text-anchor="middle" font-size="11" font-weight="bold" fill="#0891b2">★ 当該</text>
  <rect x="205" y="225" width="20" height="65" fill="#0891b2" opacity="0.6"/>
  <rect x="230" y="235" width="20" height="55" fill="#0891b2" opacity="0.5"/>
  <rect x="255" y="245" width="20" height="45" fill="#0891b2" opacity="0.4"/>
  <rect x="280" y="255" width="20" height="35" fill="#0891b2" opacity="0.3"/>
  <text x="240" y="296" text-anchor="middle" font-size="11" fill="#0e7490">表示例: "全国 12 / 47 位"</text>

  <!-- Axis 2: 全国平均比 -->
  <rect x="430" y="110" width="340" height="200" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" rx="8"/>
  <text x="450" y="142" font-size="18" font-weight="bold" fill="#5b21b6">軸 2: 全国平均比</text>
  <text x="450" y="164" font-size="12" fill="#5b21b6">全国平均からの乖離 (%)</text>

  <!-- Mean visual: bar with marker -->
  <line x1="470" y1="240" x2="730" y2="240" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="600" y1="200" x2="600" y2="280" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="600" y="195" text-anchor="middle" font-size="11" fill="#5b21b6">全国平均</text>

  <circle cx="660" cy="240" r="10" fill="#7c3aed"/>
  <text x="660" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b21b6">★ 当該</text>
  <text x="680" y="225" font-size="11" fill="#5b21b6">+12%</text>

  <text x="600" y="300" text-anchor="middle" font-size="11" fill="#5b21b6">表示例: "全国平均比 +12.4%"</text>

  <!-- Axis 3: 同規模比 -->
  <rect x="800" y="110" width="340" height="200" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="8"/>
  <text x="820" y="142" font-size="18" font-weight="bold" fill="#92400e">軸 3: 同規模平均比</text>
  <text x="820" y="164" font-size="12" fill="#92400e">人口 ±30% × 面積 ±50% の自治体平均</text>

  <!-- Similar visual: cluster -->
  <circle cx="900" cy="240" r="14" fill="#f59e0b" opacity="0.5"/>
  <circle cx="930" cy="225" r="14" fill="#f59e0b" opacity="0.5"/>
  <circle cx="950" cy="255" r="14" fill="#f59e0b" opacity="0.5"/>
  <circle cx="980" cy="230" r="14" fill="#f59e0b" opacity="0.5"/>
  <circle cx="1000" cy="250" r="14" fill="#f59e0b" opacity="0.5"/>
  <circle cx="940" cy="245" r="16" fill="#f59e0b" stroke="#78350f" stroke-width="3"/>
  <text x="940" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">★ 当該</text>

  <text x="970" y="300" text-anchor="middle" font-size="11" fill="#92400e">表示例: "同規模 7 自治体平均比 -3.2%"</text>

  <!-- Output template -->
  <rect x="60" y="340" width="1080" height="230" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>
  <text x="80" y="370" font-size="16" font-weight="bold" fill="#1e293b">議会答弁原稿 出力例 (Markdown)</text>

  <rect x="80" y="385" width="1040" height="170" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="4"/>

  <text x="100" y="412" font-size="13" font-weight="bold" fill="#1e293b" font-family="ui-monospace, monospace"># 人口 10 万人あたり医師数 ベンチマーク</text>
  <text x="100" y="436" font-size="12" fill="#475569" font-family="ui-monospace, monospace">## 概要 (3 軸サマリ)</text>
  <text x="100" y="458" font-size="12" fill="#475569" font-family="ui-monospace, monospace">- 順位: 全国 12 / 47 位</text>
  <text x="100" y="478" font-size="12" fill="#475569" font-family="ui-monospace, monospace">- 全国平均比: +12.4% (全国平均 268.4 人)</text>
  <text x="100" y="498" font-size="12" fill="#475569" font-family="ui-monospace, monospace">- 同規模 7 自治体平均比: -3.2% (同規模平均 311.7 人)</text>
  <text x="100" y="524" font-size="11" fill="#64748b" font-style="italic" font-family="ui-monospace, monospace">*出典: 政府統計の総合窓口 (e-Stat) より*</text>
  <text x="100" y="544" font-size="10" fill="#94a3b8">※同規模 = 人口 ±30% かつ面積 ±50%</text>
</svg>
