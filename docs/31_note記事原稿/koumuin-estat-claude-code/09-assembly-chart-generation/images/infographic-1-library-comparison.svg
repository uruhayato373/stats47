<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<style>
  text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif; }
</style>

<rect width="1200" height="600" fill="#fafafa"/>

<text x="600" y="55" text-anchor="middle" font-size="26" font-weight="bold" fill="#1e293b">チャートライブラリ 4 種の比較</text>
<line x1="450" y1="73" x2="750" y2="73" stroke="#0891b2" stroke-width="3" stroke-linecap="round"/>

<!-- Header -->
<rect x="60" y="100" width="1080" height="44" fill="#0891b2"/>
<text x="180" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">ライブラリ</text>
<text x="370" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">言語</text>
<text x="540" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">強み</text>
<text x="780" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">弱み</text>
<text x="1010" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">推奨用途</text>

<!-- Row 1: matplotlib (best for assembly) -->
<rect x="60" y="144" width="1080" height="80" fill="#cffafe" stroke="#e2e8f0"/>
<text x="180" y="178" text-anchor="middle" font-size="17" font-weight="900" fill="#0891b2">matplotlib</text>
<text x="180" y="200" text-anchor="middle" font-size="12" fill="#475569">+ pandas</text>
<text x="370" y="190" text-anchor="middle" font-size="14" fill="#1e293b">Python</text>
<text x="540" y="178" text-anchor="middle" font-size="13" fill="#1e293b">速い・コード短い</text>
<text x="540" y="200" text-anchor="middle" font-size="13" fill="#1e293b">Claude が一発で書ける</text>
<text x="780" y="190" text-anchor="middle" font-size="13" fill="#475569">標準色が古い</text>
<text x="1010" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="#0891b2">議会答弁の急ぎ仕事</text>
<text x="1010" y="200" text-anchor="middle" font-size="11" fill="#64748b">★ デフォルト推奨</text>

<!-- Row 2: D3 -->
<rect x="60" y="224" width="1080" height="80" fill="#ffffff" stroke="#e2e8f0"/>
<text x="180" y="268" text-anchor="middle" font-size="17" font-weight="900" fill="#7c3aed">D3.js</text>
<text x="370" y="268" text-anchor="middle" font-size="14" fill="#1e293b">TypeScript</text>
<text x="540" y="258" text-anchor="middle" font-size="13" fill="#1e293b">美しい・SVG ベース</text>
<text x="540" y="278" text-anchor="middle" font-size="13" fill="#1e293b">印刷・拡大に強い</text>
<text x="780" y="268" text-anchor="middle" font-size="13" fill="#475569">コード量が多い</text>
<text x="1010" y="258" text-anchor="middle" font-size="13" font-weight="600" fill="#7c3aed">県の広報物</text>
<text x="1010" y="278" text-anchor="middle" font-size="13" font-weight="600" fill="#7c3aed">印刷物パンフ</text>

<!-- Row 3: Recharts -->
<rect x="60" y="304" width="1080" height="80" fill="#ffffff" stroke="#e2e8f0"/>
<text x="180" y="348" text-anchor="middle" font-size="17" font-weight="900" fill="#10b981">Recharts</text>
<text x="370" y="348" text-anchor="middle" font-size="14" fill="#1e293b">React</text>
<text x="540" y="338" text-anchor="middle" font-size="13" fill="#1e293b">Web ダッシュ最適</text>
<text x="540" y="358" text-anchor="middle" font-size="13" fill="#1e293b">レスポンシブ自動</text>
<text x="780" y="348" text-anchor="middle" font-size="13" fill="#475569">React 環境が前提</text>
<text x="1010" y="338" text-anchor="middle" font-size="13" font-weight="600" fill="#10b981">庁内ポータル</text>
<text x="1010" y="358" text-anchor="middle" font-size="13" font-weight="600" fill="#10b981">イントラサイト</text>

<!-- Row 4: Plotly -->
<rect x="60" y="384" width="1080" height="80" fill="#ffffff" stroke="#e2e8f0"/>
<text x="180" y="428" text-anchor="middle" font-size="17" font-weight="900" fill="#f59e0b">Plotly</text>
<text x="370" y="428" text-anchor="middle" font-size="14" fill="#1e293b">Python / JS</text>
<text x="540" y="418" text-anchor="middle" font-size="13" fill="#1e293b">インタラクティブ</text>
<text x="540" y="438" text-anchor="middle" font-size="13" fill="#1e293b">マウスホバー対応</text>
<text x="780" y="428" text-anchor="middle" font-size="13" fill="#475569">静止画化の手間</text>
<text x="1010" y="418" text-anchor="middle" font-size="13" font-weight="600" fill="#b45309">上司に触ってもらう</text>
<text x="1010" y="438" text-anchor="middle" font-size="13" font-weight="600" fill="#b45309">提案デモ</text>

<!-- Footer guidance -->
<rect x="60" y="490" width="1080" height="80" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
<text x="600" y="520" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">議会答弁 = matplotlib / 県パンフ = D3 / 庁内 Web = Recharts / 上司提案 = Plotly</text>
<text x="600" y="548" text-anchor="middle" font-size="13" fill="#475569">どれも Claude Code に頼めば一発で書ける。覚えるのは「用途 → ライブラリ」のこの 1 文だけ。</text>
</svg>
