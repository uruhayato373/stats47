<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<style>
  text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif; }
</style>

<rect width="1200" height="600" fill="#fafafa"/>

<text x="600" y="60" text-anchor="middle" font-size="28" font-weight="bold" fill="#1e293b">議会・県民向け資料で使う 4 つのチャート</text>
<line x1="430" y1="80" x2="770" y2="80" stroke="#0891b2" stroke-width="3" stroke-linecap="round"/>

<!-- Card 1: 棒グラフ -->
<g transform="translate(60, 130)">
  <rect width="250" height="200" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="0" y="0" width="250" height="6" fill="#0891b2"/>
  <text x="125" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#0891b2" letter-spacing="2">CHART 1</text>
  <text x="125" y="80" text-anchor="middle" font-size="28" font-weight="900" fill="#0891b2">棒グラフ</text>
  <!-- mini bar -->
  <rect x="40" y="100" width="130" height="10" fill="#0891b2"/>
  <rect x="40" y="116" width="110" height="10" fill="#cbd5e1"/>
  <rect x="40" y="132" width="90" height="10" fill="#cbd5e1"/>
  <rect x="40" y="148" width="70" height="10" fill="#cbd5e1"/>
  <text x="125" y="185" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">順位提示・47 県一気に</text>
</g>

<!-- Card 2: 折れ線 -->
<g transform="translate(330, 130)">
  <rect width="250" height="200" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="0" y="0" width="250" height="6" fill="#0891b2"/>
  <text x="125" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#0891b2" letter-spacing="2">CHART 2</text>
  <text x="125" y="80" text-anchor="middle" font-size="28" font-weight="900" fill="#0891b2">折れ線</text>
  <!-- mini line -->
  <polyline points="40,150 80,135 120,140 160,120 200,105" fill="none" stroke="#0891b2" stroke-width="3"/>
  <polyline points="40,160 80,155 120,150 160,148 200,140" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <text x="125" y="185" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">経年推移・3-5 県の対比</text>
</g>

<!-- Card 3: コロプレス -->
<g transform="translate(600, 130)">
  <rect width="250" height="200" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="0" y="0" width="250" height="6" fill="#0891b2"/>
  <text x="125" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#0891b2" letter-spacing="2">CHART 3</text>
  <text x="125" y="80" text-anchor="middle" font-size="22" font-weight="900" fill="#0891b2">コロプレス地図</text>
  <!-- mini map (rough Japan) -->
  <rect x="50" y="100" width="30" height="20" fill="#0891b2" rx="3"/>
  <rect x="85" y="110" width="35" height="25" fill="#67e8f9" rx="3"/>
  <rect x="125" y="115" width="40" height="25" fill="#22d3ee" rx="3"/>
  <rect x="55" y="130" width="35" height="20" fill="#cffafe" rx="3"/>
  <rect x="95" y="140" width="40" height="20" fill="#0891b2" rx="3"/>
  <text x="125" y="185" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">分布・地域傾向</text>
</g>

<!-- Card 4: 表 -->
<g transform="translate(870, 130)">
  <rect width="250" height="200" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="0" y="0" width="250" height="6" fill="#0891b2"/>
  <text x="125" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#0891b2" letter-spacing="2">CHART 4</text>
  <text x="125" y="80" text-anchor="middle" font-size="28" font-weight="900" fill="#0891b2">表</text>
  <!-- mini table -->
  <rect x="40" y="100" width="170" height="20" fill="#0891b2"/>
  <line x1="40" y1="120" x2="210" y2="120" stroke="#e2e8f0"/>
  <line x1="40" y1="140" x2="210" y2="140" stroke="#e2e8f0"/>
  <line x1="40" y1="160" x2="210" y2="160" stroke="#e2e8f0"/>
  <rect x="40" y="100" width="170" height="65" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <text x="125" y="185" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">数値を全部残したい時</text>
</g>

<!-- Decision flow -->
<rect x="60" y="380" width="1080" height="160" rx="12" fill="#cffafe" stroke="#0891b2" stroke-width="1"/>
<text x="600" y="420" text-anchor="middle" font-size="18" font-weight="bold" fill="#0891b2">迷ったらこの 1 文で決まる</text>
<text x="600" y="455" text-anchor="middle" font-size="15" fill="#1e293b">順位 → 棒グラフ / 変化 → 折れ線 / 分布 → コロプレス地図 / 詳細数値 → 表</text>
<text x="600" y="490" text-anchor="middle" font-size="14" fill="#475569">質問者の発話を 1 単語で要約するだけで自然にチャート種別が決まる。</text>
<text x="600" y="520" text-anchor="middle" font-size="12" fill="#64748b">出典: 政府統計の総合窓口 (e-Stat) — 商用利用可・出典明記必須</text>
</svg>
