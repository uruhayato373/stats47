<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520">
  <style>text{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP',sans-serif;}</style>
  <rect width="1280" height="520" fill="#ffffff"/>
  <text x="640" y="60" text-anchor="middle" font-size="30" font-weight="800" fill="#0f172a">プログラミングなしで作る財政指標の同規模比較</text>

  <g font-size="20">
    <rect x="50" y="130" width="260" height="200" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="180" y="175" text-anchor="middle" font-weight="800" fill="#1d4ed8">① e-Stat（手順 1）</text>
    <text x="180" y="220" text-anchor="middle" fill="#0f172a">画面から CSV を 2 つ</text>
    <text x="180" y="252" text-anchor="middle" font-size="16" fill="#475569">財政指標・人口</text>
    <text x="180" y="278" text-anchor="middle" font-size="16" fill="#475569">特殊文字は「置き換えない」</text>

    <rect x="357" y="130" width="260" height="200" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="487" y="175" text-anchor="middle" font-weight="800" fill="#c2410c">② AI に渡す（2・3）</text>
    <text x="487" y="220" text-anchor="middle" fill="#0f172a">Claude / ChatGPT に</text>
    <text x="487" y="250" text-anchor="middle" fill="#0f172a">ファイル＋プロンプト</text>
    <text x="487" y="282" text-anchor="middle" font-size="16" fill="#475569">3 つの約束事を書き込む</text>

    <rect x="664" y="130" width="260" height="200" rx="16" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="794" y="175" text-anchor="middle" font-weight="800" fill="#b91c1c">③ 検算（手順 4）</text>
    <text x="794" y="220" text-anchor="middle" fill="#0f172a">5 つの確認で</text>
    <text x="794" y="250" text-anchor="middle" fill="#0f172a">AI の間違いを見つける</text>
    <text x="794" y="282" text-anchor="middle" font-size="16" fill="#475569">値・対象数・「－」・向き</text>

    <rect x="971" y="130" width="260" height="200" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="1101" y="175" text-anchor="middle" font-weight="800" fill="#15803d">④ 資料（5〜7）</text>
    <text x="1101" y="220" text-anchor="middle" fill="#0f172a">推移・基準・説明文</text>
    <text x="1101" y="250" text-anchor="middle" fill="#0f172a">原因は書かせない</text>
    <text x="1101" y="282" text-anchor="middle" font-size="16" fill="#475569">Excel 化・毎年使い回す</text>
  </g>

  <g fill="#94a3b8">
    <polygon points="352,230 334,220 334,240"/>
    <polygon points="659,230 641,220 641,240"/>
    <polygon points="966,230 948,220 948,240"/>
  </g>

  <rect x="190" y="370" width="900" height="64" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="640" y="410" text-anchor="middle" font-size="20" fill="#334155">コードは一行も書かない。そのかわり「確かめ方」を先に決めておく</text>
  <text x="1240" y="495" text-anchor="end" font-size="14" fill="#94a3b8">出典: 政府統計の総合窓口（e-Stat）「社会・人口統計体系」</text>
</svg>
