<svg width="960" height="454" viewBox="0 0 960 454" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="石川県の特徴的な支出品目">
  <title>石川県の特徴的な支出品目</title>
  <rect width="960" height="454" fill="#f9fafb"/>
  <text x="480" y="36" text-anchor="middle" font-family="'Noto Sans JP',sans-serif" font-size="20" font-weight="bold" fill="#1f2937">全国平均と比べて特徴的な品目</text>
  <text x="480" y="58" text-anchor="middle" font-family="'Noto Sans JP',sans-serif" font-size="13" fill="#6b7280">石川県（金沢市）2024年</text>
  <rect x="30" y="80" width="432" height="40" rx="8" fill="#1565c0"/>  <text x="246" y="106" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">全国平均より多い</text>
  <rect x="30" y="124" width="432" height="56" rx="6" fill="#e3f2fd"/>
  <circle cx="58" cy="152" r="17" fill="#1565c0"/>  <text x="58" y="157.04" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">1</text>
  <text x="83" y="157.04" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#1f2937">他の家賃地代</text>
  <text x="244.64000000000001" y="156.68" text-anchor="end" font-family="'Noto Sans JP', sans-serif" font-size="13" fill="#1565c0" font-weight="600">3.37倍</text>
  <rect x="254.64000000000001" y="144" width="190.1" height="16" rx="4" fill="#42a5f5" opacity="0.8"/>
  <rect x="30" y="180" width="432" height="56" rx="6" fill="#ffffff"/>
  <circle cx="58" cy="208" r="17" fill="#1565c0"/>  <text x="58" y="213.04" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">2</text>
  <text x="83" y="213.04" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#1f2937">そうざい材料セット</text>
  <text x="244.64000000000001" y="212.68" text-anchor="end" font-family="'Noto Sans JP', sans-serif" font-size="13" fill="#1565c0" font-weight="600">2.99倍</text>
  <rect x="254.64000000000001" y="200" width="168.8" height="16" rx="4" fill="#42a5f5" opacity="0.8"/>
  <rect x="30" y="236" width="432" height="56" rx="6" fill="#e3f2fd"/>
  <circle cx="58" cy="264" r="17" fill="#1565c0"/>  <text x="58" y="269.04" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">3</text>
  <text x="83" y="269.04" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#1f2937">教養娯楽用耐久財修理代</text>
  <text x="244.64000000000001" y="268.68" text-anchor="end" font-family="'Noto Sans JP', sans-serif" font-size="13" fill="#1565c0" font-weight="600">2.92倍</text>
  <rect x="254.64000000000001" y="256" width="164.4" height="16" rx="4" fill="#42a5f5" opacity="0.8"/>
  <rect x="30" y="292" width="432" height="56" rx="6" fill="#ffffff"/>
  <circle cx="58" cy="320" r="17" fill="#1565c0"/>  <text x="58" y="325.04" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">4</text>
  <text x="83" y="325.04" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#1f2937">写真撮影・プリント代</text>
  <text x="244.64000000000001" y="324.68" text-anchor="end" font-family="'Noto Sans JP', sans-serif" font-size="13" fill="#1565c0" font-weight="600">2.82倍</text>
  <rect x="254.64000000000001" y="312" width="159" height="16" rx="4" fill="#42a5f5" opacity="0.8"/>
  <rect x="30" y="348" width="432" height="56" rx="6" fill="#e3f2fd"/>
  <circle cx="58" cy="376" r="17" fill="#1565c0"/>  <text x="58" y="381.04" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">5</text>
  <text x="83" y="381.04" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#1f2937">自動車以外の輸送機器整備費</text>
  <text x="244.64000000000001" y="380.68" text-anchor="end" font-family="'Noto Sans JP', sans-serif" font-size="13" fill="#1565c0" font-weight="600">2.46倍</text>
  <rect x="254.64000000000001" y="368" width="138.5" height="16" rx="4" fill="#42a5f5" opacity="0.8"/>
  <rect x="498" y="80" width="432" height="40" rx="8" fill="#b71c1c"/>  <text x="714" y="106" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">全国平均より少ない</text>
  <rect x="498" y="124" width="432" height="56" rx="6" fill="#fef2f2"/>
  <circle cx="526" cy="152" r="17" fill="#b71c1c"/>  <text x="526" y="157.04" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">1</text>
  <text x="551" y="157.04" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#1f2937">自動車教習料</text>
  <text x="712.64" y="156.68" text-anchor="end" font-family="'Noto Sans JP', sans-serif" font-size="13" fill="#b71c1c" font-weight="600">0.09倍</text>
  <rect x="722.64" y="144" width="190.1" height="16" rx="4" fill="#ef5350" opacity="0.8"/>
  <rect x="498" y="180" width="432" height="56" rx="6" fill="#ffffff"/>
  <circle cx="526" cy="208" r="17" fill="#b71c1c"/>  <text x="526" y="213.04" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">2</text>
  <text x="551" y="213.04" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#1f2937">身の回り用品関連サービス</text>
  <text x="712.64" y="212.68" text-anchor="end" font-family="'Noto Sans JP', sans-serif" font-size="13" fill="#b71c1c" font-weight="600">0.10倍</text>
  <rect x="722.64" y="200" width="188" height="16" rx="4" fill="#ef5350" opacity="0.8"/>
  <rect x="498" y="236" width="432" height="56" rx="6" fill="#fef2f2"/>
  <circle cx="526" cy="264" r="17" fill="#b71c1c"/>  <text x="526" y="269.04" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">3</text>
  <text x="551" y="269.04" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#1f2937">通学用かばん</text>
  <text x="712.64" y="268.68" text-anchor="end" font-family="'Noto Sans JP', sans-serif" font-size="13" fill="#b71c1c" font-weight="600">0.11倍</text>
  <rect x="722.64" y="256" width="186.3" height="16" rx="4" fill="#ef5350" opacity="0.8"/>
  <rect x="498" y="292" width="432" height="56" rx="6" fill="#ffffff"/>
  <circle cx="526" cy="320" r="17" fill="#b71c1c"/>  <text x="526" y="325.04" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">4</text>
  <text x="551" y="325.04" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#1f2937">腕時計</text>
  <text x="712.64" y="324.68" text-anchor="end" font-family="'Noto Sans JP', sans-serif" font-size="13" fill="#b71c1c" font-weight="600">0.11倍</text>
  <rect x="722.64" y="312" width="186.1" height="16" rx="4" fill="#ef5350" opacity="0.8"/>
  <rect x="498" y="348" width="432" height="56" rx="6" fill="#fef2f2"/>
  <circle cx="526" cy="376" r="17" fill="#b71c1c"/>  <text x="526" y="381.04" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">5</text>
  <text x="551" y="381.04" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#1f2937">マッサージ料金等(診療外)</text>
  <text x="712.64" y="380.68" text-anchor="end" font-family="'Noto Sans JP', sans-serif" font-size="13" fill="#b71c1c" font-weight="600">0.12倍</text>
  <rect x="722.64" y="368" width="185.7" height="16" rx="4" fill="#ef5350" opacity="0.8"/>
  <text x="480" y="429" text-anchor="middle" font-family="'Noto Sans JP',sans-serif" font-size="11" fill="#6b7280">出典：総務省「家計調査」2024年　全国平均との比率</text>
</svg>