  <circle cx="526" cy="376" r="17" fill="#b71c1c"/>  <text x="526" y="381.04" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">5</text>
  <text x="551" y="381.04" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#1f2937">外国パック旅行費</text>
  <text x="712.64" y="380.68" text-anchor="end" font-family="'Noto Sans JP', sans-serif" font-size="13" fill="#b71c1c" font-weight="600">0.10倍</text>
