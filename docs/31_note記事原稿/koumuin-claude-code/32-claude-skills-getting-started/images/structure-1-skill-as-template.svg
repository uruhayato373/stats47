<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif">
  <rect width="800" height="360" fill="#FAFAFA"/>
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E293B">共有フォルダの「ひな形」と skill は同じ発想</text>
  <text x="400" y="53" text-anchor="middle" font-size="12" fill="#64748B">良い成果物を保存して、何度も使い回す仕組み</text>

  <!-- left panel: ひな形 -->
  <rect x="60" y="72" width="310" height="232" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="215" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#475569">いつもの「ひな形」運用</text>

  <rect x="80" y="116" width="270" height="46" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" rx="6"/>
  <text x="215" y="144" text-anchor="middle" font-size="13" fill="#1E293B">課の共有フォルダ</text>

  <rect x="80" y="174" width="270" height="46" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" rx="6"/>
  <text x="215" y="202" text-anchor="middle" font-size="13" fill="#1E293B">○○通知 ひな形.docx</text>

  <rect x="80" y="232" width="270" height="46" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" rx="6"/>
  <text x="215" y="260" text-anchor="middle" font-size="13" fill="#1E293B">開いて中身を差し替える</text>

  <!-- right panel: skill -->
  <rect x="430" y="72" width="310" height="232" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5" rx="8"/>
  <text x="585" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F766E">Claude Code の skill</text>

  <rect x="450" y="116" width="270" height="46" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5" rx="6"/>
  <text x="585" y="144" text-anchor="middle" font-size="13" fill="#1E293B">.claude/skills/ フォルダ</text>

  <rect x="450" y="174" width="270" height="46" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5" rx="6"/>
  <text x="585" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E293B">SKILL.md（頼み方を保存）</text>

  <rect x="450" y="232" width="270" height="46" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5" rx="6"/>
  <text x="585" y="260" text-anchor="middle" font-size="13" fill="#1E293B">「議事録作って」で呼び出す</text>

  <!-- connectors -->
  <text x="400" y="145" text-anchor="middle" font-size="22" font-weight="bold" fill="#94A3B8">≒</text>
  <text x="400" y="203" text-anchor="middle" font-size="22" font-weight="bold" fill="#94A3B8">≒</text>
  <text x="400" y="261" text-anchor="middle" font-size="22" font-weight="bold" fill="#94A3B8">≒</text>

  <text x="400" y="332" text-anchor="middle" font-size="11" fill="#475569" font-style="italic">違いは「中身がただの日本語」で、判断を伴う作業も任せられること</text>
</svg>
