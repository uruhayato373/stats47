<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif">
  <rect width="800" height="400" fill="#FAFAFA"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E293B">skill にすべき業務 — 3 つの見分け方</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#64748B">3 つのうち 1 つでも当てはまれば skill 化の価値あり</text>

  <defs>
    <marker id="arr32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F766E"/>
    </marker>
  </defs>

  <!-- condition 1 -->
  <g>
    <rect x="50" y="80" width="440" height="58" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5" rx="6"/>
    <circle cx="82" cy="109" r="16" fill="#0F766E"/>
    <text x="82" y="115" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">1</text>
    <text x="112" y="105" font-size="14" font-weight="bold" fill="#1E293B">毎回ほぼ同じ手順を繰り返している</text>
    <text x="112" y="124" font-size="10.5" fill="#0F766E">月次報告の集約・議事録作成・前年度比較 など</text>
  </g>

  <!-- condition 2 -->
  <g>
    <rect x="50" y="148" width="440" height="58" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5" rx="6"/>
    <circle cx="82" cy="177" r="16" fill="#0F766E"/>
    <text x="82" y="183" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">2</text>
    <text x="112" y="173" font-size="14" font-weight="bold" fill="#1E293B">誰がやっても同じ結果になるはず</text>
    <text x="112" y="192" font-size="10.5" fill="#0F766E">公用文の校正・起案文のチェック など</text>
  </g>

  <!-- condition 3 -->
  <g>
    <rect x="50" y="216" width="440" height="58" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5" rx="6"/>
    <circle cx="82" cy="245" r="16" fill="#0F766E"/>
    <text x="82" y="251" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">3</text>
    <text x="112" y="241" font-size="14" font-weight="bold" fill="#1E293B">手順が特定の人の頭の中にしかない</text>
    <text x="112" y="260" font-size="10.5" fill="#0F766E">属人化したベテランの段取り＝共有価値が最も高い</text>
  </g>

  <!-- converging arrows -->
  <line x1="492" y1="109" x2="536" y2="167" stroke="#0F766E" stroke-width="1.5" marker-end="url(#arr32)"/>
  <line x1="492" y1="177" x2="536" y2="177" stroke="#0F766E" stroke-width="1.5" marker-end="url(#arr32)"/>
  <line x1="492" y1="245" x2="536" y2="187" stroke="#0F766E" stroke-width="1.5" marker-end="url(#arr32)"/>

  <!-- outcome -->
  <rect x="540" y="128" width="220" height="98" fill="#DCFCE7" stroke="#16A34A" stroke-width="2" rx="8"/>
  <text x="650" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">skill 化の価値あり</text>
  <text x="650" y="184" text-anchor="middle" font-size="11" fill="#15803D">SKILL.md に保存し、</text>
  <text x="650" y="201" text-anchor="middle" font-size="11" fill="#15803D">課・係で共有・引き継ぐ</text>

  <!-- not-skill box -->
  <rect x="50" y="304" width="710" height="62" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5" rx="6"/>
  <text x="70" y="330" font-size="13" font-weight="bold" fill="#1E293B">skill にしないもの</text>
  <text x="70" y="351" font-size="11" fill="#B91C1C">一度きりで二度とやらない作業／毎回、判断や進め方が大きく変わる作業</text>
</svg>
