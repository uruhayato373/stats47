<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif">
  <rect width="800" height="440" fill="#FAFAFA"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E293B">効くプロンプトの 5 つの欄</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#64748B">「異動してきた新人への引き継ぎメモ」のように 5 つの欄を埋める</text>

  <defs>
    <marker id="arr31" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- prompt frame -->
  <rect x="40" y="78" width="470" height="344" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6,4" rx="8"/>
  <text x="58" y="100" font-size="12" font-weight="bold" fill="#64748B">プロンプト（頼み方）</text>

  <!-- row 1: 役割 -->
  <g>
    <rect x="58" y="110" width="434" height="52" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="1.5" rx="6"/>
    <circle cx="88" cy="136" r="15" fill="#1E3A8A"/>
    <text x="88" y="141" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">1</text>
    <text x="116" y="132" font-size="14" font-weight="bold" fill="#1E293B">役割と前提</text>
    <text x="116" y="151" font-size="10.5" fill="#1E3A8A">誰として・どんな状況で作業するか</text>
  </g>

  <!-- row 2: 入力 -->
  <g>
    <rect x="58" y="172" width="434" height="52" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5" rx="6"/>
    <circle cx="88" cy="198" r="15" fill="#0F766E"/>
    <text x="88" y="203" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">2</text>
    <text x="116" y="194" font-size="14" font-weight="bold" fill="#1E293B">入力</text>
    <text x="116" y="213" font-size="10.5" fill="#0F766E">どのファイル・どの情報を見るか</text>
  </g>

  <!-- row 3: 成果物 -->
  <g>
    <rect x="58" y="234" width="434" height="52" fill="#FEF3C7" stroke="#92400E" stroke-width="1.5" rx="6"/>
    <circle cx="88" cy="260" r="15" fill="#92400E"/>
    <text x="88" y="265" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">3</text>
    <text x="116" y="256" font-size="14" font-weight="bold" fill="#1E293B">成果物</text>
    <text x="116" y="275" font-size="10.5" fill="#92400E">何を・どの形式で・どこに保存するか</text>
  </g>

  <!-- row 4: 制約 -->
  <g>
    <rect x="58" y="296" width="434" height="52" fill="#FCE7F3" stroke="#9D174D" stroke-width="1.5" rx="6"/>
    <circle cx="88" cy="322" r="15" fill="#9D174D"/>
    <text x="88" y="327" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">4</text>
    <text x="116" y="318" font-size="14" font-weight="bold" fill="#1E293B">制約</text>
    <text x="116" y="337" font-size="10.5" fill="#9D174D">文体・分量・守秘・触ってはいけない箇所</text>
  </g>

  <!-- row 5: 確認 -->
  <g>
    <rect x="58" y="358" width="434" height="52" fill="#E0E7FF" stroke="#4338CA" stroke-width="1.5" rx="6"/>
    <circle cx="88" cy="384" r="15" fill="#4338CA"/>
    <text x="88" y="389" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">5</text>
    <text x="116" y="380" font-size="14" font-weight="bold" fill="#1E293B">確認</text>
    <text x="116" y="399" font-size="10.5" fill="#4338CA">迷ったら推測せず、作業前に質問させる</text>
  </g>

  <!-- arrow to result -->
  <line x1="512" y1="250" x2="556" y2="250" stroke="#64748B" stroke-width="2" marker-end="url(#arr31)"/>

  <!-- result -->
  <rect x="558" y="204" width="208" height="92" fill="#DCFCE7" stroke="#16A34A" stroke-width="2" rx="8"/>
  <text x="662" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">期待どおりの成果物</text>
  <text x="662" y="260" text-anchor="middle" font-size="10.5" fill="#15803D">様式・文体・守秘が守られ、</text>
  <text x="662" y="277" text-anchor="middle" font-size="10.5" fill="#15803D">「そのまま使える」状態で返る</text>

  <text x="662" y="330" text-anchor="middle" font-size="10.5" fill="#475569">どれかの欄が空白のとき、</text>
  <text x="662" y="346" text-anchor="middle" font-size="10.5" fill="#475569">結果は「期待外れ」になりやすい</text>

  <text x="400" y="432" text-anchor="middle" font-size="11" fill="#475569" font-style="italic">毎回 5 欄すべては不要。困ったらこの 5 欄に立ち返る</text>
</svg>
