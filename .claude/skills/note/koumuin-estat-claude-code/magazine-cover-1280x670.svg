<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 670">
<style>
  text { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif; }
</style>

<!-- Background -->
<rect width="1280" height="670" fill="#fafafa"/>
<rect x="0" y="0" width="1280" height="14" fill="#0891b2"/>

<!-- Series brand -->
<text x="80" y="98" font-size="22" font-weight="500" fill="#475569">公務員 × Claude Code × e-Stat</text>
<line x1="80" y1="118" x2="240" y2="118" stroke="#0891b2" stroke-width="3" stroke-linecap="round"/>
<text x="80" y="158" font-size="14" font-weight="500" fill="#94a3b8" letter-spacing="2">JICHITAI × STATISTICS × AI</text>

<!-- Decorative bar chart icon -->
<g transform="translate(80, 250)">
  <rect x="0" y="80" width="32" height="60" fill="#0891b2" opacity="0.3"/>
  <rect x="40" y="50" width="32" height="90" fill="#0891b2" opacity="0.5"/>
  <rect x="80" y="20" width="32" height="120" fill="#0891b2" opacity="0.7"/>
  <rect x="120" y="0" width="32" height="140" fill="#0891b2"/>
  <line x1="-8" y1="148" x2="160" y2="148" stroke="#475569" stroke-width="2"/>
</g>

<!-- Title -->
<text x="320" y="280" font-size="56" font-weight="bold" fill="#1e293b">公務員のための</text>
<text x="320" y="358" font-size="56" font-weight="bold" fill="#1e293b">e-Stat × Claude Code</text>
<text x="320" y="436" font-size="44" font-weight="bold" fill="#0891b2">実務ガイド</text>

<!-- Subtitle -->
<text x="320" y="488" font-size="22" font-weight="500" fill="#475569">47 都道府県データを 1 コマンドで取得・整形・出力</text>

<!-- Stats badges -->
<g transform="translate(320, 520)">
  <rect x="0" y="0" width="120" height="36" rx="18" fill="#0891b2"/>
  <text x="60" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">全 12 本</text>

  <rect x="136" y="0" width="160" height="36" rx="18" fill="#ede9fe"/>
  <text x="216" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#7c3aed">無料 3 + 有料 9</text>

  <rect x="312" y="0" width="180" height="36" rx="18" fill="#fef3c7"/>
  <text x="402" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">stats47 実運用ベース</text>
</g>

<!-- Footer -->
<line x1="80" y1="600" x2="1200" y2="600" stroke="#e2e8f0" stroke-width="1"/>
<text x="80" y="635" font-size="16" font-weight="600" fill="#64748b">自治体職員のための統計データ実務</text>
<text x="1200" y="635" text-anchor="end" font-size="16" font-weight="500" fill="#94a3b8">stats47.jp</text>
</svg>
