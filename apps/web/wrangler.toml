"$schema" = "./node_modules/wrangler/config-schema.json"
name = "stats47-dev"
main = ".open-next/worker.js"
compatibility_date = "2026-08-04"
# node:sqlite はアプリで使わない。依存パッケージからの誤った runtime 解決を防ぐため無効化する。
compatibility_flags = ["nodejs_compat", "disable_nodejs_sqlite_module"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Workers Cache は開発時の反映確認を妨げないよう、production のみ有効化する。
[cache]
enabled = false

[vars]
NODE_ENV = "development"
NEXT_PUBLIC_ENV = "development"

# 完全DBレス (doc 12): 本番アプリは D1 を一切 query しない。
# vestigial だった [[d1_databases]] STATS47_STATIC_DB binding は削除済 (2026-06)。
# DB schema の型ソースは packages/database/src/schema/*.ts にのみ保持する。

# デフォルトR2ストレージ（ローカル開発用）
[[r2_buckets]]
binding = "STATS47_BUCKET"
bucket_name = "stats47"
preview_bucket_name = "stats47"

# OpenNext incremental cache 用 R2 binding（ローカル開発用）。
# r2-incremental-cache override が固定名 NEXT_INC_CACHE_R2_BUCKET を要求する。
[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "stats47"
preview_bucket_name = "stats47"


# Observability設定（デフォルト）
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# ============================================
# Production環境
# ============================================
[env.production]
name = "stats47"

[env.production.cache]
enabled = true

[env.production.vars]
NODE_ENV = "production"
NEXT_PUBLIC_ENV = "production"
# ★必須: Workers ランタイムで R2 snapshot 読みを許可する。
# shouldSkipRemoteR2Read() は CLOUDFLARE_WORKERS!=="true" かつ CI でも S3creds でも
# R2_PUBLIC_FETCH_URL でもないと true(skip) を返す。これが未設定だと本番 Worker で
# readRankingItemFromR2 等が読みを skip → loadThemeData null → テーマが error fallback、
# home featured も空になる (2026-06-20 根本原因)。
CLOUDFLARE_WORKERS = "true"
# NextAuth用のシークレット（本番環境用に別途生成してください）
# openssl rand -base64 32
# AUTH_SECRET = "your-production-secret-here-minimum-32-characters"
NEXTAUTH_URL = "https://stats47.jp"
NEXT_PUBLIC_BASE_URL = "https://stats47.jp"
NEXT_PUBLIC_ESTAT_APP_ID = "59eb12e8a25751dfc27f2e48fcdfa8600b86655e"
R2_PUBLIC_URL = "https://storage.stats47.jp"
NEXT_PUBLIC_R2_PUBLIC_URL = "https://storage.stats47.jp"
# R2ストレージバケット名（機密情報ではないため、varsセクションに設定）
CLOUDFLARE_R2_BUCKET_NAME = "stats47"
# Google AdSense設定
NEXT_PUBLIC_GOOGLE_ADSENSE_CLIENT_ID = "ca-pub-7995274743017484"
NEXT_PUBLIC_GOOGLE_ADSENSE_ENABLED = "true"
# Amazon アソシエイト
NEXT_PUBLIC_AMAZON_ASSOCIATE_TAG = "stats47-22"

# production / local とも D1 binding は持たない。apps/web の read は R2 snapshot のみ。
# CI gate (.github/workflows/pr-quality-check.yml の D1 Import Gate) で再発を防ぐ。

[[env.production.r2_buckets]]
binding = "STATS47_BUCKET"
bucket_name = "stats47"

# OpenNext incremental cache 用 R2 binding（Production）。
# deploy 前に `opennextjs-cloudflare populateCache remote --env production` で
# ビルド済 ISR/SSG エントリをこのバケット (prefix incremental-cache/) に投入する。
[[env.production.r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "stats47"


# Observability設定（Production）
[env.production.observability]
enabled = true
head_sampling_rate = 1

[env.production.observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[env.production.observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

# Analytics Engine（Production）
# カスタムメトリクス書き込み用。middleware から env.ANALYTICS.writeDataPoint() で URL×status×UA を記録可能。
# Dashboard → Workers & Pages → Analytics → Analytics Engine の SQL で集計。
# 未設定時は env.ANALYTICS が undefined になるため、呼び出し側で optional chaining を使うこと。
[[env.production.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "stats47_requests"
