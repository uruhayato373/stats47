<svg width="960" height="400" viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="エンゲル係数の推移（全国平均・二人以上世帯）">
  <title>エンゲル係数の推移（全国平均・二人以上世帯）</title>
  <rect width="960" height="400" fill="#f9fafb" rx="8"/>
  <text x="480" y="32" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="20" font-weight="bold" fill="#1f2937">エンゲル係数の推移（全国平均）</text>
  <text x="480" y="52" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#6b7280">二人以上の世帯｜家計調査</text>

  <!-- Chart area: x=80..900, y=70..340 -->
  <!-- Y axis: 22% to 29%, range=7 → 270px, 1%=38.57px -->
  <!-- X axis: 2000 to 2024, range=24 → 820px, 1yr=34.17px -->

  <!-- Y grid -->
  <line x1="80" y1="340" x2="900" y2="340" stroke="#e5e7eb" stroke-width="0.5"/>
  <text x="72" y="344" text-anchor="end" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="10" fill="#6b7280">22%</text>

  <line x1="80" y1="301" x2="900" y2="301" stroke="#e5e7eb" stroke-width="0.5" stroke-dasharray="4,3"/>
  <text x="72" y="305" text-anchor="end" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="10" fill="#6b7280">23%</text>

  <line x1="80" y1="262" x2="900" y2="262" stroke="#e5e7eb" stroke-width="0.5" stroke-dasharray="4,3"/>
  <text x="72" y="266" text-anchor="end" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="10" fill="#6b7280">24%</text>

  <line x1="80" y1="224" x2="900" y2="224" stroke="#e5e7eb" stroke-width="0.5" stroke-dasharray="4,3"/>
  <text x="72" y="228" text-anchor="end" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="10" fill="#6b7280">25%</text>

  <line x1="80" y1="185" x2="900" y2="185" stroke="#e5e7eb" stroke-width="0.5" stroke-dasharray="4,3"/>
  <text x="72" y="189" text-anchor="end" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="10" fill="#6b7280">26%</text>

  <line x1="80" y1="146" x2="900" y2="146" stroke="#e5e7eb" stroke-width="0.5" stroke-dasharray="4,3"/>
  <text x="72" y="150" text-anchor="end" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="10" fill="#6b7280">27%</text>

  <line x1="80" y1="108" x2="900" y2="108" stroke="#e5e7eb" stroke-width="0.5" stroke-dasharray="4,3"/>
  <text x="72" y="112" text-anchor="end" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="10" fill="#6b7280">28%</text>

  <line x1="80" y1="70" x2="900" y2="70" stroke="#e5e7eb" stroke-width="0.5" stroke-dasharray="4,3"/>
  <text x="72" y="74" text-anchor="end" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="10" fill="#6b7280">29%</text>

  <!-- X axis labels -->
  <text x="80" y="358" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="10" fill="#6b7280">2000</text>
  <text x="251" y="358" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="10" fill="#6b7280">2005</text>
  <text x="422" y="358" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="10" fill="#6b7280">2010</text>
  <text x="592" y="358" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="10" fill="#6b7280">2015</text>
  <text x="763" y="358" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="10" fill="#6b7280">2020</text>
  <text x="900" y="358" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="10" fill="#6b7280">2024</text>

  <!-- Shaded area for 2022-2024: rebound from the 2022 low (26.6%) -->
  <rect x="832" y="70" width="68" height="270" fill="#ef4444" opacity="0.06" rx="4"/>

  <!-- Area fill under line -->
  <polygon points="
    80,290
    114,294
    148,290
    182,294
    217,301
    251,305
    285,298
    319,301
    353,294
    388,286
    422,290
    456,278
    490,282
    524,278
    558,263
    592,224
    627,193
    661,197
    695,197
    729,197
    763,128
    798,139
    832,163
    866,116
    900,97
    900,340
    80,340
  " fill="#1d4ed8" opacity="0.06"/>

  <!-- Main line: Engel coefficient trend -->
  <!-- Data: e-Stat statsDataId 0002070003 (家計調査 家計収支編 二人以上の世帯 用途分類), 全国, cat01=263 エンゲル係数 / 食料÷消費支出, cat02=03. 2000=23.3, 2001=23.2, 2002=23.3, 2003=23.2, 2004=23.0, 2005=22.9, 2006=23.1, 2007=23.0, 2008=23.2, 2009=23.4, 2010=23.3, 2011=23.6, 2012=23.5, 2013=23.6, 2014=24.0, 2015=25.0, 2016=25.8, 2017=25.7, 2018=25.7, 2019=25.7, 2020=27.5, 2021=27.2, 2022=26.6, 2023=27.8, 2024=28.3 -->
  <polyline points="
    80,290
    114,294
    148,290
    182,294
    217,301
    251,305
    285,298
    319,301
    353,294
    388,286
    422,290
    456,278
    490,282
    524,278
    558,263
    592,224
    627,193
    661,197
    695,197
    729,197
    763,128
    798,139
    832,163
    866,116
    900,97
  " fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Key data points -->
  <!-- 2000: 23.3% -->
  <circle cx="80" cy="290" r="4" fill="#fff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="94" y="281" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="10" font-weight="600" fill="#1d4ed8">23.3%</text>

  <!-- 2010: 23.3% -->
  <circle cx="422" cy="290" r="4" fill="#fff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="422" y="281" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="10" font-weight="600" fill="#1d4ed8">23.3%</text>

  <!-- 2015: 25.0% -->
  <circle cx="592" cy="224" r="4" fill="#fff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="592" y="215" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="10" font-weight="600" fill="#1d4ed8">25.0%</text>

  <!-- 2019: 25.7% (pre-inflation reference) -->
  <circle cx="729" cy="197" r="4" fill="#fff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="723" y="188" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="10" font-weight="600" fill="#1d4ed8">25.7%</text>

  <!-- 2024: 28.3% -->
  <circle cx="900" cy="97" r="5" fill="#dc2626" stroke="#fff" stroke-width="2"/>
  <text x="900" y="89" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" font-weight="bold" fill="#dc2626">28.3%</text>

  <!-- Annotation arrow: 2022 low then rebound to 2024 -->
  <line x1="780" y1="80" x2="850" y2="112" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <defs>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="650" y="66" width="136" height="22" rx="11" fill="#dc2626" opacity="0.1"/>
  <text x="718" y="82" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" font-weight="bold" fill="#dc2626">2022年を底に再上昇</text>

  <!-- Bracket annotation: "〜23%台で推移" for 2000-2010 -->
  <line x1="80" y1="324" x2="422" y2="324" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="251" y="336" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="10" fill="#6b7280">約23%台で推移</text>
</svg>