      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="bar2024" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="#f9fafb" rx="8"/>
  <text x="480" y="36" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="20" font-weight="bold" fill="#1f2937">品目別消費支出の変化（2019年 vs 2024年）</text>
  <text x="480" y="56" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#6b7280">二人以上の世帯・全国平均・年額（円）｜変化率の大きい順</text>

  <!-- Legend -->
  <rect x="340" y="68" width="14" height="14" rx="3" fill="url(#bar2019)"/>
