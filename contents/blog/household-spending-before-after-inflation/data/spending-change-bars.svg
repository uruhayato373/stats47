  <!-- maxValue = 16,236 → scale: 610px / 16236 = 0.03757 px per yen -->
  <!-- Items sorted by % change descending -->
  <!-- Row height = 48px, bar height = 18px, gap between bars = 2px -->

  <!-- 1. アイスクリーム +26.7% -->
  <text x="160" y="122" text-anchor="end" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="13" font-weight="bold" fill="#1f2937">アイスクリーム</text>
  <rect x="170" y="103" width="364.5" height="18" rx="4" fill="url(#bar2019)" opacity="0.85"/>
  <text x="540" y="117" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="10" fill="#3b82f6" font-weight="600">9,701</text>
