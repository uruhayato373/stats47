<svg width="960" height="600" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="品目別消費支出の変化（2019年 vs 2024年）">
  <title>品目別消費支出の変化（2019年 vs 2024年）</title>
  <defs>
