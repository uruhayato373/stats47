  <text x="90" y="103.6" font-size="18" class="svg-title"><tspan x="90" dy="0">中学校で約1.7倍の地域差：不登校比率は宮城県（84.58）が福井県（49.73）の約1</tspan><tspan x="90" dy="22">.7倍。都道府県間で大きな開きがある</tspan></text>
