  <text x="90" y="185.6" font-size="18" class="svg-title"><tspan x="90" dy="0">小学校も同じ傾向：沖縄県（32.69）が最多、福井県（14.50）が最少。小中ともに不登</tspan><tspan x="90" dy="22">校の地域差は深刻</tspan></text>
