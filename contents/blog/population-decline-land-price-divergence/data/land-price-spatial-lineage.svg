<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-label="住宅地点と人口メッシュの包含結合と東京都での検算"><style>text{font-family:'Noto Sans JP','Hiragino Sans',sans-serif;fill:#334155}.panel{fill:#f1f5f9}.title{font-weight:700;font-size:25px}.label{font-weight:700;font-size:21px}.body{font-size:19px}@media(prefers-color-scheme:dark){text{fill:#e2e8f0}.panel{fill:#1e293b}}</style><text x="30" y="48" class="title">県コードではなく地点の位置で結合</text><rect x="30" y="78" width="660" height="85" rx="8" class="panel"/><text x="50" y="108" class="label">計算入力</text><text x="50" y="141" class="body">人口メッシュ 177,791件 ＋ 住宅地点 17,890件</text><path d="M360 167v14m-5-5 5 5 5-5" fill="none" stroke="#64748b" stroke-width="2"/><rect x="30" y="188" width="660" height="85" rx="8" class="panel"/><text x="50" y="218" class="label">位置で接続</text><text x="50" y="251" class="body">接続 17,888地点 ／ 未接続 2地点</text><path d="M360 277v14m-5-5 5 5 5-5" fill="none" stroke="#64748b" stroke-width="2"/><rect x="30" y="298" width="660" height="85" rx="8" class="panel"/><text x="50" y="328" class="label">比較対象を選別</text><text x="50" y="361" class="body">比較可能 17,422地点 → 該当 8,980地点</text><path d="M360 387v14m-5-5 5 5 5-5" fill="none" stroke="#64748b" stroke-width="2"/><rect x="30" y="408" width="660" height="85" rx="8" class="panel"/><text x="50" y="438" class="label">東京都で検算</text><text x="50" y="471" class="body">670 ÷ 1,618 × 100 ＝ 41.4%</text><text x="30" y="565" class="label">1地点の追跡例：13103-018</text><text x="30" y="600" class="body">地価前年比 +16% → 人口メッシュ 53394507</text><text x="30" y="634" class="body">2020年 6962.7381人 → 2050年 6935.8743人</text><text x="30" y="685" class="body">期間の異なる値の重なり。将来地価・因果は推定しません。</text></svg>