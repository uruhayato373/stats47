<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="人口の増減と空き家率の変化" data-theme="dark" data-image-template="grouped-bar">
    <rect width="1080" height="1350" fill="#262626"/>
    <g font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif" fill="#F5F5F5">
      <text x="64" y="120" font-size="72" font-weight="700">人口の増減と空き家率の変化</text>
      <text x="64" y="184" font-size="32" fill="#B5B5B5">空き家 2013〜2023年・人口 2010〜2020年・1,052市区町村</text>
      
      <rect x="64" y="230" width="26" height="26" rx="4" fill="#1e88e5"/><text x="102" y="252" font-size="30" fill="#F5F5F5">空き家率の変化の中央値（ポイント）</text><line x1="116.47999999999999" y1="1206" x2="1016" y2="1206" stroke="#525252" stroke-width="1.5"/><text x="100.47999999999999" y="1216" text-anchor="end" font-size="28" fill="#B5B5B5">-1</text><line x1="116.47999999999999" y1="977.5" x2="1016" y2="977.5" stroke="#525252" stroke-width="2.5"/><text x="100.47999999999999" y="987.5" text-anchor="end" font-size="28" fill="#B5B5B5">0</text><line x1="116.47999999999999" y1="749" x2="1016" y2="749" stroke="#525252" stroke-width="1.5"/><text x="100.47999999999999" y="759" text-anchor="end" font-size="28" fill="#B5B5B5">1</text><line x1="116.47999999999999" y1="520.5" x2="1016" y2="520.5" stroke="#525252" stroke-width="1.5"/><text x="100.47999999999999" y="530.5" text-anchor="end" font-size="28" fill="#B5B5B5">2</text><line x1="116.47999999999999" y1="292" x2="1016" y2="292" stroke="#525252" stroke-width="1.5"/><text x="100.47999999999999" y="302" text-anchor="end" font-size="28" fill="#B5B5B5">3</text><g data-group="人口増"><rect data-value="-1" x="121.5" y="977.5" width="288.8" height="228.5" fill="#1e88e5"/><text x="266.4" y="1250" text-anchor="middle" font-size="26" fill="#B5B5B5">人口増</text></g><g data-group="人口減0〜5%"><rect data-value="0.23" x="421.3" y="924.9" width="288.8" height="52.6" fill="#1e88e5"/><text x="566.2" y="1250" text-anchor="middle" font-size="26" fill="#B5B5B5">人口減0〜5%</text></g><g data-group="人口減5%超"><rect data-value="2.82" x="721.2" y="333.1" width="288.8" height="644.4" fill="#1e88e5"/><text x="866.1" y="1250" text-anchor="middle" font-size="26" fill="#B5B5B5">人口減5%超</text></g>
      <text x="64" y="1310" font-size="26" fill="#B5B5B5">出典：住宅・土地統計調査・国勢調査</text>
